 x:"z_j = c_B·Y_j, y c_k está en c_B: cambian todos los z_j y los c_j − z_j. «Dentro del rango» quiere decir justamente que siguen ≤ 0. X* no cambia; Z* y los precios sombra, sí."},
{id:"b4b08",t:"SEN",q:"MIN costos. Los precios sombra de las dos restricciones ≥ son u = (2; 3). Un insumo nuevo consume 1 y 2 unidades de esos requerimientos y cuesta $9. ¿Conviene usarlo?",
 o:["No: c − z = 9 − (1·2 + 2·3) = +1 ≥ 0; en un Min sólo entra con costo reducido negativo",
    "Sí: c − z = +1 > 0 indica que mejora",
    "Sí: cuesta 9, menos que la suma de los precios sombra multiplicada por 2",
    "No se puede saber sin resolver el problema de nuevo"],a:0,
 x:"Lo que «vale» el insumo es z = u·A = 2 + 6 = 8. Cuesta 9: más de lo que aporta. En un Min, conviene sólo si c − z < 0."},
{id:"b4b09",t:"DUA",q:"Si el primal no tiene soluciones factibles, el dual necesariamente…",
 o:["no tiene soluciones factibles",
    "tiene solución no acotada",
    "tiene óptimo finito igual a 0",
    "tiene soluciones alternativas"],e:"Ninguna de las anteriores",a:4,
 x:"Si el primal es no factible, el dual es no factible o no acotado: ninguno de los dos es obligatorio. La dirección segura es la otra: primal no acotado → dual no factible."},
{id:"b4b10",t:"DUA",q:"Tabla óptima de un primal Max. ¿Dónde se leen los precios sombra (la solución del dual)?",
 o:["En los z_j de las columnas de holguras y ficticias (las que formaban la identidad inicial)",
    "En los z_j de las columnas de las variables de decisión",
    "En la columna X de valores de las básicas",
    "En la columna de cocientes θ"],a:0,
 x:"u = c_B·B⁻¹, y B⁻¹ está debajo de las columnas de la identidad inicial. La columna X tiene la solución del primal (cuánto fabricar)."},
{id:"b4b11",t:"TTA",q:"Asignación balanceada de 5 operarios a 5 tareas. Una solución básica tiene m + n − 1 = 9 variables básicas, pero sólo 5 asignaciones valen 1. Entonces…",
 o:["las soluciones de un problema de asignación son siempre degeneradas: 4 básicas valen 0",
    "las soluciones de un problema de asignación nunca son degeneradas, porque todas las asignaciones valen 1",
    "la solución es no factible, porque faltan 4 asignaciones",
    "hay que agregar 4 operarios ficticios"],a:0,
 x:"Cada operario hace una tarea: sólo 5 variables valen 1, pero la base tiene 9 lugares. Las otras 4 básicas valen 0. Es una característica conocida de la asignación."},
{id:"b4b12",t:"TTA",q:"Oferta total 120, demanda total 100. Se agrega un destino ficticio. En el óptimo, el origen A le envía 15 unidades al destino ficticio. ¿Qué significa?",
 o:["Que A tiene 15 unidades de capacidad ociosa: no las produce ni las envía",
    "Que 15 unidades de A se pierden en el camino",
    "Que hay 15 unidades de demanda insatisfecha",
    "Que A envía 15 unidades a un depósito intermedio"],a:0,
 x:"El destino ficticio absorbe la oferta que sobra (120 − 100 = 20), con costo 0. Lo que le «manda» un origen es lo que ese origen no usa. Demanda insatisfecha es el caso del origen ficticio."},
{id:"b4b13",t:"ENT",q:"Proyectos binarios A y B: «B sólo se puede hacer si se hace A». La restricción es…",
 o:["[[y_B \\leq y_A]]",
    "[[y_A \\leq y_B]]",
    "[[y_A + y_B \\leq 1]]",
    "[[y_A + y_B = 2]]"],a:0,
 x:"Probá: si y_A = 0, obliga y_B = 0 (no B sin A); si y_A = 1, y_B puede ser 0 o 1. La segunda es «A sólo si B»; la tercera, «no los dos»; la cuarta obliga a hacer los dos."},
{id:"b4b14",t:"ENT",q:"De 4 proyectos binarios hay que elegir AL MENOS 2. La restricción es…",
 o:["[[y_1 + y_2 + y_3 + y_4 \\geq 2]]",
    "[[y_1 + y_2 + y_3 + y_4 \\leq 2]]",
    "[[y_1 + y_2 + y_3 + y_4 = 2]]",
    "[[y_1 \\cdot y_2 \\cdot y_3 \\cdot y_4 \\geq 2]]"],a:0,
 x:"La suma de binarias cuenta cuántos se eligen. «Al menos» → ≥; «a lo sumo» → ≤; «exactamente» → =. Un producto de variables no es lineal."},
{id:"b4b15",t:"RED",q:"Flujo máximo: se mandan 3 unidades por el arco 1 → 2, que tenía capacidad residual 5. ¿Cómo queda la red residual?",
 o:["1 → 2 queda con 2, y aparece capacidad 3 en el sentido inverso, 2 → 1 (para poder deshacer ese flujo después)",
    "1 → 2 queda con 2, y el sentido inverso no cambia",
    "1 → 2 queda con 8, porque se suma el flujo enviado",
    "1 → 2 se elimina de la red, porque ya se usó"],a:0,
 x:"Se resta en el sentido del flujo y se suma en el inverso. Esa capacidad inversa permite redirigir flujo más adelante si aparece un camino mejor."},
{id:"b4b16",t:"STK",q:"Período común: [[T^* = \\sqrt{2L/S}]], con L el costo de la orden conjunta. Si L se cuadruplica (y lo demás queda igual), T*…",
 o:["se duplica (√4 = 2): se pide la mitad de las veces y cada lote es el doble",
    "se cuadruplica: se pide cuatro veces menos",
    "se reduce a la mitad",
    "no cambia, porque S no cambió"],a:0,
 x:"T* es proporcional a √L. Cuadruplicar L multiplica T* por 2, y los lotes Q_j = D_j·T* también se duplican."},
{id:"b4b17",t:"STK",q:"Modelo básico: si la demanda anual D se cuadruplica (lo demás igual), ¿qué pasa con Q* y con n*?",
 o:["Q* se duplica y n* también se duplica",
    "Q* se duplica y n* se cuadruplica",
    "Q* se cuadruplica y n* queda igual",
    "Q* queda igual y n* se cuadruplica"],a:0,
 x:"Q* = √(2DL/(Ci)) es proporcional a √D: ×2. n* = D/Q* = 4D/(2Q*) = 2·n*. Se pide más grande y más seguido, pero ninguno de los dos crece tanto como D."},
{id:"b4b18",t:"STK",q:"Tornillos: C = $50, L = $150, i = 0,20, D = 12.000, Q = 600, con [[A(Q) = Q^2/(2D) = 15]]. ¿Cuánto vale [[C\\cdot Q + L + C\\cdot i\\cdot A(Q)]] y qué es?",
 o:["30.000 + 150 + 150 = $30.300: el costo de UN LOTE; dividido por Q da CT = $50,50 por unidad",
    "30.000 + 150 + 150 = $30.300: es CT, el costo por unidad",
    "$50,50: el costo de un lote",
    "30.300 · 12.000: el costo anual"],a:0,
 x:"Comprar 600 a 50, pedirlos una vez y mantenerlos un ciclo cuesta 30.300. Por unidad: 30.300/600 = 50,50 = CT. Por año: CT·D = 606.000."},
{id:"b4b19",t:"STK",q:"Se pasa de un riesgo de faltante del 5 % a uno del 1 %. ¿Qué pasa?",
 o:["z sube de 1,645 a 2,33: más stock de seguridad y punto de pedido más alto",
    "z sube de 1,645 a 2,33: menos stock de seguridad, porque se acepta menos riesgo",
    "z baja de 2,33 a 1,645: menos stock de seguridad",
    "No cambia nada, porque el desvío de la demanda es el mismo"],a:0,
 x:"Menos riesgo aceptado = más protección: z más grande, SS = z·σ·√LT más grande, PP más alto. Nivel de servicio 99 % es lo mismo que RF 1 %."},
{id:"b4b20",t:"STK",q:"Con los mismos datos (σ, LT, RF), ¿qué sistema necesita más stock de seguridad: punto de pedido o revisión periódica cada T?",
 o:["Revisión periódica: su SS cubre T + LT, en lugar de sólo LT",
    "Punto de pedido: como el control es permanente, necesita más protección",
    "Los dos necesitan el mismo SS, porque el RF es el mismo",
    "Revisión periódica, pero sólo si T es mayor que LT"],a:0,
 x:"SS_RP = z·σ·√(T + LT) > z·σ·√LT = SS_PP. Es una de las diferencias que más se toman: la revisión periódica tiene más stock promedio, a cambio de no llevar un registro permanente."}
];

{id:"b5a01",t:"SPX",q:"(P18, reescrita) Al hacer entrar x_j, la básica x_3 aumenta y la básica x_4 disminuye. ¿Qué signo tienen sus coeficientes de sustitución y cuál es candidata a salir?",

    "x_3 positivo y x_4 negativo; la candidata a salir es x_3",
    "x_3 negativo y x_4 positivo; la candidata a salir es x_3"],a:0,
 x:"Coeficiente de sustitución (cátedra) = cuánto cambia la básica: si sube, es positivo; si baja, negativo. Sólo la que baja puede llegar a 0 y salir."},
{id:"b5a02",t:"SPX",q:"Max. Entra x_2. Su columna en la tabla es y = (0; −3; 1/2) y los valores de las básicas son (4; 6; 2). ¿Qué pasa en el pivote?",
 o:["Sale la fila 3 con θ = 4; la básica de la fila 2 sube a 18 y la de la fila 1 queda en 4",
    "Sale la fila 3 con θ = 4; la básica de la fila 2 baja a −6 y la de la fila 1 queda en 4",
    "Sale la fila 1 con θ = 0, porque su y vale 0 y ese es el menor cociente posible",
    "Sale la fila 2 con θ = −2, porque es el menor de los cocientes de la columna de x_2"],a:0,
 x:"Sólo compite la fila con y > 0: 2/(1/2) = 4. Las otras: nuevo valor = x − θ·y. Fila 2: 6 − 4·(−3) = 18; fila 1: 4 − 4·0 = 4."},
{id:"b5a03",t:"SPX",q:"Con Gran M, una variable ficticia sale de la base en una iteración intermedia. ¿Puede volver a entrar?",
 o:["No: su −M la deja siempre en desventaja; se puede omitir, pero su columna sirve para leer B⁻¹",
    "Sí: si su c_j − z_j se vuelve positivo, entra como cualquier otra variable de la tabla",
    "No: y además su columna ya no sirve, ni para leer B⁻¹ ni para el análisis de sensibilidad",
    "Sí: vuelve a entrar en la última iteración para verificar que la solución sea factible"],a:0,
 x:"El castigo M es tan grande que su c_j − z_j nunca vuelve a ser conveniente. Igual conviene conservar la columna: es parte de B⁻¹ (o se recupera con el efecto espejo)."},
{id:"b5a04",t:"SPX",q:"Max. Z vale 100 en la tabla actual. Entra x_j con [[c_j - z_j = 4]] y el cociente mínimo da θ = 5. ¿Cuánto vale Z después del pivote?",
 o:["Z' = 100 + 5 · 4 = 120",
    "Z' = 100 + 4 = 104",
    "Z' = 100 − 5 · 4 = 80",
    "Z' = 100 + 5 = 105"],a:0,
 x:"Z' = Z + θ·(c_j − z_j): entran 5 unidades y cada una suma 4 netos."},
{id:"b5a05",t:"SPX",q:"(P6, reescrita) ¿Por qué una restricción ≥ con b ≥ 0 necesita una variable ficticia y una ≤ no?",
 o:["Porque el exceso entra con −1 y no forma la identidad; la holgura de la ≤ entra con +1 y sí",
    "Porque el exceso entra con +1 y forma la identidad dos veces; la holgura de la ≤ no lo hace",
    "Porque las ≥ siempre son activas en el óptimo, y la ficticia sirve para medir su exceso",
    "Porque las ≥ tienen término independiente negativo, y la ficticia lo vuelve positivo"],a:0,
 x:"La base inicial necesita una columna (0, …, 1, …, 0) por fila. La holgura la da; el exceso, con −1, no. Por eso se suma la ficticia, que se castiga con M para que salga."},
{id:"b5a06",t:"SEN",q:"(P14, reescrita) Una restricción de un Max tiene valor implícito 12. ¿Cuál es la lectura correcta?",
 o:["Es el valor de su variable dual: Z cambia 12 por cada unidad más de b, dentro del rango",
    "Es el valor de su variable dual: sobran 12 unidades de ese recurso en el óptimo",
    "Es el costo reducido de su holgura: Z cambia 12 por cada unidad de holgura que entra",
    "Es el precio de venta del recurso: conviene venderlo si alguien paga más de 12"],a:0,
 x:"Valor implícito = precio dual = precio sombra = solución del dual. Es un precio (por unidad de b), no una cantidad sobrante. Vale dentro del rango de b."},
{id:"b5a07",t:"SEN",q:"Max. En la tabla óptima, la fila de la básica x_1 (c_1 = 10) tiene, en las no básicas: s_1 con y = 2 y c_j − z_j = −6; s_2 con y = −1 y c_j − z_j = −4. ¿Rango de c_1?",
 o:["[[7 \\leq c_1 \\leq 14]]",
    "[[6 \\leq c_1 \\leq 13]]",
    "[[-3 \\leq c_1 \\leq 4]]",
    "[[4 \\leq c_1 \\leq 16]]"],a:0,
 x:"Cota inferior: máx de (c_j − z_j)/y con y > 0 → −6/2 = −3. Cota superior: mín con y < 0 → −4/−1 = 4. Δc_1 ∈ [−3; 4] → c_1 ∈ [7; 14]. La tercera olvida sumar c_1."},
{id:"b5a08",t:"SEN",q:"La columna de B⁻¹ de la restricción 2 es (1; −2; 0,5) y los valores de las básicas son (6; 8; 4). ¿Rango de Δb_2?",
 o:["[[-6 \\leq \\Delta b_2 \\leq 4]]",
    "[[-8 \\leq \\Delta b_2 \\leq 4]]",
    "[[-4 \\leq \\Delta b_2 \\leq 6]]",
    "[[-6 \\leq \\Delta b_2 \\leq 8]]"],a:0,
 x:"Con r > 0: −6/1 = −6 y −4/0,5 = −8 → el mayor, −6. Con r < 0: −8/(−2) = 4. Las básicas quedan 6 + Δ, 8 − 2Δ y 4 + 0,5Δ: todas ≥ 0 sólo entre −6 y 4."},
{id:"b5a09",t:"SEN",q:"Max. b_2 sube 3 unidades, dentro de su rango, y su precio sombra es u_2 = 5. ¿Qué cambia?",
 o:["Z sube 15, cambian los valores de las básicas y los precios sombra no cambian",
    "Z sube 15, los valores de las básicas no cambian y los precios sombra sí cambian",
    "Z no cambia: dentro del rango la solución óptima queda exactamente igual",
    "Z sube 15 y cambia la base óptima, porque se modificó un término independiente"],a:0,
 x:"Dentro del rango: misma base (por eso los precios sombra, c_B·B⁻¹, no cambian), pero x_B = B⁻¹b sí se mueve. Z' = Z + u_2·Δb_2 = Z + 15."},
{id:"b5a10",t:"DUA",q:"(P10, reescrita) Primal MIN con restricciones ① ≤, ② ≥, ③ =, con x_1 ≥ 0 y x_2 libre. En el dual (Max)…",
 o:["u_1 ≤ 0, u_2 ≥ 0, u_3 libre; la restricción de x_1 es ≤ y la de x_2 es =",
    "u_1 ≥ 0, u_2 ≤ 0, u_3 libre; la restricción de x_1 es ≤ y la de x_2 es =",
    "u_1 ≤ 0, u_2 ≥ 0, u_3 libre; la restricción de x_1 es ≥ y la de x_2 es libre",
    "u_1 ≥ 0, u_2 ≤ 0, u_3 = 0; la restricción de x_1 es ≥ y la de x_2 es ="],a:0,
 x:"Min: lo natural es ≥. ① ≤ invertida → u_1 ≤ 0; ② ≥ natural → u_2 ≥ 0; ③ = → libre. x_1 ≥ 0 → restricción natural del dual Max (≤); x_2 libre → =."},
{id:"b5a11",t:"DUA",q:"(P4, reescrita) En el óptimo, la restricción del dual asociada a x_2 se cumple con desigualdad estricta. ¿Qué se sabe de x_2?",
 o:["Vale 0: los recursos que consumiría valen más de lo que deja",
    "Es positiva: los recursos que consume valen más de lo que deja",
    "Es básica con valor igual al exceso de esa restricción dual",
    "No se puede saber nada sin resolver de nuevo el primal"],a:0,
 x:"Holguras complementarias: exceso dual j × x_j = 0. Si la restricción dual j tiene exceso, x_j = 0. Es el caso de la nafta: sus recursos valían 51,67 y dejaba 50."},
{id:"b5a12",t:"DUA",q:"En el óptimo, el valor total de los recursos a precio sombra (W* del dual) comparado con la ganancia máxima Z* del primal es…",
 o:["igual: W* = Z*",
    "mayor: W* > Z*",
    "menor: W* < Z*",
    "igual sólo si no hay degeneración"],a:0,
 x:"Teorema de dualidad: con óptimo finito, W* = Z*. Es el mejor control para saber si armaste bien el dual."},
{id:"b5a13",t:"TTA",q:"(P1/P9, reescrita) Transbordo: 2 orígenes, 2 depósitos y 3 destinos. Cada origen puede enviar a cada depósito, y cada depósito a cada destino. ¿Cuántas variables y restricciones?",
 o:["10 variables (2·2 + 2·3) y 7 restricciones, una por nodo",
    "12 variables (2·2·3) y 7 restricciones, una por nodo",
    "10 variables (2·2 + 2·3) y 5 restricciones, sin los depósitos",
    "7 variables, una por nodo, y 10 restricciones, una por tramo"],a:0,
 x:"Tramo → variable: 4 de orígenes a depósitos + 6 de depósitos a destinos = 10. Nodo → restricción: 2 + 2 + 3 = 7 (los depósitos con entradas − salidas = 0)."},
{id:"b5a14",t:"TTA",q:"(P12, reescrita) Oferta total 80, demanda total 100. ¿Cómo se balancea y qué significa en el óptimo?",
 o:["Origen ficticio de 20 con costo 0; lo que envía es demanda que queda sin cubrir",
    "Destino ficticio de 20 con costo 0; lo que recibe es capacidad ociosa de los orígenes",
    "Origen ficticio de 20 con costo M; lo que envía es capacidad ociosa de los orígenes",
    "No se balancea: se cambian las demandas de = a ≤ y se resuelve igual"],a:0,
 x:"Falta oferta → origen ficticio por la diferencia. Sus envíos no existen: son la demanda insatisfecha de cada destino."},
{id:"b5a15",t:"ENT",q:"(P8, reescrita) Un programa binario puro tiene 10 variables. ¿Qué se puede asegurar?",
 o:["Tiene como mucho 2¹⁰ = 1.024 soluciones: si es factible, su óptimo es finito",
    "Tiene como mucho 2¹⁰ = 1.024 soluciones: siempre es factible y tiene óptimo",
    "Tiene como mucho 10² = 100 soluciones: si es factible, su óptimo es finito",
    "Tiene infinitas soluciones, porque el relajado admite valores entre 0 y 1"],a:0,
 x:"Cada variable vale 0 o 1: 2ⁿ combinaciones. Un conjunto finito no puede dar Z infinito. Puede ser no factible si ninguna combinación cumple las restricciones."},
{id:"b5a16",t:"ENT",q:"(P17, reescrita) Max entero. El relajado da Z = 80 con valores fraccionarios; ramificando se encuentra una solución entera con Z = 74. ¿Qué se sabe del óptimo entero Z*?",
 o:["[[74 \\leq Z^* \\leq 80]]: la entera hallada es un piso y el relajado un techo",
    "[[Z^* = 74]]: la primera entera que aparece es siempre la óptima",
    "[[Z^* = 80]]: el óptimo entero coincide con el relajado",
    "[[Z^* \\geq 80]]: el entero siempre mejora al relajado"],a:0,
 x:"En un Max el relajado es techo (el entero no lo supera) y cualquier entera encontrada es un piso (el óptimo es al menos esa). Hay que seguir ramificando las ramas que puedan superar 74."},
{id:"b5a17",t:"RED",q:"Una red tiene 6 nodos. Alguien propone un «árbol de expansión» que conecta los 6 nodos con 6 arcos. ¿Qué pasa?",
 o:["No es un árbol: con 6 nodos, 6 arcos forman necesariamente un ciclo",
    "Es un árbol válido: un árbol de expansión tiene un arco por nodo",
    "No es un árbol: un árbol de 6 nodos necesita 7 arcos",
    "Es válido sólo si el arco que sobra es el más corto"],a:0,
 x:"Un árbol de n nodos tiene exactamente n − 1 arcos. Con 5 se conectan los 6 nodos; el sexto arco cierra un ciclo."},
{id:"b5a18",t:"STK",q:"(P2, reescrita) ¿Por qué en el modelo básico la derivada nula de CT(Q) no puede dar un máximo?",
 o:["Porque L/Q es convexa para Q > 0 y C·i·Q/(2D) es lineal: la suma es convexa (forma de U)",
    "Porque L/Q es cóncava para Q > 0 y C·i·Q/(2D) es lineal: la suma es cóncava (forma de ∩)",
    "Porque C es constante y siempre domina a los otros dos términos de la función",
    "Porque la derivada de CT nunca se anula: el mínimo está siempre en el borde"],a:0,
 x:"Segunda derivada: 2L/Q³ > 0 → convexa → el punto de derivada nula es un mínimo (relativo y absoluto). C es constante y su derivada es 0."},
{id:"b5a19",t:"STK",q:"(P11, reescrita) Punto de pedido con LT constante. ¿Cuál de estos cambios NO modifica el stock de seguridad?",
 o:["Que aumente la demanda media diaria",
    "Que aumente el desvío de la demanda",
    "Que se exija un riesgo de faltante menor",
    "Que el plazo de provisión sea más largo"],a:0,
 x:"SS = z·σ·√LT: depende del RF (z), de la variabilidad (σ) y del LT. La demanda media sólo cambia el punto de pedido."},
{id:"b5a20",t:"STK",q:"(P13, reescrita) La demanda es CONSTANTE (30 u/día, sin variación), pero el LT es aleatorio: media 5 días, desvío 1 día. ¿Desvío de la demanda durante el LT?",
 o:["[[\\sqrt{5 \\cdot 0^2 + 30^2 \\cdot 1^2} = 30]]: toda la incertidumbre viene del LT",
    "[[0]]: con demanda constante no hace falta stock de seguridad",
    "[[\\sqrt{5 \\cdot 30^2} \\approx 67]]: se usa la demanda como si fuera el desvío",
    "[[30 \\cdot 5 = 150]]: es la media durante el LT, no un desvío"],a:0,
 x:"√(LT̄·σ_D² + D̄²·σ_LT²) con σ_D = 0. Aunque la demanda no varíe, si el pedido puede tardar un día más, son 30 unidades más: hace falta SS."}
];

const BANK5B = [
{id:"b5b01",t:"GRA",q:"Max Z = 2x_1 + 4x_2 sujeto a [[x_1 + 2x_2 \\leq 8]], [[x_1 \\leq 6]], [[x \\geq 0]]. Vértices: (0,0), (6,0), (6,1), (0,4). ¿Solución?",
 o:["Alternativas: todo el segmento de (0, 4) a (6, 1), con Z* = 16",
    "Alternativas: todo el segmento de (6, 0) a (6, 1), con Z* = 16",
    "Única en (6, 1), porque ahí se cortan las dos restricciones",
    "Única en (0, 4), porque es el vértice con mayor x_2"],a:0,
 x:"Z(0,4) = 16, Z(6,1) = 12 + 4 = 16, Z(6,0) = 12. Z = 2·(x_1 + 2x_2): paralela a la primera restricción, y el máximo se repite en sus dos extremos."},
{id:"b5b02",t:"GRA",q:"La región ya está limitada por [[x_1 \\leq 6]], y además hay una restricción [[x_1 \\leq 10]]. Esta última es…",
 o:["redundante geométrica: no toca la región factible",
    "redundante analítica: toca la región en un vértice",
    "necesaria: si se la quita, la región se agranda",
    "activa: se cumple con igualdad en el óptimo"],a:0,
 x:"Todo punto con x_1 ≤ 6 cumple x_1 ≤ 10: esa recta queda lejos de la región. Sacarla no cambia nada y no toca la región."},
{id:"b5b03",t:"CBA",q:"(P16, reescrita) PL en forma estándar con rango completo y región factible no vacía. ¿Qué es seguro?",
 o:["Que tiene al menos una SBF, y que sus SBF son finitas (a lo sumo C(n, m))",
    "Que tiene al menos una SBF, y que alguna de ellas es necesariamente óptima",
    "Que su región es acotada, porque tiene una cantidad finita de vértices",
    "Que su óptimo es único, porque la región factible es convexa"],a:0,
 x:"Teorema fundamental: si hay solución factible, hay SBF (punto extremo). Que alguna sea óptima requiere que exista óptimo, y eso no se sabe (puede ser no acotado)."},
{id:"b5b04",t:"CBA",q:"Un PL en forma estándar tiene n = 6 variables y m = 4 restricciones. ¿Cuántas soluciones básicas puede tener, como máximo?",
 o:["[[\\binom{6}{4} = 15]]",
    "[[6 \\cdot 4 = 24]]",
    "[[6!/2! = 360]]",
    "[[\\binom{6}{2} \\cdot 2 = 30]]"],a:0,
 x:"Se eligen las m = 4 básicas entre n = 6: C(6, 4) = 6!/(4!·2!) = 15."},
{id:"b5b05",t:"SPX",q:"MIN con restricciones ① ≥, ② = y ③ ≤ (todas con b ≥ 0). ¿Base de la tabla inicial y signo de M?",
 o:["a_1, a_2 y s_3, con +M en las ficticias",
    "a_1, a_2 y s_3, con −M en las ficticias",
    "e_1, a_2 y s_3, con +M en la ficticia",
    "e_1, e_2 y s_3, sin variables ficticias"],a:0,
 x:"La ≥ lleva exceso (−1) y ficticia; la = sólo ficticia; la ≤ su holgura. En un Min las ficticias se castigan con +M («MAX −, MIN +»)."},
{id:"b5b06",t:"SPX",q:"Max. La no básica x_4 tiene [[c_4 - z_4 = 3]] y su columna en la tabla es Y_4 = (0; 0; −1). ¿Qué se concluye?",
 o:["Solución no acotada: ninguna básica frena el crecimiento de x_4",
    "Solución degenerada: dos de los y de su columna valen 0",
    "Sale la básica de una fila con y = 0, porque su cociente es 0",
    "La tabla es óptima, porque no hay ningún cociente válido"],a:0,
 x:"Para frenar a x_4 hace falta algún y > 0. Con todos ≤ 0, entra sin límite y Z crece sin fin (c_4 − z_4 > 0)."},
{id:"b5b07",t:"SPX",q:"Max. c_B = (0; 40; 25) y la columna de la no básica x_j es Y_j = (1; 1/2; 2), con c_j = 65. ¿z_j y costo reducido?",
 o:["z_j = 0·1 + 40·½ + 25·2 = 70; c_j − z_j = −5 (no conviene que entre)",
    "z_j = 0·1 + 40·½ + 25·2 = 70; c_j − z_j = +5 (conviene que entre)",
    "z_j = 0 + 40 + 25 = 65; c_j − z_j = 0 (soluciones alternativas)",
    "z_j = 1 + ½ + 2 = 3,5; c_j − z_j = 61,5 (conviene que entre)"],a:0,
 x:"z_j = c_B·Y_j: lo que se resigna de las básicas por hacer 1 de x_j. Deja 65 y cuesta 70: −5."},
{id:"b5b08",t:"SEN",q:"Max, óptimo (4, 6). Se agrega la restricción [[x_1 + x_2 \\leq 10]]. ¿Qué pasa?",
 o:["La cumple justo (4 + 6 = 10): el óptimo actual sigue siendo óptimo",
    "La cumple justo (4 + 6 = 10): hay que reoptimizar, porque queda activa",
    "No la cumple (4 + 6 > 10): hay que reoptimizar con simplex dual",
    "La cumple con holgura: hay que agregarla a la tabla y pivotear igual"],a:0,
 x:"Se reemplaza el óptimo: si la cumple (aunque sea justo), sigue siendo factible y no puede haber nada mejor en una región más chica. No hay que iterar."},
{id:"b5b09",t:"SEN",q:"MIN costos. El requerimiento mínimo de proteína (≥) tiene valor implícito 0,8. Si se exige 1 unidad más de proteína…",
 o:["el costo mínimo sube 0,8: exigir más nunca abarata",
    "el costo mínimo baja 0,8: el requerimiento es un recurso",
    "el costo mínimo no cambia: la restricción es ≥",
    "el costo sube 0,8 sólo si la restricción es pasiva"],a:0,
 x:"Subir el b de una ≥ la ajusta: en un Min eso sube (o deja igual) el costo. Por eso en un Min una ≥ tiene valor implícito ≥ 0."},
{id:"b5b10",t:"SEN",q:"MIN. La no básica x_5 tiene [[c_5 - z_5 = +5]]. Su costo c_5 baja 3. ¿Qué pasa?",
 o:["Nada: su costo reducido pasa a +2, sigue sin entrar y W* no cambia",
    "x_5 entra a la base: su costo reducido pasa a +2, y en un Min eso mejora",
    "Nada: su costo reducido pasa a +8, sigue sin entrar y W* no cambia",
    "W* baja 3, porque bajó el costo de una variable del modelo"],a:0,
 x:"En un Min entra con c − z < 0. De +5 bajando 3 queda +2: sigue afuera. Como x_5 = 0, W* no se mueve. Necesitaría bajar más de 5."},
{id:"b5b11",t:"DUA",q:"Primal: Max Z = 3x_1 + 2x_2, s.a. [[x_1 + x_2 \\leq 4]], [[x_1 - x_2 = 1]], [[x \\geq 0]]. Su dual es…",
 o:["Min 4u_1 + u_2; u_1 + u_2 ≥ 3; u_1 − u_2 ≥ 2; u_1 ≥ 0, u_2 libre",
    "Min 4u_1 + u_2; u_1 + u_2 ≥ 3; u_1 − u_2 ≥ 2; u_1 ≥ 0, u_2 ≥ 0",
    "Min 4u_1 + u_2; u_1 + u_2 ≤ 3; u_1 − u_2 ≤ 2; u_1 ≥ 0, u_2 libre",
    "Min 3u_1 + 2u_2; u_1 + u_2 ≥ 4; u_1 − u_2 ≥ 1; u_1 ≥ 0, u_2 libre"],a:0,
 x:"b = (4; 1) a la función. Columnas: x_1 = (1; 1) con c = 3, x_2 = (1; −1) con c = 2. x ≥ 0 → ≥ en el dual Min. ① ≤ natural → u_1 ≥ 0; ② = → u_2 libre."},
{id:"b5b12",t:"DUA",q:"El dual de un problema tiene solución no acotada. ¿Qué pasa con el primal?",
 o:["No tiene soluciones factibles",
    "También tiene solución no acotada",
    "Tiene óptimo finito con Z* = 0",
    "Tiene soluciones alternativas"],a:0,
 x:"Si uno es no acotado, el otro es no factible (en cualquiera de las dos direcciones primal/dual)."},
{id:"b5b13",t:"TTA",q:"Asignación de 4 máquinas a 4 trabajos. ¿Hace falta declarar las variables como binarias?",
 o:["No: con ofertas y demandas iguales a 1, el simplex da un óptimo con ceros y unos",
    "Sí: si no, el simplex podría asignar media máquina a cada trabajo",
    "No: porque en asignación las variables valen siempre exactamente 1",
    "Sí: es un problema de programación entera que requiere ramificación"],a:0,
 x:"Integralidad del transporte (matriz de 0, 1 y −1, datos enteros): existe un óptimo entero. La asignación es un transporte con ofertas y demandas 1."},
{id:"b5b14",t:"TTA",q:"(P1, reescrita) En un transbordo, el depósito J recibe mercadería, reparte y además se queda con 15 unidades. Su ecuación (entradas − salidas = b) es…",
 o:["entradas − salidas = 15",
    "entradas − salidas = −15",
    "entradas − salidas = 0",
    "entradas − salidas ≤ 15"],a:0,
 x:"Si consume 15, entra 15 más de lo que sale. Con la convención salidas − entradas, el signo se invierte: leé siempre cómo está escrita."},
{id:"b5b15",t:"ENT",q:"Ramificación y poda (Max). La mejor entera hallada vale 40. Nodo A: no factible. Nodo B: relajado 38. Nodo C: relajado 45 con decimales. ¿Cuál se sigue ramificando?",
 o:["Sólo C: es el único que todavía podría superar 40",
    "Sólo B: tiene el relajado más cercano a 40",
    "A y C: los no factibles también se ramifican",
    "Los tres, hasta que todos den soluciones enteras"],a:0,
 x:"Se poda el no factible (A) y el que no puede superar la mejor entera (B: 38 < 40). C (45) todavía puede dar algo mejor que 40."},
{id:"b5b16",t:"ENT",q:"¿En qué se diferencian los métodos de corte de la ramificación y poda?",
 o:["Los de corte agregan restricciones a un solo problema; la ramificación lo divide en subproblemas",
    "Los de corte dividen el problema en subproblemas; la ramificación agrega restricciones a uno solo",
    "Los de corte sirven para problemas mixtos y la ramificación sólo para binarios",
    "No se diferencian: los dos enumeran todas las soluciones enteras posibles"],a:0,

};

}

/* Mezcla: cambia el orden de los pares y dentro de cada par; la e queda última. */
function makeItem(q){
  if (q.fixed){ const order=[0,1,2,3]; if(q.e) order.push(4); return {q, order, correct: order.indexOf(q.a), ans:null, struck:new Set(), flag:false, checked:false}; }
  let pairs = [[0,1],[2,3]].map(p => Math.random()<.5 ? p : [p[1],p[0]]);
  if (Math.random()<.5) pairs.reverse();
  const order = pairs.flat(); if (q.e) order.push(4);
  return {q, order, correct: order.indexOf(q.a), ans:null, struck:new Set(), flag:false, checked:false};
}

/* Las explicaciones nombran las opciones por su letra original (a–d); con las opciones mezcladas

const LREF = /(\b[Ll]as? (?:opciones )?)([abcd])(?=[\s,.;:)]|$)((?: y )([abcd])(?=[\s,.;:)]|$))?/g;
const xText = it => it.q.x.replace(LREF, (m,pre,l1,rest,l2) => {
  const map = l => LET[it.order.indexOf(LET.indexOf(l))];

});

  <section class="sheet stack">

    </div>
    <div class="stack" style="gap:8px">
      <span class="eyebrow">Temas para la práctica</span>
      <div class="chips" id="chips">
        ${TOPICS.filter(([k])=>counts[k]).map(([k,n])=>`<button class="chip" data-k="${k}" aria-pressed="${pickTopics.has(k)}">${n}<span class="n">${counts[k]}</span></button>`).join("")}
      </div>
    </div>
  </section>

  <section class="sheet stack">
    <h2>Cómo encarar cada pregunta</h2>

    <p class="tip">2. Decidí primero la conclusión (cambia / no cambia, se puede / no se puede). Eso descarta un par entero. Usá «tachar».</p>
    <p class="tip">3. En el par que queda, leé sólo el «porque». Una conclusión correcta con una razón falsa es una opción incorrecta.</p>
    <p class="tip">4. Desconfiá de la razón que es verdadera pero no responde lo que se pregunta: es el distractor más común del examen.</p>`
    :`<p class="tip">1. Leé el enunciado entero y buscá la palabra que decide: <em>necesariamente</em>, <em>siempre</em>, <em>no básica</em>, <em>≤ vs &lt;</em>, <em>Max vs Min</em>, <em>mínimo vs máximo</em>.</p>
    <p class="tip">2. Descartá el par que no corresponde (suele cambiar el concepto entero). Usá «tachar» para dejarlo marcado.</p>
    <p class="tip">3. Dentro del par que queda, compará palabra por palabra: la diferencia es un signo, un subíndice o un «sólo si».</p>
    <p class="tip">4. Si los dos del par te parecen correctos, sospechá de la e) «ninguna».</p>`}
  </section>

  <section class="sheet stack">
    <div class="row" style="justify-content:space-between">
      <h2>Mapa por tema</h2>
      <span class="row" style="gap:6px"><button class="btn ghost" id="export">Exportar avance</button><button class="btn ghost" id="reset">Borrar avance</button></span>
    </div>
    <p class="muted" style="font-size:14px">Cada número es una pregunta del banco, coloreada según tu último intento: <span class="pill ok">bien</span> <span class="pill bad">mal</span> y en blanco las que todavía no viste. Tocá un número para practicar el tema desde esa pregunta.</p>
    <div class="tmap">
      ${TOPICS.filter(([k])=>BANK.some(q=>q.t===k)).map(([k,n])=>{
        const qs=BANK.filter(q=>q.t===k), st=qs.map(q=>STATS[q.id]?.last);
        const ok=st.filter(x=>x===true).length, bad=st.filter(x=>x===false).length, none=st.length-ok-bad;
        return `<div class="trow">
          <div class="thead"><h3>${n}</h3><span class="tcount"><b class="okc">${ok}</b> bien · <b class="badc">${bad}</b> mal · ${none} sin ver</span>
            <span class="row" style="gap:6px"><button class="btn tbtn" data-topic="${k}">Practicar tema</button>${bad?`<button class="btn tbtn" data-topic="${k}" data-wrong="1">Sólo las ${bad} falladas</button>`:""}</span></div>
          <div class="tcells">${qs.map((q,j)=>`<button class="cell ${st[j]===true?"ok":st[j]===false?"bad":""}" data-tq="${k}" data-ti="${j}" aria-label="${n}, pregunta ${j+1}">${j+1}</button>`).join("")}</div>
        </div>`;}).join("")}
    </div>
    <p class="muted" style="font-size:14px" id="reset-msg">El avance se guarda sólo en este navegador. «Exportar avance» lo baja a un archivo para dejarlo en el repo.</p>
  </section>`;

  bindTabs();
  document.querySelectorAll("[data-bank]").forEach(b=>b.onclick=()=>{ useBank(+b.dataset.bank); renderHome(); });
  document.getElementById("go-sim").onclick = startSim;
  document.getElementById("go-prac").onclick = startPractice;
  const ge = document.getElementById("go-err"); if (wrongIds.length) ge.onclick = () => startList(shuffle(wrongIds).map(id=>byId[id]), "review");
  document.querySelectorAll("#chips .chip").forEach(c=>c.onclick=()=>{
    const k=c.dataset.k; pickTopics.has(k)?pickTopics.delete(k):pickTopics.add(k);
    c.setAttribute("aria-pressed", pickTopics.has(k));
  });
  document.getElementById("export").onclick = () => {
    const d = new Date(), pad = n => String(n).padStart(2,"0");
    const stamp = `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
    const bankOf = {}; Object.entries(BANKS).forEach(([n,qs]) => qs.forEach(q => bankOf[q.id] = +n));
    const teoria = Object.entries(STATS).map(([id,r]) => ({id, banco: bankOf[id] || null, tema: byId[id] ? byId[id].t : null, vistas: r.seen, mal: r.wrong, ultimoBien: r.last}));
    let practica = {}; try { practica = JSON.parse(localStorage.getItem("io-practica-v1")) || {}; } catch(e){}
    const blob = new Blob([JSON.stringify({exportado: d.toISOString(), teoria, practica}, null, 1)], {type:"application/json"});
    const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = `avance-io-${stamp}.json`;
    document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 1000);

    STATS={}; saveStats(STATS); renderHome();
  };
  document.querySelectorAll("[data-tq]").forEach(b=>b.onclick=()=>startTopic(b.dataset.tq, +b.dataset.ti, false));

/* Práctica de un tema en el orden del banco, para que los números coincidan con el mapa. */
function startTopic(k, idx, onlyWrong){
  let qs = BANK.filter(q=>q.t===k);
  if (onlyWrong){ qs = qs.filter(q=>STATS[q.id]?.last===false); idx = 0; }
  if (!qs.length) return;
  const nums = BANK.filter(q=>q.t===k).map(q=>q.id);
  S = {mode:"topic", topic:k, onlyWrong, nums: qs.map(q=>nums.indexOf(q.id)+1), items: qs.map(makeItem), i:idx, limit:0, end:null, done:false};
  renderQuiz(); window.scrollTo(0,0);
}

function simPick(){
  if (BANK.length <= 30) return shuffle(BANK).map(makeItem);
  const items=[]; TOPICS.forEach(([k])=> shuffle(BANK.filter(q=>q.t===k)).slice(0,SIM_WEIGHTS[k]||0).forEach(q=>items.push(makeItem(q)))); return items;
}
function startSim(){
  const limit = +document.getElementById("timer").value;
  const items = simPick();
  S = {mode:"sim", items, i:0, limit, end: limit? Date.now()+limit*60000 : null, done:false};
  renderQuiz(); startTimer();
}
function startPractice(){
  const n = +document.getElementById("pcount").value;
  const pool = shuffle(BANK.filter(q=>pickTopics.has(q.t))).slice(0,n);
  if(!pool.length){ return; }
  startList(pool,"prac");
}
function startList(qs, mode){
  S = {mode, items: qs.map(makeItem), i:0, limit:0, end:null, done:false};
  renderQuiz();
}

/* ---------- temporizador ---------- */
let tId = null;
function startTimer(){ stopTimer(); if(!S.end) return; tId = setInterval(tick, 1000); tick(); }
function stopTimer(){ if(tId){ clearInterval(tId); tId=null; } }
function tick(){
  const el = document.getElementById("timer-out"); if(!S || !S.end) return;
  const left = Math.max(0, S.end - Date.now());
  const m = Math.floor(left/60000), s = Math.floor(left/1000)%60;
  if(el){ el.textContent = `${String(m).padStart(2,"0")}:${String(s).padStart(2,"0")}`; el.classList.toggle("low", left < 5*60000); }
  if(left<=0){ stopTimer(); finish(); }
}

/* ---------- pregunta ---------- */
function renderQuiz(){
  const it = S.items[S.i], q = it.q, sim = S.mode==="sim", n = S.items.length;
  const showFb = !sim && it.checked;
  const optsHtml = it.order.map((k,pos)=>{
    let cls = "opt";
    if (it.ans===pos) cls+=" sel";
    if (it.struck.has(pos)) cls+=" struck";
    if (showFb){ if(pos===it.correct) cls+=" right"; else if(it.ans===pos) cls+=" wrong"; }
    const sep = (pos===2 || (pos===4)) ? `<div class="pairline" aria-hidden="true"></div>` : "";
    return `${sep}<div class="${cls}" role="radio" tabindex="0" aria-checked="${it.ans===pos}" data-pos="${pos}">
      <span class="b">${LET[pos]}</span><span class="t">${fmt(optText(q,k))}</span>
      ${showFb?"":`<button class="x" data-strike="${pos}" aria-label="Tachar opción ${LET[pos]}">${it.struck.has(pos)?"destachar":"tachar"}</button>`}
    </div>`;
  }).join("");

  let fb = "";
  if (showFb){
    const ok = it.ans===it.correct;
    fb = `<div class="expl ${ok?"ok":"bad"}"><strong>${ok?"Correcta":"Incorrecta: era la "+LET[it.correct]+")"}</strong><span>${fmt(xText(it))}</span></div>`;
  }

  const gridHtml = S.items.map((x,j)=>{
    let c="cell"; if(j===S.i) c+=" cur";
    if(sim){ if(x.ans!==null) c+=" ans"; if(x.flag) c+=" flag"; }
    else if(x.checked){ c+= x.ans===x.correct?" ok":" bad"; }
    else { const l=STATS[x.q.id]?.last; if(l===true) c+=" was-ok"; else if(l===false) c+=" was-bad"; }
    const num = S.nums ? S.nums[j] : j+1;
    return `<button class="${c}" data-go="${j}" aria-label="Pregunta ${num}">${num}</button>`;
  }).join("");

  const answered = S.items.filter(x=>x.ans!==null).length;
  const label = sim ? "Simulacro" : S.mode==="topic" ? `${TOPIC_NAME[S.topic]}${S.onlyWrong?" · falladas":""}` : (S.mode==="review"?"Repaso de errores":"Práctica");
  $app.innerHTML = `
  <div class="top">
    <div class="topline">
      <button class="btn ghost" id="home">← Salir</button>
      <span class="eyebrow">${label} · ${sim?`${answered}/${n} respondidas`:`${S.i+1} de ${n}`}</span>
      ${sim && S.end ? `<span class="timer" id="timer-out">--:--</span>` : `<span></span>`}
    </div>
    <div class="grid" style="--cols:${Math.min(n,20)};--cols-sm:${Math.min(n,10)}">${gridHtml}</div>
  </div>
  <section class="sheet stack">
    <div class="qhead"><span class="tag">Pregunta ${S.i+1} · ${TOPIC_NAME[q.t]}</span>
      ${sim?`<button class="btn ghost flagbtn" id="flag" aria-pressed="${it.flag}">${it.flag?"Marcada como dudosa":"Marcar dudosa"}</button>`:""}</div>
    <p class="stem">${fmt(q.q)}</p>
    <div class="opts" role="radiogroup">${optsHtml}</div>
    ${fb}
    <div class="nav">
      <button class="btn" id="prev" ${S.i===0?"disabled":""}>Anterior</button>
      <div class="row">
        ${sim ? `<button class="btn" id="finish">Entregar</button>` : ""}
        ${!sim && !it.checked ? `<button class="btn primary" id="check" ${it.ans===null?"disabled":""}>Corregir</button>` : ""}
        ${ (sim || it.checked) ? (S.i<n-1 ? `<button class="btn primary" id="next">Siguiente</button>` : (!sim?`<button class="btn primary" id="finish">Ver resultado</button>`:"")) : ""}
      </div>
    </div>
    <p class="kbd">Teclado: a–e elige · Enter ${sim?"avanza":"corrige / avanza"} · ← → navegan</p>
  </section>
  <div id="confirm"></div>`;

  document.getElementById("home").onclick = () => { stopTimer(); location.hash = "teoria"; renderHome(); };
  document.querySelectorAll("[data-go]").forEach(b=>b.onclick=()=>{ S.i=+b.dataset.go; renderQuiz(); });
  document.querySelectorAll(".opt").forEach(o=>{
    o.onclick = e => { if(e.target.closest("[data-strike]")) return; choose(+o.dataset.pos); };
    o.onkeydown = e => { if(e.key===" "){ e.preventDefault(); choose(+o.dataset.pos); } };
  });
  document.querySelectorAll("[data-strike]").forEach(b=>b.onclick=e=>{
    e.stopPropagation(); const p=+b.dataset.strike; it.struck.has(p)?it.struck.delete(p):it.struck.add(p);
    if(it.ans===p && it.struck.has(p)) it.ans=null; renderQuiz();
  });
  const g=id=>document.getElementById(id);
  if(g("prev")) g("prev").onclick=()=>{ S.i--; renderQuiz(); };
  if(g("next")) g("next").onclick=()=>{ S.i++; renderQuiz(); };
  if(g("check")) g("check").onclick=check;
  if(g("flag")) g("flag").onclick=()=>{ it.flag=!it.flag; renderQuiz(); };
  if(g("finish")) g("finish").onclick=()=> sim ? confirmFinish() : finish();
  tick();
}

function choose(pos){
  const it = S.items[S.i];
  if (S.mode!=="sim" && it.checked) return;
  it.ans = pos; it.struck.delete(pos); renderQuiz();
}
function check(){
  const it = S.items[S.i]; if(it.ans===null || it.checked) return;
  it.checked = true; record(it.q.id, it.ans===it.correct); renderQuiz();
}
function confirmFinish(){
  const blank = S.items.filter(x=>x.ans===null).length, flags = S.items.filter(x=>x.flag).length;
  const box = document.getElementById("confirm");
  box.innerHTML = `<section class="sheet stack"><h3>¿Entregar el simulacro?</h3>
    <p class="muted">${blank? `Quedan ${blank} sin responder. `:"Respondiste todas. "}${flags?`Tenés ${flags} marcadas como dudosas.`:""}</p>
    <div class="row"><button class="btn primary" id="yes">Entregar</button><button class="btn" id="no">Seguir respondiendo</button></div></section>`;
  document.getElementById("yes").onclick = finish;
  document.getElementById("no").onclick = ()=>{ box.innerHTML=""; };
  box.scrollIntoView({behavior:"smooth", block:"center"});
}

/* ---------- resultado ---------- */
function finish(){
  stopTimer();
  if (S.mode==="sim") S.items.forEach(it=>{ if(it.ans!==null) record(it.q.id, it.ans===it.correct); else record(it.q.id,false); });
  else S.items.forEach(it=>{ if(!it.checked && it.ans!==null){ it.checked=true; record(it.q.id, it.ans===it.correct);} });
  S.done = true;
  const items = S.mode==="sim" ? S.items : S.items.filter(x=>x.checked);
  const ok = items.filter(x=>x.ans===x.correct).length, n = items.length;
  const per = {}; items.forEach(x=>{ const t=x.q.t; per[t]=per[t]||{ok:0,n:0}; per[t].n++; if(x.ans===x.correct) per[t].ok++; });
  const wrongItems = items.filter(x=>x.ans!==x.correct);
  const nota = n ? (10*ok/n) : 0;
  $app.innerHTML = `
  <header class="stack">
    <span class="eyebrow">${S.mode==="sim"?"Simulacro entregado":"Resultado"}</span>
    <div class="score">${ok}<small> / ${n}</small></div>
    <p class="muted">${n? `${Math.round(100*ok/n)} % de aciertos, equivalente a ${nota.toFixed(1).replace(".",",")} sobre 10.`:"No respondiste ninguna pregunta."}</p>
    <div class="row">
      <button class="btn primary" id="again">${S.mode==="sim"?"Otro simulacro":"Volver al inicio"}</button>
      ${wrongItems.length?`<button class="btn" id="redo">Practicar las ${wrongItems.length} que erré</button>`:""}
      ${S.mode==="sim"?`<button class="btn ghost" id="home2">Inicio</button>`:""}
    </div>
  </header>
  <section class="sheet stack">
    <h2>Por tema</h2>
    <div class="statgrid">
      <span class="h">Tema</span><span class="h">Aciertos</span><span class="h"></span>
      ${TOPICS.filter(([k])=>per[k]).map(([k,nm])=>`<span>${nm}</span><span>${per[k].ok}/${per[k].n}</span><span class="bar"><i style="width:${100*per[k].ok/per[k].n}%"></i></span>`).join("")}
    </div>
  </section>
  <section class="sheet stack">
    <h2>Corrección</h2>
    <div class="rev">
      ${items.map((x,j)=>{
        const good = x.ans===x.correct;
        const yours = x.ans===null ? "sin responder" : `${LET[x.ans]}) ${fmt(optText(x.q,x.order[x.ans]))}`;
        return `<article class="revitem ${good?"ok":"bad"}">
          <div class="row"><span class="pill ${good?"ok":"bad"}">${good?"bien":"mal"}</span>${x.flag?`<span class="pill flag">dudosa</span>`:""}<span class="tag">${j+1} · ${TOPIC_NAME[x.q.t]}</span></div>
          <p><strong>${fmt(x.q.q)}</strong></p>
          ${good?"":`<p class="ans">Tu respuesta: ${yours}</p>`}
          <p class="ans">Correcta: ${LET[x.correct]}) ${fmt(optText(x.q,x.order[x.correct]))}</p>
          <p class="ans muted">${fmt(xText(x))}</p>
        </article>`;}).join("")}
    </div>
  </section>`;
  document.getElementById("again").onclick = ()=> S.mode==="sim" ? startSimFromResults() : renderHome();
  const h2=document.getElementById("home2"); if(h2) h2.onclick=renderHome;
  const rd=document.getElementById("redo"); if(rd) rd.onclick=()=>startList(wrongItems.map(x=>x.q),"prac");
  window.scrollTo(0,0);
}
function startSimFromResults(){
  const limit = S.limit;
  const items = simPick();
  S = {mode:"sim", items, i:0, limit, end: limit? Date.now()+limit*60000:null, done:false};
  renderQuiz(); startTimer(); window.scrollTo(0,0);
}

/* ---------- teclado ---------- */
document.addEventListener("keydown", e=>{
  if(!S || S.done || e.target.tagName==="SELECT") return;
  if(!document.querySelector(".opts")) return;
  const it = S.items[S.i];
  const k = e.key.toLowerCase();
  const idx = LET.indexOf(k);
  if (idx>=0 && idx<it.order.length && !e.ctrlKey && !e.metaKey){ choose(idx); return; }
  if (e.key==="Enter" && !e.target.closest("button")){
    if (S.mode!=="sim" && !it.checked){ check(); return; }
    if (S.i < S.items.length-1){ S.i++; renderQuiz(); }
    return;
  }
  if (e.key==="ArrowRight" && S.i<S.items.length-1 && (S.mode==="sim"||it.checked)){ S.i++; renderQuiz(); }
  if (e.key==="ArrowLeft" && S.i>0){ S.i--; renderQuiz(); }
});
</script>
<script src="parcial-2026-10-03.js"></script>
<script src="recuperatorio-2026-11-19.js"></script>
<script>
/* ===================== PRÁCTICA ===================== */
function tabsHTML(active){
  return `<nav class="tabs" aria-label="Sección">
    <button class="tab" data-tab="teoria" aria-current="${active==="teoria"?"page":"false"}">Teoría</button>
    <button class="tab" data-tab="practica" aria-current="${active==="practica"?"page":"false"}">Práctica</button></nav>`;
}
function bindTabs(){ document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>{ const t=b.dataset.tab; if(location.hash!=="#"+t) location.hash=t; else route(); }); }
function route(){ stopTimer(); if(location.hash==="#practica") renderPracticeHome(); else renderHome(); }
window.addEventListener("hashchange", route);

/* ---------- aritmética exacta ---------- */
function gcd(a,b){a=Math.abs(a);b=Math.abs(b);while(b){[a,b]=[b,a%b];}return a||1;}
class F{
  constructor(n,d=1){ if(d<0){n=-n;d=-d;} const g=gcd(n,d); this.n=(n/g)||0; this.d=d/g; }
  static of(x){ if(x instanceof F) return x; let d=1; while(Math.abs(x*d-Math.round(x*d))>1e-9 && d<1e6) d*=10; return new F(Math.round(x*d),d); }
  add(o){o=F.of(o);return new F(this.n*o.d+o.n*this.d,this.d*o.d);}
  sub(o){o=F.of(o);return new F(this.n*o.d-o.n*this.d,this.d*o.d);}
  mul(o){o=F.of(o);return new F(this.n*o.n,this.d*o.d);}
  div(o){o=F.of(o);return new F(this.n*o.d,this.d*o.n);}
  neg(){return new F(-this.n,this.d);} sign(){return Math.sign(this.n);} isZero(){return this.n===0;}
  cmp(o){o=F.of(o);return Math.sign(this.n*o.d-o.n*this.d);} eq(o){return this.cmp(o)===0;}
  val(){return this.n/this.d;} isInt(){return this.d===1;}
}
const Z0 = new F(0);
const nf = (x,dec=2) => Number(x).toLocaleString("es-AR",{maximumFractionDigits:dec,minimumFractionDigits:0}).replace(/−/g,"−").replace(/^-/,"−");
const fs = q => q.d===1 ? nf(q.n,0) : (q.d<=99 ? `${q.n<0?"−":""}${Math.abs(q.n)}/${q.d}` : nf(q.val()));
const fsa = q => q.d===1 ? nf(q.n,0) : `${fs(q)} ≈ ${nf(q.val())}`;
function inv3(M){
  const A=M.map((row,i)=>[...row,...[0,1,2].map(j=>new F(i===j?1:0))]);
  for(let c=0;c<3;c++){

    const o=mkOpts(r,cor,ds,0);
    qs.push({q:`¿Le convendría a la empresa tomar un crédito al ${p.r} % anual para expandir su presupuesto?`,...o,
      x:`λ ≈ ${nf(e.lam,3)} es el costo marginal de no tener más capital; la restricción actúa como si la tasa fuera i + λ ≈ ${nf(p.i+e.lam,3)}. ${yes?`La tasa del crédito (${p.r} %) está por debajo de λ y también de i + λ: conviene.`:`La tasa del crédito (${p.r} %) supera a i + λ: no conviene.`} (El apunte usa i₁ + λ como límite; con estos números los dos criterios coinciden.)`}); }
  return qs;
}

/* ===================== armado del parcial ===================== */
const LIB = {F,ej1Build,ej2Build,ej3Build,lineInt,fs,fsa,nf,VN,NONE};
function buildVariant(seed){
  const r=mulberry32(seedNum(seed));
  const e1=genEj1(r), e2=genEj2(r), e3=genEj3(r);
  return {id:"var-"+seed, title:`Variante ${seed}`, seed, ejs:[
    {intro:e1.intro, fig:e1.fig, sol:e1.sol, qs:ej1Questions(e1,r)},
    {intro:e2.intro+e2.table(e2.T), fig:"", sol:e2.sol, lead:"Resuelva analíticamente y responda (una sola opción):", qs:ej2Questions(e2,r)},
    {intro:e3.intro, fig:"", sol:e3.sol, qs:ej3Questions(e3,r)} ]};
}
function recupExam(){ try { return typeof window.RECUP_REAL==="function" ? window.RECUP_REAL(LIB) : null; } catch(err){ console.error(err); return null; } }
function realExam(){ try { return typeof window.PARCIAL_REAL==="function" ? window.PARCIAL_REAL(LIB) : null; } catch(err){ console.error(err); return null; } }

const PSTORE="io-practica-v1";
const pLoad=()=>{ try{ return JSON.parse(localStorage.getItem(PSTORE))||{}; }catch(e){ return {}; } };
const pSave=s=>{ try{ localStorage.setItem(PSTORE,JSON.stringify(s)); }catch(e){} };

function renderPracticeHome(){
  const real=realExam(), recup=recupExam(), hist=pLoad();
  const last=id=>hist[id]?`Último intento: ${hist[id].last}/${hist[id].n} · mejor: ${hist[id].best}/${hist[id].n}`:"Sin intentos todavía";
  const vars=Object.keys(hist).filter(k=>k.startsWith("var-")).slice(-6).reverse();
  $app.innerHTML=`${tabsHTML("practica")}
  <header class="stack">
    <span class="eyebrow">Investigación Operativa · globalizador de febrero</span>
    <h1>Parcial práctico</h1>
    <p class="muted">Tres ejercicios como en el parcial: método gráfico, una tabla simplex con sensibilidad y dual, y stock con restricción de capital. Resolvé en hoja aparte, marcá una opción por pregunta y entregá para ver la corrección.</p>
  </header>
  <div class="modes">
    ${recup?`<button class="mode" id="go-recup"><span class="k">Recuperatorio del 19/11</span><h3>El que tomaron</h3><p>Gráfico con cuatro restricciones, simplex con sensibilidad y dual, y stock con descuento por excedente. Al corregir te muestra lo que marcaste. ${last(recup.id)}</p></button>`:""}
    ${real?`<button class="mode" id="go-real"><span class="k">Parcial del 3/10</span><h3>El que tomaron</h3><p>Mismas preguntas y opciones. Al corregir te muestra también lo que marcaste en el parcial. ${last(real.id)}</p></button>`
      :`<div class="mode"><span class="k">Parcial del 3/10</span><h3>No disponible acá</h3><p>La réplica del parcial vive en un archivo privado que no se sube al repositorio.</p></div>`}
    <button class="mode" id="go-var"><span class="k">Variante nueva</span><h3>Mismos ejercicios, otros números</h3><p>Se genera al azar y cada respuesta se calcula con fracciones exactas. Cada variante tiene un código para repetirla.</p></button>
  </div>
  <section class="sheet stack">
    <h2>Repetir una variante</h2>
    <div class="row"><label for="seed" class="muted">Código</label><input class="seed" id="seed" maxlength="8" placeholder="7K3QF"><button class="btn" id="go-seed">Abrir</button></div>
    ${vars.length?`<div class="stack" style="gap:6px">${vars.map(k=>`<div class="row"><button class="btn ghost code" data-seed="${k.slice(4)}">${k.slice(4)}</button><span class="muted" style="font-size:14px">${last(k)}</span></div>`).join("")}</div>`:""}
  </section>`;
  bindTabs();
  if(real) document.getElementById("go-real").onclick=()=>startExam(real);
  if(recup) document.getElementById("go-recup").onclick=()=>startExam(recup);
  document.getElementById("go-var").onclick=()=>startExam(buildVariant(newSeed()));
  const go=()=>{ const v=document.getElementById("seed").value.trim().toUpperCase(); if(v) startExam(buildVariant(v)); };
  document.getElementById("go-seed").onclick=go;
  document.getElementById("seed").onkeydown=e=>{ if(e.key==="Enter") go(); };
  document.querySelectorAll("[data-seed]").forEach(b=>b.onclick=()=>startExam(buildVariant(b.dataset.seed)));
}

let PX=null;
function startExam(ex){ PX={ex, ans:{}, struck:{}, done:false}; renderExam(); window.scrollTo(0,0); }
function renderExam(){
  const ex=PX.ex; let n=0;
  const total=ex.ejs.reduce((s,e)=>s+e.qs.length,0), answered=Object.keys(PX.ans).length;
  let score=0; if(PX.done) ex.ejs.forEach((e,ei)=>e.qs.forEach((q,qi)=>{ if(PX.ans[ei+"-"+qi]===q.a) score++; }));
  const body=ex.ejs.map((e,ei)=>{
    let ok=0; const qh=e.qs.map((q,qi)=>{ n++; const key=ei+"-"+qi, a=PX.ans[key], st=PX.struck[key]||[];
      if(PX.done && a===q.a) ok++;
      const opts=q.opts.map((t,pos)=>{ let cls="opt"; if(a===pos) cls+=" sel"; if(st.includes(pos)) cls+=" struck";
        if(PX.done){ if(pos===q.a) cls+=" right"; else if(a===pos) cls+=" wrong"; }
        return `<div class="${cls}" role="radio" tabindex="0" aria-checked="${a===pos}" data-k="${key}" data-pos="${pos}"><span class="b">${LET[pos]}</span><span class="t">${t}</span>${PX.done?"":`<button class="x" data-sk="${key}" data-sp="${pos}" aria-label="Tachar ${LET[pos]}">${st.includes(pos)?"destachar":"tachar"}</button>`}</div>`; }).join("");
      const fb = PX.done ? `<div class="expl ${a===q.a?"ok":"bad"}"><strong>${a===q.a?"Correcta":(a===undefined?"Sin responder":"Incorrecta")}: era la ${LET[q.a]})</strong><span>${q.x}</span>${q.prev!==undefined?`<span class="prev">En el parcial marcaste ${LET[q.prev]}) ${q.prev===q.a?"✓":"✗"}</span>`:""}</div>` : "";
      return `<div class="eq" id="q-${key}"><p class="stem"><b>${n}.</b> ${q.q}</p><div class="eopts" role="radiogroup">${opts}</div>${fb}</div>`; }).join("");
    return `<section class="sheet stack"><div class="qhead"><h2>Ejercicio ${ei+1}</h2>${PX.done?`<span class="pill ${ok===e.qs.length?"ok":"bad"}">${ok}/${e.qs.length}</span>`:""}</div>
      <div class="enun">${e.intro}${e.fig||""}<p class="muted">${e.lead||"Resuelva analíticamente y responda (una sola opción):"}</p></div>${qh}
      ${PX.done?`<details class="sol"><summary>Ver resolución</summary>${e.sol}</details>`:""}</section>`;
  }).join("");
  $app.innerHTML=`
  <div class="top"><div class="topline">
    <button class="btn ghost" id="pout">← Salir</button>
    <span class="eyebrow">${ex.title} · ${PX.done?`${score}/${total} correctas`:`${answered}/${total} respondidas`}</span>
    ${PX.done?`<span></span>`:`<button class="btn primary" id="psub">Entregar</button>`}</div></div>
  ${PX.done?`<section class="sheet stack"><div class="score">${score}<small> / ${total}</small></div>
    <p class="muted">${Math.round(100*score/total)} % de aciertos.${ex.seed?` Código de esta variante: <span class="code">${ex.seed}</span>.`:""}</p>
    <div class="row"><button class="btn primary" id="pnew">Otra variante</button><button class="btn" id="pretry">Rehacer este</button></div></section>`:""}
  ${body}
  <div id="pconfirm"></div>`;
  document.getElementById("pout").onclick=()=>{ location.hash="practica"; renderPracticeHome(); };
  if(PX.done){ document.getElementById("pnew").onclick=()=>startExam(buildVariant(newSeed())); document.getElementById("pretry").onclick=()=>startExam(ex); }
  else document.getElementById("psub").onclick=()=>{
    const blank=total-Object.keys(PX.ans).length, box=document.getElementById("pconfirm");
    box.innerHTML=`<section class="sheet stack"><h3>¿Entregar?</h3><p class="muted">${blank?`Quedan ${blank} sin responder.`:"Respondiste todas."}</p><div class="row"><button class="btn primary" id="py">Entregar</button><button class="btn" id="pn">Seguir</button></div></section>`;
    document.getElementById("py").onclick=finishExam; document.getElementById("pn").onclick=()=>box.innerHTML=""; box.scrollIntoView({behavior:"smooth",block:"center"}); };
  document.querySelectorAll(".eopts .opt").forEach(o=>{
    const sel=()=>{ if(PX.done) return; const k=o.dataset.k, pos=+o.dataset.pos; PX.ans[k]=pos; PX.struck[k]=(PX.struck[k]||[]).filter(x=>x!==pos); keepScroll(renderExam); };
    o.onclick=e=>{ if(e.target.closest("[data-sk]")) return; sel(); }; o.onkeydown=e=>{ if(e.key===" "||e.key==="Enter"){ e.preventDefault(); sel(); } }; });
  document.querySelectorAll("[data-sk]").forEach(b=>b.onclick=e=>{ e.stopPropagation(); const k=b.dataset.sk, p=+b.dataset.sp, s=PX.struck[k]||[];
    PX.struck[k]= s.includes(p)?s.filter(x=>x!==p):[...s,p]; if(PX.ans[k]===p && PX.struck[k].includes(p)) delete PX.ans[k]; keepScroll(renderExam); });
}
function keepScroll(fn){ const y=window.scrollY; fn(); window.scrollTo(0,y); }
function finishExam(){
  PX.done=true; const ex=PX.ex; let sc=0,n=0; ex.ejs.forEach((e,ei)=>e.qs.forEach((q,qi)=>{ n++; if(PX.ans[ei+"-"+qi]===q.a) sc++; }));
  const h=pLoad(), o=h[ex.id]||{best:0}; h[ex.id]={last:sc,best:Math.max(o.best||0,sc),n}; pSave(h);
  renderExam(); window.scrollTo(0,0);
}

route();
</script>
