 x:"Reemplazás el óptimo: 4 < 10, sobran 6. Si sobra, vale 0. Ojo: pasiva no es lo mismo que redundante; una pasiva puede formar un borde de la región en otro lado."},
{id:"b2gra2",t:"GRA",q:"Min Z = 2x_1 + 3x_2 sujeto sólo a [[x_1 + x_2 \\geq 4]] y [[x_1, x_2 \\geq 0]]. La región factible se extiende hacia arriba y a la derecha sin límite. ¿Qué tipo de solución tiene?",
 o:["Óptimo único y finito en (4, 0), con Z* = 8",
    "Óptimo único y finito en (0, 4), con Z* = 12",
    "Solución no acotada, porque la región factible es no acotada",
    "Soluciones alternativas sobre el segmento de (4, 0) a (0, 4)"],a:0,
 x:"Es un Min: querés ir hacia el origen, y la recta x_1 + x_2 = 4 te frena. En (4, 0) Z = 8 y en (0, 4) Z = 12. La región infinita no importa, porque se abre para el lado en que Z empeora. No hay alternativas: (2, 3) no es paralelo a (1, 1)."},
{id:"b2gra3",t:"GRA",q:"Max Z = x_1 + x_2 sujeto a [[x_1 + x_2 \\leq 6]], [[x_1 \\leq 4]], [[x \\geq 0]]. Los vértices son (0,0), (4,0), (4,2) y (0,6). ¿Cuál es la solución?",
 o:["Soluciones alternativas sobre el segmento de (0, 6) a (4, 2), con Z* = 6",
    "Soluciones alternativas sobre el segmento de (4, 0) a (4, 2), con Z* = 6",
    "Óptimo único en (4, 2), porque ahí se cortan dos restricciones",
    "Óptimo único en (0, 6), porque es el vértice más alejado del origen"],a:0,
 x:"Z vale 6 en (0, 6) y en (4, 2): la función es paralela a la primera restricción. En (4, 0) vale 4, así que ese segmento no es óptimo."},
{id:"b2gra4",t:"GRA",q:"Un modelo de dos variables tiene la restricción [[x_1 + x_2 = 5]]. Al graficar, ¿cómo queda la región factible?",
 o:["Queda sobre esa recta: un segmento (o un punto) que además cumpla las otras restricciones",
    "Queda sobre esa recta, pero también incluye el semiplano del lado del origen",
    "Se separa en ≤ 5 y ≥ 5, y la región es la franja entre las dos rectas",
    "No se puede graficar: una ecuación no define semiplanos"],a:0,
 x:"Una igualdad no deja elegir lado. Separarla en ≤ 5 y ≥ 5 da exactamente la misma recta (la intersección de los dos semiplanos), no una franja."},
{id:"b2gra5",t:"GRA",q:"Una restricción tiene término independiente negativo: [[-x_1 + 2x_2 \\geq -4]]. Para llevarla a forma estándar…",
 o:["se multiplica por −1, queda [[x_1 - 2x_2 \\leq 4]] y se le suma una holgura",
    "se multiplica por −1, queda [[x_1 - 2x_2 \\geq 4]] y se le resta un exceso",
    "se le resta un exceso y se agrega una ficticia, dejando el −4",
    "se le suma una holgura directamente, porque ya es ≥"],a:0,
 x:"En forma estándar todos los b tienen que ser ≥ 0. Al multiplicar por −1 se invierte el sentido: ≥ pasa a ≤. Y la ≤ con b ≥ 0 sólo necesita holgura."},
{id:"b2gra6",t:"GRA",q:"Una restricción pasa justo por el vértice óptimo, pero si se la elimina la región factible queda exactamente igual. Esa restricción es…",
 o:["activa y redundante (analítica); su valor implícito puede ser 0",
    "activa y necesaria; su valor implícito es necesariamente positivo",
    "pasiva y redundante (geométrica); su valor implícito es 0",
    "pasiva y necesaria; su valor implícito es 0"],a:0,
 x:"Pasa por el óptimo → se cumple con igualdad → activa. Eliminarla no cambia nada → redundante. Como no es la que te frena, aflojarla no mejora Z: el valor implícito puede dar 0 (el «candado de más»)."},

/* ===== CBA ===== */
{id:"b2cba1",t:"CBA",q:"Un PL en forma estándar tiene n = 5 variables y m = 3 restricciones. ¿Cuántas soluciones básicas puede tener, como máximo?",
 o:["[[\\binom{5}{3} = 10]]","[[5 \\cdot 3 = 15]]","[[5!/2! = 60]]","[[\\binom{6}{3} = 20]]"],a:0,
 x:"Una solución básica elige m = 3 variables básicas de las n = 5: C(5, 3) = 5!/(3!·2!) = 10. Es una cota: algunas pueden no ser factibles."},
{id:"b2cba2",t:"CBA",q:"En una tabla de un PL con m = 3 restricciones, las básicas son x_1 = 4, x_3 = 0 y s_2 = 7. La solución es…",
 o:["degenerada: una básica vale 0, así que hay 2 componentes positivas, menos que m = 3",
    "no degenerada: tiene exactamente m = 3 variables en la base",
    "no factible: una variable básica no puede valer 0",
    "con soluciones alternativas, porque una básica vale 0"],a:0,
 x:"La base siempre tiene m lugares. Si uno lo ocupa una variable que vale 0, quedan menos de m positivas: degenerada. Valer 0 es factible (≥ 0); alternativas es otra cosa (un costo reducido nulo en una no básica)."},
{id:"b2cba3",t:"CBA",q:"(0, 6) y (4, 2) son soluciones óptimas de un PL, con Z* = 6. ¿Qué se puede decir del punto (2, 4)?",
 o:["También es óptimo, porque es combinación convexa de los dos (con λ = 1/2)",
    "No es óptimo, porque el óptimo sólo se alcanza en vértices",
    "Es óptimo y además es un punto extremo de la región",
    "Es óptimo sólo si además es una solución básica factible"],a:0,
 x:"(2, 4) = ½·(0, 6) + ½·(4, 2). Si el óptimo se alcanza en dos vértices, se alcanza en todo el segmento. No es punto extremo, justamente porque es combinación de otros dos."},
{id:"b2cba4",t:"CBA",q:"Un PL en forma estándar (con rango completo) tiene solución óptima. Según el teorema fundamental de la PL…",
 o:["existe al menos una solución básica factible que es óptima",
    "toda solución óptima es una solución básica factible",
    "la solución óptima es única y está en un vértice",
    "la solución óptima está en el interior de la región"],a:0,
 x:"«Existe una SBF óptima», no «toda óptima es SBF»: con alternativas, los puntos del medio del segmento son óptimos y no son vértices."},
{id:"b2cba5",t:"CBA",q:"¿Por qué la región factible de cualquier PL es un conjunto convexo?",
 o:["Porque es la intersección de semiespacios, y la intersección de conjuntos convexos es convexa",
    "Porque es la unión de semiespacios, y la unión de conjuntos convexos es convexa",
    "Porque siempre es acotada y tiene un número finito de vértices",
    "Porque la función objetivo es lineal"],a:0,
 x:"Cada restricción define un semiplano (convexo), y la región es lo que cumple todas a la vez: la intersección. La unión de convexos no es convexa en general, y la región puede no ser acotada."},
{id:"b2cba6",t:"CBA",q:"La solución conceptual del PL evalúa todas las bases. Con 20 variables y 10 restricciones, ¿cuántas son, aproximadamente?",
 o:["[[\\binom{20}{10} \\approx 184.756]]: por eso se usa el simplex, que recorre sólo algunas",
    "[[\\binom{20}{10} \\approx 184.756]]: por eso el simplex las recorre todas en orden",
    "[[20 \\cdot 10 = 200]]: es manejable, pero el simplex es más prolijo",
    "[[20 + 10 = 30]]: una por variable y una por restricción"],a:0,
 x:"El número de bases crece de forma combinatoria. El simplex no las prueba todas: va de un vértice a uno vecino, siempre mejorando Z."},

/* ===== SPX ===== */
{id:"b2spx1",t:"SPX",q:"En un Max, una restricción es una igualdad: [[x_1 + x_2 = 10]]. Para armar la tabla inicial del simplex se le agrega…",
 o:["sólo una variable ficticia, con coeficiente −M en la función objetivo",
    "una holgura y una ficticia, con coeficientes 0 y −M",
    "un exceso y una ficticia, como en una restricción ≥",
    "sólo una holgura, porque la igualdad ya se cumple"],a:0,
 x:"No hay nada que sobre ni que falte, así que no lleva holgura ni exceso. La ficticia está sólo para tener un 1 en la base inicial (B = I). «MAX −, MIN +»."},
{id:"b2spx2",t:"SPX",q:"Tabla de un Max con estos [[c_j - z_j]] en las no básicas: x_1: +4, x_2: 0, s_1: −2. ¿Qué indica el 0 de x_2?",
 o:["Nada todavía: la tabla no es óptima (x_1 tiene +4), así que primero se sigue iterando",
    "Que hay soluciones alternativas, porque una no básica tiene costo reducido 0",
    "Que la solución es degenerada",
    "Que x_2 debe entrar a la base en lugar de x_1"],a:0,
 x:"Un costo reducido nulo en una no básica anuncia alternativas sólo si la tabla ya es óptima. Acá entra x_1 (el mayor positivo)."},
{id:"b2spx3",t:"SPX",q:"Entra x_2. En su columna, los [[y_{ij}]] son (2; −1; 0,5) y los valores de las básicas son (8; 3; 4). ¿Qué fila sale?",
 o:["La fila 1, con θ = 8/2 = 4 (la fila 2 no compite porque su y es negativo)",
    "La fila 2, con θ = 3/(−1) = −3, que es el menor cociente",
    "La fila 3, con θ = 4/0,5 = 8, que es el mayor cociente",
    "Ninguna: hay un y negativo, así que la solución es no acotada"],a:0,
 x:"Sólo se divide donde y > 0: filas 1 (θ = 4) y 3 (θ = 8). Sale la del menor, la 1. Un solo y negativo no da no acotada; harían falta todos ≤ 0."},
{id:"b2spx4",t:"SPX",q:"Entra x_1. Los cocientes de la prueba son: fila 1, 6/2 = 3; fila 2, 3/1 = 3. ¿Qué pasa en la tabla siguiente?",
 o:["Sale una sola de las dos; la otra queda en la base con valor 0: solución degenerada",
    "Salen las dos, y entra también otra variable para completar la base",
    "Sale una sola, y la otra queda en la base con su valor anterior",
    "No se puede elegir: el problema no tiene solución"],a:0,
 x:"Las dos básicas llegan a 0 al mismo tiempo. Sale una (por la regla de desempate) y la otra se queda en la base valiendo 0."},
{id:"b2spx5",t:"SPX",q:"En un Max, x_3 tiene [[c_3 - z_3 = +5]] y su columna es [[Y_3 = (-1;\\ 0;\\ -2)]]. ¿Qué se concluye?",
 o:["La solución es no acotada: ninguna básica limita el crecimiento de x_3",
    "Hay degeneración, porque uno de los y vale 0",
    "Sale la básica de la fila del 0, que es el menor cociente",
    "La tabla es óptima, porque no hay cociente válido"],a:0,
 x:"Para frenar a x_3 hace falta algún y > 0. Con todos ≤ 0 (ceros incluidos), x_3 crece sin límite y Z también."},
{id:"b2spx6",t:"SPX",q:"Al terminar el simplex (todos los [[c_j - z_j \\leq 0]] en un Max), la ficticia a_3 quedó en la base con valor 0. Entonces…",
 o:["es el óptimo, factible, y la solución es degenerada",
    "el problema no tiene solución factible, porque quedó una ficticia en la base",
    "es el óptimo, y la solución no es degenerada porque la ficticia no aporta a Z",
    "hay que seguir iterando hasta sacar la ficticia"],a:0,
 x:"No factible es sólo cuando la ficticia queda con valor positivo. Con valor 0 todas las restricciones se cumplen, pero hay una básica en 0: degenerada."},
{id:"b2spx7",t:"SPX",q:"En un Min, los [[c_j - z_j]] de las no básicas son x_1: −3, x_2: +2, x_3: −5. ¿Qué hacés?",
 o:["Entra x_3, el más negativo: en un Min se mejora bajando Z",
    "Entra x_2, el único positivo, como en un Max",
    "Es óptima: hay un costo reducido positivo",
    "Entra x_1, el negativo más cercano a cero"],a:0,
 x:"Min: es óptima cuando todos son ≥ 0. Si hay negativos, entra el más negativo (es la convención; cualquiera negativo también mejora)."},
{id:"b2spx8",t:"SPX",q:"Borraste la columna de la ficticia a_3 de una restricción ≥, pero necesitás esa columna de [[B^{-1}]]. La columna del exceso e_3 es (−1/3; 2; 0). La columna que buscás es…",
 o:["(1/3; −2; 0): la del exceso con el signo cambiado (efecto espejo)",
    "(−1/3; 2; 0): la del exceso tal cual",
    "(0; 0; 1): la columna original de la ficticia",
    "No se puede recuperar sin volver a resolver"],a:0,
 x:"En una ≥ el exceso entra con −1 y la ficticia con +1, y esa relación se mantiene en toda la tabla. La columna de la ficticia es la del exceso por −1."},
{id:"b2spx9",t:"SPX",q:"Producir 1 unidad de x_1 obliga a bajar x_2 en 1/2 unidad ([[c_2 = 40]]) y x_3 en 1 unidad ([[c_3 = 10]]). Si [[c_1 = 25]]…",
 o:["[[z_1 = 40 \\cdot \\tfrac12 + 10 \\cdot 1 = 30]], y [[c_1 - z_1 = -5]]: no conviene producir x_1",
    "[[z_1 = 40 \\cdot \\tfrac12 + 10 \\cdot 1 = 30]], y [[c_1 - z_1 = +5]]: conviene producir x_1",
    "[[z_1 = 25]], porque es lo que deja x_1, y [[c_1 - z_1 = 0]]",
    "[[z_1 = 50]], la suma de los precios de lo que se resigna"],a:0,
 x:"z_j es lo que dejás de ganar en los otros productos al hacer 1 de x_j. Ganás 25 y perdés 30: neto −5."},
{id:"b2spx10",t:"SPX",q:"La solución es degenerada: la básica de la fila 2 vale 0. Entra x_4, cuyo y en la fila 2 es −1; el cociente mínimo (único) sale de la fila 1 y da θ = 5. Después del pivote, la básica de la fila 2…",
 o:["pasa a valer 0 − 5·(−1) = 5: se sale de la degeneración",
    "sigue valiendo 0, porque las básicas en cero no cambian",
    "pasa a valer −5, y la solución se vuelve no factible",
    "sale de la base, porque era la que valía 0"],a:0,
 x:"Cada básica cambia según x_i − θ·y_i. Con y negativo, la básica sube. Como θ es positivo y único, no aparece otro cero."},
{id:"b2spx11",t:"SPX",q:"En la tabla óptima, una variable básica vale 1. Sin otro dato, ¿qué tipo de solución es?",
 o:["No se puede afirmar que sea no degenerada: habría que ver que todas las básicas sean positivas",
    "No degenerada, porque una básica positiva alcanza",
    "Degenerada, porque las básicas que valen 1 vienen de la identidad",
    "Con soluciones alternativas, porque 1 es un valor entero"],a:0,
 x:"Degenerada es que alguna básica valga 0. Que una valga 1 no dice nada de las demás. Si el enunciado aclara que todas son positivas, entonces sí es no degenerada."},
{id:"b2spx12",t:"SPX",q:"Max con restricciones ①: ≤, ②: ≤, ③: ≥. ¿Cuál es la base de la tabla inicial con Gran M?",
 o:["s_1, s_2 y la ficticia a_3",
    "s_1, s_2 y el exceso e_3",
    "s_1, s_2, e_3 y a_3",
    "a_1, a_2 y a_3: una ficticia por restricción"],a:0,
 x:"El exceso entra con −1 y no sirve para la identidad; por eso se agrega la ficticia. Las ≤ ya tienen su holgura con +1."},
{id:"b2spx13",t:"SPX",q:"El nuevo valor de Z al cambiar de base es [[Z' = Z + \\theta_j (c_j - z_j)]]. En un Max con [[c_j - z_j = 6]] y θ = 0 (caso degenerado)…",
 o:["Z no cambia: se cambia de base pero no de vértice",
    "Z aumenta en 6",
    "Z disminuye, porque θ = 0 indica que la variable sale",
    "No se puede pivotear con θ = 0"],a:0,
 x:"Z' = Z + 0·6 = Z. La variable entra con valor 0. Si esto se repite, el método puede ciclar."},
{id:"b2spx14",t:"SPX",q:"¿Qué representa el coeficiente [[y_{ij} = 2]] de la columna de x_j en la fila de la básica x_i?",
 o:["Que si entra 1 unidad de x_j, la básica x_i baja 2 unidades (sustitución: −2)",
    "Que si entra 1 unidad de x_j, la básica x_i sube 2 unidades",
    "Que si entra 1 unidad de x_j, Z sube 2",
    "Que x_j vale 2 en la solución actual"],a:0,
 x:"De x_B = B⁻¹b − Y_j·x_j: ∂x_i/∂x_j = −y_ij. El coeficiente de sustitución es −2: la básica baja."},

/* ===== SEN ===== */
{id:"b2sen1",t:"SEN",q:"En el óptimo, la holgura de la restricción 2 es básica y vale 20 (sobra recurso). ¿Cuál es el rango de [[\\Delta b_2]] y qué pasa con Z*?",
 o:["[[-20 \\leq \\Delta b_2 < \\infty]], y Z* no cambia (el precio sombra es 0)",
    "[[-20 \\leq \\Delta b_2 \\leq 20]], y Z* no cambia",
    "[[-\\infty < \\Delta b_2 \\leq 20]], y Z* no cambia",
    "[[-20 \\leq \\Delta b_2 < \\infty]], y Z* cambia en u_2·Δb_2 con u_2 > 0"],a:0,
 x:"Podés sacar hasta lo que sobra (20) y agregar sin límite. Sólo cambia la holgura; los productos y Z quedan iguales."},
{id:"b2sen2",t:"SEN",q:"En el óptimo, x_2 es básica y vale 1.333,33. Su [[c_2]] sube de 80 a 90, dentro del rango. ¿Qué pasa?",
 o:["X* igual, Z* sube 10 · 1.333,33 ≈ 13.333, y cambian los precios sombra",
    "X* igual, Z* igual, porque la base no cambia",
    "X* igual, Z* sube ≈ 13.333, y los precios sombra no cambian",
    "Cambia la base, porque cambió un coeficiente de una básica"],a:0,
 x:"x_B = B⁻¹b no depende de c: mismo punto. Z' = Z + Δc·x_2*. Los precios sombra son c_B·B⁻¹, y c_B cambió."},
{id:"b2sen3",t:"SEN",q:"Max. La variable no básica x_4 tiene costo reducido [[c_4 - z_4 = -8]]. Si [[c_4]] sube 10…",
 o:["su costo reducido pasa a +2: x_4 entra a la base y Z no puede bajar",
    "no pasa nada: el cambio afecta sólo a variables básicas",
    "aparecen soluciones alternativas, porque el costo reducido queda en 0",
    "Z baja, porque x_4 pasa a costar más"],a:0,
 x:"Rango: Δc_4 ≤ 8. Con +10 se sale: −8 + 10 = +2 > 0, entra. Con +8 exacto daría 0 (alternativas)."},
{id:"b2sen4",t:"SEN",q:"Max. El precio sombra de las horas de máquina es 20 $/h (dentro de su rango). Te ofrecen horas extra a 15 $/h. ¿Conviene?",
 o:["Sí: cada hora suma 20 a Z y cuesta 15, ganancia neta 5 por hora (mientras b quede en su rango)",
    "Sí: cada hora suma 35 a Z (20 + 15)",
    "No: sólo conviene si la hora cuesta más de 20",
    "No: el precio sombra indica que sobran horas"],a:0,
 x:"El precio sombra es lo máximo que conviene pagar. Por debajo de 20 conviene, justo en 20 da igual, por encima no."},
{id:"b2sen5",t:"SEN",q:"El precio sombra de un recurso es 20, y su rango permite subir [[b]] hasta 7,5 unidades. Si conseguís 30 unidades extra, ¿cuánto sube Z?",
 o:["No se puede asegurar 20·30 = 600: el precio sombra vale sólo dentro del rango (las primeras 7,5)",
    "Exactamente 20·30 = 600",
    "Exactamente 20·7,5 = 150, y las otras 22,5 unidades tienen precio sombra 0 seguro",
    "Nada, porque 30 está fuera del rango"],a:0,
 x:"Fuera del rango cambia la base, y con ella el precio sombra. Hasta 7,5 sube 150; después hay que reoptimizar para saber cuánto vale cada unidad extra (puede ser menos, no necesariamente 0)."},
{id:"b2sen6",t:"SEN",q:"Min (costos). La restricción de capacidad es [[\\leq 100]] y tiene valor implícito −4. Si la capacidad sube a 101…",
 o:["el costo mínimo baja 4 (mejora, porque es un Min)",
    "el costo mínimo sube 4",
    "el costo no cambia, porque la restricción es ≤",
    "el costo baja 4 sólo si la restricción es pasiva"],a:0,
 x:"Aflojar una restricción nunca empeora. En un Min, mejorar es bajar: por eso una ≤ tiene valor implícito ≤ 0."},
{id:"b2sen7",t:"SEN",q:"En la alfarería (óptimo: 10 vasijas y 15 cántaros) se agrega «a lo sumo 25 piezas»: [[x_1 + x_2 \\leq 25]]. En el óptimo 10 + 15 = 25. Esa restricción…",
 o:["es activa, pero su valor implícito puede ser 0: aflojarla no mejora Z, porque ya te frenan las otras",
    "es activa, y su valor implícito es necesariamente positivo",
    "es pasiva, porque es nueva y no cambia el óptimo",
    "es activa y obliga a cambiar la base óptima"],a:0,
 x:"Se cumple justo → activa. Pero con 26 piezas el óptimo sigue igual, porque horas y demanda frenan en ese punto. Activa no implica valor implícito ≠ 0."},
{id:"b2sen8",t:"SEN",q:"Los precios sombra de horas, arcilla y demanda son u = (20; 0; 5). Un producto nuevo usa 2 h, 1 kg y nada de demanda, y deja $35 por unidad. ¿Conviene fabricarlo?",
 o:["No: sus recursos valen 2·20 + 1·0 = 40 > 35, costo reducido −5",
    "Sí: deja 35, más que el precio sombra de las horas (20)",
    "Sí: la arcilla sobra, así que sale gratis",
    "No: cualquier producto que use horas es inconveniente"],a:0,
 x:"c_nuevo − u·A_nuevo = 35 − 40 = −5. Conviene sólo si lo que deja supera lo que valen los recursos que consume."},
{id:"b2sen9",t:"SEN",q:"El óptimo es (10, 15). Se agrega la restricción [[x_1 + x_2 \\leq 22]]. ¿Qué hay que hacer?",
 o:["Reoptimizar: 10 + 15 = 25 > 22, el óptimo actual no la cumple (en general, con simplex dual)",
    "Nada: una restricción nueva nunca cambia el óptimo",
    "Calcular su c_j − z_j y, si es positivo, hacerla entrar",
    "Nada: como es ≤, sólo achica la holgura"],a:0,
 x:"Primero se reemplaza el óptimo. Si la cumple, no cambia nada. Si no la cumple, ese punto ya no es factible y hay que reoptimizar."},
{id:"b2sen10",t:"SEN",q:"Un cambio en [[b_1]] se sale de su rango: una básica quedaría negativa. ¿Qué condición se rompió y cómo se sigue?",
 o:["La factibilidad (x_B ≥ 0); se sigue con el simplex dual",
    "La optimalidad (c_j − z_j); se sigue con el simplex primal",
    "Las dos; hay que resolver de nuevo desde la tabla inicial",
    "Ninguna; sólo cambia Z"],a:0,
 x:"b sólo aparece en x_B = B⁻¹b. Los c_j − z_j siguen siendo óptimos, pero hay una básica negativa: es el caso del simplex dual."},
{id:"b2sen11",t:"SEN",q:"Dentro del rango de [[b_1]], ¿qué pasa con los precios sombra?",
 o:["No cambian: son [[c_B B^{-1}]] y la base es la misma",
    "Cambian proporcionalmente a Δb_1",
    "Cambian sólo el de la restricción 1",
    "Pasan a valer 0 si Δb_1 > 0"],a:0,
 x:"Dentro del rango no cambia la base, así que B⁻¹ y c_B son los mismos. Cambian los valores de las básicas y Z, no los precios."},
{id:"b2sen12",t:"SEN",q:"En un Max, una restricción de demanda mínima ([[x_1 \\geq 12]]) está activa. Su valor implícito…",
 o:["es ≤ 0: exigir 1 unidad más del mínimo no puede mejorar Z",
    "es ≥ 0: exigir más producción aumenta la ganancia",
    "es 0, porque las restricciones ≥ no tienen precio sombra",
    "puede tener cualquier signo"],a:0,
 x:"Subir el b de una ≥ la ajusta. En un Max eso nunca sube Z, así que el valor implícito es ≤ 0. Se lo llama valor marginal."},

/* ===== DUA ===== */
{id:"b2dua1",t:"DUA",q:"Para construir el dual, la igualdad [[x_1 + x_2 = 10]] de un primal Max se reemplaza por [[x_1 + x_2 \\leq 10]] y [[-x_1 - x_2 \\leq -10]], con duales u' y u'' ≥ 0. En el dual…",
 o:["aparecen siempre como u' − u'', que puede tener cualquier signo: equivale a una variable libre",
    "aparecen como u' + u'', que es ≥ 0: equivale a una variable no negativa",
    "una de las dos vale siempre 0, así que se elimina y queda una variable ≥ 0",
    "se convierten en una restricción de igualdad del dual"],a:0,
 x:"En cada término las dos aparecen con signos opuestos (coeficiente +a para u', −a para u''). La resta de dos no negativas puede dar cualquier signo: por eso una igualdad da una variable dual libre."},
{id:"b2dua2",t:"DUA",q:"En un primal, la variable x_2 es libre (sin restricción de signo). En el dual…",
 o:["la restricción asociada a x_2 es una igualdad",
    "la restricción asociada a x_2 es una desigualdad ≥",
    "la variable dual asociada es libre",
    "no aparece ninguna restricción asociada a x_2"],a:0,
 x:"Es la simetría de la regla: restricción «=» → variable dual libre; variable libre → restricción «=» en el dual."},
{id:"b2dua3",t:"DUA",q:"El primal Max tiene solución no acotada. ¿Qué pasa con el dual?",
 o:["No tiene soluciones factibles",
    "Tiene solución no acotada también",
    "Tiene óptimo finito con W* = 0",
    "Puede ser no factible o no acotado"],a:0,
 x:"Si el dual tuviera una solución factible, su valor sería un techo para el primal, y el primal no podría crecer sin fin. Esta dirección es segura; al revés (primal no factible) el dual puede ser no factible o no acotado."},
{id:"b2dua4",t:"DUA",q:"En el óptimo de un primal Max: x_1 = 0, x_2 = 5; la restricción 1 tiene holgura 3 y la 2 holgura 0. Por holguras complementarias…",
 o:["u_1 = 0, y la restricción dual asociada a x_2 se cumple con igualdad",
    "u_1 = 0, y la restricción dual asociada a x_1 se cumple con igualdad",
    "u_2 = 0, y la restricción dual asociada a x_2 se cumple con igualdad",
    "u_1 = 3, que es lo que sobra de ese recurso"],a:0,
 x:"Sobra recurso 1 → vale 0. Se fabrica x_2 → sus recursos valen exactamente lo que deja (igualdad). De x_1 = 0 no se puede concluir que su restricción dual sea estricta."},
{id:"b2dua5",t:"DUA",q:"Primal: Min W = 3x_1 + 5x_2, s.a. [[x_1 + x_2 \\geq 4]], [[2x_1 + x_2 \\geq 6]], [[x \\geq 0]]. Su dual es…",
 o:["Max 4u_1 + 6u_2, s.a. [[u_1 + 2u_2 \\leq 3]], [[u_1 + u_2 \\leq 5]], [[u \\geq 0]]",
    "Max 4u_1 + 6u_2, s.a. [[u_1 + u_2 \\leq 3]], [[2u_1 + u_2 \\leq 5]], [[u \\geq 0]]",
    "Max 3u_1 + 5u_2, s.a. [[u_1 + 2u_2 \\leq 4]], [[u_1 + u_2 \\leq 6]], [[u \\geq 0]]",
    "Min 4u_1 + 6u_2, s.a. [[u_1 + 2u_2 \\geq 3]], [[u_1 + u_2 \\geq 5]], [[u \\geq 0]]"],a:0,
 x:"Min → Max. Los b (4, 6) van a la función. La columna de x_1 en el primal (1; 2) es la primera restricción del dual, con c_1 = 3 a la derecha. La segunda opción no transpone la matriz."},
{id:"b2dua6",t:"DUA",q:"Refinería: u = (40/3; 50; 0) y b = (5.000; 1.200; 500), con la tercera restricción ≥ escrita como −x_2 ≤ −500. Z* = 126.666,67. ¿Cuánto vale W*?",
 o:["[[5000 \\cdot \\tfrac{40}{3} + 1200 \\cdot 50 - 500 \\cdot 0 = 126.666{,}67]], igual que Z*",
    "[[5000 \\cdot \\tfrac{40}{3} + 1200 \\cdot 50 = 126.666{,}67]], mayor que Z*",
    "[[\\tfrac{40}{3} + 50 + 0 \\approx 63{,}3]], la suma de los precios sombra",
    "No se puede calcular sin resolver el dual"],a:0,
 x:"Teorema de dualidad: W* = Z*. Es la mejor verificación para ver si los signos están bien."},
{id:"b2dua7",t:"DUA",q:"Si el primal tiene soluciones óptimas alternativas, el dual…",
 o:["tiene una solución óptima degenerada",
    "también tiene soluciones óptimas alternativas",
    "no tiene soluciones factibles",
    "tiene solución no acotada"],a:0,
 x:"Alternativas en uno ↔ degenerada en el otro, y al revés también vale."},
{id:"b2dua8",t:"DUA",q:"En la interpretación económica, la restricción del dual asociada al producto j dice que…",
 o:["lo que valen los recursos que consume 1 unidad de j es al menos lo que deja ese producto",
    "lo que valen los recursos que consume 1 unidad de j es como máximo lo que deja ese producto",
    "la cantidad producida de j no puede superar la disponibilidad de recursos",
    "el precio de venta de j es igual a su costo"],a:0,
 x:"Restricción dual j: Σ a_ij·u_i ≥ c_j. Si se fabrica (x_j > 0), se cumple con igualdad; si los recursos valen más, no se fabrica."},
{id:"b2dua9",t:"DUA",q:"En la tabla óptima de un primal Max, ¿dónde se lee la solución del dual?",
 o:["En los z_j de las columnas que formaban la identidad inicial (holguras y ficticias)",
    "En la columna X de valores de las básicas",
    "En los c_j − z_j de las variables de decisión",
    "En la fila del pivote de la última iteración"],a:0,
 x:"u = c_B·B⁻¹, y B⁻¹ está debajo de las columnas de la identidad inicial. Los c_j − z_j de las variables de decisión, cambiados de signo, son los excesos del dual, no los u."},

/* ===== TTA ===== */
{id:"b2tta1",t:"TTA",q:"Orígenes A (oferta 50) y B (oferta 30); destinos 1 (demanda 40) y 2 (demanda 40). Una solución básica es [[x_{A1} = 40]], [[x_{A2} = 10]], [[x_{B2} = 30]]. Es…",
 o:["no degenerada: tiene 3 variables positivas, igual a m + n − 1 = 2 + 2 − 1",
    "degenerada: tiene 3 variables positivas, menos que m + n = 4",
    "degenerada, porque el destino 2 recibe de dos orígenes",
    "no factible, porque el origen A no envía a todos los destinos"],a:0,
 x:"Oferta 80 = demanda 80 (balanceado). Una solución básica tiene m + n − 1 = 3 básicas; si las 3 son positivas, no es degenerada."},
{id:"b2tta2",t:"TTA",q:"Orígenes A (50) y B (30); destinos 1 (40) y 2 (60). ¿Cómo se balancea?",
 o:["Se agrega un origen ficticio con 20 unidades y costo 0; lo que envía es demanda insatisfecha",
    "Se agrega un destino ficticio con 20 unidades y costo 0; lo que recibe es capacidad ociosa",
    "Se agrega un origen ficticio con 20 unidades y costo M; lo que envía es capacidad ociosa",
    "No hace falta: el modelo se resuelve igual con ≤ en las demandas"],a:0,
 x:"Demanda 100 > oferta 80. Falta oferta → origen ficticio de 20. Sus envíos no existen: son la demanda que queda sin cubrir."},
{id:"b2tta3",t:"TTA",q:"A y B envían a un depósito K, que reparte a los destinos 1 y 2. La ecuación de K se escribe «entradas − salidas = b». Si además K se queda con 10 unidades para uso propio…",
 o:["[[x_{AK} + x_{BK} - x_{K1} - x_{K2} = 10]]: entra 10 más de lo que sale",
    "[[x_{AK} + x_{BK} - x_{K1} - x_{K2} = -10]]: sale 10 más de lo que entra",
    "[[x_{AK} + x_{BK} - x_{K1} - x_{K2} = 0]]: un depósito siempre es de paso",
    "[[x_{AK} + x_{BK} - x_{K1} - x_{K2} \\leq 10]]"],a:0,
 x:"Si K consume 10, entra más de lo que sale: entradas − salidas = 10. Ojo con la convención: si la ecuación fuera salidas − entradas, el signo se invierte."},
{id:"b2tta4",t:"TTA",q:"En un transporte, todas las ofertas y demandas son números enteros. Para obtener envíos enteros…",
 o:["alcanza con el simplex: existe un óptimo entero por la estructura de la matriz (0, 1, −1)",
    "hay que agregar la condición de enteros y resolver con ramificación y poda",
    "alcanza con redondear la solución del simplex",
    "sólo se garantiza si además los costos son enteros"],a:0,
 x:"Es la propiedad de integralidad del transporte. Los costos no influyen."},
{id:"b2tta5",t:"TTA",q:"Hay 3 operarios y 4 tareas, y cada operario hace exactamente una tarea. En el modelo de asignación…",
 o:["cada operario: Σ = 1; cada tarea: Σ ≤ 1 (una tarea queda sin hacer)",
    "cada operario: Σ ≤ 1; cada tarea: Σ = 1",
    "operarios y tareas: Σ = 1",
    "no tiene solución, porque está desbalanceado"],a:0,
 x:"Con «= 1» del lado que sobra (tareas), habría que hacer 4 tareas con 3 operarios: no factible. El lado escaso lleva = 1 y el que sobra ≤ 1 (o se agrega un operario ficticio)."},
{id:"b2tta6",t:"TTA",q:"Un transporte balanceado tiene 3 orígenes y 4 destinos. ¿Cuántas restricciones linealmente independientes tiene?",
 o:["6 = 3 + 4 − 1, porque una es redundante",
    "7 = 3 + 4, una por origen y una por destino",
    "12 = 3 · 4, una por ruta",
    "11 = 3 · 4 − 1"],a:0,
 x:"Como oferta total = demanda total, una ecuación se deduce de las otras. Por eso una solución básica tiene m + n − 1 = 6 básicas."},
{id:"b2tta7",t:"TTA",q:"En lugar de costos, la tabla tiene la ganancia por unidad enviada de cada origen a cada destino. El problema…",
 o:["sigue siendo un transporte, con función objetivo de máximo",
    "deja de ser transporte, porque el transporte siempre minimiza",
    "es una asignación, porque se busca la mejor pareja",
    "es un transbordo, porque hay ganancias intermedias"],a:0,
 x:"La estructura (ofertas, demandas, variables por ruta) es la misma; sólo cambia Min por Max."},
{id:"b2tta8",t:"TTA",q:"¿Qué tienen en común los modelos de transporte, transbordo y asignación?",
 o:["La matriz A tiene casi todos ceros, y el resto son 1 o −1",
    "La matriz A tiene casi todos unos, y el resto son ceros",
    "Todas sus restricciones son ≤",
    "Siempre se resuelven con Vogel"],a:0,
 x:"Esa estructura es la que da la integralidad automática. Los algoritmos manuales no se toman: la cátedra plantea el modelo y lo resuelve con LINDO."},

/* ===== ENT ===== */
{id:"b2ent1",t:"ENT",q:"Un analista resolvió el relajado de un problema entero de Max y obtuvo x_1 = 2,5; x_2 = 4; Z = 31. ¿Qué debe hacer?",
 o:["Tomar Z = 31 como cota superior y ramificar en x_1: un subproblema con x_1 ≤ 2 y otro con x_1 ≥ 3",
    "Redondear a (3, 4), verificar que sea factible y dar ése como óptimo",
    "Informar Z = 31 como óptimo del problema entero",
    "Ramificar en x_1: un subproblema con x_1 ≤ 2,5 y otro con x_1 ≥ 2,5"],a:0,
 x:"El relajado es una cota (en un Max, superior): el entero da 31 o menos. Redondear puede dar infactible o subóptimo. Las ramas excluyen la franja fraccionaria (entre 2 y 3)."},
{id:"b2ent2",t:"ENT",q:"El analista resuelve el relajado y la solución sale con todas las variables enteras. Entonces…",
 o:["es el óptimo del problema entero: no hace falta ramificar",
    "es sólo una cota: hay que ramificar igual",
    "hay que verificarlo redondeando",
    "es óptima sólo si el problema es binario"],a:0,
 x:"El relajado permite más soluciones que el entero. Si aun así el mejor punto es entero, ninguno entero puede ser mejor."},
{id:"b2ent3",t:"ENT",q:"En ramificación y poda (Max), la mejor solución entera encontrada da Z = 28. Un nodo abierto tiene relajado Z = 27,5 con variables fraccionarias. Ese nodo…",
 o:["se poda: nada de esa rama puede superar 28",
    "se ramifica, porque tiene variables fraccionarias",
    "reemplaza a la mejor solución, porque es más reciente",
    "se redondea a 28 y se compara"],a:0,
 x:"El relajado de la rama es lo mejor que esa rama puede dar. Si 27,5 < 28, no vale la pena seguir."},
{id:"b2ent4",t:"ENT",q:"En un problema entero de Min, el relajado da W = 40. El óptimo entero…",
 o:["es ≥ 40",
    "es ≤ 40",
    "es exactamente 40",
    "es 40 redondeado al entero más cercano"],a:0,
 x:"Relajar agranda la región, y el óptimo no puede empeorar. En un Min, el relajado da el piso: el entero cuesta 40 o más."},
{id:"b2ent5",t:"ENT",q:"Un producto tiene un costo fijo de $500 si se produce algo (x > 0). Con una binaria y, se modeliza así:",
 o:["[[x \\leq M\\,y]], y se suma [[500\\,y]] al costo",
    "[[x \\geq M\\,y]], y se suma [[500\\,y]] al costo",
    "[[y \\leq M\\,x]], y se suma [[500\\,x]] al costo",
    "[[x = M\\,y]], y se suma [[500\\,y]] al costo"],a:0,
 x:"Si y = 0, x ≤ 0 obliga a no producir. Si y = 1, x puede llegar hasta M (un número grande), y se paga el fijo."},
{id:"b2ent6",t:"ENT",q:"Dos proyectos binarios: «se puede hacer A o B, pero no los dos». La restricción es…",
 o:["[[y_A + y_B \\leq 1]]",
    "[[y_A + y_B = 1]]",
    "[[y_B \\leq y_A]]",
    "[[y_A + y_B \\geq 1]]"],a:0,
 x:"«= 1» obligaría a hacer uno. y_B ≤ y_A es «B sólo si A». «≥ 1» es «al menos uno»."},
{id:"b2ent7",t:"ENT",q:"Se resuelve un modelo entero con LINDO. Un compañero quiere usar los precios duales que imprime para decidir si compra más recurso. ¿Es correcto?",
 o:["No: esos valores son del último relajado de la ramificación y no valen para el problema entero",
    "Sí: los precios duales valen igual que en un PL continuo",
    "Sí, pero hay que redondearlos al entero más cercano",
    "Sí, siempre que el óptimo entero sea único"],a:0,
 x:"La sensibilidad supone que la base se mantiene ante cambios chicos. En un entero, un cambio chico puede saltar a otro punto entero."},

/* ===== RED ===== */
{id:"b2red1",t:"RED",q:"Red con arcos 1–2: 3, 1–3: 5, 2–3: 2, 2–4: 6, 3–4: 4. Con el algoritmo de Kruskal de la cátedra (arrancando del nodo 1), el árbol de expansión mínima tiene longitud…",
 o:["9, con 3 arcos (1–2, 2–3, 3–4)",
    "9, con 4 arcos",
    "11, con 3 arcos (1–2, 2–3, 2–4)",
    "15, con 4 arcos"],a:0,
 x:"Desde 1: el arco más corto hacia un nodo nuevo es 1–2 (3). Desde {1, 2}: 2–3 (2). Desde {1, 2, 3}: 3–4 (4). Total 9. Con 4 nodos, el árbol tiene 3 arcos."},
{id:"b2red2",t:"RED",q:"Red dirigida: 1→2: 3, 1→3: 6, 2→3: 2, 2→4: 7, 3→4: 4. La ruta más corta de 1 a 4 es…",
 o:["1–2–3–4, con longitud 9",
    "1–3–4, con longitud 10",
    "1–2–4, con longitud 10",
    "1–3–4, con longitud 9"],a:0,
 x:"Etiquetas: 2 = 3; 3 = mín(6, 3 + 2) = 5; 4 = mín(3 + 7, 5 + 4) = 9. Se reconstruye hacia atrás: 4 ← 3 ← 2 ← 1."},
{id:"b2red3",t:"RED",q:"En flujo máximo, se encuentra la trayectoria 1→2→5→6 con capacidades residuales 5, 8 y 3. ¿Cuánto flujo se envía por ella?",
 o:["3, la menor capacidad residual (el cuello de botella)",
    "8, la mayor capacidad residual",
    "16, la suma de las capacidades",
    "5, la capacidad del primer arco"],a:0,
 x:"No se puede mandar más de lo que deja pasar el arco más chico. Se resta 3 en el sentido del flujo y se suma 3 en el sentido inverso."},
{id:"b2red4",t:"RED",q:"Modelo de ruta más corta, con «Σ salidas − Σ entradas = b» en cada nodo. ¿Cuánto vale b en el nodo destino?",
 o:["−1","+1","0","Lo que mida la ruta más corta"],a:0,
 x:"Se envía una unidad de flujo del origen al destino. En el destino entra una unidad más de las que salen: salidas − entradas = −1. En el origen, +1; en los intermedios, 0."},
{id:"b2red5",t:"RED",q:"Una red conexa tiene 7 nodos. Su árbol de expansión mínima tiene…",
 o:["6 arcos y ningún ciclo",
    "7 arcos y ningún ciclo",
    "6 arcos y puede tener un ciclo",
    "tantos arcos como la red original"],a:0,
 x:"Para conectar n nodos sin ciclos hacen falta n − 1 arcos; uno más formaría un ciclo."},
{id:"b2red6",t:"RED",q:"¿Qué problema de redes generaliza a los demás (transporte, ruta más corta, flujo máximo)?",
 o:["Flujo capacitado con costo mínimo",
    "Árbol de expansión mínima",
    "Ruta más corta",
    "Flujo máximo"],a:0,
 x:"Tiene ofertas, demandas, capacidad y costo por arco. Los otros salen como casos particulares eligiendo esos datos."},

/* ===== STK ===== */
{id:"b2stk1",t:"STK",q:"En el modelo básico, el número de pedidos por año es [[n = D/Q]]. ¿En qué unidad está?",
 o:["Pedidos por año (1/tiempo): (unidades/año) ÷ (unidades/pedido)",
    "Unidades por año, como la demanda",
    "Años por pedido (eso es T = Q/D)",
    "Unidades por pedido, como Q"],a:0,
 x:"Las unidades de mercadería se cancelan y queda 1/año. T = Q/D es la inversa: tiempo entre pedidos."},
{id:"b2stk2",t:"STK",q:"[[C = \\$50]], [[i = 20\\,\\%]] anual, [[Q = 600]] (modelo básico). ¿Cuál es el costo ANUAL de mantener stock?",
 o:["[[C\\,i \\cdot Q/2 = 10 \\cdot 300 = \\$3.000]]",
    "[[C\\,i \\cdot Q = 10 \\cdot 600 = \\$6.000]]",
    "[[\\tfrac{C\\,i\\,Q}{2D} = \\$0{,}25]]",
    "[[C \\cdot Q/2 = \\$15.000]]"],a:0,
 x:"Guardar 1 unidad 1 año cuesta C·i = 10, y en promedio hay Q/2 = 300 guardadas. La b usa el stock máximo; la c es por unidad (el anual dividido D = 12.000); la d es la inversión promedio, no el costo."},
{id:"b2stk3",t:"STK",q:"[[D = 12.000]] u/año, [[Q = 600]], [[L = \\$150]]. ¿Cuál es el costo ANUAL de pedir?",
 o:["[[L \\cdot D/Q = 150 \\cdot 20 = \\$3.000]]",
    "[[L/Q = \\$0{,}25]]",
    "[[L \\cdot Q = \\$90.000]]",
    "[[L = \\$150]], porque se paga una vez"],a:0,
 x:"Se hacen n = D/Q = 20 pedidos por año, y cada uno cuesta L. La b es por unidad (3.000/12.000)."},
{id:"b2stk4",t:"STK",q:"Con [[C = 50]] y [[CT = \\$50{,}50]] por unidad (precio + pedir + mantener), ¿cuál es el costo total del año con [[D = 12.000]]?",
 o:["[[50{,}50 \\cdot 12.000 = \\$606.000]]",
    "[[50{,}50]], porque CT ya es el total",
    "[[0{,}50 \\cdot 12.000 = \\$6.000]], sin contar la compra",
    "[[50 \\cdot 12.000 = \\$600.000]]"],a:0,
 x:"CT es por unidad. El total anual es CT·D. La c es sólo pedir + mantener; la d, sólo la compra."},
{id:"b2stk5",t:"STK",q:"Modelo de punto de pedido con [[Q = 600]] y stock de seguridad [[SS = 50]]. El stock promedio es…",
 o:["[[Q/2 + SS = 350]]",
    "[[Q/2 = 300]]",
    "[[(Q + SS)/2 = 325]]",
    "[[Q + SS = 650]]"],a:0,
 x:"El diente de sierra ya no baja hasta 0 sino hasta SS. Esas 50 unidades están siempre, y encima va el promedio del lote."},
{id:"b2stk6",t:"STK",q:"Consumo durante el ingreso: [[Q = 735]], [[D/V = 1/3]]. ¿Cuál es el stock promedio?",
 o:["[[M/2 = 735 \\cdot \\tfrac23 / 2 = 245]]",
    "[[Q/2 = 367{,}5]]",
    "[[M = 490]]",
    "[[Q \\cdot \\tfrac13 / 2 = 122{,}5]]"],a:0,
 x:"Mientras entra también sale: el pico es M = Q(1 − D/V) = 490, y el promedio es M/2. La d usa D/V en lugar de 1 − D/V."},
{id:"b2stk7",t:"STK",q:"Descuento con escalón: [[C_1 = 50]], [[C_2 = 48]] si [[Q \\geq 1.000]]. Con [[C_2]], [[Q^* = 612]]. Además [[CT_1(600) = 50{,}50]] y [[CT_2(1.000) = 48{,}55]]. ¿Qué conviene?",
 o:["Pedir 1.000: Q* con C_2 no llega al mínimo, y en el borde CT_2 es menor",
    "Pedir 612 a C_2 = 48, porque es el Q* con el precio más bajo",
    "Pedir 600 a C_1, porque es el lote óptimo",
    "Pedir 1.000, porque el precio 48 es menor que 50"],a:0,
 x:"612 < 1.000: con 612 no hay descuento. Se compara CT, no el precio: 48,55 < 50,50. La d llega a lo mismo con una razón incompleta."},
{id:"b2stk8",t:"STK",q:"Descuento con escalón y costo de pedido nulo ([[L = 0]]). ¿Qué cambia?",
 o:["[[CT = C + C\\,i\\,Q/(2D)]] es una recta creciente: el mínimo de cada tramo está en su cantidad más chica",
    "[[CT = C + C\\,i\\,Q/(2D)]] es una recta decreciente: conviene el lote más grande posible",
    "Nada: el Q* se calcula igual y da 0",
    "El modelo deja de tener solución"],a:0,
 x:"Sin L/Q no hay equilibrio: pedir más sólo agrega stock. En cada tramo conviene lo mínimo (la compra mínima o a), y se comparan esos puntos."},
{id:"b2stk9",t:"STK",q:"Descuento por excedente: las primeras [[a = 500]] unidades a [[C_1 = 50]] y el resto a [[C_2 = 48]]. Si comprás [[Q = 1.000]], el precio promedio por unidad es…",
 o:["[[C(Q) = 48 + \\tfrac{(50-48)\\cdot 500}{1000} = 49]]",
    "[[48]], porque Q supera a",
    "[[50]], porque las primeras unidades fijan el precio",
    "[[48{,}5]], el promedio de C_1 y C_2 ponderado por Q"],a:0,
 x:"C(Q) = (500·50 + 500·48)/1.000 = 49. Al crecer Q tiende a 48 sin alcanzarlo. La b sería el escalón."},
{id:"b2stk10",t:"STK",q:"Lagrange con capital: sin restricción la inversión promedio es [[I(0) = 40.000]], el capital es [[I_0 = 20.000]] e [[i = 0{,}25]]. Entonces λ vale…",
 o:["[[0{,}25 \\cdot \\left[(40.000/20.000)^2 - 1\\right] = 0{,}75]]",
    "[[0{,}25 \\cdot (40.000/20.000 - 1) = 0{,}25]]",
    "[[(40.000/20.000)^2 - 1 = 3]]",
    "[[0{,}25 \\cdot 2 = 0{,}50]]"],a:0,
 x:"λ = i·[(I(0)/I_0)² − 1] = 0,25·3 = 0,75. Control: los lotes se multiplican por √(0,25/1) = 0,5 y la inversión pasa de 40.000 a 20.000 ✓."},
{id:"b2stk11",t:"STK",q:"Con restricción de capital, [[i = 20\\,\\%]] y [[\\lambda = 0{,}10]]. Un banco ofrece crédito al 35 % anual. ¿Conviene?",
 o:["No: 35 % supera a i + λ = 30 %, la plata cuesta más de lo que ahorra",
    "Sí: cualquier crédito conviene si la restricción es efectiva",
    "Sí: 35 % es mayor que λ, y eso indica que conviene",
    "No: sólo conviene si la tasa es menor que i = 20 %"],a:0,
 x:"La falta de capital cuesta como si la tasa fuera i + λ = 30 %. Conviene tomar plata sólo por debajo de eso."},
{id:"b2stk12",t:"STK",q:"Lagrange con restricción de ESPACIO: al aumentar λ, los lotes ___; con restricción de TIEMPO DE PREPARACIÓN, al aumentar λ los lotes ___.",
 o:["se achican; se agrandan",
    "se achican; también se achican",
    "se agrandan; se achican",
    "se agrandan; también se agrandan"],a:0,
 x:"Espacio: λ encarece guardar (va abajo, C·i + 2λv) → lotes chicos que ocupan menos. Preparación: λ encarece cada pedido (va arriba, L + λτ) → lotes grandes, menos preparaciones."},
{id:"b2stk13",t:"STK",q:"Demanda con [[\\sigma = 8]] u/día, [[LT = 4]] días, demanda media 50 u/día y RF = 2 % ([[z = 2{,}05]]). El punto de pedido es…",
 o:["[[50 \\cdot 4 + 2{,}05 \\cdot 8 \\cdot \\sqrt4 = 200 + 32{,}8 \\to 233]]",
    "[[50 \\cdot 4 + 2{,}05 \\cdot 8 \\cdot 4 = 200 + 65{,}6 \\to 266]]",
    "[[50 \\cdot 4 = 200]]",
    "[[2{,}05 \\cdot 8 \\cdot \\sqrt4 \\to 33]]"],a:0,
 x:"PP = demanda media en el LT + SS. El desvío va por la raíz del tiempo. El SS se redondea hacia arriba. La d es sólo el SS."},
{id:"b2stk14",t:"STK",q:"Revisión periódica: [[\\sigma = 8]] u/día, [[T = 12]] días, [[LT = 4]] días, [[z = 2{,}05]]. El stock de seguridad es…",
 o:["[[2{,}05 \\cdot 8 \\cdot \\sqrt{12 + 4} = 65{,}6 \\to 66]]",
    "[[2{,}05 \\cdot 8 \\cdot \\sqrt{4} = 32{,}8 \\to 33]]",
    "[[2{,}05 \\cdot 8 \\cdot (12 + 4) = 262{,}4]]",
    "[[2{,}05 \\cdot 8 \\cdot \\sqrt{12} = 56{,}8 \\to 57]]"],a:0,
 x:"Lo que pedís hoy tiene que durar hasta que llegue el próximo pedido: T + LT. Por eso la revisión periódica necesita más SS que el punto de pedido."},
{id:"b2stk15",t:"STK",q:"Seis artículos ordenados por costo anual (C·D): 60 %, 15 %, 12 %, 8 %, 3 % y 2 % del total. ¿Qué clase es el tercero (12 %)?",
 o:["B: su acumulado llega a 87 %, entre 75 % y 95 %",
    "A: su acumulado llega a 87 %, y la clase A llega hasta 90 %",
    "C: tiene un porcentaje chico comparado con el primero",
    "B: es el tercero de seis, o sea la mitad del medio"],a:0,
 x:"Acumulados: 60, 75, 87, 95, 98, 100. A hasta 75 % (los dos primeros), B de 75 % a 95 %, C de 95 % a 100 %. Se clasifica por el acumulado, no por posición."},
{id:"b2stk16",t:"STK",q:"Una empresa quiere un nivel de servicio del 97 %. Para el stock de seguridad usa…",
 o:["RF = 3 %, [[z = 1{,}88]]",
    "RF = 97 %, [[z = 1{,}88]]",
    "RF = 3 %, [[z = 2{,}33]]",
    "IPF = 97 %, que es lo mismo que RF = 3 %"],a:0,
 x:"Nivel de servicio 97 % → riesgo de faltante 3 % → z = 1,88. RF e IPF son medidas distintas: no se intercambian."},
{id:"b2stk17",t:"STK",q:"¿Por qué en el modelo básico el stock promedio es Q/2?",
 o:["Porque llega el lote entero (Q) y se consume parejo hasta 0: el promedio de una recta de Q a 0 es Q/2",
    "Porque se piden dos lotes por período",
    "Porque la mitad del lote se vende antes de llegar",
    "Porque el stock de seguridad es Q/2"],a:0,
 x:"Diente de sierra de Q a 0 en cada ciclo. Cambia si el pico no es Q (consumo durante el ingreso: M/2) o si el piso no es 0 (con SS: Q/2 + SS)."},
{id:"b2stk18",t:"STK",q:"Restricción de capital vs. de espacio en Lagrange: ¿cómo se mide lo que usa cada artículo?",
 o:["Capital con el promedio [[C\\,Q/2]]; espacio con el máximo [[v\\,Q]]",
    "Capital con el máximo [[C\\,Q]]; espacio con el promedio [[v\\,Q/2]]",
    "Los dos con el promedio",
    "Los dos con el máximo"],a:0,
 x:"Plata → promedio (es plata parada a lo largo del año). Espacio → máximo (el depósito tiene que alcanzar el día que llega el lote)."}
];

/* ===== BANCO 3: preguntas que circularon como tomadas (archivo «preguntas io.pdf», 16/11).
   Las que venían con opciones se respetan tal cual (fixed: no se mezclan). ===== */
const BANK3 = [
{id:"b3p01a",t:"TTA",q:"(P1) En un modelo de transbordo de costo mínimo ya resuelto, se habilita un tramo nuevo, del depósito K al destino 2. ¿Qué cambia en el modelo?",
 o:["Se agrega una variable nueva, x_K2, que aparece en la función objetivo y en las ecuaciones de K y del destino 2; la cantidad de restricciones no cambia y el costo óptimo no puede empeorar",
    "Se agrega una variable nueva, x_K2, que aparece en la función objetivo y en las ecuaciones de K y del destino 2; la cantidad de restricciones no cambia, pero el costo óptimo puede empeorar",
    "Se agrega una restricción nueva de conservación para el tramo, y el costo óptimo no puede empeorar",
    "Se agrega una restricción nueva de conservación para el tramo, y hay que volver a balancear ofertas y demandas"],a:0,
 x:"Un tramo es un arco, y en el modelo un arco es una variable (una columna), no una restricción. Aparece en la ecuación de balance de cada uno de sus dos extremos. La solución anterior sigue siendo factible con el tramo nuevo en 0, así que el óptimo sólo puede mejorar o quedar igual."},
{id:"b3p01b",t:"TTA",q:"(P1) En el mismo transbordo se agrega un punto nuevo: un depósito intermedio J que no produce ni consume, conectado con los orígenes y con los destinos. ¿Qué cambia en el modelo?",
 o:["Se agrega una restricción de conservación para J (entradas − salidas = 0) y una variable por cada tramo que entra o sale de J",
    "Se agrega una restricción de conservación para J (entradas − salidas = capacidad de J) y una variable por cada tramo que entra o sale de J",
    "Sólo se agregan variables para los tramos de J: como no tiene oferta ni demanda, no necesita restricción",
    "Sólo se agregan variables para los tramos de J, y además un destino ficticio para absorber lo que pase por J"],a:0,
 x:"Cada nodo tiene su ecuación de balance. Un punto de paso puro tiene término independiente 0: todo lo que entra sale. Sin esa ecuación, J podría crear o perder mercadería. Las ofertas y demandas totales no cambian, así que no hace falta ningún ficticio."},
{id:"b3p02",t:"STK",q:"(P2) En el modelo básico, el lote óptimo se obtiene anulando la derivada primera de CT(Q). ¿Por qué ese punto es el mínimo que se busca?",
 o:["Porque [[CT(Q) = C + \\tfrac{L}{Q} + \\tfrac{C\\,i\\,Q}{2D}]] tiene un único punto extremo para Q > 0 y es convexa ([[CT''(Q) = 2L/Q^3 > 0]]): ese punto es mínimo relativo y absoluto",
    "Porque [[CT(Q) = C + \\tfrac{L}{Q} + \\tfrac{C\\,i\\,Q}{2D}]] tiene un único punto extremo para Q > 0, aunque es un máximo; el mínimo se toma en el borde, con Q lo más chico posible",
    "Porque en ese punto se anula el costo de compra C, que es el único término que depende de Q",
    "Porque en ese punto se anula el costo de mantener, y sólo queda el costo de pedir"],a:0,
 x:"L/Q baja y C·i·Q/(2D) sube, y la suma tiene forma de U. La derivada se anula en el fondo de la U, donde pedir = mantener. C es constante y no depende de Q. En Q* ningún costo se anula: se igualan."},
{id:"b3p03",t:"STK",q:"(P3) En el modelo básico, ¿qué es n* y cómo se obtiene?",
 o:["Es el número óptimo de pedidos por período: [[n^* = \\dfrac{D}{Q^*} = \\sqrt{\\dfrac{D\\,C\\,i}{2L}}]], en pedidos por unidad de tiempo",
    "Es el número óptimo de pedidos por período: [[n^* = \\dfrac{Q^*}{D}]], en pedidos por unidad de tiempo",
    "Es el tiempo óptimo entre pedidos: [[n^* = \\dfrac{Q^*}{D}]], en unidades de tiempo",
    "Es la cantidad óptima por pedido: [[n^* = \\sqrt{\\dfrac{2DL}{C\\,i}}]], en unidades"],a:0,
 x:"n* = D/Q*: (unidades/año) ÷ (unidades/pedido) = pedidos por año. Reemplazando Q* queda √(D·C·i/(2L)). Q*/D es T*, el tiempo entre pedidos (la inversa de n*), y la última opción es Q*."},
{id:"b3p04a",t:"DUA",q:"(P4) Relación primal–dual en el óptimo. Si la k-ésima variable del primal es positiva (se produce)…",
 o:["la k-ésima restricción del dual se cumple con igualdad (su holgura o exceso vale 0)",
    "la k-ésima restricción del dual se cumple con desigualdad estricta (tiene holgura positiva)",
    "la k-ésima variable del dual también es positiva",
    "la k-ésima variable del dual vale 0"],a:0,
 x:"Cada variable del primal genera una restricción del dual, y cada restricción del primal una variable del dual. Por holguras complementarias, si x_k > 0, la restricción dual k se cumple con igualdad: los recursos que consume valen exactamente lo que deja. Las variables se aparean con restricciones del otro problema, no variable con variable."},
{id:"b3p04b",t:"DUA",q:"(P4) En el óptimo, la j-ésima restricción del primal tiene holgura positiva (sobra recurso). Entonces…",
 o:["la j-ésima variable del dual vale 0",
    "la j-ésima variable del dual es positiva, igual a la holgura",
    "la j-ésima restricción del dual se cumple con igualdad",
    "la j-ésima restricción del dual tiene holgura positiva"],a:0,
 x:"Holgura × variable dual = 0. Si sobra, el recurso vale 0 al margen. La holgura (una cantidad) no es el precio."},
{id:"b3p05a",t:"STK",q:"(P5) Descuento con escalón: C_1 si Q < a, y C_2 < C_1 si Q ≥ a. Se calculan Q_1* (con C_1) y Q_2* (con C_2). ¿Cuál es el procedimiento?",
 o:["Como C_2 < C_1, Q_2* > Q_1*. Si Q_2* ≥ a, Q_2* es el óptimo; si no, se comparan CT_1(Q_1*) y CT_2(a)",
    "Como C_2 < C_1, Q_2* > Q_1*. Si Q_2* ≥ a, Q_2* es el óptimo; si no, se comparan CT_1(Q_1*) y CT_2(Q_2*)",
    "Como C_2 < C_1, Q_2* < Q_1*. Si Q_1* ≥ a, Q_1* es el óptimo; si no, se elige a",
    "Como C_2 < C_1, Q_2* < Q_1*. Se elige siempre el lote con menor precio unitario"],a:0,
 x:"Q* = √(2DL/(C·i)): con precio menor, lote mayor. Si Q_2* < a, ese lote no tiene descuento (no es posible a C_2), y el mejor punto con descuento es el borde a. Se comparan los CT, no los precios."},
{id:"b3p05b",t:"STK",q:"(P5) Ley de precios con escalón en a = 300. Con el precio sin descuento ya da Q_1* = 450. ¿Qué se concluye?",
 o:["Q_2* también supera a (porque Q_2* > Q_1* > a), y el óptimo es Q_2*, con precio C_2",
    "Q_2* también supera a, pero el óptimo es Q_1*, porque es el que se calculó con el precio de lista",
    "Hay que comparar CT_1(Q_1*) con CT_2(a), como en todos los casos",
    "Hay que comparar CT_2(Q_2*) con CT_2(a)"],a:0,
 x:"Con el precio bajo, toda la curva de CT queda por debajo de la de C_1, y su mínimo (Q_2*) cae en el tramo con descuento. No hace falta comparar con nada."},
{id:"b3p06",t:"SPX",q:"(P6) Modelo: ① 2x_1 + x_2 ≤ 10, ② x_1 + 3x_2 ≥ 6, ③ x_1 − x_2 = 2, x ≥ 0. ¿En qué restricciones hay que agregar variables ficticias para el simplex?",
 o:["En ② y ③: la ≥ lleva un exceso (con −1) y una ficticia; la = lleva sólo la ficticia",
    "En ② y ③: la ≥ lleva una holgura (con +1) y una ficticia; la = lleva un exceso y una ficticia",
    "Sólo en ②: la = ya es una ecuación y no necesita nada",
    "Sólo en ①: las ≤ son las que necesitan completar la identidad"],a:0,
 x:"La ficticia se agrega donde no hay una variable con +1 que sirva para la base inicial (B = I): en las ≥ (el exceso entra con −1) y en las = (no tienen holgura). Con b ≥ 0. En un Max van con −M, en un Min con +M."},
{id:"b3p07",t:"STK",q:"(P7) ¿Qué caracteriza a un sistema de revisión periódica?",
 o:["Lo activa el tiempo: se revisa cada T fijo y se pide una cantidad variable (lo que falta), sin registro permanente; el stock de seguridad cubre T + LT",
    "Lo activa el tiempo: se revisa cada T fijo y se pide siempre la misma cantidad Q*, sin registro permanente; el stock de seguridad cubre sólo LT",
    "Lo activa la demanda: se pide Q* cada vez que el stock llega al punto de pedido, con registro permanente",
    "Lo activa la demanda: se pide una cantidad variable cada vez que el stock llega al punto de pedido"],a:0,
 x:"Momento fijo y cantidad variable: Q = d̄·(T + LT) + SS − existencias − pendientes. Por cubrir T + LT tiene más stock de seguridad que el punto de pedido. Se usa para artículos C y para agrupar pedidos a un proveedor."},
{id:"b3p08",t:"ENT",q:"(P8) Un programa es binario puro: sus n variables sólo pueden valer 0 o 1. ¿Qué se puede asegurar?",
 o:["Tiene a lo sumo 2^n soluciones posibles: si es factible, tiene óptimo finito (no puede ser no acotado), y en principio se puede resolver enumerando",
    "Tiene a lo sumo 2^n soluciones posibles: siempre es factible, y el relajado da directamente la solución binaria",
    "Como sus variables son enteras, el simplex sobre el relajado da siempre el óptimo binario",
    "Como sus variables son enteras, la región factible es convexa y el óptimo está en un vértice del relajado"],a:0,
 x:"Un conjunto finito de puntos no puede dar un Z infinito. Puede no ser factible (por ejemplo, x_1 + x_2 ≥ 3 con dos binarias). El relajado (0 ≤ x ≤ 1) puede dar fraccionarios: es sólo una cota. El conjunto de puntos binarios no es convexo."},
{id:"b3p09",t:"TTA",q:"(P9) Un problema de transporte (orígenes → destinos) pasa a ser de transbordo al habilitar depósitos intermedios. ¿Qué pasa con las restricciones?",
 o:["Siguen las de oferta y de demanda (como balance de cada origen y destino), y se agrega una ecuación de conservación por cada nodo de transbordo: lo que entra es igual a lo que sale",
    "Siguen las de oferta y de demanda, y se agrega una ecuación por cada nodo de transbordo con su capacidad de almacenamiento como término independiente",
    "Se eliminan las de oferta y de demanda, porque ahora todo pasa por los depósitos",
    "Se eliminan las de los destinos y se reemplazan por las de los depósitos"],a:0,
 x:"Los orígenes siguen mandando lo que tienen y los destinos siguen recibiendo lo que piden. Lo nuevo son los nodos de paso, cada uno con entradas − salidas = 0. Si un depósito además consume o aporta mercadería, ese término deja de ser 0. Los algoritmos de transporte se pueden usar si se lo formula balanceado."},
{id:"b3p10a",t:"DUA",q:"(P10) Primal de MÁXIMO con restricciones ① ≤, ② ≥ y ③ =. Al pasar al dual (de mínimo), las variables duales son…",
 o:["u_1 ≥ 0, u_2 ≤ 0, u_3 libre",
    "u_1 ≤ 0, u_2 ≥ 0, u_3 libre",
    "u_1 ≥ 0, u_2 ≥ 0, u_3 = 0, porque las igualdades no generan variable dual",
    "u_1 ≥ 0, u_2 ≥ 0, u_3 ≥ 0, porque todas las variables duales son no negativas"],a:0,
 x:"Primal Max: ≤ → u ≥ 0; ≥ → u ≤ 0; = → u libre. Coincide con el signo del valor implícito. Si antes se multiplica la ≥ por −1 (queda ≤), su u pasa a ser ≥ 0, pero su b entra al dual con el signo cambiado."},
{id:"b3p10b",t:"DUA",q:"(P10) Primal de MÍNIMO con restricciones ① ≥, ② ≤ y ③ =, y x ≥ 0. En el dual (de máximo)…",
 o:["u_1 ≥ 0, u_2 ≤ 0, u_3 libre, y cada x_j ≥ 0 da una restricción ≤",
    "u_1 ≥ 0, u_2 ≤ 0, u_3 libre, y cada x_j ≥ 0 da una restricción ≥",
    "u_1 ≤ 0, u_2 ≥ 0, u_3 libre, y cada x_j ≥ 0 da una restricción ≤",
    "u_1 ≤ 0, u_2 ≥ 0, u_3 libre, y cada x_j ≥ 0 da una restricción ≥"],a:0,
 x:"En un Min la restricción «natural» es la ≥: Min cx con Ax ≥ b da Max b·u con Aᵀu ≤ c y u ≥ 0. Por eso ≥ → u ≥ 0, ≤ → u ≤ 0, = → libre, y las x ≥ 0 dan restricciones ≤."},
{id:"b3p11",t:"STK",q:"(P11) Stock de seguridad con plazo de provisión constante: [[SS = z\\,S_D\\sqrt{LT}]]. ¿Qué lo modifica y qué no?",
 o:["Lo modifican el RF (vía z), la variabilidad de la demanda (S_D) y la duración del LT; no lo modifican Q, L, C, i ni la demanda media",
    "Lo modifican el RF (vía z), la variabilidad de la demanda y la duración del LT, y también la demanda media, porque sube el punto de pedido",
    "Lo modifican Q y L, porque lotes más grandes exigen más protección; el RF no lo modifica",
    "Lo modifican Q y L; el LT no lo modifica, porque es constante"],a:0,
 x:"La demanda media cambia el punto de pedido (PP = D̄·LT + SS), no el SS: el SS sólo protege la variabilidad. Que el LT sea constante quiere decir que no varía, no que su duración no importe: un LT más largo acumula más incertidumbre (√LT)."},
{id:"b3p12",t:"TTA",q:"(P12) ¿Cuándo se agrega un destino ficticio en un transporte, y qué significa en el óptimo?",
 o:["Cuando la oferta total supera a la demanda total: recibe el excedente con costo 0, y lo que se le envía es capacidad ociosa de cada origen",
    "Cuando la oferta total supera a la demanda total: recibe el excedente con costo M, y lo que se le envía es demanda insatisfecha",
    "Cuando la demanda total supera a la oferta total: recibe el faltante con costo 0, y lo que se le envía es demanda insatisfecha",
    "Cuando la demanda total supera a la oferta total: envía el faltante con costo 0 a cada destino"],a:0,
 x:"Sobra oferta → hace falta un destino que la absorba. Costo 0 porque esos envíos no existen. Cuando falta oferta es al revés: un origen ficticio, y lo que envía es demanda insatisfecha."},
{id:"b3p13a",t:"STK",q:"(P13) Demanda constante de 40 u/día y LT de 5 días. ¿Cuáles son la media y la varianza de la demanda durante el LT?",
 o:["Media D·LT = 200 y varianza 0: no hay incertidumbre, por eso no hace falta stock de seguridad y PP = 200",
    "Media D·LT = 200 y varianza 200: en una demanda constante la varianza es igual a la media",
    "Media 40 y varianza 0, porque la media se expresa por día",
    "Media 40 y varianza 40 · 5 = 200"],a:0,
 x:"Constante quiere decir sin variabilidad. Es el supuesto del modelo básico: PP = D·LT, sin stock de seguridad. La media sí se acumula a lo largo del LT."},
{id:"b3p13b",t:"STK",q:"(P13) Demanda diaria aleatoria con media 40 y desvío S_D = 6 (días independientes), y LT constante de 9 días. Media y desvío de la demanda durante el LT:",
 o:["Media 40 · 9 = 360; varianza 9 · 6² = 324, desvío √324 = 18",
    "Media 40 · 9 = 360; desvío 6 · 9 = 54",
    "Media 40 y desvío 6: no cambian con el LT",
    "Media 360; desvío 6 / √9 = 2"],a:0,
 x:"Las medias se suman y las varianzas también: media = D̄·LT, varianza = LT·S_D², desvío = S_D·√LT. Por la propiedad reproductiva (o el teorema central del límite) se trabaja con la normal."},
{id:"b3p13c",t:"STK",q:"(P13) Ahora el LT también es aleatorio: media 9 días y desvío S_LT = 1 día, con D̄ = 40 y S_D = 6 por día. Según el apunte, el desvío de la demanda durante el LT es…",
 o:["[[\\sqrt{9 \\cdot 6^2 + 40^2 \\cdot 1^2} = \\sqrt{1924} \\approx 43{,}9]]",
    "[[\\sqrt{9 \\cdot 6^2} = 18]], porque la variabilidad del LT no afecta a la demanda",
    "[[6 \\cdot \\sqrt{9} + 40 \\cdot 1 = 58]], sumando los desvíos",
    "[[\\sqrt{9 \\cdot 6^2 + 1^2} \\approx 18{,}03]], sumando sólo la varianza del LT"],a:0,
 x:"El apunte (Mascó–Torrent): S_DLT = √(LT̄·S_D² + D̄²·S_LT²). El segundo término pesa mucho: un día más de LT significa 40 unidades más de demanda. La media sigue siendo D̄·LT̄ = 360."},
{id:"b3p14",t:"SEN",q:"(P14) ¿Son lo mismo el valor implícito de una restricción y su precio dual? ¿Qué indican?",
 o:["Sí: es el mismo número (la variable dual u_i en el óptimo); indica cuánto cambia Z* por cada unidad adicional de b_i, mientras b_i siga dentro de su rango",
    "Sí: es el mismo número; indica cuánto cambia Z* por cada unidad adicional de b_i, para cualquier aumento de b_i",
    "No: el valor implícito es de una restricción y el precio dual es de una variable (es su costo reducido)",
    "No: el precio dual sale del dual y el valor implícito de la tabla del primal, y en general dan distinto"],a:0,
 x:"u* = c_B·B⁻¹: los valores implícitos del primal son la solución óptima del dual. También se los llama precio sombra o costo marginal. Valen al margen: fuera del rango de b cambia la base y cambia el número."},
{id:"b3p15",t:"STK",q:"(P15) ¿Qué relación hay entre CT(Q) y la expresión [[C(Q)\\cdot Q + L + C(Q)\\cdot i\\cdot A(Q)]]?",
 o:["La expresión es el costo de todo un lote (comprar Q, pedir una vez y mantenerlo un ciclo); CT(Q) es ese costo dividido por Q: el costo por unidad en el momento de la utilización",
    "La expresión es el costo de todo un lote; CT(Q) es ese costo multiplicado por D: el costo anual",
    "Son lo mismo: las dos son el costo por unidad",
    "Son lo mismo: las dos son el costo anual"],a:0,
 x:"CT(Q) = C(Q) + L/Q + C(Q)·i·A(Q)/Q. Con A(Q) = Q²/(2D) queda la del básico. El costo anual es CT·D. (El PDF de preguntas frecuentes iguala CT(Q) a la expresión sin dividir: es un error.)"},
{id:"b3p16",t:"CBA",fixed:true,q:"(P16) Un PL que verifica la hipótesis de rango completo: se conoce su conjunto de soluciones, pero no se sabe si tiene solución finita o no acotada. ¿Qué puede asegurarse con esa sola información?",
 o:["Que el óptimo, si existe, es único y está en un punto extremo, porque la región es convexa.",
    "Que existe una solución básica factible óptima, porque toda región con puntos extremos tiene óptimo.",
    "Que tiene al menos un punto extremo (una solución básica factible) y que sus puntos extremos son finitos, a lo sumo C(n, m).",
    "Que la región factible es acotada, porque tiene un número finito de puntos extremos."],a:2,
 x:"Por el teorema fundamental, si hay solución factible hay una SBF (un punto extremo), y las SBF son a lo sumo C(n, m). Nada más se puede asegurar: el óptimo puede no existir (solución no acotada), puede no ser único (alternativas), y la región puede ser no acotada aunque tenga finitos vértices."},
{id:"b3p17",t:"ENT",fixed:true,q:"(P17) Un analista resuelve un programa lineal entero con un software de ramificación y poda. El reporte trae precios sombra y análisis de sensibilidad, y los toma como afirmaciones válidas sobre su problema entero. ¿Es correcta esa interpretación?",
 o:["Sí, siempre que el cambio analizado quede dentro del rango de sensibilidad informado.",
    "No: esos valores son del último programa relajado (el original sin la condición de enteros más las restricciones que agregó la ramificación) y no describen al problema entero.",
    "Sólo es válida si el programa relajado inicial ya dio una solución entera.",
    "Sí para los precios sombra, pero no para los rangos de los coeficientes de la función objetivo."],a:1,
 x:"La sensibilidad supone que la base óptima se mantiene ante cambios chicos. En un entero, un cambio chico puede llevar el óptimo a otro punto entero lejano, así que esos números no valen para el problema entero."},
{id:"b3p18",t:"SPX",fixed:true,q:"(P18) En una tabla Simplex, la columna de la variable no básica x_j tiene coeficiente de sustitución positivo en la fila de x_3, negativo en la fila de x_4 y nulo en la fila de x_2. Si x_j ingresa a la base, ¿qué ocurre con esas variables a medida que x_j se incrementa?",
 o:["x_3 y x_4 disminuyen, y x_2 sale de la base por tener coeficiente nulo.",
    "x_3 aumenta, x_4 disminuye (y es candidata a salir de la base) y x_2 no cambia.",
    "Las tres quedan igual; sólo cambia z, a razón de c_j − z_j por unidad.",
    "x_3 disminuye (y es candidata a salir de la base), x_4 aumenta y x_2 no cambia."],a:1,
 x:"La cátedra define el coeficiente de sustitución como ∂x_i/∂x_j = −y_ij (pizarra del 1/9). Positivo en x_3 → x_3 aumenta. Negativo en x_4 → su y es positivo, x_4 baja y es la candidata a salir. Nulo en x_2 → no cambia. Atención: si el enunciado llamara «coeficiente de sustitución» al y_ij de la tabla (como hace el PDF de preguntas frecuentes), los signos se invierten y sería la otra opción del par (x_3 baja, x_4 sube). Fijate cómo lo define."}
];

/* ===== BANCO 4 (final): dos tandas de 20. Estilo de las preguntas que tomaron + ángulos nuevos
   + las confusiones más trabajadas en las sesiones. ===== */
const BANK4A = [
{id:"b4a01",t:"SPX",q:"En la tabla, la columna de la no básica x_5 tiene y = 3 en la fila de x_1, y = −2 en la fila de x_4 e y = 0 en la fila de x_2 (son los números de la TABLA, no coeficientes de sustitución). Si x_5 entra a la base…",
 o:["x_1 baja (es la candidata a salir), x_4 sube y x_2 no cambia",
    "x_1 sube, x_4 baja (es la candidata a salir) y x_2 no cambia",
    "x_1 y x_4 bajan, y x_2 sale de la base por tener y = 0",
    "las tres bajan en proporción a sus y, y sale la de mayor y"],a:0,
 x:"Con los y de la tabla: y > 0 → la básica baja (y por eso sólo esas filas compiten en el cociente); y < 0 → sube; y = 0 → no cambia. El coeficiente de sustitución es −y: si el enunciado hablara de coeficientes de sustitución, los signos se leerían al revés."},
{id:"b4a02",t:"SPX",q:"Min con Gran M. Todos los [[c_j - z_j]] ya son ≥ 0, pero en la base quedó la ficticia a_2 con valor 4. ¿Qué se concluye?",
 o:["El problema no tiene solución factible: ni con la penalización +M se pudo sacar la ficticia",
    "El problema no tiene solución factible, salvo que se aumente el valor de M y se itere de nuevo",
    "Es el óptimo, pero degenerado, porque hay una ficticia en la base",
    "Es el óptimo, y la ficticia indica cuánto sobra de la restricción 2"],a:0,
 x:"Ficticia básica con valor POSITIVO en el óptimo → no factible (la región es vacía). Si valiera 0, sería un óptimo degenerado. M ya se toma «tan grande como haga falta», y la ficticia no mide ninguna holgura."},
{id:"b4a03",t:"SPX",q:"Tabla óptima de un MIN: todas las no básicas tienen [[c_j - z_j > 0]], salvo x_3, que tiene [[c_3 - z_3 = 0]]. Todas las básicas son positivas. La solución es…",
 o:["óptima con soluciones alternativas: haciendo entrar x_3 se llega a otro óptimo con el mismo W",
    "óptima y degenerada, porque una variable tiene costo reducido 0",
    "no óptima: en un Min hay que seguir mientras haya algún costo reducido igual a 0",
    "óptima y única, porque en un Min los ceros no cuentan"],a:0,
 x:"Costo reducido 0 en una NO básica, con la tabla ya óptima → alternativas (en Max y en Min). Degenerada es otra cosa: una básica que vale 0, y acá todas son positivas."},
{id:"b4a04",t:"SPX",q:"Con soluciones degeneradas, ¿puede el simplex no terminar nunca?",
 o:["Sí: si θ = 0 varias veces seguidas, Z no mejora y las bases pueden repetirse (ciclado); las reglas de desempate lo evitan",
    "Sí: con degeneración Z empeora en cada iteración hasta que se vuelve no acotado",
    "No: aunque θ = 0, Z mejora estrictamente en cada iteración",
    "No: la degeneración sólo aparece en la tabla óptima"],a:0,
 x:"Z' = Z + θ·(c_j − z_j). Con θ = 0, Z queda igual (nunca empeora). Si se repite, se puede volver a una base anterior: es el programa cíclico."},
{id:"b4a05",t:"SEN",q:"Max, óptimo (4, 6). Se agrega la restricción nueva [[x_1 + x_2 \\leq 8]]. ¿Qué pasa?",
 o:["4 + 6 = 10 > 8: el óptimo actual no la cumple; hay que reoptimizar (simplex dual) y Z no puede mejorar",
    "4 + 6 = 10 > 8: el óptimo actual no la cumple; hay que reoptimizar, y Z puede mejorar porque cambia la base",
    "La cumple, porque 8 < 10: es pasiva y el óptimo no cambia",
    "La cumple con holgura: es activa y el óptimo no cambia"],a:0,
 x:"Reemplazás el óptimo: si no la cumple, ese punto deja de ser factible y hay que reoptimizar. Agregar una restricción sólo achica la región, así que en un Max Z baja o queda igual; nunca mejora."},
{id:"b4a06",t:"SEN",q:"En el óptimo de un Max, la holgura de la restricción 3 es básica y vale 12. Si b_3 baja 5 unidades…",
 o:["la holgura pasa a 7, los productos no cambian y Z* tampoco (el precio sombra es 0)",
    "la holgura pasa a 7, y Z* baja 5 · u_3 con u_3 > 0",
    "cambia la base, porque se modificó un término independiente",
    "la holgura pasa a 17, y Z* sube"],a:0,
 x:"Si sobra, vale 0. Rango: −12 ≤ Δb_3 < ∞. Bajar 5 está adentro: sólo baja lo que sobra, y la producción y la ganancia quedan iguales."},
{id:"b4a07",t:"SEN",q:"MIN. La variable no básica x_3 tiene [[c_3 - z_3 = 7]] en la tabla óptima. ¿Cuánto tiene que cambiar su costo c_3 para que x_3 pueda entrar a la base?",
 o:["Tiene que bajar más de 7 (con una baja de exactamente 7 aparece un óptimo alternativo)",
    "Tiene que subir más de 7 (con una suba de exactamente 7 aparece un óptimo alternativo)",
    "Tiene que bajar exactamente 7, y entonces el óptimo es único con x_3 en la base",
    "No puede entrar nunca: un costo reducido positivo en un Min la deja afuera"],a:0,
 x:"En un Min entra una variable con c_j − z_j < 0. Para pasar de +7 a negativo, c_3 tiene que bajar más de 7. Con −7 exacto queda en 0: alternativas."},
{id:"b4a08",t:"DUA",q:"El dual de un problema tiene una solución óptima degenerada. ¿Qué le pasa al primal?",
 o:["Tiene soluciones óptimas alternativas",
    "Tiene también una solución óptima degenerada",
    "No tiene soluciones factibles",
    "Tiene solución no acotada"],a:0,
 x:"Alternativas en uno ↔ degenerada en el otro, en las dos direcciones."},
{id:"b4a09",t:"DUA",q:"En el óptimo del dual de un Max, la variable u_2 vale 3 (positiva). En el óptimo del primal, la restricción 2…",
 o:["se cumple con igualdad: su holgura vale 0 (el recurso está agotado)",
    "tiene holgura 3, porque la variable dual mide lo que sobra",
    "tiene holgura positiva, pero menor que 3",
    "puede tener cualquier holgura; las duales no informan sobre el primal"],a:0,
 x:"Holguras complementarias: holgura × u = 0. Si u_2 > 0, la holgura tiene que ser 0. La variable dual es un precio, no una cantidad."},
{id:"b4a10",t:"TTA",q:"Transbordo de costo mínimo ya resuelto. Se ELIMINA un tramo por el que, en el óptimo actual, pasaban 30 unidades. ¿Qué pasa?",
 o:["Desaparece una variable del modelo; el costo óptimo no puede mejorar (sube o queda igual) y hay que reoptimizar",
    "Desaparece una variable del modelo; el costo óptimo puede mejorar, porque hay un camino menos que mantener",
    "Desaparece la restricción de conservación del tramo, y el costo no cambia",
    "Desaparece la restricción de conservación del tramo, y hay que agregar un destino ficticio"],a:0,
 x:"Un tramo es una variable. Quitarla achica las opciones: la solución vieja usaba ese tramo y ya no es posible, así que el costo sube o queda igual. Es lo opuesto de agregar un tramo."},
{id:"b4a11",t:"TTA",q:"Transporte balanceado con 4 orígenes y 5 destinos. Una solución básica tiene 7 variables positivas. Es…",
 o:["degenerada: debería tener m + n − 1 = 8, y tiene 7",
    "no degenerada: tiene más de m = 4 positivas",
    "degenerada: debería tener m · n = 20",
    "no factible: una solución básica necesita 9 = m + n positivas"],a:0,
 x:"m + n − 1 = 4 + 5 − 1 = 8 básicas (una de las 9 restricciones es redundante). Con menos de 8 positivas, alguna básica vale 0: degenerada."},
{id:"b4a12",t:"ENT",q:"Problema entero de MIN. El analista resuelve el relajado y obtiene x_1 = 3, x_2 = 5 (enteros) con W = 47. ¿Qué concluye?",
 o:["Que (3, 5) es el óptimo del problema entero, con W = 47",
    "Que W = 47 es sólo un piso: hay que ramificar para encontrar el óptimo entero",
    "Que hay que redondear y verificar los vecinos (2, 5), (3, 4) y (4, 5)",
    "Que el problema entero tiene W > 47, porque el relajado siempre es mejor"],a:0,
 x:"El relajado buscó entre todos los puntos (con decimales incluidos) y el mejor salió entero: ningún entero puede ser mejor. Si saliera fraccionario, ahí sí 47 sería sólo un piso y se ramificaría."},
{id:"b4a13",t:"ENT",q:"Ramificación y poda en un MIN. La mejor solución entera encontrada cuesta W = 50. Un nodo abierto tiene relajado W = 52, con variables fraccionarias. Ese nodo…",
 o:["se poda: en un Min, lo mejor que esa rama puede dar es 52, peor que 50",
    "se ramifica, porque tiene variables fraccionarias",
    "reemplaza a la mejor solución, porque 52 > 50",
    "se poda sólo si además es no factible"],a:0,
 x:"En un Min el relajado de una rama es su piso: esa rama no puede bajar de 52. Como ya tenés 50, no puede mejorarte. Que tenga decimales no importa."},
{id:"b4a14",t:"RED",q:"En el algoritmo de Dijkstra, el nodo 5 tiene la etiqueta permanente [12, 3]. ¿Qué significa?",
 o:["Que la distancia mínima del origen al nodo 5 es 12, y que se llega a 5 desde el nodo 3",
    "Que la distancia mínima del origen al nodo 5 es 12, y que es el tercer nodo en hacerse permanente",
    "Que el arco 3 → 5 tiene capacidad 12",
    "Que hay 12 caminos posibles al nodo 5, pasando por 3 nodos"],a:0,
 x:"Etiqueta = [distancia acumulada, nodo anterior]. Permanente quiere decir que ya no puede mejorar. La ruta se reconstruye hacia atrás siguiendo los nodos anteriores."},
{id:"b4a15",t:"STK",q:"Modelo básico: D = 12.000 u/año y Q* = 600. ¿Cuánto valen n* y T*?",
 o:["n* = 12.000/600 = 20 pedidos por año; T* = 600/12.000 = 0,05 año (unos 18 días)",
    "n* = 600/12.000 = 0,05 pedidos por año; T* = 12.000/600 = 20 años",
    "n* = 20 unidades por pedido; T* = 0,05 pedidos por año",
    "n* = 20 pedidos por año; T* = 20 días, porque n* y T* son el mismo número"],a:0,
 x:"n* = D/Q* (pedidos por año) y T* = Q*/D (tiempo entre pedidos). Son inversos: T* = 1/n*. Con 365 días, 0,05 año ≈ 18 días."},
{id:"b4a16",t:"STK",q:"Punto de pedido con demanda aleatoria. La demanda MEDIA diaria sube de 40 a 60 (el desvío, el LT y el RF quedan iguales). ¿Qué pasa?",
 o:["El punto de pedido sube, pero el stock de seguridad queda igual",
    "El punto de pedido y el stock de seguridad suben en la misma proporción (×1,5)",
    "El punto de pedido queda igual, y sube el stock de seguridad",
    "No cambia nada, porque el riesgo de faltante es el mismo"],a:0,
 x:"PP = d̄·LT + SS. La media sólo mueve el primer término. SS = z·σ·√LT depende del RF, de la variabilidad y del LT, no de la media."},
{id:"b4a17",t:"STK",q:"Demanda media 50 u/día con desvío 5; el LT es aleatorio con media 4 días y desvío 2 días. El desvío de la demanda durante el LT es…",
 o:["[[\\sqrt{4 \\cdot 5^2 + 50^2 \\cdot 2^2} = \\sqrt{10.100} \\approx 100{,}5]]",
    "[[\\sqrt{4 \\cdot 5^2} = 10]], porque la variabilidad del LT no influye",
    "[[5 \\cdot \\sqrt{4} + 50 \\cdot 2 = 110]], sumando los desvíos",
    "[[\\sqrt{4 \\cdot 5^2 + 2^2} \\approx 10{,}2]], sumando sólo la varianza del LT"],a:0,
 x:"Se suman las VARIANZAS: LT̄·σ_D² (por la demanda) + D̄²·σ_LT² (por el atraso: un día más son 50 unidades más). Acá el término del LT domina."},
{id:"b4a18",t:"STK",q:"Consumo durante el ingreso: la velocidad de producción es apenas mayor que la demanda (V = 1,05·D). ¿Qué pasa con el lote óptimo?",
 o:["Se hace muy grande: [[1 - D/V]] es casi 0, y la producción se vuelve casi continua",
    "Se hace muy chico: como se produce casi lo que se consume, conviene lotes mínimos",
    "Queda igual al del modelo básico, porque V y D casi coinciden",
    "No tiene solución: el modelo exige V ≥ 2D"],a:0,
 x:"Q* = √(2DL / (C·i·(1 − D/V))). Si V → D, el denominador → 0 y Q* → ∞: el stock casi no se acumula, así que mantener es casi gratis. Se exige V > D, nada más."},
{id:"b4a19",t:"STK",q:"Lagrange con restricción de TIEMPO DE PREPARACIÓN de máquinas: ¿en qué unidad está λ y qué pasa con los lotes al subirlo?",
 o:["$/hora; los lotes se AGRANDAN (menos preparaciones por año)",
    "$/hora; los lotes se ACHICAN (menos tiempo ocupado)",
    "$/(m³·año); los lotes se achican",
    "Es una tasa (1/año); los lotes se agrandan"],a:0,
 x:"λ es el costo de no tener una hora más de preparación: $/hora. Entra como L + λτ (encarece cada pedido, va arriba en Q*), así que el lote crece y se prepara menos veces."},
{id:"b4a20",t:"CBA",q:"¿Puede el óptimo de un PL estar en un punto que NO es vértice de la región factible?",
 o:["Sí, cuando hay soluciones alternativas (puntos del segmento entre dos vértices óptimos); pero siempre hay también al menos un vértice óptimo",
    "Sí, cuando hay soluciones alternativas; y en ese caso ningún vértice es óptimo",
    "No: el teorema dice que el óptimo está siempre y sólo en vértices",
    "No: los puntos que no son vértices son siempre interiores y nunca óptimos"],a:0,
 x:"Teorema: si hay óptimo, está en al menos un punto extremo; si está en dos, también en todo el segmento entre ellos. «Al menos uno», no «sólo» vértices."}
];

const BANK4B = [
{id:"b4b01",t:"GRA",q:"Min Z = x_1 + x_2 sujeto a [[x_1 + 2x_2 \\geq 4]] y [[x_1, x_2 \\geq 0]]. La región es no acotada (se abre hacia arriba y a la derecha). ¿Cuál es la solución?",
 o:["Óptimo único en (0, 2), con Z* = 2",
    "Óptimo único en (4, 0), con Z* = 4",
    "No acotada, porque la región factible es no acotada",
    "Alternativas sobre el segmento de (0, 2) a (4, 0)"],a:0,
 x:"Vértices: (0, 2) → Z = 2 y (4, 0) → Z = 4. En un Min se va hacia el origen, y la restricción frena en (0, 2). La región infinita se abre hacia donde Z empeora, así que no molesta."},
{id:"b4b02",t:"SPX",q:"Entra x_j. Sus COEFICIENTES DE SUSTITUCIÓN son −2 en la fila de x_1, +1 en la fila de x_3 y 0 en la fila de x_6. A medida que x_j crece…",
 o:["x_1 baja (candidata a salir), x_3 sube y x_6 no cambia",
    "x_1 sube, x_3 baja (candidata a salir) y x_6 no cambia",
    "x_1 y x_3 bajan, y x_6 sale por tener coeficiente 0",
    "ninguna cambia: sólo cambia Z"],a:0,
 x:"Coeficiente de sustitución (cátedra) = cuánto cambia la básica por unidad que entra: negativo → baja (y puede llegar a 0 y salir), positivo → sube, 0 → igual. En la tabla esos números aparecen con el signo cambiado (y = 2, −1, 0)."},
{id:"b4b03",t:"SPX",q:"Tabla de un Max: la no básica x_j tiene [[c_j - z_j = +6]]. ¿Qué significa ese 6?",
 o:["Que por cada unidad de x_j que entre, Z aumenta 6 (lo que deja x_j menos lo que se resigna de las básicas)",
    "Que por cada unidad de x_j que entre, Z aumenta 6, sin importar cuánto bajen las básicas",
    "Que x_j va a entrar con valor 6",
    "Que el precio sombra de x_j es 6"],a:0,
 x:"c_j − z_j = ganancia neta por unidad: c_j es lo que aporta x_j y z_j lo que se pierde en las básicas al hacerle lugar. Cuánto entra lo dice θ (el cociente mínimo), no este número."},
{id:"b4b04",t:"SPX",q:"¿Por qué en la condición de factibilidad se toma el MÍNIMO de los cocientes [[x_i / y_{ij}]] (con y > 0)?",
 o:["Porque es la primera básica que llega a 0 al aumentar x_j: con un θ mayor, esa básica quedaría negativa",
    "Porque es la primera básica que llega a 0 al aumentar x_j: así Z aumenta lo más posible",
    "Porque el mínimo da la variable que más mejora Z",
    "Porque el mínimo asegura que la nueva solución sea entera"],a:0,
 x:"θ es cuánto puede crecer la variable que entra. Si crece más que el mínimo, alguna básica se hace negativa: infactible. La mejora de Z la decide la condición de optimización, no esta."},
{id:"b4b05",t:"STK",q:"Escalón: C_1 = $30 si Q < 400; C_2 = $28 si Q ≥ 400. Con C_1 da Q_1* = 420. ¿Qué lote conviene?",
 o:["Q_2*: con el precio menor el lote es aún mayor (más de 420 ≥ 400), así que tiene descuento y es el óptimo",
    "Q_1* = 420, porque ya supera el mínimo y es el primero que se calcula",
    "Exactamente 400, el mínimo para tener el descuento",
    "Hay que comparar CT_1(420) con CT_2(400)"],a:0,
 x:"Precio menor → Q* mayor. Si con el precio caro ya llegás al mínimo, con el barato también, y su CT es más bajo en cualquier Q. Recién si Q_2* < a se compara CT_1(Q_1*) con CT_2(a)."},
{id:"b4b06",t:"SEN",q:"Max. El precio sombra de las horas de máquina es 15 $/h (dentro de su rango). Te ofrecen 10 horas extra a 18 $/h. ¿Conviene?",
 o:["No: cada hora suma 15 a Z y cuesta 18; perderías 3 por hora",
    "Sí: cada hora suma 15 a Z, y 10 horas suman 150",
    "Sí: el precio sombra indica que faltan horas, así que cualquier oferta conviene",
    "No: un precio sombra positivo indica que sobran horas"],a:0,
 x:"El precio sombra es lo máximo que conviene pagar. Por debajo de 15 conviene; por encima, no. Precio sombra > 0 quiere decir que el recurso está agotado, no que sobra."},
{id:"b4b07",t:"SEN",q:"Max. Cambia el c_k de una variable BÁSICA y queda dentro de su rango. ¿Qué pasa con los costos reducidos de las no básicas?",
 o:["Cambian (porque c_k está en c_B), pero siguen siendo ≤ 0: la base sigue óptima",
    "No cambian: sólo cambia el costo reducido de x_k",
    "Cambian y alguno se vuelve positivo: hay que iterar",
    "No cambian, pero sí cambia X*"],a:0,
