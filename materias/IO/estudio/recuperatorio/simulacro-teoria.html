      x:`Base óptima: ${O.B.map(j=>VN[j]).join(", ")}. Las de holgura/exceso que no están en ella valen 0: ${nbS.map(nm).join(" y ")||"ninguna"}.`}); }
  // 11 interpretación precio sombra 1
  { const u=fsa(uO[0]), un=ctx.u1, m=ctx.money;
    const cor=`Si disponemos de 1 ${ctx.res[0][1]}, la ganancia aumenta en ${u} ${m}.`;
    const ds=[`Cuesta ${u} ${m} almacenar cada ${un}.`,`Sobran ${u} unidades de ${un.split(" de ").pop()} en el inventario.`,`Si aumentamos el precio del ${P[O.B.find(j=>j<3)]}, la ganancia aumentará en ${u} ${m}.`,`Si disponemos de 1 ${ctx.res[0][1]}, la ganancia disminuye en ${u} ${m}.`];
    const o=mkOpts(r,cor,ds,0.05);
    qs.push({q:"¿Qué significa el precio sombra de la primera restricción económicamente?",...o,
      x:`u<sub>1</sub> = z<sub>j</sub> de s<sub>1</sub> en la tabla óptima = ${u}. Es cuánto sube Z por cada unidad más del recurso (dentro de su rango), y lo máximo que convendría pagar por ella. Si sobrara recurso, valdría 0.`}); }
  // 12 tabla inicial
  { const I=e.init, ins=(j,l)=>`Ingresa ${VN[j]}, sale ${VN[l]}.`, cor=ins(I.enter,I.leave);
    const others=[0,1,2].filter(j=>j!==I.enter);
    const ds=[ins(I.enter,[3,4,6].find(l=>l!==I.leave)), ins(others[0],I.leave===6?3:6), ins(others[1],3), ins(I.enter,5), ins(pick(r,others),I.leave)];
    const o=mkOpts(r,cor,ds.filter(x=>x!==cor),0.05);
    qs.push({q:"Al plantear la tabla Simplex inicial, ¿cuál variable ingresa y cuál sale de la base?",...o,
      x:`Base inicial: s<sub>1</sub>, s<sub>2</sub> y la artificial a<sub>3</sub> (no el exceso e<sub>3</sub>, que entra con −1). Con −M en el funcional, c<sub>j</sub> − z<sub>j</sub> de ${VN[I.enter]} es ${fs(e.c[I.enter])} + M, el mayor: entra ${VN[I.enter]}. Cocientes: ${I.rows.map((i,t)=>`${VN[[3,4,6][i]]}: ${fsa(I.th[t])}`).join("; ")} → sale ${VN[I.leave]}.`}); }
  // 13 costo reducido de una no básica de decisión
  { const v=[0,1,2].find(j=>!O.B.includes(j)), rc=O.red[v], a=fs(new F(Math.abs(rc.n),rc.d)), u=ctx.unit.replace(/s$/,""), m=ctx.money;
    const cor=`−${a}; producir una unidad de ${P[v]} disminuiría la ganancia en ${a} ${m}.`;
    const ds=[`0; significa que ya se está produciendo y es rentable.`,`${a}; significa que conviene producirlo para aumentar la ganancia.`,`−${fs(e.c[v])}; significa que no hay capacidad suficiente para producirlo.`,`−${a}; significa que hay que bajar su precio en ${a} para producirlo.`];
    const o=mkOpts(r,cor,ds,0.05);
    qs.push({q:`En el óptimo, ¿cuál es el costo reducido de ${P[v]} y cómo se interpreta?`,...o,
      x:`${VN[v]} no es básica en el óptimo y su c<sub>j</sub> − z<sub>j</sub> = ${fs(rc)}. Forzar una unidad baja Z en ${a}; para que convenga producirlo, su ganancia tendría que subir más de ${a} (c > ${fsa(e.c[v].sub(rc))}).`}); }
  return qs;
}

/* ===================== EJERCICIO 3: stock con restricción de capital ===================== */
function ej3Build(p){
  const [A,B]=[0,1], Q0=[0,1].map(j=>Math.sqrt(2*p.D[j]*p.L[j]/(p.C[j]*p.i)));
  const I0=[0,1].reduce((s,j)=>s+p.C[j]*Q0[j]/2,0), ratio=I0/p.I0, lam=p.i*(ratio*ratio-1);
  const Ql=Q0.map(q=>q*Math.sqrt(p.i/(p.i+lam)));
  const e={p,Q0,Iopt:I0,ratio,lam,Ql};
  const it=p.ctx.items, pct=x=>nf(x*100,1)+" %";
  e.intro=`<p>${p.ctx.firm} maneja el inventario de dos insumos críticos: ${it[0]} y ${it[1]}. Se estima una demanda anual de D<sub>A</sub> = ${nf(p.D[0],0)} u y D<sub>B</sub> = ${nf(p.D[1],0)} u. Cada vez que se realiza un pedido se incurre en un costo fijo de L<sub>A</sub> = $${nf(p.L[0],0)} para ${it[0]} y L<sub>B</sub> = $${nf(p.L[1],0)} para ${it[1]}. El costo unitario de compra es C<sub>A</sub> = $${nf(p.C[0],0)} y C<sub>B</sub> = $${nf(p.C[1],0)}. El costo de mantenimiento de inventario se estima con una tasa anual del i = ${pct(p.i)}. La empresa cuenta con un capital máximo de I<sub>0</sub> = $${nf(p.I0,0)} para invertir en el stock de estos productos.</p>`;
  e.sol=`<div class="stack"><div class="tblwrap"><table class="spx"><tr><th></th><th>Q* sin restricción</th><th>C·Q*/2</th><th>Q con λ</th></tr>
    ${[0,1].map(j=>`<tr><td>${it[j]}</td><td>${nf(Q0[j],1)}</td><td>${nf(p.C[j]*Q0[j]/2,0)}</td><td>${nf(Ql[j],1)}</td></tr>`).join("")}</table></div>
    <p>Inversión media sin restricción: ${nf(I0,0)} ${I0>p.I0?">":"≤"} ${nf(p.I0,0)}. λ = i·[(I(0)/I<sub>0</sub>)² − 1] = ${nf(p.i,2)}·[(${nf(ratio,4)})² − 1] = ${nf(lam,4)}. Tasa límite i + λ = ${pct(p.i+lam)}.</p></div>`;
  return e;
}
const CTX3=[{firm:"Una ferretería mayorista",items:["Tornillos A","Tuercas B"]},{firm:"Una distribuidora de insumos médicos",items:["Guantes A","Barbijos B"]},{firm:"Una librería mayorista",items:["Cuadernos A","Resmas B"]},{firm:"Un taller metalúrgico",items:["Bulones A","Arandelas B"]}];
function genEj3(r){
  for(let t=0;t<500;t++){
    const p={ctx:pick(r,CTX3),D:[pick(r,rng(4000,20000,1000)),pick(r,rng(4000,20000,1000))],L:[pick(r,rng(100,300,50)),pick(r,rng(100,300,50))],C:[pick(r,rng(20,120,5)),pick(r,rng(20,120,5))],i:pick(r,[0.15,0.2,0.25])};
    const e0=ej3Build({...p,I0:1}); p.I0=Math.round(e0.Iopt*(0.55+0.3*r())/500)*500;
    const e=ej3Build(p); if(e.lam<0.05||e.lam>1.5) continue;
    const yes=r()<0.6; p.r = yes ? Math.max(3,Math.floor(e.lam*100*pick(r,[0.4,0.6,0.8]))) : Math.ceil((p.i+e.lam)*100)+pick(r,[2,5,8]);
    if(yes && p.r/100>=e.lam) continue;
    return ej3Build(p);
  }
}
function ej3Questions(e,r){
  const p=e.p, it=p.ctx.items, qs=[], l=x=>`λ ≈ ${nf(x,2)}`;
  { const cands=[e.ratio-1,p.i*(e.ratio-1),e.ratio*e.ratio-1,e.lam*2,e.lam/2].filter(x=>x>0&&Math.abs(x-e.lam)>0.03);
    const o=mkOpts(r,l(e.lam),cands.map(l),0.1);
    qs.push({q:"¿Qué valor de λ es el más cercano al óptimo para cumplir con el presupuesto?",...o,
      x:`Sin restricción la inversión media es ${nf(e.Iopt,0)} > ${nf(p.I0,0)}: la restricción es efectiva. Todos los lotes se achican en la misma proporción √(i/(i+λ)), así que λ = i·[(I(0)/I<sub>0</sub>)² − 1] = ${nf(p.i,2)}·[(${nf(e.ratio,4)})² − 1] ≈ ${nf(e.lam,3)}.`}); }
  { const q=e.Q0[0], f=x=>`${nf(Math.round(x),0)} unidades`;
    const o=mkOpts(r,f(q),[f(q*Math.SQRT2),f(q/Math.SQRT2),f(e.Q0[1]),f(e.Ql[0])],0.12);
    qs.push({q:`¿Cuál es el tamaño de lote óptimo para ${it[0]} si se ignora la restricción?`,...o,
      x:`Q<sub>A</sub>* = √(2·${nf(p.D[0],0)}·${nf(p.L[0],0)} / (${nf(p.C[0],0)}·${nf(p.i,2)})) = ${nf(q,1)}.`}); }
  { const I=e.Iopt, f=x=>`$${nf(Math.round(x),0)}`, no=I>p.I0;
    const cor=`${f(I)}, por lo tanto ${no?"NO":"SÍ"} cumple la restricción.`;
    const ds=[`${f(I/2.6)}, por lo tanto SÍ cumple la restricción.`,`${f(p.I0)}, por lo tanto coincide con la restricción.`,`${f(2*I)}, por lo tanto NO cumple la restricción.`,`${f(I)}, por lo tanto ${no?"SÍ":"NO"} cumple la restricción.`];
    const o=mkOpts(r,cor,ds,0.05);
    qs.push({q:"¿Cuál es el valor más cercano a la inversión promedio si se consideran ambos lotes óptimos?",...o,
      x:`${nf(p.C[0],0)}·${nf(e.Q0[0],1)}/2 + ${nf(p.C[1],0)}·${nf(e.Q0[1],1)}/2 = ${nf(I,0)}. Se usa la inversión media (Q/2), no la máxima. ${f(p.I0)} es el capital disponible: la inversión recién coincide con él después de ajustar λ.`}); }
  { const q=e.Ql[1], f=x=>`${nf(Math.round(x),0)} unidades`;
    const o=mkOpts(r,f(q),[f(e.Q0[1]),f(e.Q0[1]*p.i/(p.i+e.lam)),f(e.Ql[0]),f(q*1.3)],0.1);
    qs.push({q:`Bajo la restricción financiera, ¿cuál es el tamaño de lote óptimo aproximado para ${it[1]}?`,...o,
      x:`Q<sub>B</sub> = √(2·D<sub>B</sub>·L<sub>B</sub> / (C<sub>B</sub>·(i + λ))) = ${nf(e.Q0[1],1)}·√(${nf(p.i,2)}/${nf(p.i+e.lam,3)}) ≈ ${nf(q,1)}.`}); }
  { const yes=p.r/100<e.lam, pc=nf(p.i*100,0);
    const cor = yes ? `Sí, porque el costo marginal del capital invertido (λ ≈ ${nf(e.lam,2)}) es mayor a la tasa bancaria.` : `No, porque la tasa bancaria supera a i + λ ≈ ${nf(p.i+e.lam,2)}: el capital extra cuesta más de lo que ahorra.`;
    const ds=["No, porque λ indica que incorporar más capital perjudica la ganancia (es negativo).","Sí, resulta conveniente porque el límite de capital actual es bajo.",`No, porque la tasa bancaria es un costo adicional y el modelo penaliza el inventario con un ${pc} %.`, yes?`No, porque la tasa bancaria supera a i + λ.`:`Sí, porque el costo marginal del capital invertido es mayor a la tasa bancaria.`];
    const o=mkOpts(r,cor,ds,0);
    qs.push({q:`¿Le convendría a la empresa tomar un crédito al ${p.r} % anual para expandir su presupuesto?`,...o,
      x:`λ ≈ ${nf(e.lam,3)} es el costo marginal de no tener más capital; la restricción actúa como si la tasa fuera i + λ ≈ ${nf(p.i+e.lam,3)}. ${yes?`La tasa del crédito (${p.r} %) está por debajo de λ y también de i + λ: conviene.`:`La tasa del crédito (${p.r} %) supera a i + λ: no conviene.`} (El apunte usa i₁ + λ como límite; con estos números los dos criterios coinciden.)`}); }
  return qs;
}

/* ===================== armado del parcial ===================== */
const LIB = {F,ej1Build,ej2Build,ej3Build,lineInt,fs,fsa,nf,VN,NONE};
function buildVariant(seed){
  const r=mulberry32(seedNum(seed));
  const e1=genEj1(r), e2=genEj2(r), e3=genEj3(r);
  return {id:"var-"+seed, title:`Variante ${seed}`, seed, ejs:[
    {intro:e1.intro, fig:e1.fig, sol:e1.sol, qs:ej1Questions(e1,r)},
    {intro:e2.intro+e2.table(e2.T), fig:"", sol:e2.sol, lead:"Resuelva analíticamente y responda (una sola opción):", qs:ej2Questions(e2,r)},
    {intro:e3.intro, fig:"", sol:e3.sol, qs:ej3Questions(e3,r)} ]};
}
function realExam(){ try { return typeof window.PARCIAL_REAL==="function" ? window.PARCIAL_REAL(LIB) : null; } catch(err){ console.error(err); return null; } }

const PSTORE="io-practica-v1";
const pLoad=()=>{ try{ return JSON.parse(localStorage.getItem(PSTORE))||{}; }catch(e){ return {}; } };
const pSave=s=>{ try{ localStorage.setItem(PSTORE,JSON.stringify(s)); }catch(e){} };

function renderPracticeHome(){
  const real=realExam(), hist=pLoad();
  const last=id=>hist[id]?`Último intento: ${hist[id].last}/${hist[id].n} · mejor: ${hist[id].best}/${hist[id].n}`:"Sin intentos todavía";
  const vars=Object.keys(hist).filter(k=>k.startsWith("var-")).slice(-6).reverse();
  $app.innerHTML=`${tabsHTML("practica")}
  <header class="stack">
    <span class="eyebrow">Investigación Operativa · recuperatorio 19/11</span>
    <h1>Parcial práctico</h1>
    <p class="muted">Tres ejercicios como en el parcial: método gráfico, una tabla simplex con sensibilidad y dual, y stock con restricción de capital. Resolvé en hoja aparte, marcá una opción por pregunta y entregá para ver la corrección.</p>
  </header>
  <div class="modes">
    ${real?`<button class="mode" id="go-real"><span class="k">Parcial del 3/10</span><h3>El que tomaron</h3><p>Mismas preguntas y opciones. Al corregir te muestra también lo que marcaste en el parcial. ${last(real.id)}</p></button>`
      :`<div class="mode"><span class="k">Parcial del 3/10</span><h3>No disponible acá</h3><p>La réplica del parcial vive en un archivo privado que no se sube al repositorio.</p></div>`}
    <button class="mode" id="go-var"><span class="k">Variante nueva</span><h3>Mismos ejercicios, otros números</h3><p>Se genera al azar y cada respuesta se calcula con fracciones exactas. Cada variante tiene un código para repetirla.</p></button>
  </div>
  <section class="sheet stack">
    <h2>Repetir una variante</h2>
    <div class="row"><label for="seed" class="muted">Código</label><input class="seed" id="seed" maxlength="8" placeholder="7K3QF"><button class="btn" id="go-seed">Abrir</button></div>
    ${vars.length?`<div class="stack" style="gap:6px">${vars.map(k=>`<div class="row"><button class="btn ghost code" data-seed="${k.slice(4)}">${k.slice(4)}</button><span class="muted" style="font-size:14px">${last(k)}</span></div>`).join("")}</div>`:""}
  </section>`;
  bindTabs();
  if(real) document.getElementById("go-real").onclick=()=>startExam(real);
  document.getElementById("go-var").onclick=()=>startExam(buildVariant(newSeed()));
  const go=()=>{ const v=document.getElementById("seed").value.trim().toUpperCase(); if(v) startExam(buildVariant(v)); };
  document.getElementById("go-seed").onclick=go;
  document.getElementById("seed").onkeydown=e=>{ if(e.key==="Enter") go(); };
  document.querySelectorAll("[data-seed]").forEach(b=>b.onclick=()=>startExam(buildVariant(b.dataset.seed)));
}

let PX=null;
function startExam(ex){ PX={ex, ans:{}, struck:{}, done:false}; renderExam(); window.scrollTo(0,0); }
function renderExam(){
  const ex=PX.ex; let n=0;
  const total=ex.ejs.reduce((s,e)=>s+e.qs.length,0), answered=Object.keys(PX.ans).length;
  let score=0; if(PX.done) ex.ejs.forEach((e,ei)=>e.qs.forEach((q,qi)=>{ if(PX.ans[ei+"-"+qi]===q.a) score++; }));
  const body=ex.ejs.map((e,ei)=>{
    let ok=0; const qh=e.qs.map((q,qi)=>{ n++; const key=ei+"-"+qi, a=PX.ans[key], st=PX.struck[key]||[];
      if(PX.done && a===q.a) ok++;
      const opts=q.opts.map((t,pos)=>{ let cls="opt"; if(a===pos) cls+=" sel"; if(st.includes(pos)) cls+=" struck";
        if(PX.done){ if(pos===q.a) cls+=" right"; else if(a===pos) cls+=" wrong"; }
        return `<div class="${cls}" role="radio" tabindex="0" aria-checked="${a===pos}" data-k="${key}" data-pos="${pos}"><span class="b">${LET[pos]}</span><span class="t">${t}</span>${PX.done?"":`<button class="x" data-sk="${key}" data-sp="${pos}" aria-label="Tachar ${LET[pos]}">${st.includes(pos)?"destachar":"tachar"}</button>`}</div>`; }).join("");
      const fb = PX.done ? `<div class="expl ${a===q.a?"ok":"bad"}"><strong>${a===q.a?"Correcta":(a===undefined?"Sin responder":"Incorrecta")}: era la ${LET[q.a]})</strong><span>${q.x}</span>${q.prev!==undefined?`<span class="prev">En el parcial marcaste ${LET[q.prev]}) ${q.prev===q.a?"✓":"✗"}</span>`:""}</div>` : "";
      return `<div class="eq" id="q-${key}"><p class="stem"><b>${n}.</b> ${q.q}</p><div class="eopts" role="radiogroup">${opts}</div>${fb}</div>`; }).join("");
    return `<section class="sheet stack"><div class="qhead"><h2>Ejercicio ${ei+1}</h2>${PX.done?`<span class="pill ${ok===e.qs.length?"ok":"bad"}">${ok}/${e.qs.length}</span>`:""}</div>
      <div class="enun">${e.intro}${e.fig||""}<p class="muted">${e.lead||"Resuelva analíticamente y responda (una sola opción):"}</p></div>${qh}
      ${PX.done?`<details class="sol"><summary>Ver resolución</summary>${e.sol}</details>`:""}</section>`;
  }).join("");
  $app.innerHTML=`
  <div class="top"><div class="topline">
    <button class="btn ghost" id="pout">← Salir</button>
    <span class="eyebrow">${ex.title} · ${PX.done?`${score}/${total} correctas`:`${answered}/${total} respondidas`}</span>
    ${PX.done?`<span></span>`:`<button class="btn primary" id="psub">Entregar</button>`}</div></div>
  ${PX.done?`<section class="sheet stack"><div class="score">${score}<small> / ${total}</small></div>
    <p class="muted">${Math.round(100*score/total)} % de aciertos.${ex.seed?` Código de esta variante: <span class="code">${ex.seed}</span>.`:""}</p>
    <div class="row"><button class="btn primary" id="pnew">Otra variante</button><button class="btn" id="pretry">Rehacer este</button></div></section>`:""}
  ${body}
  <div id="pconfirm"></div>`;
  document.getElementById("pout").onclick=()=>{ location.hash="practica"; renderPracticeHome(); };
  if(PX.done){ document.getElementById("pnew").onclick=()=>startExam(buildVariant(newSeed())); document.getElementById("pretry").onclick=()=>startExam(ex); }
  else document.getElementById("psub").onclick=()=>{
    const blank=total-Object.keys(PX.ans).length, box=document.getElementById("pconfirm");
    box.innerHTML=`<section class="sheet stack"><h3>¿Entregar?</h3><p class="muted">${blank?`Quedan ${blank} sin responder.`:"Respondiste todas."}</p><div class="row"><button class="btn primary" id="py">Entregar</button><button class="btn" id="pn">Seguir</button></div></section>`;
    document.getElementById("py").onclick=finishExam; document.getElementById("pn").onclick=()=>box.innerHTML=""; box.scrollIntoView({behavior:"smooth",block:"center"}); };
  document.querySelectorAll(".eopts .opt").forEach(o=>{
    const sel=()=>{ if(PX.done) return; const k=o.dataset.k, pos=+o.dataset.pos; PX.ans[k]=pos; PX.struck[k]=(PX.struck[k]||[]).filter(x=>x!==pos); keepScroll(renderExam); };
    o.onclick=e=>{ if(e.target.closest("[data-sk]")) return; sel(); }; o.onkeydown=e=>{ if(e.key===" "||e.key==="Enter"){ e.preventDefault(); sel(); } }; });
  document.querySelectorAll("[data-sk]").forEach(b=>b.onclick=e=>{ e.stopPropagation(); const k=b.dataset.sk, p=+b.dataset.sp, s=PX.struck[k]||[];
    PX.struck[k]= s.includes(p)?s.filter(x=>x!==p):[...s,p]; if(PX.ans[k]===p && PX.struck[k].includes(p)) delete PX.ans[k]; keepScroll(renderExam); });
}
function keepScroll(fn){ const y=window.scrollY; fn(); window.scrollTo(0,y); }
function finishExam(){
  PX.done=true; const ex=PX.ex; let sc=0,n=0; ex.ejs.forEach((e,ei)=>e.qs.forEach((q,qi)=>{ n++; if(PX.ans[ei+"-"+qi]===q.a) sc++; }));
  const h=pLoad(), o=h[ex.id]||{best:0}; h[ex.id]={last:sc,best:Math.max(o.best||0,sc),n}; pSave(h);
  renderExam(); window.scrollTo(0,0);
}

route();
</script>
