<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Hoja de práctica — simplex</title>
<style>
  @page { size: A4 portrait; margin: 10mm 9mm; }
  * { box-sizing: border-box; }
  body { font-family: Arial, Helvetica, sans-serif; color: #111; margin: 0; }
  .page { page-break-after: always; }
  .page:last-child { page-break-after: auto; }
  table { width: 100%; border-collapse: collapse; table-layout: fixed; margin-bottom: 9mm; }
  th, td { border: 1px solid #555; height: 37px; text-align: center; font-size: 10pt; }
  th { background: #e9edf5; font-weight: bold; height: 22px; }
  tr.cj td { background: #f3f3f3; height: 22px; }
  tr.z td { background: #fafafa; }
  td.lab { font-weight: bold; font-size: 9pt; }
  col.ci { width: 7%; } col.base { width: 8.5%; } col.a { width: 7.5%; } col.x { width: 11%; } col.th { width: 11%; }
</style>
</head>
<body>
<div id="hojas"></div>
<script>
function tabla() {
  const A = Array.from({length: 7}, (_, j) => `<th>A<sub>${j + 1}</sub></th>`).join('');
  const vac = c => '<td></td>'.repeat(c);
  const fila = `<tr><td></td><td></td>${vac(7)}<td></td><td></td></tr>`;
  return `<table>
    <colgroup><col class="ci"><col class="base">${'<col class="a">'.repeat(7)}<col class="x"><col class="th"></colgroup>
    <tr><th>cᵢ</th><th>Base</th>${A}<th>X</th><th>θ</th></tr>
    <tr class="cj"><td></td><td class="lab">cⱼ</td>${vac(7)}<td></td><td></td></tr>
    ${fila.repeat(3)}
    <tr class="z"><td></td><td class="lab">zⱼ</td>${vac(7)}<td></td><td></td></tr>
    <tr class="z"><td></td><td class="lab">cⱼ − zⱼ</td>${vac(7)}<td></td><td></td></tr>
  </table>`;
}
const PAGINAS = 2, POR_PAGINA = 4;
let html = '';
for (let p = 0; p < PAGINAS; p++) html += `<section class="page">${tabla().repeat(POR_PAGINA)}</section>`;
document.getElementById('hojas').innerHTML = html;
</script>
</body>
</html>
