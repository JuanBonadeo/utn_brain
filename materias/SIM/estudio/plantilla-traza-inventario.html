<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>SIM — Plantilla de traza del inventario</title>
<style>
  @page { size: A4 landscape; margin: 8mm 9mm; }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: Arial, Helvetica, sans-serif; font-size: 9pt; color: #111; }
  .head { display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 2.5mm; gap: 6mm; }
  h1 { font-size: 13pt; margin: 0; white-space: nowrap; }
  .datos { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 1.5mm 4.5mm; font-size: 9.5pt; }
  .datos span { white-space: nowrap; }
  .blank { display: inline-block; border-bottom: .8px solid #111; width: 11mm; height: 4mm; vertical-align: bottom; }
  table { border-collapse: collapse; width: 100%; table-layout: fixed; }
  th, td { border: .8px solid #333; text-align: center; }
  thead th { background: #e4e4e4; font-size: 8.6pt; padding: 1mm .5mm; }
  thead tr.grp th { background: #cfcfcf; font-size: 9pt; letter-spacing: .04em; text-transform: uppercase; }
  tbody td { height: 9.6mm; }
  tbody td.ev { text-align: left; padding-left: 1.5mm; color: #777; font-size: 8pt; }
  .thick-l { border-left: 1.8px solid #111 !important; }
</style>
</head>
<body>

<div class="head">
  <h1>Traza del inventario (s, S)</h1>
  <div class="datos">
    <span>s: <span class="blank"></span></span>
    <span>S: <span class="blank"></span></span>
    <span>I(0): <span class="blank"></span></span>
    <span>K: <span class="blank"></span></span>
    <span>i: <span class="blank"></span></span>
    <span>h: <span class="blank"></span></span>
    <span>π: <span class="blank"></span></span>
    <span>n (meses): <span class="blank"></span></span>
  </div>
</div>

<table>
  <colgroup>
    <col style="width:10%"><col style="width:6.5%">
    <col style="width:6.5%"><col style="width:8.5%">
    <col style="width:9%"><col style="width:9%"><col style="width:9%"><col style="width:6%">
    <col style="width:11.5%"><col style="width:11.5%"><col style="width:12.5%">
  </colgroup>
  <thead>
    <tr class="grp">
      <th colspan="2"></th>
      <th colspan="2" class="thick-l">Estado</th>
      <th colspan="4" class="thick-l">Lista de eventos</th>
      <th colspan="3" class="thick-l">Contadores</th>
    </tr>
    <tr>
      <th>Evento</th><th>Reloj</th>
      <th class="thick-l">I</th><th>Pedido en camino</th>
      <th class="thick-l">Próx. demanda</th><th>Llegada pedido</th><th>Próx. evaluación</th><th>Fin</th>
      <th class="thick-l">Área I⁺</th><th>Área I⁻</th><th>Costo de pedidos</th>
    </tr>
  </thead>
  <tbody>
    <tr><td class="ev">Inicio</td><td></td><td class="thick-l"></td><td></td><td class="thick-l"></td><td></td><td></td><td></td><td class="thick-l"></td><td></td><td></td></tr>
    <tr><td class="ev"></td><td></td><td class="thick-l"></td><td></td><td class="thick-l"></td><td></td><td></td><td></td><td class="thick-l"></td><td></td><td></td></tr>
    <tr><td class="ev"></td><td></td><td class="thick-l"></td><td></td><td class="thick-l"></td><td></td><td></td><td></td><td class="thick-l"></td><td></td><td></td></tr>
    <tr><td class="ev"></td><td></td><td class="thick-l"></td><td></td><td class="thick-l"></td><td></td><td></td><td></td><td class="thick-l"></td><td></td><td></td></tr>
    <tr><td class="ev"></td><td></td><td class="thick-l"></td><td></td><td class="thick-l"></td><td></td><td></td><td></td><td class="thick-l"></td><td></td><td></td></tr>
    <tr><td class="ev"></td><td></td><td class="thick-l"></td><td></td><td class="thick-l"></td><td></td><td></td><td></td><td class="thick-l"></td><td></td><td></td></tr>
    <tr><td class="ev"></td><td></td><td class="thick-l"></td><td></td><td class="thick-l"></td><td></td><td></td><td></td><td class="thick-l"></td><td></td><td></td></tr>
    <tr><td class="ev"></td><td></td><td class="thick-l"></td><td></td><td class="thick-l"></td><td></td><td></td><td></td><td class="thick-l"></td><td></td><td></td></tr>
    <tr><td class="ev"></td><td></td><td class="thick-l"></td><td></td><td class="thick-l"></td><td></td><td></td><td></td><td class="thick-l"></td><td></td><td></td></tr>
    <tr><td class="ev"></td><td></td><td class="thick-l"></td><td></td><td class="thick-l"></td><td></td><td></td><td></td><td class="thick-l"></td><td></td><td></td></tr>
    <tr><td class="ev"></td><td></td><td class="thick-l"></td><td></td><td class="thick-l"></td><td></td><td></td><td></td><td class="thick-l"></td><td></td><td></td></tr>
    <tr><td class="ev"></td><td></td><td class="thick-l"></td><td></td><td class="thick-l"></td><td></td><td></td><td></td><td class="thick-l"></td><td></td><td></td></tr>
    <tr><td class="ev"></td><td></td><td class="thick-l"></td><td></td><td class="thick-l"></td><td></td><td></td><td></td><td class="thick-l"></td><td></td><td></td></tr>
    <tr><td class="ev"></td><td></td><td class="thick-l"></td><td></td><td class="thick-l"></td><td></td><td></td><td></td><td class="thick-l"></td><td></td><td></td></tr>
    <tr><td class="ev"></td><td></td><td class="thick-l"></td><td></td><td class="thick-l"></td><td></td><td></td><td></td><td class="thick-l"></td><td></td><td></td></tr>
    <tr><td class="ev"></td><td></td><td class="thick-l"></td><td></td><td class="thick-l"></td><td></td><td></td><td></td><td class="thick-l"></td><td></td><td></td></tr>
  </tbody>
</table>

</body>
</html>
