<title>Práctica SIM Parcial 1</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: barra superior fija con el progreso · columna lateral con unidades y modos · tarjeta central de pregunta con su justificación debajo */
:root{
  color-scheme: dark;
  --bg:#1d1f22;        /* gris oscuro de base, levemente frío */
  --panel:#25282c;     /* superficies */
  --panel-2:#2d3035;   /* opciones, inputs */
  --line:#3a3e44;
  --fg:#e7e6e1;
  --muted:#9ea2a8;
  --faint:#6d7279;
  --accent:#e2b35d;    /* ámbar: el reloj de la simulación */
  --accent-ink:#1d1f22;
  --ok:#74c493; --ok-bg:#20332a;
  --bad:#e5806f; --bad-bg:#3a2522;
  --info-bg:#2a2e35;
  --f-display:"Bricolage Grotesque", "Atkinson Hyperlegible", system-ui, sans-serif;
  --f-body:"Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono:"JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --r:10px;
}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--fg);font:16px/1.55 var(--f-body);margin:0}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.topbar-in{max-width:1180px;margin:0 auto;padding:12px 16px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.brand{display:flex;align-items:baseline;gap:10px;min-width:0}
.brand b{font:700 20px/1 var(--f-display);letter-spacing:-.01em}
.brand span{color:var(--muted);font-size:13px}
.stats{display:flex;gap:18px;margin-left:auto;align-items:center;flex-wrap:wrap}
.stat{display:flex;flex-direction:column;align-items:flex-end;line-height:1.1}
.stat .v{font:600 17px var(--f-mono);font-variant-numeric:tabular-nums}
.stat .k{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.progress{height:3px;background:var(--line)}
.progress i{display:block;height:100%;background:var(--accent);width:100%;transform-origin:left;transform:scaleX(0);transition:transform .3s}

.wrap{max-width:1180px;margin:0 auto;padding-inline:16px;padding-block:20px 60px;display:grid;grid-template-columns:270px minmax(0,1fr);gap:24px;align-items:start}
@media (max-width:860px){.wrap{grid-template-columns:minmax(0,1fr)}}

aside{display:flex;flex-direction:column;gap:18px;position:sticky;top:calc(env(safe-area-inset-top,0px) + 76px)}
@media (max-width:860px){aside{position:static;order:2}}
.box{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.box h3{margin:0 0 10px;font:600 11px/1 var(--f-body);text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.units{display:flex;flex-direction:column;gap:4px}
.unit{display:grid;grid-template-columns:28px minmax(0,1fr) auto;align-items:center;gap:8px;padding:7px 8px;border-radius:8px;border:1px solid transparent;background:none;cursor:pointer;text-align:left}
.unit:hover{background:var(--panel-2)}
.unit .n{font:600 12px var(--f-mono);color:var(--muted)}
.unit .t{font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.unit .c{font:12px var(--f-mono);color:var(--faint);font-variant-numeric:tabular-nums}
.unit .bar{grid-column:2 / 4;height:3px;background:var(--line);border-radius:2px;overflow:hidden;display:flex}
.unit .bar .g{background:var(--ok)} .unit .bar .r{background:var(--bad)}
.unit[aria-pressed="false"]{opacity:.42}
.unit[aria-pressed="false"] .t{text-decoration:line-through;text-decoration-color:var(--faint)}
.mini-row{display:flex;gap:6px;margin-top:8px}
.link{background:none;border:0;color:var(--accent);cursor:pointer;padding:2px 0;font-size:13px}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:4px;background:var(--panel-2);padding:4px;border-radius:8px}
.seg button{border:0;background:none;padding:7px 6px;border-radius:6px;cursor:pointer;font-size:13px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--bg);color:var(--fg);box-shadow:0 0 0 1px var(--line)}
.seg.seg-col{grid-template-columns:1fr}
.seg.seg-col button{text-align:left;padding-inline:10px}
.toggles{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.tg{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:14px;cursor:pointer}
.tg input{appearance:none;width:34px;height:20px;border-radius:20px;background:var(--line);position:relative;cursor:pointer;flex:none;transition:background .15s}
.tg input::after{content:"";position:absolute;top:3px;left:3px;width:14px;height:14px;border-radius:50%;background:var(--fg);transition:transform .15s}
.tg input:checked{background:var(--accent)} .tg input:checked::after{transform:translateX(14px);background:var(--accent-ink)}
.filters{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:none;border-radius:999px;padding:4px 10px;font-size:13px;cursor:pointer;color:var(--muted)}
.chip[aria-pressed="true"]{border-color:var(--accent);color:var(--accent)}
.btn{border:1px solid var(--line);background:var(--panel-2);border-radius:8px;padding:9px 14px;cursor:pointer;font-size:14px}
.btn:hover{border-color:var(--faint)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:700}
.btn.primary:hover{filter:brightness(1.07)}
.btn.ghost{background:none}
.btn.danger{color:var(--bad)}
.btn:disabled{opacity:.4;cursor:default}
.full{width:100%}

main{min-width:0;display:flex;flex-direction:column;gap:16px}
.exam-bar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;background:var(--info-bg);border:1px solid var(--line);border-radius:var(--r);padding:10px 14px;font-size:14px}
.exam-bar .clock{font:600 16px var(--f-mono);color:var(--accent);font-variant-numeric:tabular-nums}
.exam-bar .sp{margin-left:auto;display:flex;gap:8px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:22px clamp(16px,3vw,30px) 24px}
.meta{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:13px;color:var(--muted);margin-bottom:12px}
.pill{border:1px solid var(--line);border-radius:999px;padding:2px 9px;font-size:12px;color:var(--fg)}
.pill.u{border-color:color-mix(in srgb,var(--accent) 55%,var(--line));color:var(--accent)}
.pill.gen{color:var(--muted);border-style:dashed}
.meta .num{margin-left:auto;font:13px var(--f-mono);font-variant-numeric:tabular-nums}
.flag{background:none;border:1px solid var(--line);border-radius:999px;padding:2px 9px;font-size:12px;cursor:pointer;color:var(--muted)}
.flag[aria-pressed="true"]{color:var(--accent);border-color:var(--accent)}
.stem{font:500 clamp(18px,2.1vw,21px)/1.45 var(--f-display);margin:0 0 14px;text-wrap:pretty;letter-spacing:-.005em}
.stem b{color:var(--accent);font-weight:700}
pre.data{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:12px 14px;font:13.5px/1.6 var(--f-mono);overflow-x:auto;margin:0 0 16px;color:var(--fg)}
code{font:.9em var(--f-mono);background:var(--panel-2);padding:1px 5px;border-radius:4px}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{display:grid;grid-template-columns:30px minmax(0,1fr);gap:12px;align-items:start;text-align:left;width:100%;padding:12px 14px;border-radius:10px;border:1px solid var(--line);background:var(--panel-2);cursor:pointer;transition:border-color .12s,background .12s}
.opt:hover:not(:disabled){border-color:var(--faint)}
.opt .k{width:28px;height:28px;border-radius:7px;display:grid;place-items:center;font:600 13px var(--f-mono);background:var(--bg);border:1px solid var(--line);color:var(--muted)}
.opt .tx{padding-top:3px;min-width:0}
.opt .why{display:block;margin-top:6px;font-size:14px;color:var(--muted);line-height:1.45}
.opt:disabled{cursor:default}
.opt.sel{border-color:var(--accent)} .opt.sel .k{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.opt.ok{border-color:var(--ok);background:var(--ok-bg)} .opt.ok .k{background:var(--ok);color:var(--accent-ink);border-color:var(--ok)}
.opt.bad{border-color:var(--bad);background:var(--bad-bg)} .opt.bad .k{background:var(--bad);color:var(--accent-ink);border-color:var(--bad)}
.opt.dim{opacity:.72}
.opt.ms .k{border-radius:5px}
.opt.miss{border-color:var(--ok);border-style:dashed;background:none} .opt.miss .k{color:var(--ok);border-color:var(--ok)}
.tag-miss{font-size:12px;color:var(--ok);margin-left:6px}
.confirm-row{display:flex;align-items:center;gap:12px;margin-top:14px;flex-wrap:wrap}
.pill.type{color:var(--muted)}
.verdict{display:flex;align-items:center;gap:10px;margin-top:18px;font:700 15px var(--f-body)}
.verdict.ok{color:var(--ok)} .verdict.bad{color:var(--bad)}
.verdict .dot{width:9px;height:9px;border-radius:50%;background:currentColor}
.explain{margin-top:10px;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:16px 18px}
.explain h4{margin:0 0 6px;font:600 11px/1 var(--f-body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.explain p{margin:0 0 10px;max-width:72ch}
.explain .src{font-size:13px;color:var(--faint);margin:10px 0 0}
.explain b{color:var(--fg)}
.nav{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.nav .sp{flex:1}
.hint{font-size:12px;color:var(--faint)}
.hint kbd{font:11px var(--f-mono);border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:0 5px;color:var(--muted)}
.map{display:grid;grid-template-columns:repeat(auto-fill,minmax(34px,1fr));gap:5px}
.map button{height:30px;border-radius:6px;border:1px solid var(--line);background:var(--panel-2);font:11px var(--f-mono);color:var(--muted);cursor:pointer;padding:0;font-variant-numeric:tabular-nums}
.map button.ok{background:var(--ok-bg);border-color:color-mix(in srgb,var(--ok) 50%,var(--line));color:var(--ok)}
.map button.bad{background:var(--bad-bg);border-color:color-mix(in srgb,var(--bad) 50%,var(--line));color:var(--bad)}
.map button.ans{border-color:var(--accent);color:var(--accent)}
.map button.cur{outline:2px solid var(--fg);outline-offset:1px}
.map button.fl{box-shadow:inset 0 -3px 0 var(--accent)}
details.mapbox summary{cursor:pointer;list-style:none;display:flex;justify-content:space-between;align-items:center;font:600 11px var(--f-body);text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
details.mapbox summary::-webkit-details-marker{display:none}
details.mapbox[open] summary{margin-bottom:12px}
.empty{text-align:center;padding:40px 20px;color:var(--muted)}
.empty h2{font:600 22px var(--f-display);color:var(--fg);margin:0 0 6px}
.result h2{font:700 clamp(26px,4vw,36px)/1.1 var(--f-display);margin:0 0 4px}
.result .big{font:600 clamp(40px,7vw,64px)/1 var(--f-mono);color:var(--accent);font-variant-numeric:tabular-nums}
.result .sub{color:var(--muted);margin:6px 0 18px}
.rtable{width:100%;border-collapse:collapse;font-size:14px;font-variant-numeric:tabular-nums}
.rtable td,.rtable th{padding:7px 8px;border-bottom:1px solid var(--line);text-align:left}
.rtable th{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600}
.rtable td.r{text-align:right;font-family:var(--f-mono)}
.wrong-list{display:flex;flex-direction:column;gap:6px;margin-top:14px}
.wrong-list button{text-align:left;border:1px solid var(--line);background:var(--panel-2);border-radius:8px;padding:9px 12px;cursor:pointer;font-size:14px;display:flex;gap:10px}
.wrong-list .uu{font:12px var(--f-mono);color:var(--bad);flex:none;padding-top:2px}
.tbl-wrap{overflow-x:auto}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
@media (max-width:520px){.stats{gap:12px}.stat .v{font-size:15px}.brand span{display:none}.opt{padding:11px 12px;gap:10px}}
</style>

<header class="topbar">
  <div class="topbar-in">
    <div class="brand"><b>SIM · Parcial 1</b><span>Simulación · UTN-ISI · sábado 7/11</span></div>
    <div class="stats">
      <div class="stat"><span class="v" id="st-ans">0/0</span><span class="k">respondidas</span></div>
      <div class="stat"><span class="v" id="st-pct">—</span><span class="k">aciertos</span></div>
      <div class="stat"><span class="v" id="st-streak">0</span><span class="k">racha</span></div>
    </div>
  </div>
  <div class="progress"><i id="prog"></i></div>
</header>

<div class="wrap">
  <aside>
    <div class="box">
      <h3>Banco</h3>
      <div class="seg seg-col" role="group" aria-label="Banco de preguntas">
        <button id="l-2" aria-pressed="true">Nivel parcial</button>
        <button id="l-1" aria-pressed="false">Base</button>
        <button id="l-3" aria-pressed="false">Extra U8</button>
      </div>
      <p class="hint" id="lvl-hint" style="margin:10px 0 0"></p>
    </div>

    <div class="box">
      <h3>Modo</h3>
      <div class="seg" role="group" aria-label="Modo">
        <button id="m-prac" aria-pressed="true">Práctica</button>
        <button id="m-exam" aria-pressed="false">Simulacro</button>
      </div>
      <div class="toggles" id="prac-opts">
        <label class="tg" for="t-shq">Mezclar preguntas <input type="checkbox" id="t-shq"></label>
        <label class="tg" for="t-sho">Mezclar opciones <input type="checkbox" id="t-sho" checked></label>
      </div>
      <div id="exam-opts" hidden>
        <p class="hint" style="margin:12px 0 10px">15 preguntas repartidas parejo entre las unidades elegidas. Ves las respuestas recién al entregar, como en el parcial 2025.</p>
        <button class="btn primary full" id="exam-start">Empezar simulacro</button>
      </div>
    </div>

    <div class="box">
      <h3>Unidades</h3>
      <div class="units" id="units"></div>
      <div class="mini-row"><button class="link" id="u-all">Todas</button><span class="hint">·</span><button class="link" id="u-none">Ninguna</button></div>
    </div>

    <div class="box" id="filter-box">
      <h3>Mostrar</h3>
      <div class="filters" id="filters">
        <button class="chip" data-f="all" aria-pressed="true">Todas</button>
        <button class="chip" data-f="todo" aria-pressed="false">Sin responder</button>
        <button class="chip" data-f="wrong" aria-pressed="false">Falladas</button>
        <button class="chip" data-f="flag" aria-pressed="false">Marcadas</button>
      </div>
    </div>

    <div class="box">
      <details class="mapbox" id="mapbox" open>
        <summary><span>Mapa de preguntas</span><span class="hint" id="map-count"></span></summary>
        <div class="map" id="map"></div>
      </details>
    </div>

    <button class="btn ghost danger" id="reset">Borrar mi progreso</button>
  </aside>

  <main id="main"></main>
</div>
<script>
const Q1 = [
// ───────── UNIDAD 1 · Qué es simular ─────────
{u:1, q:"Según Law, ¿cuál de estas es la definición de **sistema**?",
 o:["Un conjunto de ecuaciones que describen el comportamiento de un proceso real",
    "Una colección de entidades que actúan e interactúan hacia el logro de algún fin lógico",
    "Un programa que imita la operación de una instalación a lo largo del tiempo",
    "El conjunto de variables necesarias para describir una instalación en un instante",
    "Un conjunto de supuestos lógicos y matemáticos sobre cómo funciona una instalación"],
 a:1,
 why:"Law define el sistema como una **colección de entidades** (personas, máquinas) que **actúan e interactúan** hacia un **fin lógico**. Las cuatro definiciones base (sistema, estado, modelo, simulación) se confunden a propósito en el multiple choice: la única que habla de entidades que interactúan es la de sistema.",
 n:["Eso es un **modelo**: relaciones matemáticas que representan el sistema.","",
    "Eso es una **simulación**: imitar la operación a lo largo del tiempo.",
    "Eso es el **estado del sistema**.",
    "Otra vez **modelo**: un conjunto de supuestos expresados como relaciones."],
 src:"Resumen §1.1 · Law cap. 1"},

{u:1, q:"Dos equipos estudian el mismo supermercado. Uno quiere reducir la espera en cajas y el otro optimizar la reposición desde el centro de distribución. ¿Qué afirmación es correcta?",
 o:["Los dos estudian el mismo sistema, porque el supermercado físico es uno solo",
    "El primero estudia un sistema y el segundo un modelo",
    "El sistema lo define el objetivo del estudio, así que pueden ser sistemas distintos",
    "El sistema lo define la realidad y el modelo lo define el objetivo",
    "Solo el segundo es un sistema, porque incluye más entidades"],
 a:2,
 why:"El sistema **no viene dado por la realidad**: lo recorta el objetivo del estudio. El mismo supermercado puede ser «la línea de cajas» o «la cadena de abastecimiento». Lo mismo pasa con el estado: son las variables necesarias **en relación con los objetivos**.",
 n:["El edificio es uno, pero los sistemas (lo que entra y lo que queda afuera) son distintos.",
    "Los dos estudian un sistema; cada uno después construirá su propio modelo.","",
    "Al revés no: también el sistema depende del objetivo.",
    "Tener más entidades no es lo que hace a algo un sistema."],
 src:"Resumen §1.1"},

{u:1, q:"El **estado del sistema** se define como:",
 o:["Todas las variables que describen al sistema real en un instante",
    "El conjunto de variables necesarias para describir el sistema en un instante, en relación con los objetivos del estudio",
    "El valor de las medidas de rendimiento al final de la corrida",
    "La lista de eventos futuros con sus tiempos",
    "La condición del servidor (libre u ocupado)"],
 a:1,
 why:"La clave está en «**necesarias**» y «**en relación con los objetivos**». No se registran todas las variables posibles, solo las que hacen falta para responder la pregunta del estudio. En la cola simple, por ejemplo: el estado del servidor, el número en cola y los tiempos de arribo de los que esperan.",
 n:["«Todas» es la palabra absoluta que la hace falsa: se eligen según el objetivo.","",
    "Las medidas de rendimiento son la **salida** (variables endógenas), no el estado.",
    "Eso es la lista de eventos (LEV), otro componente del simulador.",
    "Es **una** variable de estado de la cola, no la definición general."],
 src:"Resumen §1.1"},

{u:1, q:"¿Qué afirmación sobre la solución analítica y la simulación es **verdadera**?",
 o:["La simulación reemplaza a la solución analítica cuando hay computadora disponible",
    "Si existe una solución analítica eficiente conviene usarla; ambos enfoques son complementarios",
    "Con suficientes corridas, la simulación da un resultado exacto",
    "La solución analítica es una estimación y la simulación es exacta",
    "La simulación siempre es más barata que resolver analíticamente"],
 a:1,
 why:"La solución analítica es **exacta**; la simulación da **estimaciones**. Si el modelo admite una solución analítica eficiente, se usa esa. No compiten: la simulación puede verificar supuestos de un modelo analítico, y un modelo analítico puede sugerir alternativas que después se simulan.",
 n:["Trampa clásica: la simulación **no la reemplaza**.","",
    "Más corridas mejoran la estimación, pero sigue siendo una estimación.",
    "Está invertida.",
    "«Siempre» la hace falsa. Desarrollar un modelo de simulación cuesta caro y lleva tiempo."],
 src:"Resumen §1.2"},

{u:1, q:"Estimás π tirando 10.000 puntos al azar sobre un cuadrado y contando cuántos caen dentro del círculo inscripto. ¿Cómo se clasifica ese modelo?",
 o:["Dinámico, estocástico y discreto","Estático y determinístico","Estático y estocástico",
    "Dinámico y determinístico","Continuo y determinístico"],
 a:2,
 why:"El tiempo no juega ningún papel (no hay evolución), así que es **estático**: es el típico Montecarlo. Usa variables aleatorias, así que es **estocástico**, y el resultado es una **estimación** que cambia de corrida en corrida.",
 n:["No hay reloj ni evolución temporal: no es dinámico.",
    "Hay azar (los puntos), así que no es determinístico.","",
    "Ni dinámico ni determinístico.",
    "El eje continuo/discreto habla de cómo cambia el estado en el tiempo; acá no hay tiempo, y además hay azar."],
 src:"Resumen §1.3"},

{u:1, q:"Un modelo de simulación **discreto**:",
 o:["Solo puede representar sistemas discretos",
    "Puede usarse para un sistema continuo si sirve a los objetivos del estudio",
    "Es siempre más preciso que uno continuo",
    "No admite variables aleatorias",
    "Requiere avanzar el reloj con incremento fijo"],
 a:1,
 why:"El tipo de modelo **no tiene que coincidir** con el tipo de sistema. Se elige discreto o continuo según los **objetivos** del estudio. Un sistema continuo puede modelarse como discreto si lo que interesa son cambios en instantes puntuales, y al revés.",
 n:["Es la trampa: no hace falta que coincidan.","",
    "Ninguno es siempre más preciso; depende de qué se quiera medir.",
    "Un modelo discreto puede ser estocástico; la cola simple es discreta y estocástica.",
    "Lo habitual en eventos discretos es el próximo evento, no el incremento fijo."],
 src:"Resumen §1.3"},

{u:1, q:"La cola simple de Law y el inventario (s, S) son modelos:",
 o:["Estáticos, estocásticos y discretos","Dinámicos, determinísticos y discretos","Dinámicos, estocásticos y continuos",
    "Dinámicos, estocásticos y discretos","Estáticos, determinísticos y continuos"],
 a:3,
 why:"Los dos **evolucionan en el tiempo** (dinámicos), tienen **variables aleatorias** como los tiempos entre arribos o el tamaño de la demanda (estocásticos), y su estado cambia **en instantes puntuales** que son los eventos (discretos). Los tres ejes son independientes.",
 n:["Hay reloj y evolución temporal, así que no son estáticos.",
    "Tienen tiempos entre arribos y demandas aleatorias.",
    "El estado cambia de golpe en cada evento, no continuamente.","",
    "Fallan los tres ejes."],
 src:"Resumen §1.3"},

{u:1, q:"¿En cuál de estas situaciones **no hace falta** simular?",
 o:["El sistema todavía no existe y se está en etapa de diseño",
    "Experimentar con el sistema real es caro o riesgoso",
    "La complejidad del sistema impide una solución analítica",
    "Se quiere un M/M/1 con ρ = 0,6 y hay fórmulas cerradas disponibles",
    "Se necesita control experimental sobre las condiciones"],
 a:3,
 why:"Si existe **solución analítica disponible** (como el M/M/1 en estado estable), se usa esa: es exacta y más barata. Las otras cuatro son justamente las razones para simular.",
 n:["Es una de las razones típicas para simular.","Otra razón para simular.","La razón principal para simular.","",
    "El control experimental es una ventaja de simular."],
 src:"Resumen §1.4"},

{u:1, q:"¿Cuál es la desventaja de la simulación que Law pone primero?",
 o:["No permite responder preguntas del tipo «¿qué pasaría si...?»",
    "Requiere programación orientada a objetos",
    "Cada corrida de un modelo estocástico produce solo una estimación de las características verdaderas",
    "Da resultados exactos, pero tarda mucho",
    "No sirve para sistemas que todavía no existen"],
 a:2,
 why:"Cada corrida da **una estimación**, no un resultado exacto. Por eso hacen falta **varias corridas** y por eso Law insiste en no sacar conclusiones de una sola. Las otras desventajas: el costo de desarrollo, el riesgo de usarla sin rigor y que requiere experiencia.",
 n:["Responder «¿qué pasaría si...?» es una **ventaja**.",
    "La POO **no** es imprescindible.","",
    "No da resultados exactos.",
    "Sirve justamente para eso: es una ventaja."],
 src:"Resumen §1.4"},

{u:1, q:"¿Cuál de estas cosas **sí es imprescindible** para hacer una simulación?",
 o:["Programación orientada a objetos","Un modelo totalmente testeado antes de usarlo",
    "Información de la realidad, o al menos estimaciones","Una computadora, para cualquier tipo de modelo",
    "Una solución analítica previa para comparar"],
 a:2,
 why:"Sin datos o estimaciones no hay con qué alimentar el modelo. Lo demás **no hace falta**: la POO no es imprescindible, no existe un modelo «totalmente testeado», hay modelos físicos sin computadora y muchas veces se simula justamente porque no hay solución analítica.",
 n:["La POO es una herramienta, no un requisito.",
    "«Totalmente» es la palabra absoluta que delata el distractor.","",
    "Hay modelos físicos (maquetas, simuladores de vuelo).",
    "Muchas veces se simula porque no hay solución analítica."],
 src:"Resumen §1.4"},

{u:1, q:"¿Cuál de estas frases es **falsa**?",
 o:["La programación orientada a objetos no es imprescindible para simular",
    "Un modelo no tiene que estar totalmente testeado para poder usarse",
    "Hay modelos que no se resuelven con computadora",
    "Para simular basta con un buen modelo lógico; no hacen falta datos ni estimaciones de la realidad",
    "La simulación puede usarse para verificar supuestos de un modelo analítico"],
 a:3,
 why:"Sin información de la realidad, o al menos estimaciones, no se puede simular. Ojo con la doble negación de la primera opción: «la POO **no** es imprescindible» es **verdadera**. Es una de las siete reglas que salen de los errores del parcial 2025.",
 n:["Verdadera, con doble negación a propósito.","Verdadera.","Verdadera: los modelos físicos.","",
    "Verdadera: los enfoques son complementarios."],
 src:"Resumen §0 y §1.4", fix:true},

{u:1, q:"¿Cuál de estas cosas **no** está entre los riesgos que, según Law, hacen fracasar un estudio de simulación?",
 o:["Objetivos mal definidos al comienzo",
    "Sacar conclusiones a partir de una sola corrida",
    "Usar distribuciones arbitrarias en lugar de las que muestran los datos",
    "Usar un modelo menos complejo que el sistema real",
    "No definir un período de calentamiento"],
 a:3,
 why:"Un modelo **siempre** es menos complejo que el sistema: es una abstracción, y eso no es un error sino su naturaleza. Los riesgos de Law son: objetivos mal definidos, un nivel de detalle **inadecuado**, tratarlo como «solo programar», malos datos, distribuciones arbitrarias, no definir calentamiento y concluir con una sola corrida.",
 n:["Es un riesgo.","Es un riesgo, y Law lo repite en el inventario.","Es un riesgo.","",
    "Es un riesgo."],
 src:"Resumen §1.1 y §1.4"},

{u:1, q:"Según AnyLogic in 3 Days, ¿qué ventaja tiene un modelo de simulación frente a uno analítico?",
 o:["Siempre da resultados exactos",
    "Refleja naturalmente la estructura del sistema y, una vez elegido el nivel de abstracción, suele ser más fácil de construir",
    "No necesita datos de entrada",
    "Es mejor para optimizar",
    "No requiere validación"],
 a:1,
 why:"AnyLogic in 3 Days agrega esas dos ventajas a la lista de Law: el modelo **se parece al sistema** (entidades, procesos, recursos) y, elegido el nivel de abstracción, suele ser **más fácil de construir** que un modelo analítico.",
 n:["La simulación da estimaciones.","Sigue haciendo falta información de la realidad.","",
    "Para optimizar, Law dice que es mejor un buen modelo **analítico**.",
    "Toda simulación seria se valida."],
 src:"Resumen §1.4 · AnyLogic in 3 Days"},

{u:1, q:"La **simulación** se define como:",
 o:["Un conjunto de supuestos que representan el comportamiento de un sistema",
    "La imitación de la operación de un sistema real a lo largo del tiempo, que genera una historia artificial para inferir sus características",
    "La resolución exacta de un modelo matemático complejo",
    "Un experimento directo sobre el sistema real",
    "Un modelo físico a escala"],
 a:1,
 why:"Hay dos ideas en la definición. Primero, **imitar a lo largo del tiempo** generando una **historia artificial**. Segundo, **inferir** las características del sistema a partir de ella. Técnicamente, evalúa numéricamente un modelo y **estima** las medidas buscadas.",
 n:["Eso es un modelo.","","«Exacta» es lo que no es.","Eso es experimentar con el sistema real, la primera rama del árbol.",
    "Un modelo físico es otra rama del árbol."],
 src:"Resumen §1.1"},

{u:1, q:"En el árbol de formas de estudiar un sistema, ¿qué determina si un modelo matemático se resuelve analíticamente o por simulación?",
 o:["Si el sistema es real o ficticio","Si el modelo es físico o matemático",
    "Si el modelo es lo bastante simple como para resolverse con fórmulas","Si se dispone de AnyLogic",
    "Si el sistema es discreto o continuo"],
 a:2,
 why:"La última bifurcación pregunta si el modelo es simple. Si lo es, se resuelve con fórmulas y el resultado es **exacto**. Si es demasiado complejo, se simula y el resultado es una **estimación**.",
 n:["Esa es la primera bifurcación (sistema real o modelo).","Esa es la segunda bifurcación.","",
    "La herramienta no define el enfoque.",
    "Es un eje de clasificación de los modelos, no la bifurcación del árbol."],
 src:"Resumen §1.2"},

// ───────── UNIDAD 2 · Elementos ─────────
{u:2, q:"En la guardia de un hospital, ¿cuál es la clasificación correcta según los elementos de la cátedra?",
 o:["Pacientes: recursos. Médicos: entidades. Sala de espera: atributo",
    "Pacientes: entidades. Médicos: recursos. Sala de espera: localización",
    "Pacientes: entidades. Médicos: localizaciones. Sala de espera: recurso",
    "Pacientes: atributos. Médicos: recursos. Sala de espera: variable",
    "Pacientes: entidades. Médicos: atributos. Sala de espera: localización"],
 a:1,
 why:"La **entidad** es lo que hace cambiar el estado (el paciente que llega o se va). El **recurso** es el dispositivo que lleva a cabo el evento (el médico que atiende). La **localización** es el lugar donde las entidades se detienen (la sala de espera).",
 n:["Está invertido.","","El médico no es un lugar.","Un atributo es una característica de la entidad, como la gravedad del paciente.",
    "El médico no es una característica del paciente."],
 src:"Resumen §2"},

{u:2, q:"Según la cátedra, las localizaciones son ______ y los recursos son ______.",
 o:["dinámicas / estáticos","estáticas / dinámicos","entidades / atributos","variables / constantes","exógenas / endógenas"],
 a:1,
 why:"Las **localizaciones** son lugares fijos donde las entidades se detienen (la fila, la sala de espera): son **estáticas**. Los **recursos** son dispositivos que llevan a cabo un evento (cajero, máquina, router): son **dinámicos**.",
 n:["Está invertido.","","Mezcla otras categorías.","No es esa la distinción.","Esa es la clasificación de las variables."],
 src:"Resumen §2"},

{u:2, q:"En un banco, «el tipo de trámite que viene a hacer el cliente» es:",
 o:["Una entidad","Un recurso","Un atributo","Una variable de estado","Una medida de rendimiento"],
 a:2,
 why:"Un **atributo** es una característica de una entidad. El cliente es la entidad y el tipo de trámite lo describe.",
 n:["La entidad es el cliente, no su trámite.","El recurso es el cajero.","",
    "El estado sería, por ejemplo, cuántos hay en cola.","Una medida sería el tiempo de espera."],
 src:"Resumen §2"},

{u:2, q:"Una corrida simula 8 horas de atención en 2 segundos de CPU. ¿Qué registra el reloj de la simulación al final?",
 o:["2 segundos","8 horas","Depende de la velocidad de la máquina","8 horas multiplicadas por la cantidad de eventos","Cero, porque se reinicia al terminar"],
 a:1,
 why:"El reloj registra el **tiempo simulado**, que no tiene relación con el tiempo de CPU. Simular 8 horas de banco lleva el reloj a 8 horas, tarde lo que tarde la computadora.",
 n:["Eso es el tiempo de CPU.","","El tiempo simulado no depende del hardware.","No tiene sentido.","No se reinicia."],
 src:"Resumen §2"},

{u:2, q:"En la cola M/M/1, ¿cuáles son las variables **exógenas**?",
 o:["La demora promedio en cola, el número promedio en cola y la utilización",
    "El estado del servidor y el número en cola",
    "Los tiempos entre arribos y los tiempos de servicio",
    "El reloj y la lista de eventos",
    "Los tiempos de arribo de los clientes que esperan"],
 a:2,
 why:"Las **exógenas** son variables aleatorias que **entran** al modelo, y hay que conocer su distribución: tiempo entre arribos y tiempo de servicio. Las tres medidas de rendimiento son **endógenas**, porque **salen** del modelo. El servidor y la cola son variables **de estado**.",
 n:["Son las **endógenas**: las medidas que salen del modelo.","Son variables de **estado**.","",
    "Son componentes del simulador.","También son de estado: se necesitan para calcular la demora."],
 src:"Resumen §2"},

{u:2, q:"Según la clasificación de la práctica, ¿qué tipo de variable es d(n)?",
 o:["Exógena","De estado","Endógena (de respuesta)","Un parámetro","Un atributo"],
 a:2,
 why:"Las **endógenas** o de respuesta son las **medidas de rendimiento** que produce el modelo: d(n), q(n) y u(n).",
 n:["Las exógenas entran al modelo, como el tiempo entre arribos.","El estado describe el sistema en cada instante, y d(n) es un promedio de toda la corrida.","",
    "Un parámetro es un dato fijo, como la media de servicio.","Los atributos son de las entidades."],
 src:"Resumen §2"},

{u:2, q:"En el inventario, el evento «fin de la simulación» en t = n calcula costos y reporta. ¿Qué dice esto de la definición de evento?",
 o:["Que no es un evento, porque no cambia el estado",
    "Que confirma la definición del profe: el evento siempre cambia el estado",
    "Que, según Law, un evento puede no cambiar el estado y servir solo para terminar la simulación o programar decisiones",
    "Que es un evento solo si coincide con una evaluación",
    "Que es una rutina de librería"],
 a:2,
 why:"El profe define el evento como «cambio en el estado», pero Law es más preciso: es una ocurrencia instantánea que **puede** cambiar el estado, y a veces solo sirve para **terminar** la simulación o para **programar decisiones**. Si una opción dice que el evento «**siempre** cambia el estado», desconfiá.",
 n:["Para Law sí es un evento.","Justo lo contrario: muestra que la definición del profe se queda corta.","",
    "No depende de eso.","Las rutinas de librería generan variables aleatorias."],
 src:"Resumen §2 (Ojo) · Law §1.3"},

{u:2, q:"En el ejemplo de la red de computadoras de la clase 1, ¿cuál es la medida de rendimiento?",
 o:["Los paquetes","Los routers","La llegada de paquetes","La latencia o el throughput","El tipo de paquete"],
 a:3,
 why:"La tabla de la clase 1 da, para la red: entidades = paquetes, recursos = routers, variable = llegada de paquetes, y medida = **latencia o throughput**.",
 n:["Son las entidades.","Son los recursos.","Es la variable de entrada.","","Sería un atributo."],
 src:"Resumen §2 · clase 1"},

{u:2, q:"¿Cómo define la cátedra al **sistema**, a diferencia de Law?",
 o:["Como un conjunto de elementos, que define el alcance",
    "Como un programa de computadora",
    "Como una condición en un momento determinado",
    "Como el responsable de que cambie el estado",
    "Como un conjunto de supuestos matemáticos"],
 a:0,
 why:"En la tabla de elementos el profe lo define como «conjunto de elementos» que **define el alcance**. Es compatible con Law: lo que entra en el sistema depende del objetivo.",
 n:["","No.","Eso es el estado del sistema.","Eso es la entidad.","Eso es un modelo."],
 src:"Resumen §2"},

{u:2, q:"En una fábrica modelada con simulación, ¿qué opción tiene **un error** de clasificación?",
 o:["Productos: entidades","Máquinas: recursos","Tiempos de proceso: variables",
    "Productividad: medida de rendimiento","Cantidad de productos en espera: atributo"],
 a:4,
 why:"La cantidad de productos esperando describe al **sistema** en un instante: es una **variable de estado**. Un atributo describe a **una entidad** (por ejemplo, el tipo de producto). Las otras cuatro coinciden con la tabla de la clase 1.",
 n:["Correcto según la tabla.","Correcto.","Correcto.","Correcto.",""],
 src:"Resumen §2"},

// ───────── UNIDAD 3 · DES ─────────
{u:3, q:"¿Cuál es la **ventaja principal** del avance del reloj por próximo evento frente al incremento fijo?",
 o:["Es más fácil de programar","Es más preciso en los cálculos aritméticos",
    "Saltea los períodos de inactividad, porque el reloj salta directo al próximo evento",
    "Permite procesar varios eventos a la vez sin desempatar","Avanza en pasos Δt más chicos"],
 a:2,
 why:"Como entre dos eventos el estado no cambia, no tiene sentido recorrer ese intervalo: el reloj **salta** al próximo evento. Así se ahorra el cómputo de los períodos sin actividad. Es lo que usa casi todo el software comercial.",
 n:["No es la ventaja que da Law.","Tampoco: la ventaja es computacional, no aritmética.","",
    "Los empates existen igual y se resuelven con prioridades.",
    "No avanza en Δt: salta."],
 src:"Resumen §3.1"},

{u:3, q:"¿Cuándo tiene sentido usar el avance por **incremento fijo**?",
 o:["Cuando hay muchos períodos de inactividad","Cuando los datos existen solo por período, por ejemplo anuales",
    "Cuando se necesita máxima precisión en el instante de cada evento","Cuando el modelo es estático","Nunca: está prohibido en simulación discreta"],
 a:1,
 why:"El incremento fijo tiene sentido cuando el sistema se observa **por período** (por ejemplo, datos económicos anuales). Su costo es procesar los eventos **al final** del intervalo, lo que introduce error y obliga a desempatar.",
 n:["Justamente ahí es peor: recorre la inactividad.","","Introduce error de discretización.",
    "Un modelo estático no tiene reloj.","«Nunca» es falso."],
 src:"Resumen §3.1"},

{u:3, q:"Con incremento fijo Δt = 1, dos eventos ocurren en t = 3,2 y t = 3,7. ¿Qué pasa?",
 o:["Se procesan en sus instantes exactos","Se procesan los dos en t = 4, al final del intervalo, y hay que decidir en qué orden",
    "Se descarta el segundo","Se procesan en t = 3","El reloj salta a 3,2"],
 a:1,
 why:"Con incremento fijo, los eventos que caen dentro de un intervalo se consideran ocurridos **al final** del intervalo. Por eso hay **error** (se corren a t = 4) y hace falta una **regla de desempate**.",
 n:["Eso haría el próximo evento.","","No se pierde ningún evento.","Se procesan al final, no al inicio.","Eso es el próximo evento."],
 src:"Resumen §3.1"},

{u:3, q:"¿Qué caracteriza a una simulación a eventos discretos?",
 o:["El tiempo avanza siempre en pasos iguales",
    "Las variables de estado cambian solo en un número contable de instantes, en cada uno de los cuales ocurre un evento",
    "No usa variables aleatorias","Las variables cambian continuamente","Solo puede modelar sistemas discretos"],
 a:1,
 why:"En una DES el estado cambia en **instantes puntuales y contables** (los eventos) y entre dos eventos permanece **constante**. Por eso el reloj puede saltar.",
 n:["Eso es el incremento fijo, que es solo una forma de avanzar.","","Puede ser estocástica.","Eso es un modelo continuo.","El modelo discreto puede representar un sistema continuo."],
 src:"Resumen §3"},

{u:3, q:"¿Qué componente del simulador **determina el próximo evento y avanza el reloj** hasta ese instante?",
 o:["La rutina de inicialización","La rutina de temporización","La rutina de evento","Las rutinas de librería","El generador de reportes"],
 a:1,
 why:"La **rutina de temporización** mira la lista de eventos, elige el más próximo y salta el reloj. Después el programa principal invoca la **rutina del evento** correspondiente.",
 n:["Arranca todo en t = 0.","","Procesa un tipo de evento ya elegido.","Generan variables aleatorias.","Calcula y muestra las medidas al final."],
 src:"Resumen §3.2 · Law fig. 1.2"},

{u:3, q:"¿Para qué sirven las **rutinas de librería**?",
 o:["Para elegir el próximo evento","Para generar las observaciones de las variables aleatorias","Para guardar el historial de eventos",
    "Para calcular las medidas al final","Para inicializar los contadores"],
 a:1,
 why:"Las rutinas de librería **generan variables aleatorias** a partir de sus distribuciones: tiempos entre arribos, tiempos de servicio, tamaños de demanda. Es la §9 del resumen (transformada inversa).",
 n:["Eso hace la temporización.","","El simulador no guarda un historial obligatorio.","Eso hace el generador de reportes.","Eso hace la inicialización."],
 src:"Resumen §3.2"},

{u:3, q:"¿Qué contiene la **lista de eventos** (LEV)?",
 o:["El historial de todos los eventos ocurridos","El próximo instante en que ocurrirá cada tipo de evento",
    "Las medidas de rendimiento parciales","Los números aleatorios ya generados","Los tiempos de arribo de los clientes en cola"],
 a:1,
 why:"La LEV guarda **el próximo instante de cada tipo de evento**. En la cola simple: próximo arribo (A) y próxima partida (D). Con el servidor libre, D vale ∞.",
 n:["No es un historial: mira hacia adelante.","","Eso son los contadores estadísticos.","Eso son los números generados.",
    "Eso es el vector de tiempos de arribo, que es parte del **estado**."],
 src:"Resumen §3.2 y §4.5"},

{u:3, q:"¿Por qué en una DES el reloj puede saltar de un evento al siguiente sin perder información?",
 o:["Porque los eventos están equiespaciados","Porque entre dos eventos consecutivos el estado del sistema no cambia",
    "Porque se usa incremento fijo","Porque las medidas se calculan solo al final","Porque el tiempo de CPU es despreciable"],
 a:1,
 why:"Como el estado es **constante entre eventos**, no hay nada que observar en el medio. Por eso alcanza con acumular las áreas con el valor que tenía la variable durante el intervalo, multiplicado por su largo.",
 n:["En general no lo están: son aleatorios.","","El incremento fijo es lo opuesto.","Las áreas se acumulan evento a evento.","No tiene relación."],
 src:"Resumen §3"},

{u:3, q:"¿Qué componente **coordina el ciclo**, llama a la temporización y a las rutinas de evento, y revisa si hay que terminar?",
 o:["La rutina de inicialización","El programa principal","El generador de reportes","Los contadores estadísticos","La lista de eventos"],
 a:1,
 why:"El **programa principal** coordina el ciclo: llama a la temporización, invoca la rutina de evento, y al final de cada vuelta revisa la condición de fin. Si se cumple, llama al generador de reportes.",
 n:["Solo actúa en t = 0.","","Solo actúa al final.","Son datos, no rutinas.","Es una estructura de datos."],
 src:"Resumen §3.2"},

// ───────── UNIDAD 4 · Cola simple ─────────
{u:4, q:"¿Cuáles son los **eventos** del modelo de cola con un servidor de Law?",
 o:["Arribo, inicio de servicio y partida","Arribo y partida","Arribo, partida y servidor ocupado",
    "Arribo, partida e inicio de la simulación","Solo el arribo; la partida es un cambio de estado"],
 a:1,
 why:"Hay **solo dos eventos**: arribo y partida. El inicio de servicio no es un evento aparte: ocurre **dentro** del arribo (si el servidor estaba libre) o **dentro** de la partida (si había cola). «Servidor ocupado» es un **cambio de estado** y «inicio» es la rutina de inicialización.",
 n:["El inicio de servicio ocurre dentro de los otros dos eventos.","",
    "Es un estado, no un evento: trampa del 2025.","Es la rutina de inicialización.","La partida es un evento."],
 src:"Resumen §4.1"},

{u:4, q:"Llega un cliente y encuentra el servidor **libre**. ¿Qué programa la rutina de arribo?",
 o:["Solo el próximo arribo","Solo la partida de este cliente","El próximo arribo y la partida de este cliente",
    "La partida del próximo cliente en cola","Nada: espera a la temporización"],
 a:2,
 why:"El arribo **siempre** programa el próximo arribo. Además, si el servidor estaba libre, el cliente entra directo a servicio con demora 0, y hay que programar **su** partida en reloj + S. Si el servidor estaba ocupado, solo se programa el próximo arribo y el cliente va a la cola.",
 n:["Eso pasa si el servidor está **ocupado**.","Falta el próximo arribo, que se programa siempre.","",
    "No hay cola si el servidor estaba libre.","La rutina de evento sí programa."],
 src:"Resumen §4.1"},

{u:4, q:"En una **partida**, la cola tiene 2 clientes. ¿Qué hace la rutina?",
 o:["Pone el servidor libre y D = ∞","Programa el próximo arribo",
    "Saca al primero de la cola, calcula su demora, lo pasa a servicio y programa su partida",
    "Programa la partida de los dos que están en cola","Saca al último que llegó (LIFO)"],
 a:2,
 why:"Con cola no vacía, la partida pasa al **primero** (FIFO) a servicio. Calcula su demora como reloj − su tiempo de arribo, suma 1 al contador de demoras y programa su partida en reloj + S. El servidor **sigue ocupado**. El próximo arribo no se toca: ya estaba programado.",
 n:["Eso pasa si la cola está **vacía**.","El arribo lo programa la rutina de arribo.","",
    "Solo hay un servidor: se programa una partida por vez.","La disciplina es FIFO."],
 src:"Resumen §4.1"},

{u:4, q:"¿Por qué el estado de la cola simple incluye los **tiempos de arribo** de los clientes que esperan?",
 o:["Para calcular la utilización","Para programar el próximo arribo",
    "Para calcular la demora de cada cliente cuando empieza su servicio","Para ordenar la lista de eventos","No hace falta: es opcional"],
 a:2,
 why:"La demora de un cliente es **instante de inicio del servicio − instante de arribo**. Cuando el cliente pasa a servicio (en una partida), se necesita saber cuándo llegó. Por eso se guarda el vector de tiempos de arribo de los que esperan.",
 n:["La utilización sale del área bajo B(t).","El próximo arribo se genera con A, no con los arribos pasados.","",
    "La LEV no depende de eso.","Sin ese dato no se puede calcular d(n)."],
 src:"Resumen §4.1"},

{u:4, q:"¿Qué par de afirmaciones sobre los **divisores** de las medidas es correcto?",
 o:["d(n) se divide por T(n); q(n) se divide por n",
    "d(n) se divide por n; q(n) y u(n) se dividen por T(n)",
    "Las tres se dividen por n","Las tres se dividen por T(n)",
    "d(n) y q(n) se dividen por n; u(n) por T(n)"],
 a:1,
 why:"d(n) es un promedio **sobre clientes**: suma de demoras / n. q(n) y u(n) son promedios **sobre el tiempo**: área bajo Q(t) o B(t) dividida por la duración de la corrida T(n).",
 n:["Está invertido.","","q y u son promedios en el tiempo.","d es un promedio por cliente.","q(n) es un promedio en el tiempo."],
 src:"Resumen §4.2"},

{u:4, q:"¿Qué es **T(n)** en el modelo de Law?",
 o:["Un parámetro que fija el modelador antes de correr","El instante en que sale el cliente n",
    "El instante en que se completa la n-ésima demora, o sea, cuando el cliente n empieza su servicio","El tiempo total de servicio","La suma de los tiempos entre arribos"],
 a:2,
 why:"La corrida termina cuando **n clientes completaron su demora en cola**. Eso ocurre cuando el cliente n **empieza** su servicio. T(n) es **aleatorio**: depende de los A y S generados. En la traza de Law, T(6) = 8,6.",
 n:["Lo fijo es n, no T(n).","Trampa: termina cuando el cliente n **empieza** a ser atendido, no cuando sale.","",
    "No.","Coincidiría solo por casualidad."],
 src:"Resumen §4.3"},

{u:4, q:"Las demoras de 4 clientes fueron 0; 0; 2 y 4 minutos. ¿Cuánto vale d(4)?",
 o:["3,0","1,5","6,0","0,75","2,0"],
 a:1,
 why:"d(4) = (0 + 0 + 2 + 4) / 4 = 6/4 = **1,5**. Las demoras **iguales a cero también se promedian**: son clientes que no esperaron, pero completaron su demora.",
 n:["Es lo que da si excluís los ceros (6/2): error típico.","","Es la demora total, sin dividir.","No.","No."],
 src:"Resumen §4.2"},

{u:4, q:"¿Qué mide u(n)?",
 o:["La proporción de clientes que no esperaron","La proporción del tiempo en que el servidor estuvo ocupado",
    "El número promedio de clientes en el sistema","El tiempo medio de servicio","λ/μ, calculado con las medias de entrada"],
 a:1,
 why:"u(n) es el **área bajo B(t)** dividida por T(n), donde B(t) vale 1 si el servidor está ocupado y 0 si está libre. Es la **proporción del tiempo** en que el servidor trabajó.",
 n:["No se mide por clientes.","","Esa sería otra medida, L.","Es un dato de entrada.","Esa es la ρ teórica; u(n) es la estimación de la corrida."],
 src:"Resumen §4.2"},

{u:4, q:"¿Cuál de estas magnitudes **no es una medida de rendimiento**, sino un **dato de entrada** del modelo?",
 o:["La demora promedio en cola","El número promedio de clientes en cola","La utilización del servidor",
    "El tiempo promedio de servicio","El número promedio de clientes en el sistema"],
 a:3,
 why:"El tiempo de servicio (su distribución y su media) **entra** al modelo: es exógeno. Fue una trampa del parcial 2025. Ojo: el número en el **sistema** sí es una medida de rendimiento, aunque no sea una de las tres de Law.",
 n:["Es medida (d).","Es medida (q).","Es medida (u).","","Es medida, aunque no una de las tres de Law."],
 src:"Resumen §0 regla 4 y §4.2"},

{u:4, q:"Con los datos de la traza de Law, ¿cuántos clientes hay **en cola** en t = 7,5?",
 pre:TRAZA_LAW,
 o:["1","2","3","4","0"],
 a:2,
 why:"Para t = 7,5 llegaron 8 clientes (el último en 7,2). El servidor atiende al cliente 5, que empezó en 4,9 y sale en 8,6; los clientes 1 a 4 ya salieron. En cola esperan **el 6, el 7 y el 8**: Q(7,5) = 3.\n\nCronología: C1 0,4–2,4; C2 2,4–3,1; C3 3,1–3,3; C4 3,8–4,9; C5 4,9–8,6.",
 n:["No.","Te olvidaste del cliente que llegó en 7,2.","","Contaste al que está en servicio: ese no está en cola.","No."],
 src:"Resumen §4.3 · traza de Law"},

{u:4, q:"En la traza de Law, ¿cuál es la **demora del cliente 5**?",
 pre:TRAZA_LAW,
 o:["0","0,9","3,7","1,1","3,0"],
 a:1,
 why:"El cliente 5 llega en 4,0. El servidor está ocupado con el cliente 4, que empezó en 3,8 con S₄ = 1,1 y sale en 4,9. Entonces el 5 empieza en 4,9 y su demora es 4,9 − 4,0 = **0,9**.",
 n:["El servidor estaba ocupado.","","3,7 es su tiempo de servicio.","1,1 es el servicio del cliente 4.","3,0 es la demora del cliente 6."],
 src:"Resumen §4.3"},

{u:4, q:"En la traza de Law, se procesa la **partida de t = 2,4** (sale el cliente 1). ¿Cómo queda el cuadro **después** del evento?",
 pre:TRAZA_LAW,
 o:["B = 1, Q = 1; LEV: A = 3,8 y D = 3,1; demoras = 2, demora total = 0,8; área Q = 1,1; área B = 2,0",
    "B = 1, Q = 2; LEV: A = 3,8 y D = 3,1; demoras = 1, demora total = 0; área Q = 1,1; área B = 2,0",
    "B = 0, Q = 0; LEV: A = 3,8 y D = ∞; demoras = 2, demora total = 0,8; área Q = 0,5; área B = 2,4",
    "B = 1, Q = 1; LEV: A = 3,8 y D = 3,1; demoras = 2, demora total = 0,8; área Q = 1,6; área B = 2,4",
    "B = 1, Q = 1; LEV: A = 2,1 y D = 3,1; demoras = 2, demora total = 0,8; área Q = 1,1; área B = 2,0"],
 a:0,
 why:"Antes del evento: Q = 2 (los clientes 2 y 3) y B = 1.\n1) **Áreas con el valor viejo**. Área Q: 1 entre 1,6 y 2,1 (0,5) más 2 entre 2,1 y 2,4 (0,6), da **1,1**. Área B: ocupado de 0,4 a 2,4, da **2,0**.\n2) **Estado**. El cliente 2 pasa a servicio: su demora es 2,4 − 1,6 = 0,8. Queda Q = 1 (el 3), demoras = 2 (el 1 con 0 y el 2 con 0,8), total 0,8.\n3) **LEV**. D = 2,4 + S₂ = 2,4 + 0,7 = 3,1. A = 3,8 no se toca.",
 n:["","Q bajó a 1 y la demora del cliente 2 ya se contó.","Había cola: el servidor no queda libre.",
    "Las áreas se acumularon mal: se suma el área de Q, no el reloj.","El arribo de 2,1 ya ocurrió; el próximo es 3,8."],
 src:"Resumen §4.5 · plantilla de clase"},

{u:4, q:"En la traza de Law, el área bajo Q(t) es 9,9, pero la demora total es 5,7. ¿Por qué no coinciden?",
 pre:TRAZA_LAW,
 o:["Porque el área incluye los tiempos de servicio",
    "Porque en T(6) = 8,6 todavía esperan los clientes 7 y 8, cuya espera está en el área pero no en las demoras completadas",
    "Por error de redondeo","Porque el área se divide por T(n) y la demora por n","Porque el área se acumula con el valor nuevo"],
 a:1,
 why:"El área bajo Q(t) suma **toda** la espera ocurrida hasta 8,6, incluida la de quienes todavía están en cola. El cliente 7 (llegó en 5,8) lleva 2,8 y el 8 (llegó en 7,2) lleva 1,4. Entonces 5,7 + 2,8 + 1,4 = **9,9**. Si al final la cola estuviera vacía, las dos cantidades coincidirían.",
 n:["Q(t) cuenta solo a los que están en cola.","","La diferencia es exacta: 4,2.","Eso es lo que se hace después; las cantidades ya difieren antes de dividir.","Se acumula con el valor viejo, y eso no explica la diferencia."],
 src:"Razonamiento sobre la traza de Law (§4.3)", gen:true},

{u:4, q:"En la traza de Law, el servidor estuvo ocupado 7,7 de los 8,6 minutos. ¿En qué intervalos estuvo **libre**?",
 pre:TRAZA_LAW,
 o:["De 0 a 0,4 y de 3,3 a 3,8","De 0 a 0,4 solamente","De 3,1 a 3,8","De 4,9 a 5,6","De 0 a 0,4 y de 7,2 a 8,6"],
 a:0,
 why:"Antes del primer arribo (0 a 0,4) no hay nadie. El cliente 3 sale en 3,3 sin cola, y el 4 recién llega en 3,8. En total está libre 0,4 + 0,5 = 0,9, así que u(6) = 7,7/8,6 ≈ **0,90**.",
 n:["","Falta el hueco entre 3,3 y 3,8.","En 3,1 empieza el cliente 3: está ocupado hasta 3,3.","Ahí atiende al cliente 5.","Ahí atiende al cliente 5, que sale en 8,6."],
 src:"Resumen §4.3"},

{u:4, q:"Con estos datos, ¿cuánto vale **q(4)**?",
 pre:TRAZA_MINI,
 o:["0,325","≈ 0,31","≈ 0,71","≈ 0,43","0,52"],
 a:1,
 why:"Arribos en 0,5; 1,5; 2,2 y 4,2.\n• C1: 0,5 a 2,0.\n• C2: llega en 1,5 y espera hasta 2,0 (D = 0,5); servicio hasta 3,0.\n• C3: llega en 2,2 y espera hasta 3,0 (D = 0,8); servicio hasta 3,5.\n• C4: llega en 4,2 con el servidor libre (D = 0). Ahí se completa la 4.ª demora: **T(4) = 4,2**.\nÁrea Q = 0,5 + 0,8 = 1,3, así que q(4) = 1,3/4,2 ≈ **0,31**.",
 n:["Es d(4) = 1,3/4: dividiste por n en vez de por T(n).","","Es u(4) = 3,0/4,2.","Dividiste por 3: T(4) no es la última partida.","No."],
 src:"Ejercicio armado con el método de §4.5", gen:true},

{u:4, q:"Con los mismos datos, ¿cuántos A y cuántos S se generaron hasta T(4)?",
 pre:TRAZA_MINI,
 o:["4 A y 4 S","5 A y 4 S","4 A y 3 S","5 A y 3 S","3 A y 4 S"],
 a:1,
 why:"**A**: la inicialización programa el primer arribo (A₁), y **cada** arribo programa el siguiente. Los 4 arribos consumen A₂ a A₅. Total: **5 A**.\n**S**: se genera cada vez que alguien **empieza** el servicio: C1 en su arribo, C2 en la partida de 2,0, C3 en la de 3,0 y C4 en su arribo de 4,2. Total: **4 S**.",
 n:["Te olvidaste de que el arribo de C4 programa el siguiente.","","No.","C4 empieza el servicio en T(4) y se genera su S.","No."],
 src:"Resumen §4.1 y §4.5", gen:true},

{u:4, q:"Al procesar un evento, el área bajo Q(t) se actualiza como `área += (reloj − t_último) × Q`. ¿Con qué valor de Q?",
 o:["El nuevo, después de actualizar el estado","El viejo, el que tuvo Q durante el intervalo","El promedio entre el viejo y el nuevo","El máximo","Da igual"],
 a:1,
 why:"Entre el último evento y el actual, Q fue **constante** e igual al valor anterior al evento. El rectángulo tiene alto Q_viejo. Por eso el orden es: primero las áreas, después el estado.",
 n:["Error típico: cambia el área.","","Q no varió linealmente.","No.","No da igual."],
 src:"Resumen §4.5"},

{u:4, q:"Law simuló 1000 clientes con media entre arribos 1 y media de servicio 0,5, y obtuvo u = 0,460. La utilización teórica es ρ = 0,5. ¿Cómo se explica?",
 o:["Hay un error en el programa","La ρ teórica está mal calculada",
    "u(n) es la estimación de una sola corrida y varía con los números aleatorios","El modelo no es M/M/1","La utilización siempre es menor que ρ"],
 a:2,
 why:"Cada corrida es **una muestra**: con otros números aleatorios saldría otro valor, a veces mayor y a veces menor que 0,5. Es la primera desventaja de la simulación.",
 n:["No hace falta un error para que difiera.","ρ = λ/μ = 1/2 = 0,5 está bien.","","Exponencial en llegadas y servicio con un servidor: sí es M/M/1.","«Siempre» es falso."],
 src:"Resumen §4.4 y §7.4", gen:true},

{u:4, q:"Querés generar un tiempo entre arribos exponencial de **media 2** con U = 0,8 y la fórmula −media · ln U. ¿Qué valor sale?",
 o:["≈ 0,446","1,6","≈ 0,112","≈ 0,223","≈ 3,22"],
 a:0,
 why:"X = −2 · ln(0,8) = −2 · (−0,2231) ≈ **0,446**. Ojo: la fórmula va con la **media**, no con la tasa. Si usaras la tasa 1/2 te daría 0,112.",
 n:["","Multiplicaste 2 · 0,8: no es la transformada.","Usaste la tasa (0,5) en lugar de la media.","Olvidaste multiplicar por la media.","Es −2·ln(1 − U): también es una transformada válida, pero no la fórmula pedida (−media · ln U)."],
 src:"Resumen §4.5 y §9.2"},

{u:4, q:"Con el servidor **libre** y la cola vacía, ¿qué valor tiene la próxima partida en la LEV?",
 o:["0","El reloj actual","∞","El próximo arribo","El último tiempo de servicio"],
 a:2,
 why:"Si nadie está siendo atendido, no hay partida posible. Se pone D = ∞ para que la temporización nunca la elija hasta que llegue alguien.",
 n:["La elegiría ya.","Igual.","","No.","No."],
 src:"Resumen §4.5"},

{u:4, q:"Llega un cliente con el servidor **ocupado**. ¿Qué **no** cambia en el cuadro?",
 o:["El número en cola","El vector de tiempos de arribo","El próximo arribo en la LEV","El contador de demoras completadas","El área bajo Q(t)"],
 a:3,
 why:"El cliente va a la cola: Q sube en 1, se agrega su tiempo de arribo, se programa el próximo arribo y se acumulan las áreas. Pero **su demora todavía no se completó**: se va a contar cuando pase a servicio.",
 n:["Sube en 1.","Se agrega su arribo.","Se programa el siguiente.","","Se acumula antes de actualizar."],
 src:"Resumen §4.1 y §4.5"},

{u:4, q:"¿Cuándo termina la corrida de la cola simple de Law con n = 6?",
 o:["Cuando sale el sexto cliente","Cuando llega el sexto cliente","Cuando el sexto cliente empieza su servicio",
    "Cuando el reloj llega a 6","Cuando la cola queda vacía"],
 a:2,
 why:"La condición es que **6 clientes completen su demora en cola**, y eso pasa cuando el sexto **empieza** a ser atendido. En la traza de Law es en 8,6; el sexto saldría en 9,2.",
 n:["Trampa clásica.","Llegar no completa la demora.","","n cuenta clientes, no tiempo.","No es esa la condición."],
 src:"Resumen §4.3"},

// ───────── UNIDAD 5 · Inventario (s, S) ─────────
{u:5, q:"Política (20, 50). Al revisar a principio de mes, I = 15. ¿Cuánto se pide?",
 o:["20","50","35","5","Nada"],
 a:2,
 why:"Como I = 15 < s = 20, se pide **Z = S − I = 50 − 15 = 35**: lo que falta para llegar a S. No se piden «s unidades» ni «S unidades».",
 n:["Se pide hasta S, no s.","S es el nivel objetivo, no la cantidad.","","Es s − I.","I < s, así que sí se pide."],
 src:"Resumen §5.1"},

{u:5, q:"Política (20, 50). Al revisar, I = 20 exacto. ¿Qué pasa?",
 o:["Se piden 30","Se piden 20","No se pide nada","Se piden 50","Se paga K pero Z = 0"],
 a:2,
 why:"La regla es pedir **si I < s** (estrictamente menor). Con I = 20 = s no se cumple, así que Z = 0 y **no se paga nada**, ni siquiera K.",
 n:["Pasaría si la regla fuera I ≤ s.","No.","","No.","Si no se pide, no se paga K."],
 src:"Resumen §5.1"},

{u:5, q:"Política (20, 50). Al revisar, I = −5 (hay backlog de 5). ¿Cuánto se pide?",
 o:["50","45","55","25","Nada, primero hay que cubrir el backlog"],
 a:2,
 why:"Z = S − I = 50 − (−5) = **55**. Al llegar el pedido, 5 unidades cubren el backlog y quedan 50 en depósito.",
 n:["No llegaría a S después de cubrir el backlog.","Restaste mal el signo.","","No.","El pedido es lo que cubre el backlog."],
 src:"Resumen §5.1 y §5.2"},

{u:5, q:"¿Qué afirmación sobre la política (s, S) es **verdadera**?",
 o:["Garantiza que el inventario quede siempre entre s y S","El inventario nunca puede ser negativo",
    "Entre dos revisiones el inventario puede caer por debajo de s e incluso volverse negativo","Siempre se piden S unidades","Se revisa cada vez que ocurre una demanda"],
 a:2,
 why:"La revisión es **periódica** (a principio de mes). Entre revisiones las demandas siguen bajando I sin control, y además el pedido tarda L en llegar. Puede caer por debajo de s y quedar negativo (backlog).",
 n:["Es la trampa número 9 de la lista.","Hay backlog.","","Se pide Z = S − I.","Es revisión periódica, no continua."],
 src:"Resumen §5.1 (Ojo)"},

{u:5, q:"K = 32, i = 3. Se piden Z = 35 unidades. ¿Cuál es el costo del pedido?",
 o:["137","105","1123","201","32"],
 a:0,
 why:"Costo del pedido = **K + i·Z** = 32 + 3·35 = 32 + 105 = **137**. K es el costo fijo de preparación (se paga una vez por pedido) e i el costo por unidad.",
 n:["","Olvidaste K.","Multiplicaste K·Z + i: K es fijo.","Sumaste 32 + 35 y multiplicaste por 3.","Olvidaste el costo por unidad."],
 src:"Resumen §5.3"},

{u:5, q:"En 3 meses: el mes 1 se pidieron 30 unidades, el mes 2 nada y el mes 3 se pidieron 20. Con K = 32 e i = 3, ¿cuál es el **costo de pedido promedio mensual**?",
 o:["≈ 71,33","82","214","≈ 107","50"],
 a:0,
 why:"Mes 1: 32 + 90 = 122. Mes 2: **0** (no se pide, no se paga K). Mes 3: 32 + 60 = 92. Total 214, dividido por **3 meses** ≈ **71,33**.",
 n:["","Pagaste K también en el mes 2 (246/3).","Falta dividir por los meses.","Dividiste por 2 pedidos: se divide por meses.","No."],
 src:"Resumen §5.3"},

{u:5, q:"En un mes, I(t) = 10 entre 0 y 0,4; −5 entre 0,4 y 0,7; y 15 entre 0,7 y 1. Con h = 1 y π = 5, ¿cuánto suman los costos de **mantenimiento y faltante** del mes?",
 o:["10","16","8,5","24","9"],
 a:1,
 why:"Área I⁺ = 10·0,4 + 15·0,3 = 4 + 4,5 = 8,5, y mantenimiento = h·8,5 = **8,5**.\nÁrea I⁻ = 5·0,3 = 1,5, y faltante = π·1,5 = **7,5**.\nSuma: **16**. h va con I⁺ y π con I⁻.",
 n:["Usaste h para todo (8,5 + 1,5).","","Es solo el mantenimiento.","Invertiste h y π.","Restaste en vez de usar I⁻ = max(−I, 0)."],
 src:"Resumen §5.2 y §5.3"},

{u:5, q:"En el mismo instante coinciden una **llegada de pedido** y una **demanda**. ¿En qué orden se procesan?",
 o:["Primero la demanda","Primero la llegada del pedido","Es indistinto","Primero el que se generó antes","Se procesan juntos como un solo evento"],
 a:1,
 why:"Prioridades de Law: 1) llegada de pedido, 2) demanda, 3) fin, 4) evaluación. Así la demanda encuentra el stock ya repuesto.",
 n:["La llegada de pedido tiene prioridad 1.","","El orden afecta I⁺ e I⁻.","Se usa la prioridad, no el orden de generación.","Son eventos distintos."],
 src:"Resumen §5.4"},

{u:5, q:"En t = n coinciden el **fin de simulación** y una **evaluación**. ¿Qué pasa?",
 o:["Se evalúa y, si I < s, se pide","Se procesa el fin primero, y la evaluación no llega a ejecutarse",
    "Se procesa la evaluación primero porque es periódica","Se genera un error","Se ejecutan en paralelo"],
 a:1,
 why:"El fin tiene prioridad 3 y la evaluación 4: el fin va antes y termina la corrida. Tiene sentido: un pedido en t = n nunca llegaría dentro del horizonte, pero cargaría su costo.",
 n:["La evaluación tiene menor prioridad.","","Está al revés.","No.","Los eventos se procesan de a uno."],
 src:"Resumen §5.4"},

{u:5, q:"Entre la llegada de pedido, la demanda y la evaluación, ¿cuál **no programa ningún evento futuro**?",
 o:["La demanda","La evaluación","La llegada de pedido","Las tres programan algo","La demanda y la evaluación"],
 a:2,
 why:"La **llegada de pedido** suma Z al inventario y no programa nada. La demanda programa la próxima demanda, y la evaluación programa la próxima evaluación (siempre) y la llegada del pedido (si pidió). El fin termina la corrida.",
 n:["Programa la próxima demanda.","Programa la próxima evaluación en t + 1.","","La llegada de pedido no programa nada.","Esas dos son justamente las que sí programan."],
 src:"Resumen §5.4"},

{u:5, q:"En la evaluación de t = 3 se cumple I < s. ¿Qué programa?",
 o:["Solo la llegada del pedido en t + L","Solo la próxima evaluación en t = 4",
    "La llegada del pedido en 3 + L y la próxima evaluación en t = 4","La próxima demanda","Nada, porque el pedido llega solo"],
 a:2,
 why:"La evaluación **siempre** programa la siguiente en t + 1. Si pidió, además paga K + iZ y programa la llegada en t + L, con L ~ U(0,5; 1).",
 n:["Falta la próxima evaluación.","Falta la llegada.","","Eso lo hace la demanda.","Alguien tiene que programar la llegada."],
 src:"Resumen §5.4"},

{u:5, q:"¿Cómo se acumulan las áreas bajo I⁺ e I⁻?",
 o:["Con un evento propio de prioridad 5","Con una rutina que no es evento, llamada antes de cada evento, que mira el signo de I en el intervalo anterior",
    "Solo al final de la corrida","Solo en las evaluaciones","Con el valor de I después del evento"],
 a:1,
 why:"Es una rutina auxiliar, **no un evento**. Antes de cada evento, mira el signo de I durante el intervalo que termina. Si fue positivo suma a I⁺, si fue negativo suma a I⁻ y si fue cero no suma.",
 n:["No es un evento.","","Se acumula evento a evento.","También en demandas y llegadas.","Con el valor anterior."],
 src:"Resumen §5.4"},

{u:5, q:"En la tabla de Law, con s = 20 fijo, S pasa de 40 a 100. ¿Qué pasa con los componentes del costo?",
 o:["Sube el mantenimiento, baja el faltante y baja el costo de pedido","Sube todo","Sube el mantenimiento, baja el faltante y sube el costo de pedido",
    "Baja el mantenimiento y sube el faltante","No cambia nada, porque s es el mismo"],
 a:0,
 why:"Con S más alto se guarda más (el mantenimiento pasa de 9,25 a 36,00) y falta menos (el faltante baja de 18,10 a 7,95). El costo de pedido **baja** (de 99,26 a 81,37): se piden lotes grandes con menos frecuencia y se paga menos veces K.",
 n:["","No.","Error típico: lotes más grandes, pero menos pedidos.","Está invertido.","S cambia el tamaño de cada pedido."],
 src:"Resumen §5.5 · Law fig. 1.90"},

{u:5, q:"La política (20, 60) dio el menor costo, 122,74. ¿Qué concluye Law?",
 o:["Que es la óptima","Que es la óptima con 95% de confianza",
    "Que parece la mejor, pero es una sola corrida por política y el orden podría cambiar con otros números aleatorios","Que hay que elegir la de menor faltante","Que la simulación no sirve para este problema"],
 a:2,
 why:"Cada costo es la estimación de **una sola corrida**: una muestra de tamaño 1, con mucha varianza. Law concluye que una sola corrida por política **no alcanza** para elegir.",
 n:["No se puede afirmar con una corrida.","No se calculó ningún intervalo.","","El criterio es el costo total.","Sirve, pero hacen falta más corridas."],
 src:"Resumen §5.5"},

{u:5, q:"Según Law, ¿qué se podía saber **sin simular** sobre el efecto de cambiar s y S?",
 o:["La magnitud exacta de cada componente","La dirección del costo total","La dirección de cada componente, pero no su magnitud ni hacia dónde va el total",
    "Nada","Todo, porque el modelo es simple"],
 a:2,
 why:"Que subir S aumenta el mantenimiento y baja el faltante es intuitivo. Pero **cuánto** no se sabe, y como los componentes se mueven en sentidos opuestos, **sin simular no se sabe ni para dónde va el total**.",
 n:["La magnitud requiere simular.","Justamente no.","","La dirección de cada componente sí.","No hay solución analítica."],
 src:"Resumen §5.5"},

{u:5, q:"El tamaño de la demanda vale 1, 2, 3 o 4 con probabilidades 1/6, 1/3, 1/3 y 1/6. Con r = 0,52, ¿qué tamaño sale?",
 o:["1","2","3","4","No se puede saber sin otro r"],
 a:2,
 why:"Acumuladas: 0,1667; 0,5; 0,8333; 1. Como r = 0,52 cae en (0,5; 0,8333], sale **D = 3**. Es la transformada inversa discreta: el primer valor cuya acumulada supera a r.",
 n:["Sería con r ≤ 0,1667.","Sería con r entre 0,1667 y 0,5.","","Sería con r > 0,8333.","Un r alcanza."],
 src:"Resumen §5.1 y §5.6"},

{u:5, q:"La demora de entrega es L ~ U(0,5; 1). Con r = 0,4, ¿cuánto vale L?",
 o:["0,4","0,7","0,2","0,9","0,5"],
 a:1,
 why:"L = a + (b − a)·r = 0,5 + 0,5·0,4 = **0,7** meses.",
 n:["Es r sin transformar.","","Es (b − a)·r, sin sumar a.","Sería con r = 0,8.","Es el mínimo."],
 src:"Resumen §5.6"},

{u:5, q:"Tiempo entre demandas exponencial de media 0,1 mes. Con r = 0,3, ¿cuánto vale?",
 o:["≈ 0,120","0,03","≈ 1,204","≈ 0,012","0,3"],
 a:0,
 why:"X = −0,1 · ln(0,3) = −0,1 · (−1,204) ≈ **0,120** meses.",
 n:["","Multiplicaste 0,1 · 0,3.","Olvidaste multiplicar por la media.","Multiplicaste por la media al cuadrado (0,01).","No."],

{u:5, q:"El costo de oportunidad del capital inmovilizado en stock, ¿en qué parámetro entra según Law?",
 o:["En K","En i","En h","En π","En ninguno"],
 a:2,
 why:"El costo de **mantenimiento** h incluye alquiler del depósito, seguros, impuestos, mantenimiento **y el costo de oportunidad** del capital atado al inventario. Por eso se cobra sobre I⁺, lo que efectivamente hay guardado. i es el precio unitario de lo que se compra.",
 n:["K es el costo fijo de preparación del pedido.","i es el costo por unidad pedida.","","π es la penalidad por faltante.","Sí entra."],
 src:"Law §1.5.1 · Resumen §5.3"},

{u:5, q:"Una demanda de 4 llega con I = 2. ¿Qué pasa en el modelo de Law?",
 o:["Se pierden 2 unidades de demanda","I queda en −2 y esa deuda se cubre cuando llegue el próximo pedido",
    "Se rechaza la demanda completa","Se hace un pedido de urgencia","I queda en 0"],
 a:1,
 why:"No hay ventas perdidas: el exceso queda **pendiente** (backlog) e I se vuelve negativo. Cuando llega el pedido, **primero** cubre el backlog y lo que sobra va al depósito.",
 n:["No se pierde: queda pendiente.","","No.","Solo se pide en las evaluaciones.","I sí puede ser negativo."],
 src:"Resumen §5.2"},

{u:5, q:"Simulás 12 meses y hubo 140 eventos. ¿Por cuánto se divide la suma de los costos de pedido para el costo promedio mensual?",
 o:["Por 140","Por 12","Por la cantidad de pedidos","Por 152","Por 1"],
 a:1,
 why:"El costo total es **promedio mensual**: se divide por la cantidad de **meses** n, no por eventos ni por pedidos.",
 n:["Error del ejercicio numérico.","","Eso daría el costo por pedido.","No.","No."],
 src:"Resumen §5.6"},

{u:5, q:"¿En qué se diferencia el inventario de Law del modelo de punto de reorden de Investigación Operativa?",
 o:["En que Law no tiene costo de mantenimiento","En que Law usa revisión periódica (a principio de mes) y por eso puede aparecer backlog",
    "En que Law usa control continuo","En que en Law la demanda es determinística","No hay diferencia"],
 a:1,
 why:"En IO el control es **continuo**: se pide apenas el stock toca el punto de reorden. Acá se mira **solo a principio de cada mes**, así que entre revisiones el stock puede caer mucho.",
 n:["Sí tiene, h.","","Al revés.","La demanda es aleatoria en tiempo y tamaño.","Sí la hay."],
 src:"Resumen §5.2"},

// ───────── UNIDAD 6 · Pasos de Weitz ─────────
{u:6, q:"Según Weitz, ¿cuál es el **segundo paso** de un estudio de simulación?",
 o:["Recolección y análisis de datos","Generación del modelo de simulación base","Verificación","Formulación del problema","Generación del modelo preliminar"],
 a:1,
 why:"Weitz: 1) definición del sistema, 2) **modelo base**, 3) recolección de datos, 4) modelo preliminar, 5) verificación, 6) validación, 7) modelo final, 8) escenarios, 9) sensibilidad, 10) documentación. Regla mnemotécnica: Dibu, **Messi**, Romero, Molina... «Recolección» es el paso 3 de Weitz, y aparece en el paso 2 **de Law**: por eso confunde.",
 n:["Es el paso 3 de Weitz.","","Es el paso 5.","Es el paso 1 de Law.","Es el paso 4."],
 src:"Resumen §6"},

{u:6, q:"¿Qué paso de Weitz va **inmediatamente antes** del análisis de sensibilidad?",
 o:["Generación del modelo final","Determinación de los escenarios","Validación","Documentación","Verificación"],
 a:1,
 why:"7) modelo final → 8) **determinación de escenarios** → 9) análisis de sensibilidad. Tiene lógica: primero se definen los escenarios (optimista, pesimista, intermedio) y después se mide si las diferencias entre ellos son significativas.",
 n:["Es el 7, dos antes.","","Es el 6.","Es el 10, después.","Es el 5."],
 src:"Resumen §6"},

{u:6, q:"El equipo compara la salida del modelo con los tiempos de espera registrados en el banco durante un mes. ¿Qué está haciendo?",
 o:["Verificación","Validación","Análisis de sensibilidad","Recolección de datos","Determinación de escenarios"],
 a:1,
 why:"**Validar** es comprobar que el modelo representa la **realidad**: a entradas similares, ¿da salidas similares a las del sistema real? Se hace junto con el cliente.",
 n:["Verificar es comprobar el **programa**, no compararlo con la realidad.","","La sensibilidad compara escenarios entre sí.","Los datos ya se usan; acá se contrasta la salida.","No."],
 src:"Resumen §6"},

{u:6, q:"Corriendo paso a paso el modelo, descubren que el reloj retrocede después de cierta partida. ¿En qué paso se detecta este problema?",
 o:["Validación","Verificación","Análisis de sensibilidad","Modelo final","Documentación"],
 a:1,
 why:"**Verificar** es comprobar que el programa hace lo que quise programar: es debugging. ¿El programa funciona? ¿Los parámetros son correctos? ¿Se completa una corrida sin problemas? Un reloj que retrocede es un error de programación.",
 n:["La validación supone que el programa ya funciona.","","No.","No.","No."],
 src:"Resumen §6"},

{u:6, q:"Según las diapositivas, en el paso 2 de Weitz (modelo base):",
 o:["Se ajustan las distribuciones a los datos","Los datos todavía no importan; se definen relaciones, gráficos e indicadores de salida",
    "Se valida con el cliente","Se corren los escenarios","Se calculan intervalos de confianza"],
 a:1,
 why:"El modelo base es la **estructura lógica**: relaciones, gráficos e indicadores de salida. El profe remarca que **los datos todavía no importan**: llegan en el paso 3.",
 n:["Eso es el paso 3.","","Eso es el paso 6.","Eso es el paso 8.","Eso es el paso 9."],
 src:"Resumen §6"},

{u:6, q:"¿Qué es el **modelo final** (paso 7)?",
 o:["La versión que se entrega sin más cambios","El escenario raíz contra el que se comparan los demás escenarios",
    "El modelo con todos los escenarios integrados","El modelo optimista","La documentación"],
 a:1,
 why:"El modelo final es el **escenario raíz**: la base validada contra la que se comparan los escenarios del paso 8.",
 n:["Después vienen los escenarios y la sensibilidad.","","Los escenarios se derivan de él.","El optimista es uno de los escenarios.","Es el paso 10."],
 src:"Resumen §6"},

{u:6, q:"En la determinación de escenarios (paso 8), ¿qué versiones sugiere la cátedra?",
 o:["Corta, media y larga","Optimista, pesimista e intermedia","Determinística y estocástica","Transitoria y estable","Base, preliminar y final"],
 a:1,
 why:"Paso 8: ideas nuevas y cambios sugeridos, en versiones **optimista, pesimista e intermedia**.",
 n:["No.","","No.","Son las fases de un sistema de colas.","Son los modelos de los pasos 2, 4 y 7."],
 src:"Resumen §6"},

{u:6, q:"¿Qué pregunta responde el **análisis de sensibilidad** de Weitz, y con qué herramienta?",
 o:["Si el programa funciona, con trazas","Si hay diferencia estadísticamente significativa entre escenarios, con intervalos de confianza",
    "Qué distribución siguen los datos, con chi-cuadrado","Si el modelo representa la realidad, con el cliente","Cuántas corridas hacen falta, con el TCL"],
 a:1,
 why:"El paso 9 pregunta si las diferencias entre escenarios son **estadísticamente significativas**, y se responde con **intervalos de confianza**.",
 n:["Es verificación.","","Es recolección y análisis de datos.","Es validación.","No es la definición del paso."],
 src:"Resumen §6"},

{u:6, q:"¿Qué diferencia de orden hay entre las listas de Law y de Weitz respecto de la validación?",
 o:["Ninguna","En Law hay una validación antes de programar: el documento de supuestos, paso 3",
    "Law no valida","Weitz valida antes de verificar","Law verifica después de validar el modelo programado"],
 a:1,
 why:"Law valida el **documento de supuestos** (paso 3) antes de programar y verificar (paso 4), y vuelve a validar el modelo programado (paso 6). Weitz verifica (5) y después valida (6).",
 n:["Sí la hay.","","Valida dos veces.","Weitz verifica primero.","En Law, verificar (4) va antes de validar el programado (6)."],
 src:"Resumen §6"},

{u:6, q:"¿Con quién se hace la **validación**, según el profe?",
 o:["Solo con el programador","Junto con el cliente","Con un auditor externo","Con el profesor","No hace falta nadie: es automática"],
 a:1,
 why:"El cliente es quien conoce el sistema real y puede decir si las salidas son razonables. Por eso la validación se hace **junto con el cliente**.",
 n:["El programador hace la verificación.","","No.","No.","No."],
 src:"Resumen §6"},

{u:6, q:"¿Qué paso de Weitz integra los anteriores y debe representar lo mejor posible el estado habitual del sistema?",
 o:["Modelo base","Modelo preliminar","Modelo final","Escenarios","Validación"],
 a:1,
 why:"El paso 4, **modelo preliminar**, junta la definición (1), la estructura (2) y los datos (3) para representar el estado habitual del sistema. Después se verifica y se valida.",
 n:["Es el 2: todavía sin datos.","","Es el 7: el escenario raíz ya validado.","Es el 8.","Es el 6."],
 src:"Resumen §6"},

{u:6, q:"¿Cuál es la secuencia correcta de los pasos 3 a 6 de Weitz?",
 o:["Recolección → modelo preliminar → verificación → validación","Modelo preliminar → recolección → validación → verificación",
    "Recolección → verificación → modelo preliminar → validación","Verificación → validación → recolección → modelo preliminar","Recolección → validación → verificación → modelo final"],
 a:0,
