// ───────── UNIDAD 7 · Colas ─────────
{u:7, q:"En la notación de Kendall A/S/c/K/L, ¿qué describe la **segunda letra**?",
 o:["La distribución de los tiempos entre llegadas","La distribución de los tiempos de servicio","El número de servidores","La capacidad","La población"],
 a:1,
 why:"A = tiempos entre llegadas, **S = tiempos de servicio**, c = servidores en paralelo, K = capacidad del sistema y L = tamaño de la población.",
 n:["Es la primera.","","Es la tercera.","Es la cuarta.","Es la quinta."],
 src:"Resumen §7.2 · Wiki U8 §8.3"},

{u:7, q:"En M/M/1/5, ¿qué significa el 5?",
 o:["Que la cola admite 5 clientes, sin contar al que se atiende","Que el sistema admite como máximo 5 clientes, contando al que está en servicio",
    "Que la población es de 5 clientes","Que hay 5 servidores","Que la tasa de servicio es 5"],
 a:1,
 why:"K es la capacidad del **sistema**: los que esperan **más** los que están siendo atendidos. Con un servidor, la cola admite a lo sumo 4.",
 n:["Trampa: K cuenta todo el sistema, no solo la cola.","","Sería la quinta posición.","Sería la tercera.","Kendall no lleva tasas."],
 src:"Resumen §7.2 (Ojo)"},

{u:7, q:"¿Cómo se interpreta **M/D/2**?",
 o:["Llegadas Poisson, servicio determinístico, 2 servidores, capacidad y población infinitas","Llegadas determinísticas, servicio exponencial, 2 servidores",
    "Llegadas exponenciales, servicio general, 2 colas","Llegadas Poisson, servicio determinístico, capacidad 2","Población de 2 clientes"],
 a:0,
 why:"M = markoviano (llegadas Poisson, o sea tiempos entre llegadas exponenciales), D = servicio **determinístico**, 2 servidores. **Las posiciones omitidas se consideran infinitas.**",
 n:["","Está invertido.","D no es general (G).","El 2 está en la tercera posición: son servidores.","No."],
 src:"Wiki U8 §8.3"},

{u:7, q:"En un modelo con **población finita**, ¿qué pasa con la tasa de llegadas?",
 o:["Es constante","Aumenta a medida que hay más clientes en el sistema","Disminuye a medida que aumenta el número de clientes en el sistema",
    "Depende de la hora del día","Es cero"],
 a:2,
 why:"Con pocos clientes posibles, cada uno que está **dentro** del sistema es uno menos que puede llegar. La tasa depende del **estado** (cuántos hay adentro), no del reloj.",
 n:["Eso es población infinita.","Al revés.","","Eso sería un λ(t) no homogéneo, otro concepto.","No."],
 src:"Resumen §7.1"},

{u:7, q:"Un técnico atiende **6 impresoras** de una oficina; cada una se descompone en promedio cada 40 horas. El enunciado no dice nada sobre la población. ¿Cómo se modela?",
 o:["M/M/1, porque si no dice nada la población es infinita","Con población finita de 6, porque las impresoras rotas no pueden volver a romperse mientras esperan",
    "M/M/6","Con capacidad 6 y población infinita","No se puede modelar"],
 a:1,
 why:"La población se **deduce del planteo**: pocos clientes que vuelven al sistema. Con 3 impresoras rotas solo quedan 3 que pueden fallar, y la tasa de llegadas baja. Es el típico caso que el enunciado no aclara y hay que reconocer, como los telares.",
 n:["La regla de «infinito si se omite» es para leer la notación, no para modelar un enunciado.","","Hay un solo técnico.","La cantidad de impresoras es la población, no la capacidad.","Sí se puede, con software."],
 src:"Resumen §7.1 y §7.5"},

{u:7, q:"M/M/1 con λ = 3 por hora y μ = 4 por hora. ¿Cuánto vale **L**?",
 o:["0,75","2,25","3","4","1"],
 a:2,
 why:"ρ = 3/4 = 0,75. L = ρ/(1 − ρ) = 0,75/0,25 = **3**. Lq = ρ²/(1 − ρ) = 2,25. Control: L − Lq = ρ = 0,75.",
 n:["Es ρ.","Es Lq.","","No.","Es W en horas."],
 src:"Resumen §7.4"},

{u:7, q:"Mismo M/M/1, con λ = 3/h y μ = 4/h. ¿Cuánto espera **en cola** un cliente en promedio?",
 o:["45 minutos","1 hora","15 minutos","2,25 horas","20 minutos"],
 a:0,
 why:"Wq = Lq/λ = 2,25/3 = 0,75 h = **45 min**. Control: W = Wq + 1/μ = 0,75 + 0,25 = 1 h, y L = λW = 3.",
 n:["","Es W: incluye el servicio.","Es 1/μ, el servicio.","Es Lq.","No."],
 src:"Resumen §7.3 y §7.4"},

{u:7, q:"M/M/1 con ρ = 0,75. ¿Cuál es la probabilidad de que un cliente que llega **tenga que esperar**?",
 o:["0,25","0,75","0,5625","1","0"],
 a:1,
 why:"En M/M/1, **pw = ρ = 0,75**: tiene que esperar si encuentra al servidor ocupado, y eso pasa una fracción ρ del tiempo. **P0 = 1 − ρ = 0,25** es la probabilidad de encontrar el sistema vacío y no esperar.",
 n:["Es P0: la probabilidad de **no** esperar.","","Es ρ², la probabilidad de 2 o más en el sistema.","No.","No."],
 src:"Resumen §7.4"},

{u:7, q:"Un sistema G/G/3 (llegadas y servicio con distribución general) en estado estable tiene λ = 12 por hora y se mide L = 6. ¿Cuánto vale W?",
 o:["No se puede calcular sin fórmulas de G/G/3","0,5 horas","2 horas","72 horas","6 horas"],
 a:1,
 why:"La ley de Little **L = λW es universal**: vale para cualquier modelo en estado estable, sin importar las distribuciones ni la cantidad de servidores. W = L/λ = 6/12 = **0,5 h**.",
 n:["Trampa: Little no necesita el modelo.","","Invertiste: λ/L.","Multiplicaste.","No."],
 src:"Resumen §7.3"},

{u:7, q:"En cualquier cola en estado estable, ¿cuánto vale **L − Lq**?",
 o:["ρ²","λ/μ, el número promedio de clientes en servicio","1/μ","Wq","Siempre 1"],
 a:1,
 why:"Multiplicando W = Wq + 1/μ por λ y usando Little: λW = λWq + λ/μ, o sea **L = Lq + λ/μ**. La diferencia es el número medio de clientes **siendo atendidos**: en M/M/1 es ρ, y en M/M/c es la cantidad media de servidores ocupados.",
 n:["No.","","Es el tiempo de servicio.","No.","«Siempre» y además mal: con un servidor la diferencia es ρ < 1."],
 src:"Derivado de las relaciones universales (§7.3)", gen:true},

{u:7, q:"M/M/1 con λ = μ = 5 por hora. ¿Qué afirmación es correcta?",
 o:["No se puede simular","Se puede simular, pero no existe estado estable, así que las fórmulas no aplican",
    "L = 1","El sistema se vacía siempre","P0 = 0,5"],
 a:1,
 why:"La condición de estado estable es **ρ < 1**. Con ρ = 1 la cola crece sin límite. **Sí se puede simular**: se ve la cola crecer y el servidor ocupado casi todo el tiempo. Lo que no existe es la solución analítica. Las dos preguntas salieron en 2025.",
 n:["Trampa del 2025: sí se puede.","","L = ρ/(1 − ρ) no está definido.","No.","P0 = 1 − ρ = 0 no tiene sentido sin estado estable."],
 src:"Resumen §7.4 (Ojo)"},

{u:7, q:"¿Cuándo valen las fórmulas analíticas de colas (P0, L, Lq...)?",
 o:["Desde t = 0","Solo en la fase transitoria","Solo en estado estable","Siempre que haya simulación","Solo con población finita"],
 a:2,
 why:"Todo sistema pasa primero por una fase **transitoria**, que depende de las condiciones iniciales, y después llega al **estado estable**. Las fórmulas valen solo en estado estable.",
 n:["En t = 0 se está en la transitoria.","Al revés.","","No.","No."],
 src:"Resumen §7.1"},

{u:7, q:"λ = 25 atascos por hora y μ = 4 por hora por reparador. ¿Cuál es el **mínimo** número de reparadores para que exista estado estable?",
 o:["6","7","8","9","25"],
 a:1,
 why:"En M/M/c se necesita **λ < cμ**. Con c = 6, cμ = 24 < 25: no alcanza. Con c = **7**, cμ = 28 > 25. Es el caso American Weavers.",
 n:["24 < 25: inestable.","","Es estable, pero no es el mínimo.","Es el óptimo en costo, no el mínimo estable.","No."],
 src:"Resumen §7.5 · Wiki U8"},

{u:7, q:"Con λ = 25, μ = 4 y c = 7, ¿cuánto vale la utilización ρ?",

 a:1,
 why:"Con c servidores, **ρ = λ/(cμ) = 25/28 ≈ 0,893**, que coincide con el 89,29% de la tabla 13.3.",
 n:["Es λ/μ sin dividir por c.","","No.","No.","No."],
 src:"Resumen §7.3 · tabla 13.3"},

{u:7, q:"American Weavers: cs = 50 por reparador por hora, cw = 100 por máquina parada por hora, y con c = 8 se tiene L = 7,744. ¿Cuál es el costo total por hora?",
 o:["≈ 1174,4","≈ 1559,7","≈ 1128,6","≈ 1145,9","≈ 549,4"],
 a:0,
 why:"Costo total = **cs·c + cw·L** = 50·8 + 100·7,744 = 400 + 774,4 = **1174,4**. Con c = 7 da 1559,7; con c = 9, 1128,6 (el óptimo); con c = 10, 1145,9.",
 n:["","Es c = 7.","Es c = 9.","Es c = 10.","Pusiste cw = 50 e invertiste."],

{u:7, q:"En American Weavers el óptimo es c = 9. ¿Por qué no conviene seguir a 10?",
 o:["Porque con 10 el sistema es inestable","Porque L baja apenas de 6,79 a 6,46, y el ahorro de espera (≈ 33) no paga el sueldo extra (50)",
    "Porque la fórmula no vale con c > 9","Porque con 10 Lq es negativo","Porque la utilización baja del 70%"],
 a:1,
 why:"La curva de costo total tiene forma de U. De 9 a 10, el término de espera baja 100·(6,786 − 6,459) ≈ 32,7, pero el de servidores sube 50. El mínimo está donde el ahorro marginal de espera deja de cubrir el costo marginal del servidor.",
 n:["Más servidores lo hace más estable.","","Vale.","No.","La utilización no es el criterio."],
 src:"Wiki U8 · Weitz 13.5"},

{u:7, q:"En un M/M/c/K (capacidad limitada), ¿cuál es la fórmula correcta del costo total?",
 o:["cs·c + cw·L","cs·c + cw·Lq","cs·c + cw·L + cd·λ·Pd","cs·c + cd·Pd","cw·L + cd·λ"],
 a:2,
 why:"Con capacidad limitada los clientes que encuentran el sistema lleno **se pierden**. Hay que sumar el **costo de negación**: costo por cliente perdido × tasa de llegadas × probabilidad de negación.",
 n:["Falta el tercer término: trampa clásica.","Se usa L, y además falta la negación.","","Falta la espera.","Faltan los servidores, y Pd en el último término."],
 src:"Resumen §7.5 · Wiki U8"},

{u:7, q:"Llegan 20 clientes por hora, la probabilidad de negación de servicio es 0,05 y cada cliente perdido cuesta $10. ¿Cuál es el costo de negación por hora?",
 o:["$0,50","$10","$200","$1","$100"],
 a:1,
 why:"cd·λ·Pd = 10 · 20 · 0,05 = **$10 por hora**. Se pierden en promedio 20·0,05 = 1 cliente por hora, a $10 cada uno.",
 n:["Olvidaste λ.","","Olvidaste Pd.","Es la cantidad de clientes perdidos, sin el costo.","No."],
 src:"Wiki U8"},

{u:7, q:"¿Qué hace falta saber del tiempo de servicio para usar un **M/G/1**?",
 o:["Solo la media","La media y el desvío estándar","La distribución completa","Nada: se supone exponencial","El percentil 95"],
 a:1,
 why:"G = distribución **general**. El modelo pide la **media y el desvío estándar** del servicio. Un desvío de 0 corresponde a un servicio **determinístico**. En el libro se resuelve con software (STORM).",
 n:["No alcanza.","","Alcanza con media y desvío.","Eso sería M/M.","No."],
 src:"Resumen §7.5"},

{u:7, q:"¿Cuál de estos **no** es un supuesto del M/M/1?",
 o:["Llegadas Poisson","Servicio exponencial","Una sola cola FIFO infinita","Población finita","Un servidor"],
 a:3,
 why:"El M/M/1 supone **población infinita**. El resumen de alumnos 2025 dice «finita» y está mal.",
 n:["Es supuesto.","Es supuesto.","Es supuesto.","","Es supuesto."],
 src:"Resumen §7.4 (Ojo)"},

{u:7, q:"M/M/1 con ρ = 0,9. ¿Cuánto vale Lq?",
 o:["0,9","9","8,1","0,81","10"],
 a:2,
 why:"Lq = ρ²/(1 − ρ) = 0,81/0,1 = **8,1**, y L = 9. Por eso cerca de ρ = 1 la cola explota (figura 10).",
 n:["Es ρ.","Es L.","","Es ρ²: falta dividir por (1 − ρ).","No."],
 src:"Resumen §7.4"},

{u:7, q:"¿Qué afirmación sobre el **M/M/c** es correcta?",
 o:["Tiene c colas, una por servidor","Tiene una sola cola y c servidores idénticos en paralelo; es estable si λ < cμ",
    "Es estable si λ < μ","Sus fórmulas se toman de memoria en el parcial","Los servidores pueden tener distinta velocidad"],
 a:1,
 why:"M/M/c: **una sola cola** que alimenta a c servidores **idénticos**. Es estable si λ < cμ. Hay que entender cómo funciona; las fórmulas **no se piden**.",
 n:["Una sola cola.","","Esa es la condición de un servidor.","Las fórmulas no se piden.","Se suponen idénticos."],
 src:"Resumen §7.5"},

{u:7, q:"¿Qué es la **probabilidad de negación de servicio**?",
 o:["La probabilidad de que el servidor esté libre","La probabilidad de que un cliente que llega encuentre el sistema lleno y se pierda",
    "La probabilidad de esperar","1 − ρ","La probabilidad de que la cola esté vacía"],
 a:1,
 why:"Solo existe con **capacidad limitada**. Es la probabilidad de encontrar el sistema lleno, y se calcula **por complemento**: 1 menos la probabilidad de todos los estados en que todavía hay lugar.",
 n:["Es P0.","","Es pw.","Es P0 en M/M/1.","No."],
 src:"Resumen §7.5"},

// ───────── UNIDAD 8 · Probabilidad ─────────
{u:8, q:"En un proceso de Poisson de tasa λ, ¿qué distribución tienen los **tiempos entre arribos**?",
 o:["Poisson de media λ","Exponencial de media 1/λ","Uniforme","Normal","Binomial"],
 a:1,
 why:"La **Poisson cuenta** cuántos eventos hay en un intervalo (es discreta). La **exponencial mide** el tiempo entre eventos (es continua). «Los tiempos entre arribos son Poisson» es **falso**: es la trampa más repetida.",
 n:["La trampa clásica.","","No.","No.","No."],
 src:"Resumen §8.5"},

{u:8, q:"En un proceso de Poisson **no homogéneo**, ¿qué propiedad se pierde?",
 o:["Los incrementos independientes","Los incrementos estacionarios","Que N(0) = 0","Que los eventos ocurran de a uno","Todas"],
 a:1,
 why:"Con λ(t) variable, cuántos eventos hay en un intervalo depende de **dónde** está y no solo de su largo: se pierde la **estacionariedad**. Los incrementos **siguen siendo independientes**.",
 n:["Trampa: siguen independientes.","","Se mantiene.","Se mantiene.","No."],
 src:"Resumen §8.5"},

{u:8, q:"Llegan clientes según un proceso de Poisson de 6 por hora. Ya pasaron 30 minutos sin llegadas. ¿Cuál es la probabilidad de que **no llegue nadie en los próximos 10 minutos**?",
 o:["≈ 0,368","≈ 0,135","≈ 0,05","≈ 0,632","Depende de los 30 minutos que ya pasaron"],
 a:0,
 why:"Por la **falta de memoria** de la exponencial, los 30 minutos no importan. P(T > 1/6 h) = e^(−6·1/6) = e^(−1) ≈ **0,368**.",
 n:["","Es e^(−2): usaste 20 minutos.","No.","Es la probabilidad de que **sí** llegue alguien.","Es justo lo que la falta de memoria descarta."],
 src:"Resumen §8.4"},

{u:8, q:"Un cajero termina servicios a tasa 10/h y otro a 15/h, ambos exponenciales e independientes. ¿Cuál es el tiempo medio hasta que **alguno** se libere?",
 o:["6 minutos","4 minutos","2,4 minutos","10 minutos","5 minutos"],
 a:2,
 why:"El **mínimo de exponenciales independientes** es exponencial con la **suma de las tasas**: 10 + 15 = 25/h. La media es 1/25 h = **2,4 min**.",
 n:["Es la media del primero.","Es la media del segundo.","","No.","Promediaste las medias: no corresponde."],
 src:"Resumen §8.4"},

{u:8, q:"X es exponencial de tasa 4 (media 0,25). ¿Qué distribución tiene Y = 3X?",
 o:["Exponencial de tasa 12","Exponencial de tasa 4/3","Exponencial de tasa 4","Normal","No es exponencial"],
 a:1,
 why:"c·X sigue siendo exponencial, con tasa **λ/c** = 4/3. La media pasa a 3·0,25 = 0,75 = 1/(4/3). Escalar los tiempos por 3 divide la tasa por 3.",
 n:["Multiplicaste la tasa: es al revés.","","Cambió la escala.","No.","Sí lo es."],
 src:"Resumen §8.4"},

{u:8, q:"Var(X) = 4. ¿Cuánto vale Var(3X − 7)?",
 o:["12","5","36","29","−3"],
 a:2,
 why:"**Var(aX + b) = a²·Var(X)** = 9·4 = **36**. La constante −7 corre todos los valores por igual y no cambia la dispersión.",
 n:["No elevaste a al cuadrado.","Hiciste 12 − 7.","","Restaste 7.","Una varianza nunca es negativa."],
 src:"Resumen §8.1"},

{u:8, q:"X e Y son independientes, con Var(X) = 4 y Var(Y) = 9. ¿Cuánto vale Var(X − Y)?",
 o:["−5","5","13","36","Depende de la covarianza"],
 a:2,
 why:"Var(X − Y) = Var(X) + (−1)²·Var(Y) − 2Cov = 4 + 9 − 0 = **13**. La resta **suma** varianzas: restar una variable aleatoria agrega incertidumbre.",
 n:["Una varianza no puede ser negativa.","Restaste varianzas.","","No.","Como son independientes, Cov = 0."],
 src:"Resumen §8.1"},

{u:8, q:"¿Cuál de estas afirmaciones es **verdadera para cualquier** par de variables X e Y?",
 o:["Var(X + Y) = Var(X) + Var(Y)","E[X + Y] = E[X] + E[Y]","E[XY] = E[X]·E[Y]","Var(XY) = Var(X)·Var(Y)","Cov(X, Y) = 0"],
 a:1,
 why:"La esperanza de una suma es la suma de las esperanzas **siempre**. La varianza de una suma es la suma de varianzas **solo si son independientes** (en general, más 2Cov).",
 n:["Necesita independencia (o Cov = 0).","","Necesita independencia.","Falso en general.","Solo si no están correlacionadas."],
 src:"Resumen §8.1"},

{u:8, q:"E[X] = 3 y E[X²] = 13. ¿Cuánto vale Var(X)?",
 o:["10","4","16","√13","1"],
 a:1,
 why:"**Var(X) = E[X²] − E[X]²** = 13 − 9 = **4**.",
 n:["Restaste E[X] sin elevar.","","Sumaste.","No.","No."],
 src:"Resumen §8.1"},

{u:8, q:"Sin conocer la distribución de X, ¿qué cota da **Chebyshev** para P(|X − μ| ≥ 3σ)?",
 o:["≤ 1/3","≤ 1/9","= 0,0027","≤ 0,05","≥ 1/9"],
 a:1,
 why:"Chebyshev: P(|X − μ| ≥ kσ) ≤ 1/k² = **1/9 ≈ 0,111**, para cualquier distribución con varianza finita. El 0,0027 es el valor de la **normal**, que no se puede suponer.",
 n:["Es 1/k, sin el cuadrado.","","Solo vale si X es normal.","No.","Es una cota superior, no inferior."],
 src:"Resumen §8.2"},

{u:8, q:"X ≥ 0 con E[X] = 5. ¿Qué dice **Markov** sobre P(X ≥ 20)?",
 o:["Que es 0,25","Que es a lo sumo 0,25","Que es al menos 0,25","Que es a lo sumo 4","Que no se puede acotar"],
 a:1,
 why:"Markov: P(X ≥ a) ≤ E[X]/a = 5/20 = **0,25**. Es una **cota superior**, válida para cualquier X no negativa.",
 n:["Es una cota, no el valor.","","Es superior, no inferior.","Invertiste: a/E[X].","Sí se puede, porque X ≥ 0."],
 src:"Resumen §8.2"},

{u:8, q:"X ~ Uniforme(2, 8). ¿Cuánto valen E[X] y Var(X)?",
 o:["E = 5 y Var = 3","E = 5 y Var = 6","E = 3 y Var = 3","E = 5 y Var = 36","E = 4 y Var = 3"],
 a:0,
 why:"E = (a + b)/2 = 10/2 = **5**. Var = (b − a)²/12 = 36/12 = **3**.",
 n:["","Es b − a.","No.","Olvidaste dividir por 12.","No."],
 src:"Resumen §8.4"},

{u:8, q:"X ~ Binomial(n = 200, p = 0,01). ¿Con qué Poisson se aproxima?",
 o:["λ = 200","λ = 2","λ = 0,01","No se puede, porque n no supera 1000","λ = 1,98"],
 a:1,
 why:"Con n grande y p chico, Binomial(n, p) ≈ Poisson(**λ = np**) = 200·0,01 = 2. Ross **no da un umbral numérico**: una opción con «solo si n > ...» es falsa.",
 n:["No.","","No.","No hay un umbral fijo.","Es la varianza np(1 − p) de la binomial."],
 src:"Resumen §8.3"},

{u:8, q:"X ~ Poisson(λ = 2), con P(X = 2) ≈ 0,2707. Usando la fórmula de recurrencia, ¿cuánto vale P(X = 3)?",
 o:["≈ 0,1804","≈ 0,5413","≈ 0,2707","≈ 0,0902","≈ 0,1353"],
 a:0,
 why:"Recurrencia: P(i + 1) = λ/(i + 1) · P(i) = 2/3 · 0,2707 ≈ **0,1804**. Existe para no recalcular factoriales y potencias, y es lo que usa AnyLogic. La demostración no se pide.",
 n:["","Multiplicaste por λ sin dividir.","Repetiste P(2).","Dividiste por 3 sin multiplicar por λ.","Es e^(−2) = P(0)."],
 src:"Resumen §8.3"},

{u:8, q:"¿Cuál es la **única** distribución, de las vistas, cuya esperanza y varianza son iguales?",
 o:["Exponencial","Binomial","Poisson","Uniforme","Geométrica"],
 a:2,
 why:"Poisson: **E = Var = λ**. Ojo: en la exponencial la **media** es igual al **desvío** (1/λ), pero la varianza es 1/λ².",
 n:["E = 1/λ, Var = 1/λ²: no son iguales.","Var = np(1 − p) < np.","","No.","No."],
 src:"Resumen §8.3"},

{u:8, q:"Cada tirada tiene probabilidad 0,2 de éxito. ¿En qué tirada se espera el **primer éxito**?",
 o:["0,2","4","5","1","0,8"],
 a:2,
 why:"Es una **geométrica**: cuenta el número de la tirada del primer éxito, y **E = 1/p** = 1/0,2 = **5**.",
 n:["Es p.","Sería la cantidad de fracasos antes del éxito.","","No.","Es 1 − p."],
 src:"Resumen §8.3"},

{u:8, q:"Una urna tiene 10 bolillas, 4 blancas. Sacás 3 **sin reposición**. ¿Qué distribución tiene la cantidad de blancas?",
 o:["Binomial(3; 0,4)","Hipergeométrica","Geométrica","Poisson(1,2)","Bernoulli"],
 a:1,
 why:"**Sin reposición**, la probabilidad cambia en cada extracción: es la **hipergeométrica**. Con reposición sería Binomial(3; 0,4).",
 n:["Sería con reposición.","","Cuenta tiradas hasta el primer éxito.","No.","Es una sola prueba."],
 src:"Resumen §8.3"},

{u:8, q:"¿Qué afirmación sobre el **teorema central del límite** es correcta?",
 o:["Requiere que las Xᵢ sean normales","Dice que el promedio es exactamente normal para todo n",
    "Para n grande, (X̄ − μ)/(σ/√n) es aproximadamente N(0, 1), cualquiera sea la distribución de las Xᵢ i.i.d.","Dice que X̄ converge a μ","Solo vale para variables discretas"],
 a:2,
 why:"Pide Xᵢ **i.i.d.** con μ y σ² finitas. Las Xᵢ **no** tienen que ser normales, y el resultado es **aproximado**. El profe lo marcó como «muy importante». Ejemplo: una uniforme sola es chata, pero la suma de 12 parece una campana.",
 n:["Trampa: no hace falta.","Es aproximado.","","Eso es la ley de los grandes números.","Vale para cualquier distribución."],
 src:"Resumen §8.4"},

{u:8, q:"En la ley de los grandes números, ¿qué es lo que tiende a infinito?",
 o:["El tiempo de simulación","La cantidad de observaciones n","La varianza","La media","La tasa λ"],
 a:1,
 why:"El promedio de **n** variables i.i.d. converge a μ cuando **n → ∞**. Lo que crece es la cantidad de observaciones, **no el tiempo**.",
 n:["Trampa clásica.","","La varianza de X̄ baja.","La media es fija.","No."],
 src:"Resumen §8.2"},

{u:8, q:"La **ley débil** de los grandes números se demuestra con:",
 o:["Markov aplicado directamente a X̄","Chebyshev y Var(X̄) = σ²/n, que necesita independencia","El TCL","La falta de memoria","La recurrencia de Poisson"],
 a:1,
 why:"Var(X̄) = σ²/n (esto pide **independencia**). Chebyshev da P(|X̄ − μ| > ε) ≤ σ²/(nε²), que tiende a 0 cuando n → ∞.",
 n:["Se usa Chebyshev, que a su vez sale de Markov.","","El TCL es otro resultado.","No.","No."],
 src:"Resumen §8.2"},

{u:8, q:"Las Xᵢ son i.i.d. con σ² = 25. ¿Cuál es el **desvío estándar** de X̄ con n = 100?",
 o:["0,25","0,5","2,5","5","0,05"],
 a:1,
 why:"Var(X̄) = σ²/n = 25/100 = 0,25, así que el desvío es √0,25 = **0,5** (que también es σ/√n = 5/10).",
 n:["Es la varianza, no el desvío.","","Hiciste σ²/10.","Es σ.","No."],
 src:"Resumen §8.2"},

{u:8, q:"Proceso de Poisson no homogéneo con λ(t) = 2t. ¿Qué distribución tiene la cantidad de eventos en (1, 2]?",
 o:["Poisson de media 2","Poisson de media 3","Poisson de media 4","Exponencial de tasa 2","Poisson de media 1"],
 a:1,
 why:"m(t) = ∫₀ᵗ 2s ds = t². La cantidad en (t, t + s] es Poisson de media **m(t + s) − m(t)** = m(2) − m(1) = 4 − 1 = **3**.",
 n:["Usaste λ(1)·1.","","Es m(2): olvidaste restar m(1).","Las cantidades son discretas.","Es m(1)."],
 src:"Resumen §8.5"},

{u:8, q:"Proceso de Poisson de 6 llegadas por hora. ¿Cuál es la probabilidad de **cero llegadas en 20 minutos**?",
 o:["≈ 0,135","≈ 0,368","≈ 0,0025","≈ 0,865","0"],
 a:0,
 why:"N(1/3 h) ~ Poisson(λt) = Poisson(6·1/3 = 2). P(N = 0) = e^(−2) ≈ **0,135**.",
 n:["","Es e^(−1): usaste 10 minutos.","Es e^(−6): usaste una hora.","Es 1 − e^(−2).","No."],
 src:"Resumen §8.5"},

{u:8, q:"¿Cuál de estas **no** es una de las condiciones del proceso de Poisson homogéneo?",
 o:["N(0) = 0","Incrementos independientes","Incrementos estacionarios","Los tiempos entre eventos tienen distribución de Poisson","Los eventos ocurren de a uno"],
 a:3,
 why:"Las cinco condiciones son: N(0) = 0, incrementos independientes, incrementos estacionarios, P(1 evento en h) ≈ λh y P(2 o más en h) ≈ 0. Los tiempos entre eventos salen como **consecuencia**, y son **exponenciales**, no Poisson.",
 n:["Es condición.","Es condición.","Es condición.","","Es condición."],
 src:"Resumen §8.5"},

{u:8, q:"¿Qué diferencia hay entre la ley de los grandes números y el TCL?",
 o:["Son lo mismo","La LGN dice a qué valor converge el promedio (μ); el TCL dice qué forma tiene su distribución (normal)",
    "La LGN dice que el promedio es normal","El TCL necesita variables normales","La LGN vale solo para Poisson"],
 a:1,
 why:"**LGN**: X̄ → μ, o sea **a dónde** va el promedio. **TCL**: la distribución de X̄ alrededor de μ es aproximadamente normal, o sea **qué forma** tiene. En simulación, la LGN justifica promediar corridas y el TCL permite armar intervalos de confianza.",
 n:["No.","","Eso es el TCL.","No.","Vale en general."],
 src:"Resumen §8.2 y §8.4"},

{u:8, q:"X ~ N(50, 16), con varianza 16. ¿Cuánto vale P(X > 58) expresada en Z?",
 o:["P(Z > 0,5)","P(Z > 2)","P(Z > 8)","P(Z > 0,125)","P(Z > 1)"],
 a:1,
 why:"σ = √16 = 4. Z = (58 − 50)/4 = **2**. Ojo: el segundo parámetro es la varianza, así que se divide por σ, no por σ².",
 n:["Dividiste por 16.","","No estandarizaste.","No.","No."],
 src:"Resumen §8.4"},

{u:8, q:"¿Por qué los modelos analíticos de colas usan tiempos exponenciales?",
 o:["Porque siempre son realistas","Por conveniencia matemática: la falta de memoria hace que el estado sea solo cuántos hay, y así hay fórmulas cerradas",
    "Porque es la única distribución continua","Porque tiene media cero","Porque lo exige AnyLogic"],
 a:1,
 why:"Como no tiene memoria, no hace falta registrar hace cuánto empezó el servicio actual: el estado es solo **n**. Eso da fórmulas cerradas como las del M/M/1. Es una elección por **conveniencia**, no porque sea realista.",
 n:["No siempre lo es.","","Hay muchas.","Tiene media 1/λ > 0.","No."],
 src:"Resumen §8.4"},

{u:8, q:"X ~ Exponencial(λ = 0,5). ¿Cuánto vale P(X ≤ 2)?",
 o:["≈ 0,368","≈ 0,632","1","0,25","≈ 0,865"],
 a:1,
 why:"F(x) = 1 − e^(−λx) = 1 − e^(−1) ≈ **0,632**.",
 n:["Es P(X > 2).","","No.","No.","Sería con λ = 1."],
 src:"Resumen §8.4"},

{u:8, fix:true, q:"Sea X una variable **geométrica** de parámetro p, definida como el número del intento en que ocurre el primer éxito. ¿Qué es correcto?",
 o:["P{X = i} = (1 − p)^(i−1) · p, para i ≥ 1","Var(X) = (1 − p)/p²","E[X] = (1 − p)/p","A y B","A, B y C"],
 a:3,
 why:"A es la función de masa: i − 1 fracasos seguidos de un éxito. B es la varianza que da Ross. **C es falsa**: (1 − p)/p es la esperanza de la cantidad de **fracasos** antes del primer éxito. Como Ross cuenta el número del intento, E[X] = 1/p. Es la pregunta 1.1 del parcial 2025 con otra trampa.",
 n:["Verdadera, pero no es la única.","Verdadera, pero no es la única.","Falsa: esa es la media de los fracasos, no del número de intento.","","Incluye C, que es falsa."],
 src:"Resumen §8.3 · parcial 2025 P1.1"},

{u:8, q:"X ~ Binomial(n = 10; p = 0,3). ¿Cuánto vale Var(2X + 5)?",
 o:["13,4","9,2","4,2","8,4","12,0"],
 a:3,
 why:"Var(X) = np(1 − p) = 10 · 0,3 · 0,7 = 2,1. Entonces Var(2X + 5) = 2² · 2,1 = **8,4**. El +5 no cambia la dispersión.",
 n:["Le sumaste 5 a la varianza.","Hiciste 2 · 2,1 + 5.","Multiplicaste por 2, no por 2².","","Usaste np = 3 como si fuera la varianza (4 · 3)."],
 src:"Resumen §8.1 y §8.3"},

{u:8, t:"ms", q:"X ~ Poisson(λ). Marcá **todas** las afirmaciones correctas.",
 o:["E[X] = Var(X) = λ","P{X = 0} = e^(−λ)","P{X = i + 1} = λ/(i + 1) · P{X = i}","Es continua y modela el tiempo entre eventos de un proceso de Poisson","Es la suma de λ variables de Bernoulli independientes"],
 a:[0,1,2],
 why:"Las tres primeras son la media y varianza, la masa en 0 (e^(−λ) λ⁰/0!) y la fórmula de recurrencia. La Poisson es **discreta** y cuenta eventos; el tiempo entre eventos es exponencial. La suma de Bernoulli es la **binomial**.",
 n:["Verdadera: la única con E = Var.","Verdadera.","Verdadera: es la recurrencia que usa AnyLogic.","Falsa: confunde Poisson con exponencial.","Falsa: es la binomial (y λ ni siquiera tiene que ser entero)."],
 src:"Resumen §8.3 y §8.5"},

{u:8, q:"Un proceso de Poisson tiene tasa 4 por hora. ¿Cuál es la probabilidad de que ocurran **exactamente 2 eventos en 30 minutos**?",
 o:["≈ 0,1465","≈ 0,5413","≈ 0,2707","≈ 0,1353","≈ 0,7293"],
 a:2,
 why:"N(0,5 h) ~ Poisson(λt) = Poisson(4 · 0,5 = 2). P{N = 2} = e^(−2) · 2²/2! = 2e^(−2) ≈ **0,2707**.",
 n:["Usaste una hora: Poisson(4) en i = 2.","Olvidaste dividir por 2!.","","Es P{N = 0} = e^(−2).","Es 1 − 0,2707: la probabilidad de que **no** sean exactamente 2."],
 src:"Resumen §8.5"},

{u:8, fix:true, q:"Proceso de Poisson homogéneo de tasa λ = 3. Sobre la cantidad de eventos en el intervalo (2, 5]:",
 o:["Depende de cuántos eventos hubo en [0, 2]", "Tiene distribución Poisson de media 9", "Es independiente de la cantidad de eventos en [0, 2]", "A y B", "B y C"],
 a:4,
 why:"Por **incrementos estacionarios**, solo importa el largo del intervalo (3), así que la media es λ · 3 = 9. Por **incrementos independientes**, lo que pasa en (2, 5] no depende de lo que pasó en [0, 2], porque los intervalos no se superponen.",
 n:["Falsa: contradice los incrementos independientes.", "Verdadera.", "Verdadera.", "A es falsa.", ""],
 src:"Resumen §8.5"},

{u:8, q:"Proceso **no homogéneo** con λ(t) = 3 si t < 2 y λ(t) = 1 si t ≥ 2. ¿Qué distribución tiene la cantidad de eventos en (1, 4]?",
 o:["Poisson de media 9","Poisson de media 6","Poisson de media 3","Poisson de media 5","Poisson de media 8"],
 a:3,
 why:"m(4) − m(1) = área bajo λ(t) entre 1 y 4. De 1 a 2: 3 · 1 = 3. De 2 a 4: 1 · 2 = 2. Total: **5**. En el no homogéneo hay que integrar λ(t); no alcanza con multiplicar una tasa por el largo.",
 n:["Usaste λ = 3 en todo el intervalo.","Promediaste las tasas (2) y multiplicaste por 3.","Usaste λ = 1 en todo el intervalo.","","Es m(4) = 8: olvidaste restar m(1) = 3."],
 src:"Resumen §8.5"},

{u:8, t:"vf", q:"«En un proceso de Poisson no homogéneo, la distribución del número de eventos en un intervalo depende solo de la longitud del intervalo.»",
 o:VF, a:1,
 why:"Falso. «Depende solo de la longitud» es la definición de **incrementos estacionarios**, que es justamente lo que el no homogéneo **pierde**. Con λ(t) variable importa **dónde** está el intervalo.",
 n:["",""], src:"Resumen §8.5"},

{u:8, t:"vf", q:"«En un proceso de Poisson homogéneo, la cantidad de eventos en (0, 1] y la cantidad en (3, 4] son independientes y tienen la misma distribución.»",
 o:VF, a:0,
 why:"Verdadero. Son intervalos que no se superponen, así que son independientes. Además tienen el mismo largo, así que por estacionariedad las dos son Poisson(λ).",
 n:["",""], src:"Resumen §8.5"},

{u:8, q:"La duración de un servicio es exponencial de **media 6 minutos**. El cliente actual ya lleva 4 minutos. ¿Cuál es la duración **total** esperada de su servicio?",
 o:["6 minutos","2 minutos","4 minutos","10 minutos","8 minutos"],
 a:3,
 why:"Por falta de memoria, lo que **falta** tiene media 6, como si recién empezara. La duración **total** es lo que ya pasó más lo que falta: 4 + 6 = **10**. La trampa es responder 6, que es lo que falta, no el total.",
 n:["Es lo que falta, no la duración total.","Restaste: supone que el servicio «recuerda» que tenía que durar 6.","Es solo lo que ya pasó.","","No."],
 src:"Resumen §8.4"},

{u:8, q:"Tres cajeros atienden con tiempos exponenciales independientes, cada uno a tasa 12 por hora. Los tres están ocupados. ¿Cuánto falta, en promedio, para la **próxima** salida?",
 o:["5 minutos","15 minutos","≈ 1,67 minutos","2,5 minutos","≈ 0,6 minutos"],
 a:2,
 why:"El mínimo de exponenciales independientes es exponencial con la **suma de las tasas**: 36 por hora. La media es 1/36 h ≈ **1,67 min**.",
 n:["Es la media de un solo cajero.","Sumaste las medias.","","Dividiste por 2 en vez de por 3.","No."],
 src:"Resumen §8.4"},

{u:8, fix:true, q:"X es exponencial de tasa λ y c > 0 es una constante. ¿Qué es correcto?",
 o:["cX es exponencial de tasa cλ", "E[cX] = 1/(cλ)", "cX es exponencial de tasa λ/c, con media c/λ", "A y B", "Todas"],
 a:2,
 why:"Escalar los tiempos por c divide la tasa por c: cX es exponencial de tasa λ/c, y su media es 1/(λ/c) = c/λ, que coincide con c · E[X]. A y B son el mismo error: multiplicar la tasa por c.",
 n:["Falsa: multiplicar los tiempos baja la tasa.", "Falsa: sería la media si la tasa fuera cλ.", "", "Las dos son falsas.", "A y B son falsas."],
 src:"Resumen §8.4"},

{u:8, q:"X es exponencial y P{X > 2 | X > 1} = 0,6. ¿Cuánto vale P{X > 3 | X > 1}?",
 o:["0,6","0,4","0,216","0,12","0,36"],
 a:4,
 why:"Por falta de memoria, P{X > 2 | X > 1} = P{X > 1} = 0,6. Y P{X > 3 | X > 1} = P{X > 2} = P{X > 1}² = 0,6² = **0,36**, porque P{X > t} = e^(−λt).",
 n:["Supone que faltar 2 unidades cuesta lo mismo que faltar 1.","Es el complemento.","Es 0,6³: contaste tres unidades en vez de dos.","No.",""],
 src:"Resumen §8.4", gen:true},

{u:8, q:"X e Y son independientes, con Var(X) = 2 y Var(Y) = 3. ¿Cuánto vale Var(2X − 3Y + 1)?",
 o:["−19","13","36","35","5"],
 a:3,
 why:"Var(2X − 3Y + 1) = 2² · 2 + (−3)² · 3 = 8 + 27 = **35**. El signo menos se va al elevar al cuadrado, y el +1 no aporta.",
 n:["Restaste las varianzas (8 − 27).","No elevaste los coeficientes al cuadrado (4 + 9).","Sumaste el 1.","","Sumaste las varianzas sin coeficientes."],
 src:"Resumen §8.1"},

{u:8, q:"Var(X) = 4, Var(Y) = 9 y Var(X + Y) = 19. ¿Cuánto vale Cov(X, Y)?",
 o:["6","0","3","−3","1,5"],
 a:2,
 why:"Var(X + Y) = Var(X) + Var(Y) + 2Cov. Entonces 19 = 13 + 2Cov, y Cov = **3**. Como no es 0, X e Y **no** son independientes.",
 n:["Olvidaste dividir por 2.","Supusiste independencia, pero el dato la contradice.","","Signo cambiado.","Dividiste por 4."],
 src:"Resumen §8.1"},

{u:8, t:"ms", q:"¿Cuáles valen para **cualquier** par de variables X, Y, sin suponer independencia? Marcá todas.",
 o:["E[X + Y] = E[X] + E[Y]","E[3X − 2] = 3E[X] − 2","Var(X + Y) = Var(X) + Var(Y)","Var(X + c) = Var(X), para c constante","Var(−X) = −Var(X)"],
 a:[0,1,3],
 why:"La linealidad de la esperanza vale **siempre**. Sumar una constante no cambia la varianza. La varianza de la suma necesita Cov = 0. Y Var(−X) = (−1)² Var(X) = Var(X), nunca negativa.",
 n:["Verdadera: siempre.","Verdadera: E[aX + b] = aE[X] + b.","Falsa: le falta + 2Cov(X, Y).","Verdadera: es Var(aX + b) con a = 1.","Falsa: Var(−X) = Var(X)."],
 src:"Resumen §8.1"},

{u:8, q:"En la demostración de Var(aX + b) = a²Var(X), ¿por qué desaparece la b?",
 o:["Porque la esperanza de una constante es cero, y E[b] se anula al desarrollar","Porque b es independiente de X, así que su covarianza con X vale cero","Porque al restar la media queda b − b","Porque Var(b) = b², que se cancela con el término cruzado","Porque la demostración supone b = 0 sin pérdida de generalidad"],
 a:2,
 why:"aX + b − E[aX + b] = aX + b − (aE[X] + b) = a(X − E[X]). La b se cancela con la b de la media, y queda E[a²(X − E[X])²] = a²Var(X).",
 n:["Falso: E[b] = b, no 0.","La b es constante; no se usa covarianza en la prueba.","","Var(b) = 0, y no hay término cruzado que la cancele.","No se supone nada sobre b."],
 src:"Resumen §8.1 · resumen-probabilidad §3.4"},

{u:8, q:"Para pasar de E[X² − 2μX + μ²] a E[X²] − 2μE[X] + μ², ¿qué se usa?",
 o:["Que X y X² son independientes, y la esperanza del producto se separa", "Que E[X²] = E[X]², lo que permite cancelar el término cuadrático", "La desigualdad de Chebyshev aplicada a (X − μ)²", "La linealidad de E (μ es constante)", "La propiedad Var(aX + b) = a²Var(X) con a = −2μ"],
 a:3,
 why:"La esperanza de una suma es la suma de las esperanzas, y como 2μ y μ² son **constantes**, salen afuera. Después se reemplaza E[X] = μ y queda E[X²] − μ².",
 n:["X y X² casi nunca son independientes, y no hace falta.","Es falso en general: la diferencia es justamente la varianza.","No interviene.","","Se usa en otra demostración."],
 src:"Resumen-probabilidad §3.2"},

{u:8, q:"Una variable tiene μ = 50 y σ = 5, de distribución desconocida. ¿Qué dice Chebyshev sobre P{40 < X < 60}?",
 o:["Que es a lo sumo 0,25","Que es aproximadamente 0,9545","Que es al menos 0,95","Que es al menos 0,75","Que es a lo sumo 0,75"],
 a:3,
 why:"40 y 60 están a k = 2 desvíos. Chebyshev: P{|X − 50| ≥ 10} ≤ 1/4. Entonces lo que queda **adentro** es P{40 < X < 60} ≥ 1 − 1/4 = **0,75**. El 0,9545 es de la normal, que no se puede suponer.",
 n:["Esa cota es para lo de **afuera**.","Es el valor de la normal.","No.","","La desigualdad está al revés."],
 src:"Resumen §8.2"},

{u:8, q:"X ≥ 0 con E[X] = 2. ¿Cuál es una conclusión correcta de **Markov**?",
 o:["P{X ≥ 10} = 0,2","P{X ≤ 10} ≤ 0,8","P{X ≥ 10} ≥ 0,2","Hace falta conocer la varianza","P{X ≥ 10} ≤ 0,2"],
 a:4,
 why:"Markov: P{X ≥ a} ≤ E[X]/a = 2/10 = **0,2**. Es una cota **superior**. Su complemento daría P{X < 10} ≥ 0,8, no ≤.",
 n:["Es una cota, no un valor exacto.","El complemento invierte la desigualdad: sería ≥ 0,8.","Está al revés.","Eso lo pide Chebyshev; a Markov le alcanza con E[X] y X ≥ 0.",""],
 src:"Resumen §8.2"},

{u:8, q:"La desigualdad de Chebyshev se obtiene aplicando la de Markov a:",
 o:["X, con a = kσ, y la cota E[X]/(kσ)", "|X − μ|, con a = kσ, sin elevar al cuadrado", "(X − μ)²/σ², con a = k²", "X̄, con a = μ, usando Var(X̄) = σ²/n", "e^X, con a = e^k"],
 a:2,
 why:"(X − μ)²/σ² es no negativa y tiene esperanza 1. Markov con a = k² da P{(X − μ)² ≥ k²σ²} ≤ 1/k², que es P{|X − μ| ≥ kσ} ≤ 1/k².",
 n:["X puede ser negativa, y no da 1/k².", "Es un Markov válido, pero da E|X − μ|/(kσ), no 1/k².", "", "No.", "No."],
 src:"Resumen §8.2"},

{u:8, q:"¿Qué dice la **ley débil** de los grandes números?",
 o:["Que X̄ₙ = μ a partir de algún n suficientemente grande","Que P{X̄ₙ → μ} = 1","Que X̄ₙ es aproximadamente normal para n grande","Que P{|X̄ₙ − μ| > ε} → 0, para todo ε > 0","Que Var(X̄ₙ) tiende a σ² cuando n crece"],
 a:3,
 why:"La débil habla de la **probabilidad de estar lejos**, que tiende a 0. «Con probabilidad 1» es la **fuerte**. «Aproximadamente normal» es el **TCL**. Y Var(X̄) = σ²/n tiende a 0, no a σ².",
 n:["X̄ nunca queda exactamente igual a μ.","Es la ley fuerte.","Es el TCL.","","Tiende a 0."],
 src:"Resumen §8.2"},

{u:8, t:"vf", q:"«Para que valga Var(X̄) = σ²/n alcanza con que las Xᵢ tengan todas la misma media.»",
 o:VF, a:1,
 why:"Falso. Hace falta que tengan la **misma varianza** σ² y que sean **independientes** (o al menos no correlacionadas), para que la varianza de la suma sea la suma de las varianzas. La media no interviene.",
 n:["",""], src:"Resumen §8.2"},

{u:8, q:"Las Xᵢ son i.i.d. con media 10 y desvío 4. Con n = 64, ¿a qué equivale aproximadamente P{X̄ > 11}?",
 o:["P{Z > 0,25}","P{Z > 4}","P{Z > 0,5}","No se puede calcular: las Xᵢ no son normales","P{Z > 2}"],
 a:4,
 why:"Por el TCL, X̄ ≈ N(10; σ/√n) con σ/√n = 4/8 = 0,5. Z = (11 − 10)/0,5 = **2**. No hace falta que las Xᵢ sean normales.",
 n:["Dividiste por σ y no por σ/√n.","Usaste la varianza de X̄ (0,25) como si fuera el desvío.","Es σ/√n, no el valor de Z.","Es la trampa: el TCL no lo exige.",""],
 src:"Resumen §8.4"},

{u:8, t:"ms", q:"Sobre el **teorema central del límite**, marcá todas las correctas.",
 o:["Requiere Xᵢ i.i.d. con media y varianza finitas","Requiere que las Xᵢ sean normales","La aproximación mejora a medida que n crece","Para n finito, el resultado es exacto","Justifica generar una normal sumando 12 uniformes y restando 6"],
 a:[0,2,4],
 why:"El TCL pide i.i.d. con μ y σ² finitas. La normal es **aproximada** y mejora con n. Por eso Naylor genera normales sumando 12 uniformes: suma de 12 U(0,1) tiene media 6 y varianza 1.",
 n:["Verdadera.","Falsa: cualquier distribución.","Verdadera.","Falsa: es aproximado.","Verdadera: es uno de los métodos del TP 2.2."],
 src:"Resumen §8.4 y §9.2"},

{u:8, fix:true, q:"Un lote tiene 20 piezas, 5 defectuosas. Se inspeccionan 4 **sin reposición**. Comparada con una Binomial(4; 0,25), la cantidad de defectuosas tiene:",
 o:["Mayor varianza", "La misma esperanza y menor varianza", "Distinta esperanza, porque las extracciones no son independientes", "A y C", "Ninguna de las anteriores"],
 a:1,
 why:"Es **hipergeométrica**: E = n · N/(N + M) = 4 · 5/20 = 1, igual que la binomial. La varianza se multiplica por (N + M − n)/(N + M − 1) = 16/19 < 1, así que es **menor**. Sin reposición cada extracción da información, y la incertidumbre baja.",
 n:["Falsa: el factor de corrección es menor que 1.", "", "Falsa: la esperanza es la misma, n · N/(N + M).", "Las dos son falsas.", "B es correcta."],
 src:"Resumen §8.3"},

{u:8, q:"Cada intento tiene p = 0,25 de éxito. ¿Cuántos intentos se esperan hasta el **tercer** éxito?",
 o:["4","9","3","0,75","12"],
 a:4,
 why:"Binomial negativa (Pascal): E = r/p = 3/0,25 = **12**. Es la suma de 3 geométricas de media 1/p = 4.",
 n:["Es hasta el primer éxito.","Es la cantidad de **fracasos** esperados: r(1 − p)/p.","Es r.","Es r · p.",""],
 src:"Resumen §8.3"},

{u:8, q:"X ~ Binomial(5; 0,5), con P{X = 1} = 0,15625. Con la recurrencia P{i+1} = (n − i)/(i + 1) · p/(1 − p) · P{i}, ¿cuánto vale P{X = 2}?",
 o:["0,15625","0,625","0,3125","0,078","0,25"],
 a:2,
 why:"Con i = 1: (5 − 1)/(1 + 1) · (0,5/0,5) · 0,15625 = 2 · 1 · 0,15625 = **0,3125**. Control: C(5,2)/32 = 10/32.",
 n:["Repetiste P{1}.","Usaste (n − i) = 4 sin dividir por (i + 1).","","Dividiste en vez de multiplicar.","No."],
 src:"Resumen §8.3"},

{u:8, q:"¿Cuál de estas **no** es uno de los tres axiomas de probabilidad?",
 o:["0 ≤ P(A) ≤ 1","P(S) = 1","P(A ∪ B) = P(A) + P(B) para A y B mutuamente excluyentes","P(Aᶜ) = 1 − P(A)","Ninguna: las cuatro son axiomas"],
 a:3,
 why:"P(Aᶜ) = 1 − P(A) es una **consecuencia**: A y Aᶜ son excluyentes y su unión es S, así que por los axiomas 2 y 3, 1 = P(A) + P(Aᶜ).",
 n:["Axioma 1.","Axioma 2.","Axioma 3.","","Una de ellas se deduce."],
 src:"Resumen-probabilidad §2"},

{u:8, fix:true, q:"P(A) = 0,5, P(B) = 0,4 y P(A ∩ B) = 0,2. ¿Qué es correcto?",
 o:["P(A | B) = 0,5", "A y B son independientes", "P(A ∪ B) = 0,7", "A y B", "Todas"],
 a:4,
 why:"P(A | B) = 0,2/0,4 = 0,5 = P(A), así que son **independientes** (P(AB) = 0,5 · 0,4 = 0,2 lo confirma). Y P(A ∪ B) = P(A) + P(B) − P(AB) = 0,7. Las tres son verdaderas: esta vez «todas» es la correcta, así que no la descartes por reflejo.",
 n:["Verdadera: 0,2/0,4.", "Verdadera: P(A | B) = P(A).", "Verdadera: 0,5 + 0,4 − 0,2.", "Es incompleta: C también es verdadera.", ""],
 src:"Resumen-probabilidad §2"},

{u:8, q:"X ~ Uniforme(0, b) y Var(X) = 3. ¿Cuánto vale b?",
 o:["36","3","12","6","√3"],
 a:3,
 why:"Var = (b − 0)²/12 = 3, así que b² = 36 y b = **6**.",
 n:["Es b².","No.","Multiplicaste 3 · 4.","","No."],
 src:"Resumen §8.4"},

{u:8, q:"X ~ N(10; 9), con varianza 9. ¿Qué distribución tiene Y = 2X − 4?",
 o:["N(16; 18)","N(16; 14)","N(20; 36)","No es normal, porque se restó una constante","N(16; 36)"],
 a:4,
 why:"aX + b sigue siendo normal. Media: 2 · 10 − 4 = 16. Varianza: 2² · 9 = 36.",
 n:["Multiplicaste la varianza por 2, no por 4.","Restaste 4 también a la varianza.","Olvidaste restar 4 a la media.","Falso: aX + b es normal.",""],
 src:"Resumen §8.4"},

{u:8, q:"Llegan en promedio 2 clientes por minuto (proceso de Poisson). ¿Cuál es la probabilidad de que el próximo llegue en **menos de 30 segundos**?",
 o:["≈ 0,368","≈ 0,865","≈ 0,393","≈ 0,632","0,5"],
 a:3,
 why:"El tiempo hasta el próximo es exponencial de tasa 2/min. P{T < 0,5} = 1 − e^(−2 · 0,5) = 1 − e^(−1) ≈ **0,632**.",
 n:["Es la de que tarde **más** de 30 s.","Usaste un minuto.","Usaste tasa 1.","","Supone uniforme."],
 src:"Resumen §8.4 y §8.5"},

{u:8, q:"Un sistema recibe 1000 pedidos por día; cada uno falla con probabilidad 0,002, de forma independiente. ¿Cuál es, aproximadamente, la probabilidad de que **ninguno** falle en un día?",
 o:["≈ 0,368","≈ 0,998","≈ 0,271","≈ 0,135","0,002"],
 a:3,
 why:"Es Binomial(1000; 0,002), con n grande y p chico: ≈ Poisson(λ = np = 2). P{0} = e^(−2) ≈ **0,135**.",
 n:["Es e^(−1).","Es la probabilidad de que un pedido **no** falle.","Es P{1} = P{2}.","","Es p."],
 src:"Resumen §8.3"},

{u:8, t:"vf", q:"«La exponencial es la única distribución que no tiene memoria.»",
 o:VF, a:1,
 why:"Falso por una palabra: es la única **continua** sin memoria. En el mundo discreto, la **geométrica** también la tiene: si ya fallaron 5 intentos, la cantidad que falta hasta el éxito tiene la misma distribución que al principio.",
 n:["",""], src:"Resumen §8.4 · lo de la geométrica es conocimiento general", gen:true},

{u:8, q:"¿Cuál de las condiciones del proceso de Poisson garantiza que los eventos ocurran **de a uno**?",
 o:["N(0) = 0","Incrementos independientes","Incrementos estacionarios","lim P{N(h) = 1}/h = λ","lim P{N(h) ≥ 2}/h = 0"],
 a:4,
 why:"La quinta condición dice que en un intervalo muy chico la probabilidad de dos o más eventos es despreciable frente a h: no hay llegadas simultáneas.",
 n:["Solo fija el arranque.","Habla de intervalos disjuntos.","Habla del largo del intervalo.","Fija la tasa de uno, no excluye dos.",""],
 src:"Resumen §8.5"},

{u:8, fix:true, q:"Sobre el proceso de Poisson **no homogéneo** con intensidad λ(t):",
 o:["Se pierden los incrementos independientes", "λ varía en función del tiempo", "N(t + s) − N(t) es Poisson de media m(t + s) − m(t)", "A y B", "B y C"],
 a:4,
 why:"B es la definición. C es la propiedad con m(t) = ∫λ. **A es falsa**: los incrementos siguen independientes y lo que se pierde es la estacionariedad. Es la 1.13 del parcial 2025 con otra combinación.",
 n:["Falsa: la trampa clásica.", "Verdadera.", "Verdadera.", "A es falsa.", ""],
 src:"Resumen §8.5 · parcial 2025 P1.13"},

{u:7, q:"M/M/1 con λ = 8 por hora. Se mide W = 30 minutos. ¿Cuánto vale μ?",
 o:["16 por hora","12 por hora","2 por hora","8,4 por hora","10 por hora"],
 a:4,
 why:"L = λW = 8 · 0,5 = 4. En M/M/1, L = ρ/(1 − ρ) = 4, así que ρ = 0,8 y μ = λ/ρ = **10**. Control: W = 1/(μ − λ) = 1/2 h.",
 n:["Hiciste λ/W.","No.","Es 1/W.","No.",""],
 src:"Resumen §7.3 y §7.4"},

{u:7, q:"M/M/1 con μ = 5 por hora. Se mide W = 0,5 h y Lq = 0,9. ¿Cuánto vale λ?",
 o:["1,8 por hora","4,5 por hora","3 por hora","2 por hora","6 por hora"],
 a:2,
 why:"Wq = W − 1/μ = 0,5 − 0,2 = 0,3 h. Little: λ = Lq/Wq = 0,9/0,3 = **3**. Control: ρ = 0,6 y Lq = 0,36/0,4 = 0,9.",
 n:["Hiciste Lq/W: Lq va con Wq.","Dividiste por 1/μ.","","No.","Daría ρ > 1."],
 src:"Resumen §7.3"},

{u:7, t:"ms", q:"M/M/1 con ρ = 0,8. Marcá todas las correctas.",
 o:["P0 = 0,2","pw = 0,8","L = 4","Lq = 3,2","L − Lq = 0,2"],
 a:[0,1,2,3],
 why:"P0 = 1 − ρ = 0,2. pw = ρ = 0,8. L = 0,8/0,2 = 4. Lq = 0,64/0,2 = 3,2. Y L − Lq = 0,8 = ρ (el número medio en servicio), no 0,2.",
 n:["Verdadera.","Verdadera.","Verdadera.","Verdadera.","Falsa: L − Lq = ρ = 0,8."],
 src:"Resumen §7.4"},

{u:7, q:"M/M/1 con ρ = 0,5. ¿Cuál es la probabilidad de que haya **más de 2** clientes en el sistema?",
 o:["0,25","0,875","0,0625","0,5","0,125"],
 a:4,
 why:"Pn = (1 − ρ)ρⁿ: P0 = 0,5, P1 = 0,25, P2 = 0,125. P{N > 2} = 1 − 0,875 = **0,125** (que es ρ³).",
 n:["Es P{N > 1} = ρ².","Es P{N ≤ 2}.","Es P{N > 3} = ρ⁴.","Es P{N > 0}.",""],
 src:"Resumen §7.4", gen:true},

{u:7, fix:true, q:"Sobre el modelo **M/M/3/10/50**:",
 o:["Hay 3 servidores en paralelo","Caben a lo sumo 10 clientes en cola, además de los que se atienden","La población es de 50 clientes","A y C","Todas"],
 a:3,
 why:"Posiciones: A/S/c/K/L. c = 3 servidores, K = 10 es la capacidad del **sistema** (cola más servicio), y L = 50 la población. B es falsa: en cola caben a lo sumo 7.",
 n:["Verdadera.","Falsa: K cuenta todo el sistema.","Verdadera.","","B es falsa."],
 src:"Resumen §7.2 · Wiki U8 §8.3"},

{u:7, t:"vf", q:"«En un M/M/c, la condición de estado estable es λ < μ.»",
 o:VF, a:1,
 why:"Falso. Con c servidores la capacidad total es cμ, así que la condición es **λ < cμ**, o sea ρ = λ/(cμ) < 1. λ < μ es la del M/M/1.",
 n:["",""], src:"Resumen §7.5"},

{u:7, t:"vf", q:"«La ley de Little vale solo para modelos con llegadas Poisson y servicio exponencial.»",
 o:VF, a:1,
 why:"Falso. L = λW y Lq = λWq son **universales**: valen en estado estable para cualquier modelo de colas.",
 n:["",""], src:"Resumen §7.3"},

{u:7, q:"Un taller atiende 4 máquinas. Cada una, **mientras funciona**, se rompe a tasa 0,5 por día. Si ahora hay 3 en el taller, ¿cuál es la tasa de llegadas?",
 o:["2 por día","1,5 por día","0 por día","0,5 por día","0,125 por día"],
 a:3,
 why:"Población finita: solo **una** máquina está afuera y puede romperse, así que la tasa es 1 · 0,5 = **0,5**. La tasa baja a medida que hay más clientes en el sistema.",
 n:["Es la tasa con las 4 funcionando (taller vacío).","Usaste las 3 que están adentro.","Sería con las 4 adentro.","","No."],
 src:"Resumen §7.1", gen:true},

{u:7, q:"Con un servidor (cs = 20/h) se tiene un M/M/1 con λ = 3 y μ = 4, y cw = 30 por cliente en el sistema por hora. Con dos servidores, L ≈ 0,873. ¿Conviene agregar el segundo?",
 o:["No: agrega 20 por hora de sueldo","Sí: ahorra ≈ 63,8 por hora","Sí: el costo pasa a ≈ 66,2, y ahorra ≈ 43,8 por hora","Sí: ahorra ≈ 23,8 por hora","No: con dos servidores se pierde el estado estable"],
 a:2,
 why:"c = 1: L = ρ/(1 − ρ) = 3, costo = 20 + 30 · 3 = 110. c = 2: costo = 40 + 30 · 0,873 ≈ 66,2. Ahorro ≈ **43,8 por hora**.",
 n:["Mira solo el sueldo y olvida la espera.","Es solo el ahorro de espera (90 − 26,2): falta restar el sueldo extra.","","No.","Más servidores lo hacen más estable."],
 src:"Resumen §7.5 · método de Weitz 13.5"},

{u:7, t:"ms", q:"¿Qué hace falta conocer para resolver un **M/G/1**? Marcá todo lo necesario.",
 o:["La tasa de llegadas λ","La media del tiempo de servicio","El desvío estándar del tiempo de servicio","La distribución completa de los tiempos entre llegadas","Que el servicio sea normal"],
 a:[0,1,2],
 why:"Las llegadas son M (Poisson), así que alcanza con λ. Del servicio, general, se necesitan **media y desvío**. No hace falta la distribución completa ni que sea normal.",
 n:["Necesario.","Necesario.","Necesario.","No: son Poisson, alcanza con λ.","No: G es cualquier distribución."],
 src:"Resumen §7.5"},

{u:7, fix:true, q:"M/M/1. ¿Qué es correcto?",
 o:["Si λ > μ, no se puede simular","Si λ < μ, no hay solución analítica","Si λ > μ, la cola crece sin límite y no hay estado estable","A y C","B y C"],
 a:2,
 why:"Solo C es verdadera. A es falsa: **sí se puede simular**, y se ve crecer la cola. B es falsa: con λ < μ es justamente cuando **sí** valen las fórmulas. Son las 2.14 y 2.15 del parcial 2025, combinadas.",
 n:["Falsa.","Falsa.","","A es falsa.","B es falsa."],
 src:"Resumen §7.4 · parcial 2025 P2.14 y P2.15"},

{u:7, q:"American Weavers, c = 7: L = 12,097 y Lq = 5,847. ¿Cuántos reparadores están ocupados, en promedio?",
 o:["7","≈ 0,893","5,847","12,097","6,25"],
 a:4,
 why:"L − Lq = número medio en servicio = λ/μ = 25/4 = **6,25**. Coincide con 7 · 0,893 (utilización por servidores).",
 n:["Están ocupados el 89% del tiempo, no siempre.","Es la utilización de cada uno.","Es Lq.","Es L.",""],
 src:"Derivado de §7.3 · tabla 13.3", gen:true},

{u:7, q:"En American Weavers con c = 7, pw = 0,702. ¿Qué significa?",
 o:["Que los reparadores están ocupados el 70,2% del tiempo de la jornada", "Que en promedio hay 0,702 máquinas paradas esperando en la cola", "Que 7 de cada 10 máquinas que se atascan esperan", "Que el sistema está completamente vacío el 29,8% del tiempo", "Que cada máquina atascada espera en promedio 0,702 horas en cola"],
 a:2,
 why:"pw es la probabilidad de que un cliente que llega **tenga que esperar**, porque encuentra los 7 ocupados. La utilización es otra cosa (89,29%).",
 n:["Eso es la utilización: 89,29%.","Eso sería Lq (5,847).","","Sería P0, que es otro valor.","Wq es 0,234 h."],
 src:"Tabla 13.3 · Resumen §7.3"},

{u:7, q:"Simulás un M/M/1 que arranca vacío y promediás la cola de las primeras 2 horas. El valor da muy distinto del Lq analítico. ¿Cuál es la explicación más razonable?",
 o:["El M/M/1 no se puede simular: solo tiene solución analítica cerrada", "El Lq analítico también es una estimación, así que es normal que difiera", "Para comparar habría que suponer población finita en el modelo analítico", "Arrancar vacío mete la fase transitoria en el promedio", "La ley de Little no vale en simulación, solo en el modelo analítico"],
 a:3,
 why:"Arrancar vacío es una condición inicial particular. Las fórmulas describen el estado **estable**; el promedio de las primeras horas mezcla la fase **transitoria**. Por eso Law menciona el período de calentamiento como riesgo.",
 n:["Sí se puede.","El analítico es exacto.","No tiene relación.","","Vale en estado estable."],
 src:"Resumen §7.1 y §1.4"},

{u:7, t:"vf", q:"«En un sistema con capacidad limitada, la probabilidad de negación de servicio es la probabilidad de que el sistema esté vacío.»",
 o:VF, a:1,
 why:"Falso. Es la probabilidad de que esté **lleno**: el cliente que llega no puede entrar y se pierde. Se calcula por complemento.",
 n:["",""], src:"Resumen §7.5"},

{u:7, fix:true, q:"En el análisis económico de colas de Weitz:",
 o:["La curva de costo total tiene forma de U en función de c", "El costo de espera se calcula como cw · Lq", "El óptimo es el c que da el menor L", "A y B", "A y C"],
 a:0,
 why:"cs · c crece linealmente y cw · L baja, así que la suma tiene forma de U. B es falsa porque el costo de espera va con **L**. C es falsa: el menor L se logra con infinitos servidores; lo que se minimiza es el **costo total**.",
 n:["", "Falsa: se usa L, los clientes en el sistema.", "Falsa: L baja siempre que se agrega un servidor; el óptimo minimiza el costo total.", "B es falsa.", "C es falsa."],
 src:"Resumen §7.5 · Wiki U8"},

{u:4, t:"ms", q:"¿Cuáles son **eventos** del modelo de cola con un servidor de Law? Marcá todos.",
 o:["El arribo de un cliente","La partida de un cliente","El servidor pasa a estar ocupado","El comienzo del servicio","El inicio de la simulación"],

 why:"Solo dos: arribo y partida. «Ocupado» es un cambio de estado, el comienzo de servicio ocurre dentro de los otros dos y el inicio es la rutina de inicialización. Es la 2.12 del parcial 2025, donde el alumno marcó de más.",
 n:["Evento.","Evento.","Es un estado.","Ocurre dentro del arribo o de la partida.","Es la rutina de inicialización."],

{u:4, t:"ms", q:"¿Cuáles son medidas de rendimiento que estima Law en la cola simple? Marcá todas.",
 o:["Demora promedio en cola","Tiempo promedio de servicio","Número promedio de clientes en el sistema","Proporción del tiempo en que el servidor está ocupado","Número promedio de clientes en cola"],
 a:[0,3,4],
 why:"d(n), u(n) y q(n). El tiempo de servicio es dato de entrada y el número en el **sistema** no es una de las tres de Law.",

{u:4, fix:true, q:"Con estos datos, ¿qué es correcto?",
 pre:TRAZA_P,
 o:["u(3) = 1,0", "d(3) = 1,0", "q(3) = 0,75", "A y B", "B y C"],
 a:4,
 why:"Arribos en 1,0; 1,5 y 2,0. C1: 1,0 a 2,5. C2 espera de 1,5 a 2,5 (D = 1,0) y sale en 4,0. C3 espera de 2,0 a 4,0 (D = 2,0). **T(3) = 4,0**.\nd(3) = (0 + 1 + 2)/3 = 1,0. Área Q = 1·0,5 + 2·0,5 + 1·1,5 = 3,0, así que q(3) = 3/4 = 0,75. El servidor estuvo ocupado de 1,0 a 4,0: u(3) = 3/4 = **0,75**, no 1.",
 n:["Falsa: el tiempo antes del primer arribo también cuenta. Da 3/4.", "Verdadera.", "Verdadera.", "A es falsa.", ""],
 src:"Ejercicio armado con el método de §4.5", gen:true},

{u:4, q:"Mismos datos. ¿Cuántos A y cuántos S se generaron hasta T(3)?",
 pre:TRAZA_P,
 o:["3 A y 3 S","5 A y 3 S","4 A y 2 S","4 A y 3 S","3 A y 2 S"],
 a:3,
 why:"A: la inicialización genera A₁, y los arribos de 1,0, 1,5 y 2,0 generan A₂, A₃ y A₄. Total 4. S: C1 al llegar, C2 en la partida de 2,5 y C3 en la partida de 4,0. Total 3.",
 n:["Falta A₁, que genera la inicialización.","El arribo de 4,2 todavía no ocurrió.","Falta el S de C3, que se genera en T(3).","","Faltan dos."],
 src:"Resumen §4.1", gen:true},

{u:4, q:"Mismos datos. ¿Cómo queda el cuadro **después** del arribo de t = 2,0?",
 pre:TRAZA_P,
 o:["Q = 2; LEV: A = 4,0 y D = 2,5; área Q = 0,5; área B = 1,0; demoras = 1","Q = 2; LEV: A = 4,2 y D = 2,5; área Q = 1,0; área B = 1,0; demoras = 1","Q = 2; LEV: A = 4,2 y D = 3,5; área Q = 0,5; área B = 1,0; demoras = 2","Q = 2; LEV: A = 4,2 y D = 2,5; área Q = 0,5; área B = 1,0; demoras = 1","Q = 1; LEV: A = 4,2 y D = 2,5; área Q = 0,5; área B = 2,0; demoras = 1"],
 a:3,
 why:"Áreas con el valor viejo: Q fue 1 entre 1,5 y 2,0, da 0,5. B fue 1 entre 1,0 y 2,0, da 1,0. Llega C3 con el servidor ocupado: Q = 2. Se programa A = 2,0 + A₄ = 4,2. D sigue en 2,5 (C1). Demoras completadas: solo la de C1.",
 n:["A = 2,0 + 2,2 = 4,2, no 4,0.","Área Q con el valor nuevo (2 · 0,5).","D no cambia en un arribo con servidor ocupado, y C2 todavía no completó su demora.","","Q es 2 y el área B es 1,0."],
 src:"Resumen §4.5", gen:true},

{u:4, t:"vf", q:"«Si al terminar la corrida no queda nadie en cola, el área bajo Q(t) coincide con la suma de las demoras completadas.»",
 o:VF, a:0,
 why:"Verdadero. Cada cliente aporta al área exactamente su tiempo en cola. Si nadie quedó esperando, toda la espera ya está contada en las demoras. En la traza anterior, las dos dan 3,0. En la de Law no coinciden (9,9 contra 5,7) porque quedan los clientes 7 y 8 en cola.",
 n:["",""], src:"Razonamiento sobre §4.3", gen:true},

{u:4, t:"vf", q:"«En la cola simple, la rutina de arribo siempre genera un tiempo de servicio.»",
 o:VF, a:1,
 why:"Falso. Solo lo genera si el servidor estaba **libre** y el cliente entra directo a servicio. Lo que genera siempre es el **próximo arribo**.",
 n:["",""], src:"Resumen §4.1"},

{u:4, fix:true, q:"Sobre las variables del modelo de cola simple:",
 o:["Q(t) y B(t) son de estado, y los tiempos de servicio son exógenos", "d(n) es una variable exógena", "Los tiempos de arribo de los clientes que esperan son exógenos", "A y B", "A y C"],
 a:0,
 why:"Q(t) y B(t) describen el sistema en cada instante: son de estado. Los tiempos de servicio entran al modelo: son exógenos. d(n) sale del modelo: es **endógena**. Y los tiempos de arribo de los que esperan se guardan como parte del **estado**.",
 n:["", "Falsa: es endógena, sale del modelo.", "Falsa: son parte del estado (se guardan para calcular demoras).", "B es falsa.", "C es falsa."],
 src:"Resumen §2"},

{u:4, q:"Dos corridas de la cola simple con los mismos parámetros, n = 6, pero distintos números aleatorios. ¿Qué es correcto?",
 o:["Las dos terminan en T(6) = 8,6, porque n fija la duración", "T(6) es el mismo porque n es el mismo; cambian solo las medidas", "d(6) es el mismo porque depende solo de las medias de A y S", "Cambian T(6) y las tres medidas", "Solo cambia u(6); d(6) y T(6) quedan fijos por n"],
 a:3,
 why:"n es fijo, pero T(n) es **aleatorio**: depende de los A y S. Por eso cada corrida es una muestra y sus medidas son estimaciones.",
 n:["8,6 es de la traza de Law en particular.","n fijo no implica T(n) fijo.","Dependen de los valores generados, no solo de las medias.","","Cambian todas."],
 src:"Resumen §4.3 y §4.4"},

{u:4, q:"En una partida con cola no vacía, ¿qué contadores estadísticos se modifican, además de las áreas?",
 o:["Ninguno: los contadores solo cambian en los arribos", "Solo la demora total, con el tiempo de servicio del que sale", "Solo el número de demoras completadas, sin tocar la demora total", "Demoras completadas (+1) y demora total", "El número de clientes servidos y la utilización acumulada"],
 a:3,
 why:"El que pasa a servicio completa su demora: se suma 1 al contador y su demora (reloj − su tiempo de arribo) a la demora total.",
 n:["Alguien completa su demora.","Falta el contador.","Falta la demora total.","","Law no lleva esos contadores."],
 src:"Resumen §4.5"},

{u:4, q:"¿Por qué q(n) se divide por T(n) y d(n) por n?",
 o:["Por convención de Law, sin una razón de fondo que lo justifique", "Porque T(n) es siempre mayor que n, y así q(n) queda menor que 1", "q promedia en el tiempo; d, por cliente", "Porque d(n) se calcula al final y q(n) se acumula evento a evento", "Porque q(n) incluye también a los clientes que están siendo atendidos"],
 a:2,
 why:"q(n) promedia una función del tiempo, Q(t): el área se divide por la duración. d(n) promedia una lista de n números, las demoras: se divide por n.",
 n:["Tiene razón de fondo.","No tiene por qué.","","Las dos se acumulan evento a evento.","Q(t) cuenta solo la cola."],
 src:"Resumen §4.2"},

{u:5, q:"(s, S) = (20, 40), I(0) = 25, K = 32, i = 3, h = 1, π = 5, n = 1 mes. Evaluación en t = 0. Demandas: 10 unidades en t = 0,3 y 20 en t = 0,6. ¿Costo total del mes?",
 o:["54","14","12","22","67"],
 a:3,
 why:"En t = 0, I = 25 ≥ 20: **no se pide** y no se paga K. I = 25 de 0 a 0,3; 15 de 0,3 a 0,6; −5 de 0,6 a 1.\nÁrea I⁺ = 25·0,3 + 15·0,3 = 12. Área I⁻ = 5·0,4 = 2.\nCosto = 0 + 1·12 + 5·2 = **22**.",
 n:["Pagaste K sin haber pedido.","Usaste h para el faltante.","Es solo el mantenimiento.","","Sumaste un pedido que no ocurrió."],
 src:"Resumen §5.3 y §5.4", gen:true},

{u:5, q:"(s, S) = (20, 40), I(0) = 15, K = 32, i = 3, h = 1, π = 5, n = 1. En t = 0 se evalúa; el pedido llega en t = 0,5. Demandas: 20 en t = 0,2 y 5 en t = 0,8. ¿Costo total del mes?",
 o:["94,5","119,0","168,5","126,5","131,5"],
 a:3,
 why:"t = 0: I = 15 < 20, se piden Z = 25 y se paga 32 + 75 = 107.\nI = 15 de 0 a 0,2; −5 de 0,2 a 0,5; 20 de 0,5 a 0,8; 15 de 0,8 a 1.\nÁrea I⁺ = 3 + 6 + 3 = 12. Área I⁻ = 5 · 0,3 = 1,5.\nTotal = 107 + 12 + 7,5 = **126,5**.",
 n:["Olvidaste K.","Olvidaste el faltante.","Invertiste h y π.","","No."],
 src:"Resumen §5.3 y §5.4", gen:true},

{u:5, q:"(s, S) = (20, 60). En la evaluación de t = 2, I = −8. Con K = 32 e i = 3, ¿cuánto cuesta el pedido?",
 o:["212","204","236","68","164"],
 a:2,
 why:"Z = S − I = 60 − (−8) = 68. Costo = 32 + 3 · 68 = **236**.",
 n:["Pediste 60.","Olvidaste K.","","Es Z, no el costo.","Usaste Z = 44."],
 src:"Resumen §5.1 y §5.3"},

{u:5, t:"ms", q:"Sobre los eventos del inventario de Law, marcá todas las correctas.",
 o:["La llegada de pedido tiene la mayor prioridad","La evaluación programa la próxima evaluación aunque no se pida","La demanda programa la próxima demanda","La llegada de pedido programa la próxima evaluación","El fin de simulación se programa en t = n"],
 a:[0,1,2,4],
 why:"Prioridades: llegada 1, demanda 2, fin 3, evaluación 4. La evaluación siempre programa la siguiente en t + 1. La llegada de pedido **no programa nada**.",
 n:["Verdadera.","Verdadera.","Verdadera.","Falsa: no programa nada.","Verdadera."],
 src:"Resumen §5.4"},

{u:5, fix:true, q:"En la tabla de Law, con S = 100 fijo, s pasa de 20 a 60:",
 o:["Baja el costo de faltante","Sube el costo de mantenimiento","Baja el costo de mantenimiento","A y B","A y C"],
 a:3,
 why:"Con s más alto se pide antes, el inventario cae menos: el faltante baja (7,95 a 0,24) y el mantenimiento **sube** (36,00 a 53,91).",
 n:["Verdadera.","Verdadera.","Falsa.","","C es falsa."],

{u:5, t:"vf", q:"«En la política (s, S), si al revisar I ≥ s, igual se paga el costo fijo K.»",
 o:VF, a:1,

{u:5, t:"vf", q:"«El costo de faltante se calcula sobre la cantidad de unidades que no se pudieron entregar en el momento de cada demanda.»",

{u:5, q:"¿Cuál de estas **no** es una variable aleatoria en el modelo de inventario de Law?",
 o:["El tiempo entre demandas","El tamaño de cada demanda","La demora de entrega","El intervalo entre evaluaciones","Ninguna: las cuatro son aleatorias"],
 a:3,
 why:"La revisión es **periódica**: una por mes, fija. Las otras tres se generan: exponencial, empírica discreta y uniforme.",
 n:["Exponencial de media 0,1.","Empírica: 1 a 4.","U(0,5; 1).","","El intervalo es fijo."],
 src:"Resumen §5.1"},

{u:5, q:"En 3 meses: costo de pedido total 214, área bajo I⁺ = 45 y área bajo I⁻ = 6. Con h = 1 y π = 5, ¿cuál es el costo total promedio mensual?",
 o:["289","88,33","148,33","96,33","101,33"],
 a:3,
 why:"214/3 + 1 · 45/3 + 5 · 6/3 = 71,33 + 15 + 10 = **96,33**. Las tres partes se dividen por los meses.",
 n:["No dividiste por 3.","Usaste h para el faltante.","Invertiste h y π.","","No."],

{u:5, fix:true, q:"Sobre la política (s, S) con revisión periódica y demora de entrega:",
 o:["Se pide Z = S − I","Al llegar el pedido, el inventario queda en S","El inventario puede seguir negativo después de que llega un pedido","A y C","A y B"],
 a:3,
 why:"Z se calcula con el I del momento de la revisión, pero mientras el pedido viaja siguen llegando demandas. Por eso al llegar no queda en S, y si la deuda creció mucho, puede seguir negativo.",
 n:["Verdadera.","Falsa: hubo demandas durante la demora.","Verdadera.","","B es falsa."],
 src:"Resumen §5.1 y §5.2", gen:true},

{u:5, q:"Entre t = 0,4 y t = 0,7 el inventario estuvo exactamente en 0. ¿Qué suma la rutina de áreas al llegar al evento de 0,7?",

{u:1, t:"vf", q:"«Para simular siempre hacen falta herramientas informáticas.»",

{u:1, fix:true, q:"Según Law, un modelo de simulación **estocástico**:",

{u:1, t:"ms", q:"¿Cuáles son **ventajas** de la simulación, según Law y AnyLogic in 3 Days? Marcá todas.",

 why:"Las ventajas son probar sin riesgo, estimar bajo condiciones nuevas, encontrar cuellos de botella y comunicar. No da resultados exactos, y para optimizar Law prefiere un buen modelo analítico.",

{u:2, q:"Según Law, un **evento** es:",

 why:"Instantánea y que **puede** cambiar el estado. El «siempre» es la trampa: hay eventos que solo terminan la simulación o programan decisiones.",

{u:3, fix:true, q:"Sobre el avance del reloj por próximo evento:",

{u:9, q:"GCL mixto: Zᵢ = (5Zᵢ₋₁ + 3) mod 16, con Z₀ = 7. ¿Cuánto vale U₂?",
 o:["0,375","0,5","0,0625","0,4375","0,1875"],
 a:2,
 why:"Z₁ = (35 + 3) mod 16 = 38 mod 16 = 6, así que U₁ = 6/16 = 0,375. Z₂ = (30 + 3) mod 16 = 33 mod 16 = 1, así que U₂ = 1/16 = **0,0625**.",

{u:9, q:"¿Qué condición **no** es necesaria para que un GCL mixto tenga período completo (Hull–Dobell)?",
 o:["Que m y c sean primos relativos","Que todo primo que divide a m divida también a a − 1","Que, si 4 divide a m, 4 divida a a − 1","Que el multiplicador a sea un número primo","Ninguna: las cuatro son necesarias"],
 a:3,
 why:"Hull–Dobell pide **las tres** primeras y nada más. Que a sea primo no hace falta: en el GCL de la pregunta anterior, a = 5 funciona, pero a = 9 también cumpliría con m = 16.",
 n:["Es necesaria.","Es necesaria (el resumen de alumnos la redacta al revés).","Es necesaria.","","Una no lo es."],
 src:"Resumen §9.1 · banco E18"},

{u:9, q:"Zᵢ = (3Zᵢ₋₁ + 3) mod 16. ¿Tiene período completo?",
 o:["Sí: cumple las tres condiciones de Hull–Dobell", "No: m y c no son primos relativos entre sí", "No: 2 divide a m pero no divide a a − 1", "Sí: alcanza con que c sea impar y m potencia de 2", "No: falla la condición del 4"],
 a:4,
 why:"m = 16 y c = 3 son primos relativos ✓. El único primo que divide a 16 es 2, y divide a a − 1 = 2 ✓. Pero 4 divide a 16 y **no** divide a a − 1 = 2 ✗. Falla la tercera condición.",
 n:["Falla la tercera.","mcd(16, 3) = 1: sí lo son.","2 divide a a − 1 = 2.","Ser impar no alcanza: hay tres condiciones.",""],
 src:"Resumen §9.1", gen:true},

{u:9, q:"Generás una Poisson(2) contando cuántos tiempos exponenciales de media 0,5 entran en una unidad de tiempo, con U = 0,6; 0,3; 0,5. ¿Qué valor sale?",

 a:1,
