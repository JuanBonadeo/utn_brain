<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>SIM — Plantilla de traza de la cola simple</title>
<style>
  @page { size: A4 landscape; margin: 8mm 9mm; }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: Arial, Helvetica, sans-serif; font-size: 9pt; color: #111; }
  .head { display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 2.5mm; gap: 6mm; }
  h1 { font-size: 13pt; margin: 0; }
  .datos { display: flex; gap: 5mm; font-size: 9.5pt; }
  .datos span { white-space: nowrap; }
  .blank { display: inline-block; border-bottom: .8px solid #111; width: 16mm; height: 4mm; vertical-align: bottom; }
  table { border-collapse: collapse; width: 100%; table-layout: fixed; }
  th, td { border: .8px solid #333; text-align: center; }
  thead th { background: #e4e4e4; font-size: 8.6pt; padding: 1mm .5mm; }
  thead tr.grp th { background: #cfcfcf; font-size: 9pt; letter-spacing: .04em; text-transform: uppercase; }
  tbody td { height: 9.6mm; }
  tbody td.ev { text-align: left; padding-left: 1.5mm; color: #777; font-size: 8pt; }
  .thick-l { border-left: 1.8px solid #111 !important; }
</style>
</head>
<body>

<div class="head">
  <h1>Traza de la cola simple</h1>
  <div class="datos">
    <span>Media entre arribos: <span class="blank"></span></span>
    <span>Media de servicio: <span class="blank"></span></span>
    <span>n (demoras): <span class="blank"></span></span>
  </div>
</div>

    <tr><td class="ev"></td><td></td><td class="thick-l"></td><td></td><td></td><td class="thick-l"></td><td></td><td class="thick-l"></td><td></td><td></td><td></td></tr>
