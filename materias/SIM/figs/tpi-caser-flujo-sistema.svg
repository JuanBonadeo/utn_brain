<svg viewBox="0 0 1300 400" xmlns="http://www.w3.org/2000/svg" role="img"
     aria-label="Flujo del sistema: un pedido dispara produccion directo (sin stock intermedio) y pasa agregado por estampado, laminado y lavado; las ULI lavadas esperan en la cola del horno y se tratan segun la regla de encendido; luego siguen por el zincado tercerizado (con una demora adicional de revenido en algunos articulos) y el envasado hasta la entrega, donde se mide el tiempo de entrega contra el plazo comprometido. Los articulos sin tratamiento termico saltean el horno y van directo al zincado.">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1a1a1a"/>
    </marker>
  </defs>

  <style>
    text { font-family: Arial, Helvetica, sans-serif; fill: #1a1a1a; }
    .caja { fill: #ffffff; stroke: #1a1a1a; stroke-width: 1.6; }
    .cola { fill: #ffffff; stroke: #1a1a1a; stroke-width: 1.6; stroke-dasharray: 6 4; }
    .recurso { fill: #eef4fb; stroke: #15406b; stroke-width: 2.6; }
    .fuente { fill: #ffffff; stroke: #1a1a1a; stroke-width: 1.6; }
    .titulo-caja { font-size: 13px; font-weight: bold; text-anchor: middle; }
    .sub-caja { font-size: 10.5px; text-anchor: middle; }
    .etiqueta { font-size: 10.5px; text-anchor: middle; }
    .flecha { stroke: #1a1a1a; stroke-width: 1.4; fill: none; marker-end: url(#arrow); }
  </style>

  <!-- 1. Pedido (fuente) -->
  <rect class="fuente" x="10" y="170" width="110" height="60" rx="18"/>
  <text class="titulo-caja" x="65" y="196">Pedido</text>
  <text class="sub-caja" x="65" y="212">(entidad)</text>

  <!-- 2. Aguas arriba (incluye lavado) -->
  <rect class="caja" x="170" y="170" width="180" height="60"/>
  <text class="titulo-caja" x="260" y="192">Aguas arriba</text>
  <text class="sub-caja" x="260" y="207">estampado + laminado + lavado</text>
  <text class="sub-caja" x="260" y="220">(agregado por familia)</text>

  <!-- 3. Cola horno -->
  <rect class="cola" x="410" y="170" width="120" height="60"/>
  <text class="titulo-caja" x="470" y="196">Cola horno</text>
  <text class="sub-caja" x="470" y="212">(FIFO, ULI lavadas)</text>

  <!-- 4. Horno (recurso) -->
  <rect class="recurso" x="590" y="160" width="150" height="80"/>
  <text class="titulo-caja" x="665" y="188">Horno</text>
  <text class="sub-caja" x="665" y="203">cementación + temple</text>
  <text class="sub-caja" x="665" y="216">estados: Fig. 2</text>

  <!-- 5. Zincado tercerizado -->
  <rect class="caja" x="810" y="170" width="170" height="60"/>
  <text class="titulo-caja" x="895" y="194">Zincado</text>
  <text class="sub-caja" x="895" y="210">(tercerizado, plazo</text>
  <text class="sub-caja" x="895" y="222">aleatorio)</text>

  <!-- 6. Envasado -->
  <rect class="caja" x="1050" y="170" width="110" height="60"/>
  <text class="titulo-caja" x="1105" y="205">Envasado</text>

  <!-- flechas fila principal -->
  <line class="flecha" x1="120" y1="200" x2="168" y2="200"/>
  <line class="flecha" x1="350" y1="200" x2="408" y2="200"/>
  <line class="flecha" x1="530" y1="200" x2="588" y2="200"/>
  <line class="flecha" x1="740" y1="200" x2="808" y2="200"/>
  <line class="flecha" x1="980" y1="200" x2="1048" y2="200"/>

  <!-- etiquetas de flechas -->
  <text class="etiqueta" x="144" y="250">dispara producción</text>
  <text class="etiqueta" x="144" y="262">(sin chequeo de stock)</text>
  <text class="etiqueta" x="379" y="250">Split en ULIs</text>
  <text class="etiqueta" x="559" y="250">según regla de</text>
  <text class="etiqueta" x="559" y="262">encendido</text>
  <text class="etiqueta" x="774" y="256">ULI tratada</text>
  <text class="etiqueta" x="774" y="268">+ demora de revenido</text>
  <text class="etiqueta" x="774" y="280">si el artículo lo lleva</text>
  <text class="etiqueta" x="1014" y="250">ULI zincada</text>
  <text class="etiqueta" x="1014" y="262">(ida y vuelta)</text>

  <!-- bypass: articulos sin tratamiento termico -->
  <path class="flecha" d="M 260 168 C 260 80, 895 80, 895 168" />
  <text class="etiqueta" x="577" y="72">si el artículo no lleva tratamiento térmico (saltea el horno)</text>

  <!-- 7. Entrega (sumidero) -->
  <rect class="fuente" x="1040" y="290" width="130" height="70"/>
  <text class="titulo-caja" x="1105" y="316">Entrega</text>
  <text class="sub-caja" x="1105" y="331">(sumidero)</text>
  <text class="sub-caja" x="1105" y="344">mide plazo real</text>

  <line class="flecha" x1="1105" y1="230" x2="1105" y2="288"/>
  <text class="etiqueta" x="1195" y="255">vs. plazo</text>
  <text class="etiqueta" x="1195" y="267">comprometido</text>
  <text class="etiqueta" x="1195" y="279">→ nivel de servicio</text>

  <!-- leyenda -->
  <rect class="fuente" x="20" y="300" width="26" height="18"/>
  <text x="54" y="313" font-family="Arial" font-size="10.5px">entidad (fuente / sumidero)</text>
  <rect class="caja" x="20" y="326" width="26" height="18"/>
  <text x="54" y="339" font-family="Arial" font-size="10.5px">proceso (delay)</text>
  <rect class="cola" x="230" y="300" width="26" height="18"/>
  <text x="264" y="313" font-family="Arial" font-size="10.5px">cola</text>
  <rect class="recurso" x="230" y="326" width="26" height="18"/>
  <text x="264" y="339" font-family="Arial" font-size="10.5px">recurso (capacidad limitada)</text>
</svg>
