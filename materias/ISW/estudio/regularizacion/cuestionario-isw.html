 opts:['VAL / SP 1.2 Establecer el entorno de validación','VER / SP 2.2 Llevar a cabo las revisiones entre pares','VER / SP 2.3 Analizar los datos de la revisión entre pares','VER / SP 3.1 Realizar la verificación','VER / SP 2.1 Preparar las revisiones con usuarios','VAL / SP 2.1 Preparar las revisiones entre pares','PMC / SP 1.2 Monitorizar los compromisos','NINGUNA de las otras opciones'],
 ans:'NINGUNA',
 exp:'Lo correcto sería **VER / SP 2.1 Preparar las revisiones entre pares** (pares + chequeo futuro), pero no está: una opción lo pone en **VAL** (que no tiene revisiones entre pares) y otra dice «revisiones con usuarios». Leé la sigla y el texto completos → **NINGUNA**.'},
{id:'u5-dist2',u:'U5',t:'Discriminar VER / VAL',src:'Cuestionario',conf:'ok',inst:RELSP,
 q:'En el marco del proyecto «Autoconsulta servicios de larga distancia», distribuir entre los analistas elegidos para participar de la reunión la descripción del último caso de uso, que acaba de terminar otro analista y que será chequeada en dicha reunión.',
 opts:['VER / SP 2.1 Preparar las revisiones entre pares','VER / SP 2.2 Llevar a cabo las revisiones entre pares','VER / SP 1.2 Establecer el entorno de verificación','VAL / SP 2.1 Realizar la validación','PMC / SP 1.5 Monitorizar la involucración de las partes interesadas','NINGUNA de las otras opciones'],
 ans:'VER / SP 2.1',
 exp:'Son **pares** (analistas revisando a otro analista) y el chequeo es **futuro** → **VER / SP 2.1 Preparar las revisiones entre pares**.'},
{id:'u5-cheq',u:'U5',t:'Discriminar VER / VAL',src:'Cuestionario',conf:'ok',inst:RELSP,
 q:'En el marco del proyecto «Autoconsulta servicios de larga distancia», dos analistas elegidos para participar de la reunión chequean el último caso de uso que acaba de terminar otro analista, planteando las observaciones pertinentes.',
 opts:['VER / SP 2.1 Preparar las revisiones entre pares','VER / SP 2.2 Llevar a cabo las revisiones entre pares','VER / SP 2.3 Analizar los datos de la revisión entre pares','VER / SP 3.1 Realizar la verificación','VAL / SP 2.1 Realizar la validación','NINGUNA de las otras opciones'],
 ans:'VER / SP 2.2',
 exp:'Pares, en **presente**: **VER / SP 2.2 Llevar a cabo las revisiones entre pares**.'},
{id:'u5-almac',u:'U5',t:'Discriminar VER / VAL',src:'Cuestionario',conf:'ok',inst:RELSP,
 q:'Ayer se realizó una reunión con 2 analistas para controlar los C.U. escritos por otro analista; detectaron problemas que deben corregirse para que el software cumpla con las minutas y las reglas de negocio ya aprobadas por el cliente. Ya se documentaron los hallazgos y se enviaron al autor. En este momento se está almacenando la información de las identidades de los analistas involucrados en una parte del repositorio a la que sólo accede personal de Calidad; en la parte pública sólo queda la información de los problemas a corregir.',
 opts:['VER / SP 2.2 Llevar a cabo las revisiones entre pares','VER / SP 2.3 Analizar los datos de la revisión entre pares','VER / SP 3.2 Analizar los resultados de la verificación','PPQA / SP 2.2 Establecer registros','VAL / SP 2.2 Analizar los resultados de la validación','NINGUNA de las otras opciones'],
 ans:'VER / SP 2.3',
 exp:'La revisión ya se hizo; ahora se **almacenan los datos para futura referencia y análisis** → **VER / SP 2.3 Analizar los datos de la revisión entre pares**.'},
{id:'u5-cumin',u:'U5',t:'Discriminar VER / VAL',src:'Cuestionario',conf:'ok',inst:RELSP,
 q:'En el marco del proyecto «Liquidación y Cobranza a Obras Sociales», personal del equipo de proyecto de la software factory realiza un control respecto a si el contenido de los casos de uso cumple con lo documentado en las Minutas de Relevamiento.',
 opts:['VER / SP 3.1 Realizar la verificación','VER / SP 2.2 Llevar a cabo las revisiones entre pares','VAL / SP 2.1 Realizar la validación','PPQA / SP 1.2 Evaluar objetivamente los productos de trabajo y los servicios','RD / SP 3.5 Validar los requerimientos','NINGUNA de las otras opciones'],
 ans:'VER / SP 3.1',
 exp:'No es VAL (no participa el cliente) ni PPQA (no se chequea un estándar de la organización). Se compara un producto contra **otro artefacto del proyecto**, en presente → **VER / SP 3.1**.'},
{id:'u5-glos',u:'U5',t:'Discriminar VER / VAL',src:'Cuestionario',conf:'ok',inst:RELSP,
 q:'Realizar un control respecto a si los nombres de las etiquetas de los campos de ingreso por pantalla cumplen las definiciones estándar planteadas en el Glosario, en el marco del proyecto «Liquidación y Cobranza a Obras Sociales».',
 opts:['VER / SP 2.1 Preparar las revisiones entre pares','VER / SP 3.1 Realizar la verificación','VER / SP 3.2 Analizar los resultados de la verificación','VAL / SP 2.1 Realizar la validación','OPD / SP 1.6 Establecer los estándares del entorno de trabajo','NINGUNA de las otras áreas'],
 ans:'VER / SP 3.1',
 exp:'El glosario es **del proyecto**, no un estándar organizacional → no es PPQA ni OPD. Se controla ahora → **VER / SP 3.1**.'},
{id:'u5-etiq',u:'U5',t:'Discriminar VER / VAL',src:'Cuestionario',conf:'ok',inst:RELSP,
 q:'Realizar un control con el usuario respecto a si los nombres de las etiquetas de los campos de ingreso por pantalla se entienden adecuadamente y si se corresponden con los conceptos de negocio correctos, en el marco del proyecto «Liquidación y Cobranza a Obras Sociales».',
 opts:['VER / SP 3.1 Realizar la verificación','VAL / SP 2.1 Realizar la validación','VAL / SP 1.2 Establecer el entorno de validación','VAL / SP 2.2 Analizar los resultados de la validación','PMC / SP 1.5 Monitorizar la involucración de las partes interesadas','NINGUNA de las otras áreas'],
 ans:'VAL / SP 2.1',
 exp:'Participa el **usuario** y se chequea contra el **negocio** → **VAL / SP 2.1 Realizar la validación**.'},
{id:'u5-agenda',u:'U5',t:'Discriminar VER / VAL',src:'Cuestionario',conf:'ok',inst:RELSP,
 q:'Coordinar con precisión la agenda de horarios en que puede utilizarse el server en instalaciones del cliente para realizar la prueba de aceptación.',
 opts:['VAL / SP 1.2 Establecer el entorno de validación','VAL / SP 2.1 Realizar la validación','VER / SP 1.2 Establecer el entorno de verificación','PP / SP 2.1 Establecer el presupuesto y el calendario','PP / SP 2.4 Planificar los recursos del proyecto','NINGUNA de las otras opciones'],
 ans:'VAL / SP 1.2',
 exp:'Prueba de **aceptación** → VAL; se está preparando el entorno → **SP 1.2**. Si dijera **prueba de sistema**, sería VER.'},
{id:'u5-agenda2',u:'U5',t:'Discriminar VER / VAL',src:'Cuestionario',conf:'ok',inst:RELA,opts:AREAS,ans:'VAL',
 q:'Coordinar con antelación la agenda en que serán citados los usuarios clave para realizar la prueba de aceptación.',
 exp:'Prueba de **aceptación** con usuarios clave → **VAL**.'},
{id:'u5-insp',u:'U5',t:'Discriminar VER / VAL',src:'Cuestionario',conf:'ok',inst:RELA,opts:AREAS,ans:'VER',
 q:'Determinar que se controlarán mediante Inspección los diagramas de secuencia del proyecto «Aplicativo para Gestión on-line de solicitudes de Compra de Moneda Extranjera».',
 exp:'La inspección es un tipo de revisión → técnica **estática** → vinculada a **VER**.'},
{id:'u5-t1',u:'U5',t:'Partición de equivalencia',src:'Parcial 2022',conf:'ded',
 ctx:'Un termómetro mide grados centígrados enteros cada 1 minuto. Si la temperatura sube por encima de 25, se activa la refrigeración. Si cae por debajo de 20, se apaga. Capacidad de medición: 0 a 53 grados.',
 q:'¿Cuáles valores son la mejor elección para cubrir todas las particiones válidas?',opts:['19, 33','0, 20, 25, 53','3, 23, 33','13, 23','17, 18, 19','20, 25'],ans:'3, 23, 33',
 exp:'Tres particiones válidas: 0–19 (se apaga), **20–25 (zona muerta, no pasa nada)** y 26–53 (se activa). Un representante por partición: **3, 23, 33**. «0, 20, 25, 53» son valores límite, no representantes de partición. Olvidar la zona muerta es el error clásico.'},
{id:'u5-t2',u:'U5',t:'Partición de equivalencia',src:'Parcial 2020',conf:'ded',
 ctx:'Un termómetro mide grados centígrados enteros. Si la temperatura cae por debajo de 18, se activa la calefacción. Si pasa los 23, se apaga.',
 q:'¿Cuáles valores son la mejor elección para cubrir todas las particiones válidas?',opts:['15, 19, 25','17, 18, 19','18, 20, 22','16, 26, 32'],ans:'15, 19, 25',
 exp:'Particiones: ≤ 17 · 18–23 · ≥ 24. **15, 19, 25** cae uno en cada una. «18, 20, 22» cae entero en la zona muerta; «16, 26, 32» deja afuera la zona 18–23.'},
{id:'u5-antig',u:'U5',t:'Partición de equivalencia',src:'Parcial 2024',conf:'ok',fixed:true,
 ctx:'La antigüedad se mide en categorías: 2 años o menos; más de 2 y menos de 5; 5 o más y menos de 10; 10 o más. Se sabe además que la edad de jubilación es 65 años y que el período de prueba inicial es de hasta 6 meses.',
 q:'¿Cuántos casos de prueba son necesarios si sólo se necesitan las particiones de equivalencia válidas para probar el cálculo del adicional por antigüedad?',
 opts:['0 (las pruebas exhaustivas son imposibles)','1','2','3','4','5'],ans:'4',
 exp:'Una partición válida por categoría → **4**. La jubilación y el período de prueba son **ruido**. La opción «0» es verdadera como frase y falsa como respuesta: justamente por eso se particiona.'},
{id:'u5-tec',u:'U5',t:'Técnicas de prueba',src:'Parcial 2025',conf:'ok',
 q:'Relacione cada acción con la técnica de prueba que corresponde:',cols:['Valores límite','Tablas de decisión','Transición de estados'],
 rows:['Diseñar casos con valores válidos e inválidos en el campo «número de legajo» (8 dígitos)','Verificar las reglas de promoción (aprobado con 4 o más) representando todas las combinaciones de notas y estados en una matriz','Ejecutar casos que simulen la secuencia de estados de un alumno: Inscripto → Cursando → Aprobado/Desaprobado'],
 rans:['Valores límite','Tablas de decisión','Transición de estados'],
 exp:'Campo con rango o longitud → **valores límite**. «Todas las combinaciones», matriz, reglas cruzadas → **tablas de decisión**. Secuencia de estados → **transición de estados**.'},
{id:'u5-gym',u:'U5',t:'Tablas de decisión',src:'Parcial 2024',conf:'ok',fixed:true,
 ctx:'Un gimnasio tiene tres categorías de socio: Coulson (inicial), IronMan (10 % de descuento) y Hulk (15 % de descuento). Además, si al comprar tiene la cuota al día, recibe un 5 % adicional. Los descuentos son acumulables. El sistema calcula el porcentaje de descuento a aplicar.',
 q:'Con una tabla de decisión, determine:',cols:['2','3','4','5','6','8'],
 rows:['Cantidad de acciones a colocar','Cantidad de columnas que quedan después de simplificar la tabla','Cantidad de casos de prueba válidos (sin condiciones incompatibles)'],
 rans:['4','6','6'],
 exp:'**4 acciones**: aplicar 0 %, 10 %, 15 % y el 5 % adicional. **6 columnas**: la categoría no es binaria, es una condición de 3 valores; 3 × 2 estados de cuota = 6. **6 casos**: ninguna combinación es imposible.'},
{id:'u5-aero',u:'U5',t:'Tablas de decisión',src:'Parcial 2022',conf:'ded',fixed:true,
 ctx:'El sistema solicita usuario y contraseña, valida si son correctos y, de ser así, muestra el historial de vuelo. Caso contrario rechaza el ingreso (el rechazo se produce si el usuario no existe, o si existe y la contraseña no coincide). Adicionalmente, si el usuario tiene puntos suficientes, ofrece viajes de recompensa.',
 q:'Con una tabla de decisión, determine:',cols:['1','2','3','4','8'],
 rows:['Cantidad de condiciones','Cantidad de acciones','Cantidad de casos de prueba','Casos de prueba con todas las condiciones verdaderas'],
 rans:['3','3','4','1'],
 exp:'Condiciones: ¿existe el usuario?, ¿coincide la contraseña?, ¿tiene puntos? → **3** (confirmado). Acciones: mostrar historial, rechazar, ofrecer recompensa → 3. Si el usuario no existe, lo demás es irrelevante: 8 combinaciones se reducen a **4** casos, y sólo **1** tiene todo verdadero. Salvo las condiciones, la clave es deducida.'},
{id:'u5-cv1',u:'U5',t:'Ciclos de vida',src:'Cuestionario',conf:'ok',
 q:'El ciclo de vida que mejora las posibilidades de salir antes a producción con un producto de software es:',opts:['Cascada','Iterativo','Incremental'],ans:'Incremental',
 exp:'**Incremental**: después del primer incremento ya se puede entregar una porción de la funcionalidad planificada.'},
{id:'u5-cv2',u:'U5',t:'Ciclos de vida',src:'Cuestionario',conf:'ok',
 q:'El ciclo de vida de desarrollo de software que permite trabajar con requerimientos no estabilizados es:',opts:['Cascada','Incremental','Iterativo'],ans:'Iterativo',
 exp:'**Iterativo**: busca reducir el riesgo entre las necesidades del usuario y el producto final por malentendidos en la recolección de requisitos.'},
{id:'u5-cv3',u:'U5',t:'Ciclos de vida',src:'Cuestionario',conf:'ok',
 q:'El ciclo de vida que menos colabora con un desarrollo de software cuando los requerimientos son inestables es:',opts:['Cascada','Incremental','Iterativo'],ans:'Cascada',
 exp:'En **cascada**, cerrada la etapa de análisis, los cambios en los requisitos no se contemplan hasta terminar la etapa de prueba.'},
{id:'u5-cv4',u:'U5',t:'Ciclos de vida',src:'Cuestionario',conf:'ok',
 q:'¿Cuál es el ciclo de vida que permite, al ser usado como base para un proyecto, reducir el riesgo de subestimación del esfuerzo?',opts:['Cascada','Iterativo','Incremental','Prototipado'],ans:'Prototipado',
 exp:'Al construir la pantalla del **prototipo** se entiende mejor el requerimiento, y eso mejora la estimación. El incremental no ayuda: si subestimaste el último módulo te enterás recién cuando lo hacés.'},
{id:'u5-cv5',u:'U5',t:'Ciclos de vida',src:'Cuestionario',conf:'ok',
 ctx:'Proyecto de mantenimiento correctivo. Se estimó que la funcionalidad estará en un par de semanas. Las correcciones son ajustes a requerimientos que ya están implementados.',
 q:'Determine el ciclo que más se ajusta a la situación:',opts:['Cascada','Iterativo','Incremental','Prototipado'],ans:'Cascada',
 exp:'Prevalecen programación y prueba, y dura un par de semanas: no vale la pena armar incrementos de 3 días con su versionado y despliegue → **Cascada**.'},
{id:'u5-cv6',u:'U5',t:'Ciclos de vida',src:'Cuestionario',conf:'ok',
 q:'Señale el/los ciclos de vida que se usan como base en proyectos de desarrollo donde los requerimientos son conocidos y estables:',opts:['Cascada','Incremental','Iterativo','Ninguno de los mencionados'],ans:['Cascada','Incremental'],
 exp:'Con requisitos estables sirven **cascada** (entrega todo al final) **e incremental** (divide en versiones). Iterativo y prototipado se justifican cuando hay inestabilidad.'},
{id:'u5-cv7',u:'U5',t:'Ciclos de vida',src:'Cuestionario',conf:'ok',
 ctx:'Un cliente nos convocó para desarrollar un sistema de información web. Necesita salir al mercado lo antes posible: por la pandemia, sus sistemas actuales no están adaptados para el home office.',
 q:'Determine el ciclo que más se adecua a las necesidades planteadas:',opts:['Cascada','Prototipado','Incremental','Iterativo'],ans:'Incremental',
 exp:'La variable decisiva es **salir antes a producción** → **Incremental**, con entregas tempranas y parciales.'},
{id:'u5-incr',u:'U5',t:'Ciclos de vida',src:'Cuestionario',conf:'ok',
 q:'En un proyecto basado en un ciclo de vida incremental, indique si cada afirmación es verdadera o falsa:',cols:VF,
 rows:['El análisis se realiza sólo en el primer incremento','La prueba de sistema se realiza sólo en el último incremento','La prueba unitaria se realiza en cada incremento','La prueba de aceptación aplica al último incremento, pero no a los anteriores'],
 rans:['Falso','Falso','Verdadero','Falso'],
 exp:'Cada incremento es una **mini-cascada** con análisis, diseño, codificación y prueba, y se plantea para terminar en un producto funcional: se hacen todas las pruebas en todos los incrementos.'},
{id:'u5-incrsis',u:'U5',t:'Ciclos de vida',src:'Cuestionario',conf:'ok',fixed:true,
 q:'En un proyecto basado en un ciclo de vida incremental con X incrementos, ¿en cuáles incrementos se deben disponer pruebas de sistema?',
 opts:['Todos','En los últimos','En los incrementos pares','En el último incremento','En ninguno, la prueba de sistema no hace falta'],ans:'Todos',
 exp:'**En todos**: cada incremento termina en un producto funcional.'},
{id:'u5-vars',u:'U5',t:'Ciclos de vida',src:'Cuestionario',conf:'ok',
 q:'¿Cuál/cuáles de las siguientes variables inciden sobre la elección de un ciclo de vida genérico de desarrollo, como base para nuestro proyecto?',
 opts:['Necesidad de poner en producción el producto de software, incluso antes de estar terminado','Estabilidad en los requerimientos','Disponibilidad presupuestaria del cliente','Cantidad de recursos disponibles para el desarrollo','Tipo de lenguaje de programación','Ninguna de las mencionadas'],
 ans:['Necesidad de poner','Estabilidad'],
 exp:'La rapidez con la que hay que desplegar y la **estabilidad de los requerimientos** determinan el ciclo. Presupuesto, recursos y lenguaje no.'},
{id:'u5-manual',u:'U5',t:'Ciclos de vida',src:'Cuestionario',conf:'ok',fixed:true,
 q:'En un proyecto basado en un ciclo de vida cascada, ¿en cuál fase se confecciona el manual de usuario?',opts:['Análisis','Diseño','Codificación','Prueba'],ans:'Prueba',
 exp:'El proceso de pruebas contempla, además de definir, elaborar, ejecutar y evaluar pruebas, la **elaboración de la documentación de usuario** (manuales de usuario y de administración).'},
{id:'u5-artman',u:'U5',t:'Ciclos de vida',src:'Cuestionario',conf:'ok',
 q:'Indique qué artefactos revisten importancia para realizar el manual de usuario:',opts:['GUI','Caso de uso','Código fuente','Informe de pruebas unitarias realizadas'],ans:['GUI','Caso de uso'],
 exp:'La **GUI** y el **caso de uso** determinan lo que ve el usuario y el paso a paso. El código fuente y el informe de pruebas unitarias no le sirven a quien usa el sistema.'},
{id:'u5-vfvv',u:'U5',t:'Grados de confianza',src:'Cuestionario',conf:'ok',
 q:'Indique si cada afirmación es verdadera o falsa:',cols:VF,
 rows:['Una compañía de software puede decidir lanzar al mercado un programa antes de estar plenamente probado y depurado','El objetivo final de V&V es establecer confianza de que el sistema de software es adecuado','Algunas pruebas funcionales pueden realizarse sin conocimiento de cómo funciona el programa','Para probar si un requerimiento se cumple alcanza con armar un caso de prueba'],
 rans:['Verdadero','Verdadero','Verdadero','Falso'],
 exp:'Con pocos competidores se puede lanzar antes. V&V buscan **confianza** de que el sistema es adecuado para su uso previsto. Caja negra = sin conocer el funcionamiento interno. Un solo caso de prueba no alcanza para un requerimiento.'},
{id:'u5-edadpeso',u:'U5',t:'Partición de equivalencia',src:'Cuestionario',conf:'ok',
 ctx:'Un sistema de entrenamiento emite una calificación (de Bajo a Excelente) según la edad y el peso que se ingresan. El criterio es el de la tabla.',
 table:{head:['Edad','Excelente','Muy bueno','Bueno','Regular','Bajo'],rows:[['7','27-31','32','33-34','35-37','> 37 y < 27'],['8','30-34','35','36-40','41-42','> 42 y < 30'],['9','34-39','40-41','42-45','46-47','> 47 y < 34'],['10','40-46','47-50','51-55','56-58','> 58 y < 40'],['11','42-46','47-50','51-52','53-55','> 55 y < 42'],['12','45-52','53','54-55','56-60','> 60 y < 45'],['13','55-59','60','61-62','63-65','> 65 y < 55'],['14','60-65','66-67','68-72','73-75','> 75 y < 60']]},
 q:'¿Cuáles de las siguientes premisas son verdaderas?',
 opts:['Para la edad hay una sola partición de equivalencia, que contiene los valores 7 a 14','Para la edad hay 8 particiones de equivalencia','Tablas de decisión sería una técnica más apropiada en este caso','Para la edad 11, algunos de los valores límite de peso son 41, 42, 46, 47, 55, 56','Para la edad 11, algunos de los valores límite de peso son 40, 42, 47, 55, 57'],
 ans:['Para la edad hay 8','Tablas de decisión','Para la edad 11, algunos de los valores límite de peso son 41'],
 exp:'El criterio cambia con cada edad → **8 particiones** para la edad. Hay dos condiciones (edad y peso) que combinadas dan la calificación → **tablas de decisión**. Para 11: bordes 41|42, 46|47, 55|56.'},
{id:'u5-pan',u:'U5',t:'Partición de equivalencia',src:'Cuestionario',conf:'ok',
 ctx:'Un sistema de pedidos de materia prima para panaderías acepta pedidos de distintos productos. La cantidad de pedido válida más pequeña es 0,5 y la más grande es 25. La precisión del campo es de 0,1.',
 q:'¿Cuál de los siguientes es un conjunto mínimo de valores de entrada que cubre las particiones de equivalencia del campo?',
 opts:['10; 28','0,2; 0,9; 29,5','12,3','0,4; 0,5; 25; 25,1'],ans:'0,2; 0,9; 29,5',
 exp:'Particiones: PI1 x < 0,5 · PV 0,5 ≤ x ≤ 25 · PI2 x > 25. **0,2 (inválido) · 0,9 (válido) · 29,5 (inválido)**, uno por partición. «0,4; 0,5; 25; 25,1» son valores límite: cubren, pero no es el conjunto mínimo.'},
{id:'u5-e18',u:'U5',t:'Partición de equivalencia',src:'Cuestionario',conf:'ok',
 ctx:'Si la edad es menor a 18, se rechaza el ingreso. Entre 18 y 30 se admite y se asigna un 20 % de descuento. Con más de 30 se admite el ingreso, pero sin descuento.',
 q:'¿Cuáles de los siguientes valores están dentro de la misma partición de equivalencia?',opts:['17, 29, 31','17, 18, 19','29, 30, 31','18, 29, 30'],ans:'18, 29, 30',
 exp:'Particiones: < 18 · **18 a 30** · > 30. Sólo 18, 29 y 30 caen en la misma.'},
{id:'u5-regr',u:'U5',t:'Estrategias de prueba',src:'Parcial 2016 (era a desarrollar)',conf:'ok',
 q:'El objetivo de la prueba de regresión es:',
 opts:['Verificar que lo que antes funcionaba sigue funcionando después de un cambio o corrección','Verificar que el defecto corregido realmente se solucionó','Probar el sistema con el usuario final en su entorno','Probar los módulos aislados con stubs y drivers'],ans:0,
 exp:'Regresión = que el arreglo **no rompió otra cosa**. Verificar que el defecto se solucionó es la prueba de **confirmación**.'},
{id:'n-u5-myers',u:'U5',t:'Principios de Myers',src:'Nueva',
 q:'Según los principios de prueba de Myers, indique si cada afirmación es verdadera o falsa:',cols:VF,
 rows:['Un desarrollador debe evitar probar su propio programa','Una parte necesaria de un caso de prueba es la definición del resultado esperado','La probabilidad de encontrar errores adicionales en una sección es inversamente proporcional a la cantidad de errores ya encontrados en ella','Los casos de prueba deben escribirse tanto para condiciones de entrada esperadas como no esperadas','Conviene planificar el esfuerzo de pruebas suponiendo que no se encontrarán errores'],
 rans:['Verdadero','Verdadero','Falso','Verdadero','Falso'],
 exp:'La probabilidad es **proporcional** a los errores ya encontrados (principio 9). **No** se planifica suponiendo que no habrá errores (principio 8). Sin resultado esperado no hay caso de prueba (principio 1).'},
{id:'n-u5-myers9',u:'U5',t:'Principios de Myers',src:'Nueva',
 ctx:'En las pruebas de un sistema de facturación se encontraron 14 defectos en el módulo de Notas de Crédito y 2 en el de Clientes.',
 q:'Según los principios de Myers, ¿dónde es más probable encontrar errores adicionales?',opts:['En Notas de Crédito','En Clientes','La probabilidad es la misma en ambos','No puede saberse sin nuevas pruebas'],ans:0,
 exp:'Principio 9: la probabilidad de encontrar errores adicionales es **proporcional** a los ya encontrados en esa sección. Conviene concentrar el esfuerzo en **Notas de Crédito**.'},
{id:'n-u5-niv',u:'U5',t:'Niveles de prueba',src:'Nueva',
 q:'Relacione cada descripción con el nivel de prueba:',cols:['Unitaria','Integración','Sistema','Aceptación'],
 rows:['La hace el propio desarrollador, aislando el componente con stubs y drivers','Busca defectos de interconexión entre módulos; toma como referencia el diseño','Prueba el comportamiento global contra requisitos funcionales y no funcionales, con un equipo independiente','La realiza un usuario o cliente para confirmar que satisface sus necesidades'],
 rans:['Unitaria','Integración','Sistema','Aceptación'],
 exp:'Ningún nivel reemplaza a otro. La prueba de sistema usa técnicas de **caja negra** en un entorno lo más parecido posible a producción.'},
{id:'n-u5-top',u:'U5',t:'Niveles de prueba',src:'Nueva',
 q:'Estrategia de integración que descubre rápidamente los errores de arquitectura y requiere stubs que simulen los módulos inferiores:',opts:['Top-down','Bottom-up','Big-bang','Regresión'],ans:'Top-down',
 exp:'**Top-down**: de arriba hacia abajo, con **stubs**. Bottom-up usa **test-drivers** y no encuentra problemas de diseño hasta muy avanzado. Big-bang no simula nada pero descubre todo al final.'},
{id:'n-u5-bot',u:'U5',t:'Niveles de prueba',src:'Nueva',
 q:'La integración bottom-up:',
 opts:['Requiere test-drivers en cada nivel y no encuentra problemas de diseño hasta muy avanzado','Requiere stubs y descubre rápido los errores de arquitectura','No requiere simular nada, pero descubre los problemas al final','Sólo es aplicable a sistemas sin componentes críticos'],ans:0,
 exp:'Bottom-up: **test-drivers**, problemas de diseño tardíos; es apropiada para orientado a objetos y **necesaria para componentes críticos**.'},
{id:'n-u5-prest',u:'U5',t:'Tipos de prueba',src:'Nueva',
 q:'Relacione cada objetivo con el tipo de prueba de prestaciones:',cols:['Carga','Capacidad','Estrés','Estabilidad','Escalabilidad'],
 rows:['Validar que el tiempo de respuesta no supere 2 segundos con 300 usuarios, en escenarios realistas','Aumentar la carga hasta encontrar el punto a partir del cual las prestaciones se degradan','Exceder los límites de procesamiento y almacenamiento, observando la integridad del sistema','Mantener carga normal durante 72 horas para detectar mala liberación de recursos','Verificar que el sistema pueda absorber requisitos mayores de prestaciones'],
 rans:['Carga','Capacidad','Estrés','Estabilidad','Escalabilidad'],
 exp:'Carga = validar requisitos definidos · Capacidad = **punto umbral** · Estrés = **sobrecarga**, foco en integridad · Estabilidad = **en el tiempo** · Escalabilidad = absorber requisitos mayores.'},
{id:'n-u5-acep',u:'U5',t:'Niveles de prueba',src:'Nueva',
 q:'Relacione cada modalidad de prueba de aceptación:',cols:['Alfa','Beta','Piloto'],
 rows:['Un conjunto acotado de clientes preseleccionados, en un entorno controlado como las oficinas de la empresa','Un conjunto más amplio de clientes, en o fuera de sus instalaciones, con algún control','Un conjunto reducido de departamentos del cliente, en sus instalaciones y en ambiente de producción'],
 rans:['Alfa','Beta','Piloto'],
 exp:'Alfa: acotado y controlado. Beta: más amplio. Piloto: departamentos del cliente, **en producción**.'},
{id:'n-u5-conf',u:'U5',t:'Estrategias de prueba',src:'Nueva',
 ctx:'Se corrigió un defecto en el cálculo de intereses. El tester ejecuta exactamente la misma prueba, con los mismos datos y condiciones, que había detectado el fallo.',
 q:'Esa prueba es de:',opts:['Confirmación','Regresión','Aceptación','Integración'],ans:'Confirmación',
 exp:'**Confirmación**: verifica que el defecto corregido se solucionó (misma prueba, mismos datos). La **regresión** verifica que el arreglo no rompió otra cosa. Se usan juntas.'},
{id:'n-u5-regt',u:'U5',t:'Estrategias de prueba',src:'Nueva',
 q:'Relacione cada situación con el tipo de regresión:',cols:['Local','De exposición','Remota'],
 rows:['Al corregir el cálculo de descuentos se introduce un error nuevo en ese mismo cálculo','El cambio en el módulo de facturación rompe el módulo de stock','La corrección deja al descubierto un error que ya existía y estaba enmascarado'],
 rans:['Local','Remota','De exposición'],
 exp:'Local = el arreglo crea un error nuevo ahí mismo. Remota = rompe **otra área**. De exposición = revela errores **que ya existían**.'},
{id:'n-u5-revt',u:'U5',t:'Técnicas estáticas',src:'Nueva',
 q:'Relacione cada descripción con el tipo de revisión:',cols:['Revisión informal','Walkthrough','Revisión técnica','Inspección'],
 rows:['La dirige el propio autor; busca entendimiento común y discutir alternativas','La dirige un moderador formado que no es el autor; registra defectos y tiene seguimiento formal con criterios de salida','Busca consenso técnico entre expertos (arquitectos, usuarios clave), no encontrar defectos','«¿Te parece bien este código?», sin proceso ni roles definidos'],
 rans:['Walkthrough','Inspección','Revisión técnica','Revisión informal'],
 exp:'La **inspección** es la de máxima formalidad y **no la dirige el autor**. El **walkthrough** sí lo dirige el autor.'},
{id:'n-u5-roles',u:'U5',t:'Técnicas estáticas',src:'Nueva',
 q:'En una revisión, el rol que decide destinar tiempo del proyecto a las revisiones y determina si se cumplieron sus objetivos es el:',opts:['Supervisor','Moderador','Autor','Revisor','Documentador'],ans:'Supervisor',
 exp:'El **supervisor** asigna tiempo, evalúa si se cumplieron los objetivos y atiende pedidos de formación. El **moderador** dirige el proceso de la revisión.'},
{id:'n-u5-estat',u:'U5',t:'Técnicas estáticas',src:'Nueva',
 q:'Son defectos que puede detectar el análisis estático:',
 opts:['Variables no inicializadas','Código inalcanzable','Variables declaradas y no utilizadas','Tiempo de respuesta excesivo bajo carga','Violaciones de los estándares de programación'],
 ans:['Variables no inicializadas','Código inalcanzable','Variables declaradas','Violaciones'],
 exp:'El análisis estático no ejecuta el código: no puede medir tiempos de respuesta, que es una prueba **dinámica** de prestaciones.'},
{id:'n-u5-cc',u:'U5',t:'Técnicas estáticas',src:'Nueva',fixed:true,
 ctx:'Un método tiene 3 sentencias IF y 1 WHILE, todas con condiciones simples (binarias).',
 q:'Su complejidad ciclomática es:',opts:['3','4','5','6'],ans:'5',
 exp:'Complejidad ciclomática = decisiones binarias + 1 = 4 + 1 = **5**. Sirve para estimar cuántas pruebas necesita el componente.'},
{id:'n-u5-dec',u:'U5',t:'Técnicas dinámicas',src:'Nueva',
 q:'La técnica de caja blanca que exige evaluar cada IF-THEN-ELSE y cada DO-WHILE tanto en verdadero como en falso es la prueba de:',opts:['Sentencia','Decisión','Caminos','Partición de equivalencia'],ans:'Decisión',
 exp:'**Decisión**. Sentencia = ejecutar cada sentencia al menos una vez. Caminos = cada camino independiente (no todas las combinaciones). Partición es de caja negra.'},
{id:'n-u5-cuo1',u:'U5',t:'Partición de equivalencia',src:'Nueva',fixed:true,
 q:'Campo «cantidad de cuotas»: entero de 1 a 12. Aplicando la directriz de rango, ¿cuántas particiones de equivalencia (válidas más inválidas) surgen?',opts:['1','2','3','12','14'],ans:'3',
 exp:'Rango → **1 válida** (1 a 12) + **2 inválidas** (menor que 1 y mayor que 12) = 3.'},
{id:'n-u5-cuo2',u:'U5',t:'Valores límite',src:'Nueva',
 q:'Campo «cantidad de cuotas»: entero de 1 a 12. ¿Cuál es el conjunto de valores límite a probar?',opts:['0, 1, 12, 13','1, 12','1, 6, 12','0, 13','2, 11'],ans:'0, 1, 12, 13',
 exp:'Los extremos del rango y sus vecinos de afuera: **0, 1, 12, 13** (igual que el ejemplo 10–100 → 9, 10, 100, 101).'},
{id:'n-u5-tarj',u:'U5',t:'Partición de equivalencia',src:'Nueva',
 q:'Campo «tipo de tarjeta» que admite VISA, MASTER o AMEX; el sistema trata a las tres de la misma forma. Según la directriz de conjuntos de valores, se identifican:',
 opts:['1 partición válida y 1 inválida','3 particiones válidas y 1 inválida','1 partición válida y 2 inválidas','3 válidas y 3 inválidas'],ans:0,
 exp:'Conjunto de valores discretos → **1 válida + 1 inválida** (todo lo demás). Dos inválidas es la directriz de **rango**. Si cada tarjeta tuviera un comportamiento distinto, habría una partición por valor.'},
{id:'n-u5-estac',u:'U5',t:'Partición de equivalencia',src:'Nueva',
 ctx:'Un estacionamiento cobra por horas enteras, de 1 a 24. Hasta 2 horas es gratis; de 3 a 6 horas se cobra la tarifa A; más de 6 horas, la tarifa B.',
 q:'¿Cuáles valores son la mejor elección para cubrir todas las particiones válidas?',opts:['1, 4, 10','1, 2, 3','3, 5','2, 6','5, 10, 25','0, 1, 24'],ans:'1, 4, 10',
 exp:'Particiones válidas: 1–2 · 3–6 · 7–24. **1, 4, 10** pone un representante en cada una. «5, 10, 25» y «0, 1, 24» meten valores inválidos y dejan una partición afuera.'},
{id:'n-u5-envio',u:'U5',t:'Tablas de decisión',src:'Nueva',fixed:true,

/* ============ MOTOR ============ */
const UNITS = {U1:'Modelos de calidad y CMMI',U2:'Gestión de procesos',U3:'Gestión de proyectos',U5:'Verificación y validación',X:'Fuera de temario'};
const UCODE = {U1:'U1',U2:'U2',U3:'U3',U5:'U5',X:'Extra'};
const KINDS = {parcial:'Parciales',cuest:'Cuestionario',nueva:'Nuevas'};
const PIN = /^(Ninguna|NINGUNA|Todas)/;
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const md = s => esc(s).replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>');

function resolveOne(list,a){
  if(typeof a==='number') return a<list.length?a:-1;
  const i=list.indexOf(a); if(i>=0) return i;
  const m=[]; list.forEach((o,j)=>{ if(o.startsWith(a)) m.push(j); });
  return m.length===1?m[0]:-1;
}
Q.forEach(q=>{
  q.type = q.cols ? 'matrix' : (Array.isArray(q.ans) ? 'multi' : 'single');
  q.k = q.src.startsWith('Parcial') ? 'parcial' : (q.src.startsWith('Cuestionario') ? 'cuest' : 'nueva');
  if(q.type==='matrix') q.a = q.rans.map(x=>resolveOne(q.cols,x));
  else if(q.type==='multi') q.a = q.ans.map(x=>resolveOne(q.opts,x));
  else q.a = resolveOne(q.opts,q.ans);
  if([].concat(q.a).some(x=>x<0) || (q.type==='matrix' && q.rows.length!==q.rans.length)){ q.broken=true; console.warn('Clave sin resolver:',q.id); }
});
const QS = Q.filter(q=>!q.broken);
const QM = {}; QS.forEach(q=>QM[q.id]=q);

function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function makePerm(q){
  if(q.type==='matrix'){ const r=q.rows.map((_,i)=>i); return q.fixed?r:shuffle(r); }
  const idx=q.opts.map((_,i)=>i);
  if(q.fixed) return idx;
  return shuffle(idx.filter(i=>!PIN.test(q.opts[i]))).concat(idx.filter(i=>PIN.test(q.opts[i])));
}
let PERM={}; QS.forEach(q=>PERM[q.id]=makePerm(q));

const HKEY='isw-banco-v1';
let H={}; try{ H=JSON.parse(localStorage.getItem(HKEY)||'{}')||{}; }catch(e){ H={}; }
function saveH(){ try{ localStorage.setItem(HKEY,JSON.stringify(H)); }catch(e){} }

const S = { mode:'practice', units:new Set(['U1','U2','U3','U5']), kinds:new Set(['parcial','cuest','nueva']), status:'all', shuffle:false,
  list:[], idx:0, resp:{}, exam:null, confirm:null };

function newResp(q){ return {sel: q.type==='single'?null:(q.type==='multi'?[]:q.rows.map(()=>null)), checked:false, score:null}; }
function answered(q,r){ if(!r) return false; if(q.type==='single') return r.sel!==null; if(q.type==='multi') return r.sel.length>0; return r.sel.every(x=>x!==null); }
function grade(q,r){
  if(q.type==='single') return r.sel===q.a?1:0;
  if(q.type==='multi'){ const a=new Set(q.a), s=new Set(r.sel); return (a.size===s.size && [...a].every(x=>s.has(x)))?1:0; }
  let c=0; q.a.forEach((x,i)=>{ if(r.sel[i]===x) c++; }); return c/q.a.length;
}
function ctx(){
  if(S.mode==='exam' && S.exam) return {ids:S.exam.ids, idx:S.exam.idx, resp:S.exam.resp, reveal:id=>S.exam.done};
  return {ids:S.list, idx:S.idx, resp:S.resp, reveal:id=>!!(S.resp[id]&&S.resp[id].checked)};
}
function setIdx(i){ if(S.mode==='exam'&&S.exam) S.exam.idx=i; else S.idx=i; }
function curQ(){ const c=ctx(); const q=QM[c.ids[c.idx]]; if(!q) return {}; if(!c.resp[q.id]) c.resp[q.id]=newResp(q); return {q, r:c.resp[q.id], c}; }

function buildList(keepId){
  let l=QS.filter(q=>S.units.has(q.u)&&S.kinds.has(q.k));
  if(S.status==='new') l=l.filter(q=>!H[q.id]);
  if(S.status==='bad') l=l.filter(q=>H[q.id]&&!H[q.id].ok);
  if(S.shuffle) l=shuffle(l);
  S.list=l.map(q=>q.id);
  const k=keepId?S.list.indexOf(keepId):-1;
  S.idx = k>=0 ? k : 0;
}

/* ---------- render: filtros ---------- */
function renderFilters(){
  const f=$('#filters');
  if(S.mode==='exam'){ f.hidden=true; return; }
  f.hidden=false;
  const base=QS.filter(q=>S.kinds.has(q.k));
  const uc=u=>base.filter(q=>q.u===u).length;
  const kbase=QS.filter(q=>S.units.has(q.u));
  const kc=k=>kbase.filter(q=>q.k===k).length;
  const bad=QS.filter(q=>H[q.id]&&!H[q.id].ok&&S.units.has(q.u)&&S.kinds.has(q.k)).length;
  f.innerHTML =
   `<div class="fgroup"><span class="flabel">Unidad</span>${Object.keys(UNITS).map(u=>`<button type="button" class="chip" data-act="unit" data-u="${u}" aria-pressed="${S.units.has(u)}" title="${esc(UNITS[u])}">${UCODE[u]} <span class="n">${uc(u)}</span></button>`).join('')}</div>
    <div class="fgroup"><span class="flabel">Origen</span>${Object.keys(KINDS).map(k=>`<button type="button" class="chip" data-act="kind" data-k="${k}" aria-pressed="${S.kinds.has(k)}">${KINDS[k]} <span class="n">${kc(k)}</span></button>`).join('')}</div>
    <div class="fgroup"><span class="flabel">Mostrar</span>
      <button type="button" class="chip" data-act="status" data-s="all" aria-pressed="${S.status==='all'}">Todas</button>
      <button type="button" class="chip" data-act="status" data-s="new" aria-pressed="${S.status==='new'}">Sin practicar</button>
      <button type="button" class="chip" data-act="status" data-s="bad" aria-pressed="${S.status==='bad'}">Falladas <span class="n">${bad}</span></button>
      <button type="button" class="chip" data-act="shuffle" aria-pressed="${S.shuffle}">Mezclar orden</button></div>
    <span class="count">${S.list.length} preguntas</span>`;
}

/* ---------- render: pregunta ---------- */
function srcBadges(q){
  let b=`<span class="badge">${esc(q.src)}</span>`;
  if(q.k==='nueva') b+=`<span class="badge new">nueva</span>`;
  else if(q.conf==='ded') b+=`<span class="badge ded">clave deducida</span>`;
  else b+=`<span class="badge ok">clave confirmada</span>`;
  return b;
}
function hintFor(q){
  if(q.type==='multi') return 'Puede haber más de una correcta. Si marcás de más, se pierde el punto.';
  if(q.type==='matrix') return 'Una respuesta por fila. Cada fila suma por separado.';
  return 'Elegí una opción.';
}
function answerText(q){
  if(q.type==='single') return q.opts[q.a];
  if(q.type==='multi') return q.a.map(i=>q.opts[i]).join(' · ');
  return null;
}
function renderCard(){
  const card=$('#card');
  if(S.mode==='exam' && !S.exam){ card.innerHTML=examIntro(); return; }
  const c=ctx();
  if(!c.ids.length){
    card.innerHTML=`<div class="empty"><p>No hay preguntas con estos filtros.</p>${S.status==='bad'?'<p>Todavía no fallaste ninguna, o ya las limpiaste.</p>':''}<button type="button" class="btn" data-act="reset-filters">Ver todas</button></div>`;
    return;
  }
  const {q,r}=curQ(); const reveal=c.reveal(q.id); const perm=PERM[q.id];
  let h=`<div class="qhead"><span class="utag">${UCODE[q.u]}</span><span class="topic">${esc(UNITS[q.u])} · ${esc(q.t)}</span>${srcBadges(q)}</div>`;
  h+=`<div class="qnum">Pregunta ${c.idx+1} de ${c.ids.length}</div>`;
  if(q.ctx||q.table){
    h+=`<div class="ctx">${q.ctx?`<p>${md(q.ctx)}</p>`:''}`;
    if(q.table) h+=`<div class="tblwrap"><table><thead><tr>${q.table.head.map(x=>`<th>${esc(x)}</th>`).join('')}</tr></thead><tbody>${q.table.rows.map(row=>`<tr>${row.map(x=>`<td>${esc(x)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
    h+=`</div>`;
  }
  h+=`<p class="stem">${md(q.q)}</p>`;
  h+=`<p class="hint">${q.inst?esc(q.inst)+' ':''}${hintFor(q)}</p>`;
  if(q.type==='matrix'){
    h+=`<div class="matrix">`+perm.map(ri=>{
      const sel=r.sel[ri]; const rc=reveal?(sel===q.a[ri]?' r-ok':' r-bad'):'';
      return `<div class="mrow${rc}"><div class="mtext">${md(q.rows[ri])}</div><div class="mcols" role="radiogroup" aria-label="${esc(q.rows[ri])}">`+
        q.cols.map((cn,ci)=>{
          let sc='seg'; if(reveal&&ci===q.a[ri]) sc+=' seg-ans'; if(reveal&&sel===ci&&ci!==q.a[ri]) sc+=' seg-wrong';
          return `<label class="${sc}"><input type="radio" id="m-${q.id}-${ri}-${ci}" name="m-${q.id}-${ri}" data-ri="${ri}" data-ci="${ci}" ${sel===ci?'checked':''} ${reveal?'disabled':''}><span>${esc(cn)}</span></label>`;
        }).join('')+`</div></div>`;
    }).join('')+`</div>`;
  } else {
    const single=q.type==='single';
    h+=`<div class="opts">`+perm.map((oi,pos)=>{
      const chk= single? r.sel===oi : r.sel.includes(oi);
      const isAns= single? q.a===oi : q.a.includes(oi);
      let cls='opt', mark='';
      if(reveal){ if(isAns){ cls+=' is-ans'; mark='correcta'; } else if(chk){ cls+=' is-wrong'; mark='tu respuesta'; } }
      return `<label class="${cls}"><input type="${single?'radio':'checkbox'}" id="o-${q.id}-${oi}" name="o-${q.id}" data-oi="${oi}" ${chk?'checked':''} ${reveal?'disabled':''}><span class="key">${String.fromCharCode(65+pos)}</span><span class="otext">${md(q.opts[oi])}</span><span class="mark">${mark}</span></label>`;
    }).join('')+`</div>`;
  }
  // acciones
  const last=c.idx>=c.ids.length-1;
  h+=`<div class="actions"><button type="button" class="btn ghost" data-act="prev" ${c.idx===0?'disabled':''}>← Anterior</button><span class="spacer"></span>`;
  if(S.mode==='practice'){
    if(!reveal) h+=`<button type="button" class="btn primary" id="btn-check" data-act="check" ${answered(q,r)?'':'disabled'}>Corregir</button>`;
    else h+=`<button type="button" class="btn" data-act="retry">Reintentar</button>`;
    h+=`<button type="button" class="btn ${reveal?'primary':''}" data-act="next" ${last?'disabled':''}>Siguiente →</button>`;
  } else {
    if(!S.exam.done && last) h+=`<button type="button" class="btn primary" data-act="submit">Entregar</button>`;
    else h+=`<button type="button" class="btn primary" data-act="next" ${last?'disabled':''}>Siguiente →</button>`;
  }
  h+=`</div>`;
  if(reveal) h+=feedback(q,r);
  card.innerHTML=h;
}
function feedback(q,r){
  const s=r.score!==null&&r.score!==undefined?r.score:grade(q,r);
  const unans=!answered(q,r)&&s===0;
  let cls,verdict;
  if(s===1){cls='good';verdict='Correcto';}
  else if(s===0){cls='bad';verdict=unans?'Sin responder':'Incorrecto';}
  else {cls='part';verdict=`Parcial: ${Math.round(s*q.a.length)} de ${q.a.length} filas`;}
  const ans=answerText(q);
  return `<div class="fb ${cls}" id="fb"><div class="verdict">${verdict}</div>`+
    (ans?`<p class="answer">Respuesta: ${md(ans)}</p>`:'')+
    `<p>${md(q.exp)}</p>`+
    (q.conf==='ded'?`<p class="ded">Clave deducida: el formulario original no mostraba la respuesta correcta.</p>`:'')+
    `</div>`;
}

/* ---------- render: panel lateral ---------- */
function sqClass(q,r,reveal,isCur){
  let c='sq';
  if(r&&reveal){ const s=r.score!==null&&r.score!==undefined?r.score:grade(q,r); c+= s===1?' ok':(s===0?' bad':' part'); }
  else if(r&&answered(q,r)&&S.mode==='exam') c+=' done';
  if(isCur) c+=' cur';
  return c;
}
function gridHTML(){
  const c=ctx();
  return `<div class="grid">`+c.ids.map((id,i)=>{ const q=QM[id]; const r=c.resp[id]; return `<button type="button" class="${sqClass(q,r,c.reveal(id),i===c.idx)}" data-act="goto" data-i="${i}" aria-label="Pregunta ${i+1}">${i+1}</button>`; }).join('')+`</div>`;
}
function unitBars(ids,resp){
  return `<div class="ubars">`+['U1','U2','U3','U5','X'].map(u=>{
    const qs=ids.map(id=>QM[id]).filter(q=>q.u===u&&resp[q.id]&&(resp[q.id].checked||(S.exam&&S.exam.done&&S.mode==='exam')));
    if(!qs.length) return '';
    const pts=qs.reduce((a,q)=>a+grade(q,resp[q.id]),0); const pct=Math.round(pts/qs.length*100);
    return `<div class="ubar"><span class="code">${UCODE[u]}</span><span class="track"><span class="fill" style="width:${pct}%"></span></span><span class="val">${pct} %</span></div>`;
  }).join('')+`</div>`;
}
function renderSide(){
  const side=$('#side');
  if(S.mode==='practice'){
    const done=S.list.filter(id=>S.resp[id]&&S.resp[id].checked);
    const pts=done.reduce((a,id)=>a+grade(QM[id],S.resp[id]),0);
    const pct=done.length?Math.round(pts/done.length*100):0;
    const hist=Object.keys(H).length, hbad=Object.values(H).filter(x=>!x.ok).length;
    side.innerHTML=`<div class="panel"><h3>Esta sesión</h3>
      <div class="stats"><div class="stat"><b>${done.length}</b><span>corregidas</span></div><div class="stat"><b>${pts%1?pts.toFixed(1).replace('.',','):pts}</b><span>puntos</span></div><div class="stat"><b>${pct}%</b><span>acierto</span></div></div>
      ${done.length?unitBars(S.list,S.resp):'<p class="note">Respondé y corregí para ver el acierto por unidad.</p>'}
    </div>
    <div class="panel"><h3>Preguntas</h3>${gridHTML()}
      <div class="legend"><span><i style="background:var(--ok-soft);border-color:var(--ok)"></i>bien</span><span><i style="background:var(--warn-soft);border-color:var(--warn)"></i>parcial</span><span><i style="background:var(--bad-soft);border-color:var(--bad)"></i>mal</span></div>
      <div class="sidebtns"><button type="button" class="btn small" data-act="reset-session">Reiniciar sesión</button>
      <button type="button" class="btn small ghost" data-act="forget">${S.confirm==='forget'?'¿Seguro? Tocá de nuevo':'Olvidar historial'}</button></div>
      <p class="note" style="margin-top:10px">Historial en este navegador: ${hist} practicadas, ${hbad} para repasar.</p>
    </div>`;
    return;
  }
  if(!S.exam){ side.innerHTML=`<div class="panel"><h3>Cómo es el parcial</h3><p class="note">Hoy el parcial es todo multiple choice y matrices, sin desarrollo. «Ninguna de las opciones» es una opción real. En las de selección múltiple, marcar de más te hace perder el punto.</p></div>`; return; }
  const E=S.exam; const n=E.ids.length;
  if(!E.done){
    const ans=E.ids.filter(id=>answered(QM[id],E.resp[id])).length;
    side.innerHTML=`<div class="panel"><h3>Simulacro en curso</h3><div class="stats"><div class="stat"><b>${ans}/${n}</b><span>respondidas</span></div></div>${gridHTML()}
      <div class="sidebtns"><button type="button" class="btn small primary" data-act="submit">${S.confirm==='submit'?`Faltan ${n-ans}. ¿Entregar igual?`:'Entregar'}</button><button type="button" class="btn small ghost" data-act="abort">Abandonar</button></div></div>`;
  } else {
    side.innerHTML=`<div class="panel"><h3>Revisión</h3>${unitBars(E.ids,E.resp)}${gridHTML()}
      <div class="legend"><span><i style="background:var(--ok-soft);border-color:var(--ok)"></i>bien</span><span><i style="background:var(--warn-soft);border-color:var(--warn)"></i>parcial</span><span><i style="background:var(--bad-soft);border-color:var(--bad)"></i>mal</span></div>
      <div class="sidebtns"><button type="button" class="btn small primary" data-act="start-exam">Nuevo simulacro</button></div></div>`;
  }
}
function renderBanner(){
  const b=$('#banner');
  if(!(S.mode==='exam'&&S.exam&&S.exam.done)){ b.innerHTML=''; return; }
  const E=S.exam; const n=E.ids.length;
  const pts=E.ids.reduce((a,id)=>a+grade(QM[id],E.resp[id]),0);
  const pct=Math.round(pts/n*100); const pass=pts>=n*0.6;
  const fmt=x=>(Math.round(x*10)/10).toString().replace('.',',');
  b.innerHTML=`<div class="result"><div class="score">${fmt(pts)} <small>/ ${n}</small></div><span class="pill ${pass?'pass':'fail'}">${pct} % · ${pass?'aprobado':'no alcanza'}</span>
   <p>Se aprueba con ${fmt(n*0.6)} puntos (60 %). Las matrices suman por fila, como en el formulario. Recorré las preguntas para ver cada corrección.</p></div>`;
}
function examIntro(){
  const pool=QS.filter(q=>q.u!=='X').length;
  return `<div class="intro"><h2>Simulacro de 13 preguntas</h2>
   <p class="note">Como el parcial 2024: 13 puntos, se aprueba con 8.</p>
   <ul><li>3 preguntas al azar de cada unidad (U1, U2, U3, U5) y 1 más de cualquiera, de un banco de ${pool}.</li>
   <li>No hay corrección hasta que entregás.</li>
   <li>Una pregunta simple vale 1 punto; una matriz reparte su punto entre las filas.</li>
   <li>Las que falles quedan marcadas para repasar en el modo Práctica.</li></ul>
   <button type="button" class="btn primary" data-act="start-exam">Empezar simulacro</button></div>`;
}
function renderAll(){ renderFilters(); renderBanner(); renderCard(); renderSide();
  document.querySelectorAll('.modes button').forEach(b=>b.setAttribute('aria-pressed', String(b.dataset.mode===S.mode))); }

/* ---------- acciones ---------- */
function startExam(){
  const byU={}; QS.filter(q=>q.u!=='X').forEach(q=>(byU[q.u]=byU[q.u]||[]).push(q.id));
  let ids=[]; Object.keys(byU).forEach(u=>{ ids=ids.concat(shuffle(byU[u]).slice(0,3)); });
  const rest=shuffle(QS.filter(q=>q.u!=='X'&&!ids.includes(q.id)).map(q=>q.id));
  ids=shuffle(ids.concat(rest.slice(0,1)));
  ids.forEach(id=>PERM[id]=makePerm(QM[id]));
  S.exam={ids, idx:0, resp:{}, done:false}; S.confirm=null;
}
function record(q,s){ const prev=H[q.id]||{n:0}; H[q.id]={n:prev.n+1, ok:s===1}; }
function scrollToCard(){
  const el=$('#card'); const top=el.getBoundingClientRect().top;
  if(top<0) el.scrollIntoView({behavior: matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth', block:'start'});
}

document.addEventListener('click', e=>{
  const b=e.target.closest('[data-act]'); if(!b||b.disabled) return;
  const act=b.dataset.act;
  if(act!=='forget'&&act!=='submit') S.confirm=null;
  switch(act){
    case 'mode': S.mode=b.dataset.mode; S.confirm=null; renderAll(); break;
    case 'unit': { const u=b.dataset.u; if(S.units.has(u)){ if(S.units.size>1) S.units.delete(u); } else S.units.add(u); buildList(); renderAll(); break; }
    case 'kind': { const k=b.dataset.k; if(S.kinds.has(k)){ if(S.kinds.size>1) S.kinds.delete(k); } else S.kinds.add(k); buildList(); renderAll(); break; }
    case 'status': S.status=b.dataset.s; buildList(); renderAll(); break;
    case 'shuffle': S.shuffle=!S.shuffle; buildList(); renderAll(); break;
    case 'reset-filters': S.units=new Set(['U1','U2','U3','U5']); S.kinds=new Set(['parcial','cuest','nueva']); S.status='all'; buildList(); renderAll(); break;
    case 'prev': { const c=ctx(); if(c.idx>0){ setIdx(c.idx-1); renderCard(); renderSide(); scrollToCard(); } break; }
    case 'next': { const c=ctx(); if(c.idx<c.ids.length-1){ setIdx(c.idx+1); renderCard(); renderSide(); scrollToCard(); } break; }
    case 'goto': setIdx(+b.dataset.i); renderCard(); renderSide(); scrollToCard(); break;
    case 'check': { const {q,r}=curQ(); if(!answered(q,r)) break; r.checked=true; r.score=grade(q,r); record(q,r.score); saveH(); renderCard(); renderSide(); renderFilters(); const fb=$('#fb'); if(fb&&fb.getBoundingClientRect().bottom>innerHeight) fb.scrollIntoView({behavior:'smooth',block:'nearest'}); break; }
    case 'retry': { const {q}=curQ(); S.resp[q.id]=newResp(q); PERM[q.id]=makePerm(q); renderCard(); renderSide(); break; }
    case 'reset-session': S.resp={}; QS.forEach(q=>PERM[q.id]=makePerm(q)); S.idx=0; renderAll(); break;
    case 'forget': if(S.confirm==='forget'){ H={}; saveH(); S.confirm=null; buildList(); renderAll(); } else { S.confirm='forget'; renderSide(); } break;
    case 'start-exam': S.mode='exam'; startExam(); renderAll(); scrollToCard(); break;
    case 'abort': S.exam=null; renderAll(); break;
    case 'submit': {
      const E=S.exam; const missing=E.ids.filter(id=>!answered(QM[id],E.resp[id])).length;
      if(missing>0 && S.confirm!=='submit'){ S.confirm='submit'; renderSide(); break; }
      E.ids.forEach(id=>{ const q=QM[id]; if(!E.resp[id]) E.resp[id]=newResp(q); const r=E.resp[id]; r.score=grade(q,r); record(q,r.score); });
      saveH(); E.done=true; E.idx=0; S.confirm=null; renderAll(); window.scrollTo({top:0,behavior:'smooth'}); break;
    }
  }
});
document.addEventListener('change', e=>{
  const t=e.target; if(!t.closest('#card')) return;
  const {q,r}=curQ(); if(!q) return;
  if(t.dataset.oi!==undefined){ const oi=+t.dataset.oi;
    if(q.type==='single') r.sel=oi;
    else r.sel = t.checked ? [...new Set(r.sel.concat(oi))] : r.sel.filter(x=>x!==oi);
  } else if(t.dataset.ri!==undefined){ r.sel[+t.dataset.ri]=+t.dataset.ci; }
  const bc=$('#btn-check'); if(bc) bc.disabled=!answered(q,r);
  if(S.mode==='exam') renderSide();
});

buildList(); renderAll();
</script>
