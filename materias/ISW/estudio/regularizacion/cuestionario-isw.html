<title>Banco ISW</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Condensed:wght@600;700&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&display=swap">
<style>
:root{
  --bg:#eef1f5; --surface:#ffffff; --surface-2:#f5f7fa; --line:#d5dbe4; --line-strong:#b9c2cf;
  --text:#152033; --muted:#58647a; --accent:#2446b0; --accent-ink:#ffffff; --accent-soft:#e2e8f9;
  --ok:#1b7548; --ok-soft:#e0f1e7; --bad:#ad3627; --bad-soft:#f8e3df; --warn:#8f5c00; --warn-soft:#f6ecd6;
  --shadow:0 1px 2px rgba(21,32,51,.06),0 6px 24px -12px rgba(21,32,51,.18);
  --sans:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --cond:"IBM Plex Sans Condensed","Arial Narrow",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0d1219; --surface:#151c27; --surface-2:#1a2330; --line:#2a3444; --line-strong:#3a4659;
    --text:#e4e9f1; --muted:#97a2b5; --accent:#89a4ff; --accent-ink:#0d1219; --accent-soft:#1e2946;
    --ok:#5cc28e; --ok-soft:#152f22; --bad:#f1806e; --bad-soft:#3a1d19; --warn:#e2aa47; --warn-soft:#33270f;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 28px -14px rgba(0,0,0,.6);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0d1219; --surface:#151c27; --surface-2:#1a2330; --line:#2a3444; --line-strong:#3a4659;
  --text:#e4e9f1; --muted:#97a2b5; --accent:#89a4ff; --accent-ink:#0d1219; --accent-soft:#1e2946;
  --ok:#5cc28e; --ok-soft:#152f22; --bad:#f1806e; --bad-soft:#3a1d19; --warn:#e2aa47; --warn-soft:#33270f;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 28px -14px rgba(0,0,0,.6);
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--text);font-family:var(--sans);font-size:16px;line-height:1.55;padding-inline:16px;padding-block:20px 48px}
.wrap{max-width:1120px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* header */
.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:16px}
.eyebrow{font-family:var(--mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
h1{font-family:var(--cond);font-weight:700;font-size:clamp(2rem,5vw,2.6rem);line-height:1;margin:6px 0 8px;letter-spacing:-.01em}
.sub{margin:0;color:var(--muted);max-width:62ch}
.sub b{color:var(--text);font-weight:600}
.modes{display:inline-flex;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:3px;gap:3px}
.modes button{border:0;background:transparent;padding:8px 16px;border-radius:7px;cursor:pointer;font-weight:500;color:var(--muted)}
.modes button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}

/* filters */
.filters{display:flex;flex-wrap:wrap;gap:10px 22px;align-items:center;padding:12px 14px;background:var(--surface);border:1px solid var(--line);border-radius:12px}
.fgroup{display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.flabel{font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-right:4px}
.chip{border:1px solid var(--line-strong);background:transparent;border-radius:999px;padding:4px 11px;font-size:14px;cursor:pointer;color:var(--muted);display:inline-flex;gap:6px;align-items:baseline}
.chip .n{font-family:var(--mono);font-size:12px;opacity:.8}
.chip[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--text)}
.count{margin-left:auto;font-family:var(--mono);font-size:13px;color:var(--muted)}

/* layout */
.layout{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:18px;align-items:start}
@media (max-width:880px){.layout{grid-template-columns:minmax(0,1fr)}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:22px clamp(16px,3vw,30px) 24px;min-width:0}
.side{display:flex;flex-direction:column;gap:14px;position:sticky;top:calc(env(safe-area-inset-top,0px) + 14px)}
@media (max-width:880px){.side{position:static}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.panel h3{margin:0 0 10px;font-family:var(--mono);font-size:12px;font-weight:500;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}

/* question */
.qhead{display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center;margin-bottom:14px}
.utag{font-family:var(--mono);font-size:12px;font-weight:500;background:var(--text);color:var(--surface);padding:2px 7px;border-radius:5px}
.topic{font-size:14px;color:var(--muted);margin-right:auto}
.badge{font-family:var(--mono);font-size:11.5px;padding:2px 8px;border-radius:5px;border:1px solid var(--line-strong);color:var(--muted);white-space:nowrap}
.badge.ok{border-color:transparent;background:var(--ok-soft);color:var(--ok)}
.badge.ded{border-color:transparent;background:var(--warn-soft);color:var(--warn)}
.badge.new{border-color:transparent;background:var(--accent-soft);color:var(--accent)}
.qnum{font-family:var(--mono);font-size:12.5px;color:var(--muted);margin-bottom:6px}
.ctx{margin:0 0 14px;padding:12px 14px;background:var(--surface-2);border:1px solid var(--line);border-radius:8px;font-size:15px}
.ctx p{margin:0}
.tblwrap{overflow-x:auto;margin:10px 0 2px}
.ctx table{border-collapse:collapse;font-size:13.5px;font-variant-numeric:tabular-nums;min-width:100%}
.ctx th,.ctx td{border:1px solid var(--line);padding:4px 8px;text-align:left;white-space:nowrap}
.ctx th{font-weight:600;background:var(--surface)}
.stem{font-size:1.14rem;font-weight:500;line-height:1.45;margin:0 0 6px;text-wrap:pretty}
.hint{font-size:13.5px;color:var(--muted);margin:0 0 14px}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{display:grid;grid-template-columns:auto auto 1fr auto;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;cursor:pointer;background:var(--surface);transition:border-color .12s,background-color .12s}
.opt:hover{border-color:var(--line-strong)}
.opt input{margin:0;accent-color:var(--accent);width:17px;height:17px}
.opt .key{font-family:var(--mono);font-size:12px;color:var(--muted);width:1.2em}
.opt .mark{font-family:var(--mono);font-size:11.5px;white-space:nowrap}
.opt:has(input:checked){border-color:var(--accent);background:var(--accent-soft)}
.opt.is-ans{border-color:var(--ok);background:var(--ok-soft)}
.opt.is-ans .mark{color:var(--ok)}
.opt.is-wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt.is-wrong .mark{color:var(--bad)}
.opt:has(input:disabled){cursor:default}

/* matrix */
.matrix{display:flex;flex-direction:column;gap:10px}
.mrow{display:flex;flex-direction:column;gap:7px;padding:10px 12px;border:1px solid var(--line);border-radius:10px}
.mrow.r-ok{border-color:var(--ok)}
.mrow.r-bad{border-color:var(--bad)}
.mtext{font-size:15px}
.mcols{display:flex;flex-wrap:wrap;gap:6px}
.seg{position:relative;display:inline-flex}
.seg input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer}
.seg span{display:inline-block;padding:5px 11px;border:1px solid var(--line-strong);border-radius:7px;font-size:14px;color:var(--muted);background:var(--surface)}
.seg input:checked + span{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.seg input:focus-visible + span{outline:2px solid var(--accent);outline-offset:2px}
.seg.seg-ans span{border-color:var(--ok);color:var(--ok);background:var(--ok-soft)}
.seg.seg-ans input:checked + span{background:var(--ok);border-color:var(--ok);color:var(--surface)}
.seg.seg-wrong input:checked + span{background:var(--bad);border-color:var(--bad);color:var(--surface)}
.seg input:disabled{cursor:default}

/* actions & feedback */
.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px;align-items:center}
.btn{border:1px solid var(--line-strong);background:var(--surface);border-radius:9px;padding:9px 16px;cursor:pointer;font-weight:500}
.btn:hover:not(:disabled){border-color:var(--text)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover:not(:disabled){filter:brightness(1.08);border-color:var(--accent)}
.btn.ghost{border-color:transparent;color:var(--muted);padding-inline:10px}
.btn.small{padding:6px 11px;font-size:14px}
.spacer{flex:1}
.fb{margin-top:18px;padding:14px 16px;border-radius:10px;border:1px solid var(--line)}
.fb.good{background:var(--ok-soft);border-color:transparent}
.fb.bad{background:var(--bad-soft);border-color:transparent}
.fb.part{background:var(--warn-soft);border-color:transparent}
.fb .verdict{font-family:var(--cond);font-weight:700;font-size:1.15rem;margin-bottom:4px}
.fb.good .verdict{color:var(--ok)} .fb.bad .verdict{color:var(--bad)} .fb.part .verdict{color:var(--warn)}
.fb p{margin:6px 0 0}
.fb .answer{font-weight:500}
.fb .ded{font-size:13.5px;color:var(--warn);margin-top:8px}
.fb .src{font-size:13px;color:var(--muted);margin-top:8px;font-family:var(--mono)}

/* side panel */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.stat{display:flex;flex-direction:column}
.stat b{font-family:var(--cond);font-size:1.6rem;line-height:1.1;font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--muted)}
.ubars{display:flex;flex-direction:column;gap:7px;margin-bottom:6px}
.ubar{display:grid;grid-template-columns:34px 1fr 52px;gap:8px;align-items:center;font-size:12.5px}
.ubar .code{font-family:var(--mono)}
.ubar .track{height:6px;background:var(--surface-2);border:1px solid var(--line);border-radius:99px;overflow:hidden}
.ubar .fill{height:100%;background:var(--ok);border-radius:99px}
.ubar .val{font-family:var(--mono);color:var(--muted);text-align:right;font-variant-numeric:tabular-nums}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(32px,1fr));gap:5px}
.sq{height:32px;border:1px solid var(--line);border-radius:6px;background:var(--surface);font-family:var(--mono);font-size:11.5px;color:var(--muted);cursor:pointer;padding:0;font-variant-numeric:tabular-nums}
.sq.done{background:var(--accent-soft);border-color:var(--accent);color:var(--text)}
.sq.ok{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.sq.bad{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
.sq.part{background:var(--warn-soft);border-color:var(--warn);color:var(--warn)}
.sq.cur{outline:2px solid var(--text);outline-offset:1px}
.legend{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12px;color:var(--muted);margin-top:10px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px;border:1px solid}
.sidebtns{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.note{font-size:13.5px;color:var(--muted);margin:0}

/* exam */
.intro h2{font-family:var(--cond);font-size:1.6rem;margin:0 0 8px}
.intro ul{margin:8px 0 18px;padding-left:20px;color:var(--muted)}
.intro li{margin:3px 0}
.result{display:flex;flex-wrap:wrap;align-items:center;gap:12px 18px;padding:16px 18px;border-radius:12px;background:var(--surface);border:1px solid var(--line)}
.result .score{font-family:var(--cond);font-size:2.4rem;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.result .score small{font-size:1rem;color:var(--muted);font-weight:600}
.pill{font-family:var(--mono);font-size:12.5px;padding:4px 10px;border-radius:99px;font-weight:500}
.pill.pass{background:var(--ok-soft);color:var(--ok)}
.pill.fail{background:var(--bad-soft);color:var(--bad)}
.result p{margin:0;color:var(--muted);font-size:14px;flex-basis:100%}
.empty{padding:30px 6px;text-align:center;color:var(--muted)}
@media (prefers-reduced-motion: reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>

<div class="wrap">
  <header class="top">
    <div>
      <div class="eyebrow">ICS · Ingeniería y Calidad de Software</div>
      <h1>Banco ISW</h1>
      <p class="sub">Parcial de regularización: <b>sábado 26/09, 9:30</b>, aulas 210 a 213. Entran <b>U1, U2, U3 y U5</b>, sin libro abierto. Se aprueba con el <b>60 %</b>.</p>
    </div>
    <div class="modes" role="group" aria-label="Modo">
      <button type="button" data-act="mode" data-mode="practice" aria-pressed="true">Práctica</button>
      <button type="button" data-act="mode" data-mode="exam" aria-pressed="false">Simulacro</button>
    </div>
  </header>

  <section class="filters" id="filters" aria-label="Filtros"></section>
  <div id="banner"></div>

  <main class="layout">
    <article class="card" id="card" aria-live="polite"></article>
    <aside class="side" id="side"></aside>
  </main>
</div>

<script>
/* ============ DATOS ============
   ans: índice, texto exacto o prefijo único de la opción correcta.
   Multi: array. Matriz: rows + cols + rans (una columna por fila).
   src 'Parcial …' / 'Cuestionario' = ya existían; 'Nueva' = creadas con el mismo formato.
   conf 'ded' = el formulario original no mostraba la clave; está deducida. */

const AREAS = ['VER (Verificación)','VAL (Validación)','OT (Formación organizativa)','PMC (Monitorización y control del proyecto)','OPD (Definición de procesos de la organización)','PP (Planificación de proyecto)','OPF (Enfoque en procesos de la organización)','NINGUNA de las otras áreas'];
const RELA = 'Relacione la actividad descripta con el área de proceso que corresponda (sólo una), o indique NINGUNA si no encuadra con ninguna de las opciones.';
const RELSP = 'Relacione la actividad descripta con el área de proceso y práctica específica que corresponda (sólo una), o indique NINGUNA si no encuadra con ninguna de las opciones.';
const XOPTS = ['REQM / SP 1.2 Obtener el compromiso sobre los requerimientos','REQM / SP 1.3 Gestionar los cambios de los requerimientos','CM / SP 1.3 Crear o liberar líneas base','CM / SP 2.1 Seguir las peticiones de cambio','CM / SP 2.2 Controlar los elementos de configuración','CM / SP 3.1 Establecer registros de gestión de configuración','PPQA / SP 1.2 Evaluar objetivamente los productos de trabajo y los servicios','PPQA / SP 2.1 Comunicar y asegurar la resolución de las no conformidades','VER / SP 3.1 Realizar la verificación','NINGUNA de las otras opciones'];
const VF = ['Verdadero','Falso'];
const NIV = ['Nivel 1','Nivel 2','Nivel 3','Nivel 4','Nivel 5'];

const Q = [
/* ---------------- U1 ---------------- */
{id:'u1-req',u:'U1',t:'Componentes de un área de proceso',src:'Parcial 2012 · 2020 · 2021 · 2024',conf:'ok',
 q:'Son componentes requeridos de un Área de Proceso CMMI:',
 opts:['Metas específicas','Metas genéricas','Prácticas genéricas','Sub-prácticas genéricas','Herramientas'],ans:['Metas específicas','Metas genéricas'],
 exp:'Requeridos = **sólo las metas** (SG y GG). Las prácticas (SP y GP) son **esperadas**; subprácticas, productos de trabajo típicos, ejemplos y ampliaciones son **informativos**. Las herramientas ni siquiera son componentes del modelo.'},
{id:'u1-spob',u:'U1',t:'Componentes de un área de proceso',src:'Parcial 2025',conf:'ded',fixed:true,
 q:'«CMMI considera como elemento obligatorio las prácticas específicas en las áreas de proceso.»',opts:['Sí','No'],ans:'No',
 exp:'Las SP son **esperadas**, no requeridas: la organización puede implementar prácticas alternativas siempre que satisfaga la meta. Lo obligatorio son las **metas**.'},
{id:'u1-ma',u:'U1',t:'Niveles de madurez',src:'Parcial 2025',conf:'ded',fixed:true,
 ctx:'Una software factory lleva varios años en el mercado, cumple con las áreas de proceso de nivel 3 y con las áreas de nivel 2, excepto el área de proceso MA, que también corresponde al nivel 2.',
 q:'Determine el nivel de madurez de la software factory.',opts:NIV,ans:'Nivel 1',
 exp:'Modelo escalonado: para estar en un nivel hay que cumplir **todas** las áreas de ese nivel y de los anteriores. Falta MA (nivel 2) → no alcanza el 2, y sin el 2 no hay 3. Queda en **nivel 1**, el nivel por defecto.'},
{id:'u1-estim',u:'U1',t:'Niveles de madurez',src:'Parcial 2025',conf:'ok',fixed:true,
 ctx:'Cierto gerente afirmó que una vez que se alcanza el nivel 3 ya no es necesario cumplir con la meta «Establecer estimaciones». De hecho: «nosotros dejamos de hacerlo».',
 q:'¿En cuáles niveles de madurez NO nos encontramos?',opts:NIV,ans:['Nivel 2','Nivel 3','Nivel 4','Nivel 5'],
 exp:'«Establecer estimaciones» es la SG 1 de **PP (nivel 2)**. Si la dejó de cumplir, se cae del nivel 2 y de todo lo que está arriba: la organización está en **nivel 1**. Alcanzar un nivel superior no exime de las áreas inferiores.'},
{id:'u1-inst',u:'U1',t:'Componentes de un área de proceso',src:'Cuestionario',conf:'ok',
 q:'Determine los elementos que tratan en CMMI la institucionalización de un proceso:',
 opts:['Metas genéricas','Metas específicas','Prácticas genéricas','Prácticas específicas','Ninguna de las mencionadas'],ans:['Metas genéricas','Prácticas genéricas'],
 exp:'Las **metas y prácticas genéricas** tratan la institucionalización. «Genérico» significa que la misma declaración se aplica a múltiples áreas de proceso. Las específicas tratan lo particular de cada área.'},
{id:'u1-atodo',u:'U1',t:'Niveles de madurez',src:'Cuestionario',conf:'ok',fixed:true,
 ctx:'La software factory «ATodooNada» tiene todas las áreas de proceso de nivel 3 implementadas; sólo le falta el área de PMC, que no es de nivel 3.',
 q:'¿Cuál es el nivel de madurez de la software factory?',opts:NIV,ans:'Nivel 1',
 exp:'PMC es de **nivel 2**. Sin una sola área de nivel 2 no se alcanza el nivel 2, y sin el 2 no hay 3. Queda en **nivel 1**.'},
{id:'u1-n2',u:'U1',t:'Áreas por nivel',src:'Cuestionario',conf:'ok',
 q:'Determine el/las área/s de proceso que son necesarias para alcanzar el nivel de madurez 2 de CMMI:',opts:['PP','PMC','OPD','VER'],ans:['PP','PMC'],
 exp:'**PP y PMC** son nivel 2. OPD y VER son nivel 3.'},
{id:'u1-sfn2',u:'U1',t:'Niveles de madurez',src:'Cuestionario',conf:'ok',
 q:'Estoy en una software factory con nivel de madurez 2. Esto es importante porque voy a encontrar en cada proyecto:',
 opts:['Un cronograma del proyecto','Un proceso de prueba definido a nivel organización','Un plan de proyecto','Una lista de puntos de control del cronograma del proyecto','Estándares de la organización'],
 ans:['Un cronograma del proyecto','Un plan de proyecto','Una lista de puntos de control'],
 exp:'Cronograma, plan y puntos de control salen de **PP / PMC (nivel 2)**. Un proceso definido **a nivel organización** y los estándares son de **OPD (nivel 3)**: en nivel 2 cada proyecto puede tener procesos bastante distintos.'},
{id:'u1-ppqa',u:'U1',t:'Áreas por nivel',src:'Cuestionario',conf:'ok',fixed:true,
 q:'«El nivel de madurez al que corresponde el aseguramiento de la calidad, y en el cual nace, es el nivel 3.»',opts:VF,ans:'Falso',
 exp:'**PPQA** es un área de soporte de **nivel 2**. No confundir con VER y VAL, que son nivel 3.'},
{id:'u1-princ',u:'U1',t:'Ingeniería de software',src:'Parcial 2012 · 2013 · 2015',conf:'ok',
 q:'Entre los principios de la Ingeniería de Software están:',
 opts:['Las personas y el tiempo son intercambiables','Haz de la calidad la razón de trabajar','Primero hazlo rápido, luego hazlo correcto','Probar, probar y probar'],ans:['Haz de la calidad','Probar, probar'],
 exp:'Las personas y el tiempo **no** son intercambiables: sumar gente no acelera linealmente (coordinación, comunicación, curva de aprendizaje). «Rápido primero» es lo opuesto a un enfoque disciplinado.'},
{id:'u1-etapa',u:'U1',t:'Ingeniería de software',src:'Parcial 2013',conf:'ok',fixed:true,
 q:'Etapa que consiste en comprobar que el software realiza correctamente las tareas indicadas en la especificación:',
 opts:['Análisis de requerimientos','Planificación','Diseño','Prueba','Mantenimiento'],ans:'Prueba',
 exp:'Es la **Prueba**. Etapas: análisis de requisitos → especificación → diseño y arquitectura → programación → prueba → mantenimiento.'},
{id:'u1-adapt',u:'U1',t:'Tipos de mantenimiento',src:'Parcial 2016',conf:'ok',
 q:'Tipo de mantenimiento que comprende las modificaciones que afectan a los entornos en los que opera el sistema (hardware, software de base, gestores de base de datos, comunicaciones):',
 opts:['Correctivo','Evolutivo','Adaptativo','Perfectivo'],ans:'Adaptativo',
 exp:'**Adaptativo** = cambios por el **entorno**. Correctivo corrige errores; evolutivo agrega, modifica o elimina por cambios en las necesidades del usuario; perfectivo mejora la calidad interna.'},
{id:'u1-soft',u:'U1',t:'Ingeniería de software',src:'Parcial 2012',conf:'ok',fixed:true,
 q:'El software está compuesto por:',opts:['Programas','Programas y datos','Programas, datos y documentos','Programas, datos, documentos y hardware'],ans:'Programas, datos y documentos',
 exp:'Software = **programas + datos + documentos**. En clase se agregó «procedimientos», pero en el parcial 2012 la respuesta esperada fue esta.'},
{id:'n-u1-heroe',u:'U1',t:'Niveles de madurez',src:'Nueva',fixed:true,
 q:'Nivel de madurez en el que el éxito depende de la competencia y heroicidad del personal, se abandonan los procesos en momentos de crisis y la organización es incapaz de repetir sus éxitos:',
 opts:['Nivel 1 — Inicial','Nivel 2 — Gestionado','Nivel 3 — Definido','Nivel 4 — Gestionado cuantitativamente','Nivel 5 — En optimización'],ans:'Nivel 1',
 exp:'**Nivel 1 (Inicial)**. Ojo: el modelo dice que estas organizaciones **a menudo producen productos que funcionan**, pero exceden el presupuesto y no cumplen el calendario. En nivel 2 la disciplina se mantiene incluso bajo estrés.'},
{id:'n-u1-4v5',u:'U1',t:'Niveles de madurez',src:'Nueva',
 q:'¿Qué distingue al nivel de madurez 5 del nivel 4?',
 opts:['El nivel 5 trata las causas comunes de variación y cambia el proceso para mejorar su rendimiento; el 4 trata las causas especiales','El nivel 5 trata las causas especiales de variación; el 4 trata las causas comunes','El nivel 5 exige el conjunto de procesos estándar de la organización; el 4 no lo exige','El nivel 5 fija objetivos cuantitativos; el 4 sólo cualitativos','Ninguna de las opciones'],ans:0,
 exp:'Nivel 4: **causas especiales**, predictibilidad estadística. Nivel 5: **causas comunes**, mejora continua incremental e innovadora del proceso. La opción invertida es la trampa. El conjunto de procesos estándar existe desde el nivel 3, y los objetivos cuantitativos ya aparecen en el 4.'},
{id:'n-u1-2v3',u:'U1',t:'Niveles de madurez',src:'Nueva',
 q:'La diferencia principal entre el nivel 2 y el nivel 3 de madurez es que en el nivel 3:',
 opts:['Los procesos de cada proyecto se adaptan desde el conjunto de procesos estándar de la organización, por lo que son consistentes entre proyectos','Los proyectos planifican y se monitorizan según políticas','El rendimiento del proceso es predecible estadísticamente','Se identifican y corrigen las causas especiales de variación'],ans:0,
 exp:'2 vs 3 es **alcance y consistencia**. En nivel 2 los procesos pueden ser bastante distintos en cada proyecto; en nivel 3 se **adaptan desde el conjunto estándar** según las guías de adaptación. Planificar y monitorizar ya es nivel 2; lo estadístico es nivel 4.'},
{id:'n-u1-comp',u:'U1',t:'Componentes de un área de proceso',src:'Nueva',
 q:'Clasifique cada componente de un área de proceso:',cols:['Requerido','Esperado','Informativo'],
 rows:['Metas genéricas','Prácticas específicas','Subprácticas','Productos de trabajo típicos','Prácticas genéricas','Declaración de propósito'],
 rans:['Requerido','Esperado','Informativo','Informativo','Esperado','Informativo'],
 exp:'Requeridos = metas (SG, GG). Esperados = prácticas (SP, GP). Todo lo demás (subprácticas, productos típicos, propósito, notas introductorias, ejemplos, ampliaciones) es informativo.'},
{id:'n-u1-num',u:'U1',t:'Componentes de un área de proceso',src:'Nueva',
 q:'En la notación de CMMI, «SP 2.3» identifica a:',
 opts:['La práctica específica número 3 de la meta específica 2','La práctica específica número 2 de la meta específica 3','La subpráctica 3 de la práctica genérica 2','La práctica específica 3 del nivel de madurez 2'],ans:0,
 exp:'SP x.y → **x = número de la meta** a la que pertenece, **y = número de secuencia** dentro de esa meta. Ej.: PMC SP 2.1 Analizar problemas es la primera práctica de la SG 2.'},
{id:'n-u1-ot',u:'U1',t:'Niveles de madurez',src:'Nueva',fixed:true,
 ctx:'Una software factory cumple todas las áreas de proceso de nivel 2 y todas las de nivel 3 excepto OT. Además implementó OPP y QPM, que son de nivel 4.',
 q:'¿Cuál es su nivel de madurez?',opts:NIV,ans:'Nivel 2',
 exp:'OT es **nivel 3** (en la edición castellana del CMMI la carátula de OT dice «nivel 4», pero es una errata: las tablas del mismo libro y la PPT de cátedra la ponen en 3). Falta un área de nivel 3 → se queda en **nivel 2**. Las áreas de nivel 4 no suman.'},
{id:'n-u1-cal',u:'U1',t:'Calidad de producto',src:'Nueva',
 q:'Clasifique el tipo de calidad de producto al que corresponde cada ejemplo:',cols:['Interna','Externa','De uso'],
 rows:['Facilidad de mantenimiento del código','Cumplimiento de los requerimientos','El sistema anda, pero a la media hora de uso real aparece un problema que nadie había previsto','Respeto de los estándares de codificación','Accesibilidad'],
 rans:['Interna','Externa','De uso','Interna','Externa'],
 exp:'**Interna**: la que el cliente no percibe (mantenibilidad, claridad del código, estándares, reusabilidad). **Externa**: la que se ve desde afuera (requerimientos, accesibilidad). **De uso**: la «calidad futura» que aparece recién con el uso real.'},
{id:'n-u1-mant',u:'U1',t:'Tipos de mantenimiento',src:'Nueva',
 q:'Relacione cada situación con el tipo de mantenimiento:',cols:['Correctivo','Evolutivo','Adaptativo','Perfectivo'],
 rows:['Migrar el sistema de SQL Server a PostgreSQL por decisión del cliente','Corregir el cálculo del IVA, que da mal en las facturas B','Agregar un reporte de ventas por sucursal que el usuario ahora necesita','Reestructurar el código del módulo de stock para hacerlo más mantenible, sin cambiar su funcionalidad'],
 rans:['Adaptativo','Correctivo','Evolutivo','Perfectivo'],
 exp:'Adaptativo = cambio de **entorno** (el gestor de base de datos). Correctivo = error. Evolutivo = cambio en las **necesidades del usuario**. Perfectivo = mejora de la **calidad interna**, según la tabla de la U1.'},
{id:'n-u1-car',u:'U1',t:'Ingeniería de software',src:'Nueva',
 q:'¿Cuáles de las siguientes son características del software según la Guía de Ingeniería del Software?',
 opts:['Se desarrolla, no se fabrica','No se estropea, pero se deteriora','Las personas y el tiempo son intercambiables','La reutilización ya alcanzó su máximo potencial','Es un elemento lógico, no físico'],
 ans:['Se desarrolla','No se estropea','Es un elemento lógico'],
 exp:'Se **desarrolla** (no hay línea de producción: cada producto es único) y **se deteriora** porque cada cambio de mantenimiento puede introducir defectos. Es un elemento **lógico**. Personas y tiempo **no** son intercambiables, y la reutilización está **lejos** de su potencial.'},
{id:'n-u1-capas',u:'U1',t:'Ingeniería de software',src:'Nueva',
 q:'En la tecnología multicapa de la ingeniería del software, ¿qué sirve de base sobre la que se apoyan procesos, métodos y herramientas?',
 opts:['El compromiso con la calidad','El ciclo de vida del proyecto','Las herramientas CASE','La gestión de proyectos'],ans:0,
 exp:'Base: **compromiso con la calidad** → Procesos (marco de trabajo) → Métodos (el «cómo» técnico) → Herramientas (automatización).'},
{id:'n-u1-madcap',u:'U1',t:'Madurez y capacidad',src:'Nueva',
 q:'Indique si cada afirmación es verdadera o falsa:',cols:VF,
 rows:['La madurez es de la organización entera y se razona por etapas','La capacidad se mide por área de proceso individual','Una organización nivel 5 ya no necesita ejecutar PP ni PMC','Una organización puede instanciar un área de un nivel superior al suyo si el contexto de negocio lo justifica'],
 rans:['Verdadero','Verdadero','Falso','Verdadero'],
 exp:'Los niveles son **acumulativos**: una organización nivel 5 sigue haciendo PP y PMC todos los días. Instanciar un área superior se puede, con el riesgo de no tener la base institucional que la sostenga cuando aparece el estrés.'},
{id:'n-u1-ieee',u:'U1',t:'Ingeniería de software',src:'Nueva',
 q:'Según la IEEE, la ingeniería del software es la aplicación de un enfoque ______ al desarrollo, operación y mantenimiento del software.',
 opts:['sistemático, disciplinado y cuantificable','ágil, iterativo e incremental','creativo, flexible y adaptable','formal, matemático y demostrable'],ans:0,
 exp:'Definición IEEE: enfoque **sistemático, disciplinado y cuantificable**.'},
{id:'n-u1-gest',u:'U1',t:'Calidad de producto',src:'Nueva',fixed:true,
 q:'De los tres niveles de gestión de la calidad, ¿en cuál se ubica CMMI?',opts:['Producto','Proyecto','Proceso','Ninguno de los tres'],ans:'Proceso',
 exp:'Producto (pruebas en paralelo a cada etapa) · Proyecto (controlar fases y áreas de gestión) · **Proceso** (gestionar las áreas de proceso de toda la organización mediante una metodología). Ahí juega CMMI.'},
{id:'n-u1-n4',u:'U1',t:'Niveles de madurez',src:'Nueva',fixed:true,
 q:'¿A partir de qué nivel de madurez el rendimiento de los procesos es predecible cuantitativamente, y no sólo cualitativamente?',opts:NIV,ans:'Nivel 4',
 exp:'En **nivel 4** el rendimiento es predecible **cuantitativamente** (medidas analizadas estadísticamente). En nivel 3, sólo **cualitativamente**.'},

/* ---------------- U2 ---------------- */
{id:'u2-fyd',u:'U2',t:'OPF',src:'Parcial 2015 · 2016 · 2020 · 2022',conf:'ok',
 q:'Área de proceso cuyo propósito se basa en la comprensión de las fortalezas y debilidades actuales de los procesos de la organización:',opts:['OPD','OT','OPF','PP'],ans:'OPF',
 exp:'**OPF** diagnostica y planifica la mejora. OPD define y guarda los activos. Es la pregunta más repetida de toda la serie de parciales.'},
{id:'u2-bench',u:'U2',t:'OPF',src:'Parcial 2021',conf:'ok',
 q:'¿Qué área se encarga de evaluar los procesos de la organización contra los de otras organizaciones?',opts:['VER','VAL','OT','OPF','OPD','PP'],ans:'OPF',
 exp:'El **benchmarking** frente a otras organizaciones está entre las fuentes de mejoras candidatas de **OPF**.'},
{id:'u2-repo',u:'U2',t:'OPD',src:'Parcial 2022 · 2024',conf:'ok',
 q:'¿Cuál es el área que mantiene el repositorio de medidas de producto y proceso relacionadas con el conjunto de procesos estándar de la organización?',
 opts:['MA','OPD','PMC','PP','OPF','OPP','Ninguna de las opciones'],ans:'OPD',
 exp:'**OPD / SP 1.4 Establecer el repositorio de medición de la organización**. La trampa es **MA**: es nivel 2 y mide **el proyecto**. Si dice «de la organización» o «procesos estándar», es OPD.'},
{id:'u2-metr',u:'U2',t:'OPD',src:'Parcial 2021',conf:'ok',
 q:'Cuando se almacenan las métricas de un proyecto en el repositorio de mediciones de la software factory, ¿qué área(s) de CMMI intervienen?',opts:['OT','PP','OPF','OPD'],ans:'OPD',
 exp:'El repositorio es un **activo de la organización** → OPD (SP 1.4).'},
{id:'u2-spopf',u:'U2',t:'OPF',src:'Parcial 2012',conf:'ok',
 q:'Son prácticas específicas del área OPF:',
 opts:['Establecer el repositorio de medición de la organización','Establecer planes de acción de procesos','Especificar el proceso de negocio principal','Incorporar las experiencias relativas al proceso en los activos de proceso de la organización'],
 ans:['Establecer planes de acción','Incorporar las experiencias'],
 exp:'OPF SP 2.1 y SP 3.4. El repositorio de medición es **OPD** SP 1.4. «Especificar el proceso de negocio principal» no es de ninguna área.'},
{id:'u2-spopd',u:'U2',t:'OPD',src:'Parcial 2013',conf:'ok',
 q:'Son prácticas específicas del área OPD:',
 opts:['Establecer el repositorio de medición de la organización','Establecer las descripciones de los modelos de ciclo de vida','Especificar el proceso de negocio principal','Incorporar las experiencias relativas al proceso en los activos de proceso de la organización'],
 ans:['Establecer el repositorio','Establecer las descripciones'],
 exp:'OPD SP 1.4 y SP 1.2. «Incorporar las experiencias…» es de **OPF** (SP 3.4). Es la misma lista que la pregunta de OPF de 2012, con la consigna invertida.'},
{id:'u2-ot',u:'U2',t:'OT',src:'Parcial 2013',conf:'ok',
 q:'Área cuyo propósito es desarrollar las habilidades y el conocimiento de las personas para que puedan realizar sus roles de manera eficaz y eficiente:',opts:['OPD','OPF','OT','RD'],ans:'OT',
 exp:'**OT (Formación organizativa)**, nivel 3.'},
{id:'u2-n3',u:'U2',t:'Áreas por nivel',src:'Parcial 2016',conf:'ded',
 q:'Áreas de proceso que corresponden al nivel de madurez 3:',opts:['VAL','PMC','VER','PP','OPF'],ans:['VAL','VER','OPF'],
 exp:'VAL, VER y OPF son nivel 3. PMC y PP son nivel 2.'},
{id:'u2-ptorg',u:'U2',t:'OPD',src:'Cuestionario',conf:'ok',
 q:'¿Cuál es el/las área(s) de CMMI que se encarga de verificar y almacenar los productos de trabajo a nivel organizacional (es decir, los que se usan en todos los proyectos)?',
 opts:['PP','OPF','PMC','OPD','OT','NINGUNA de las anteriores'],ans:'NINGUNA',
 exp:'Trampa: «verificar», «almacenar» y «nivel organizacional» empujan a OPD, pero los **productos de trabajo** surgen de cada proyecto (código fuente, minutas). Si dijera **activos**, sería OPD.'},
{id:'u2-excep',u:'U2',t:'OPD',src:'Cuestionario',conf:'ok',inst:RELSP,
 q:'Escribir el procedimiento por el cual deberá pedirse la excepción en un proyecto en particular, indicando motivos justificados, para no incluir Testing Automatizado (a diferencia de lo determinado por el proceso establecido).',
 opts:['OPD / SP 1.1 Establecer los procesos estándar','OPD / SP 1.2 Establecer las descripciones de los modelos de ciclo de vida','OPD / SP 1.3 Establecer los criterios y las guías de adaptación','PP / SP 1.3 Definir el ciclo de vida del proyecto','OPF / SP 1.2 Evaluar los procesos de la organización','OT / SP 1.4 Establecer la capacidad de formación','NINGUNA de las otras opciones'],
 ans:'OPD / SP 1.3',
 exp:'Apartarse del proceso estándar con motivos justificados = **guías de adaptación** → **OPD / SP 1.3**. Misma respuesta para la variante «no incluir un Diseñador Gráfico».'},
{id:'u2-modneg',u:'U2',t:'OPD',src:'Cuestionario',conf:'ok',inst:RELA,opts:AREAS,ans:'OPD',
 q:'Detallar en qué tipo de proyectos puede no realizarse el Modelado de Negocio (apartándose del proceso estándar), invocando causas justificadas.',
 exp:'Es definir **criterios y guías de adaptación** del proceso estándar → **OPD** (SP 1.3).'},
{id:'u2-lecc',u:'U2',t:'OPF',src:'Cuestionario',conf:'ok',inst:RELA,opts:AREAS,ans:'OPF',
 q:'Analizar tendencias en los informes de lecciones aprendidas de los proyectos terminados, para detectar cambios que podrían introducirse en los procesos.',
 exp:'Las lecciones aprendidas son fuente de **mejoras candidatas** → **OPF**. Si el enunciado plantea un problema de un proyecto específico, difícilmente sea OPD, OPF u OT; acá se mira a toda la organización.'},
{id:'u2-nc',u:'U2',t:'OPF',src:'Cuestionario',conf:'ok',inst:RELA,opts:AREAS,ans:'OPF',
 q:'Revisar los informes de no conformidad de procesos, generados por el área de SQA, para diseñar posibles cambios a la plantilla de casos de uso.',
 exp:'Cadena: **PPQA** emite y documenta las no conformidades → **OPF** las revisa y propone la mejora → **OPD** materializa el cambio en el activo.'},
{id:'u2-gerqa',u:'U2',t:'OPF',src:'Cuestionario',conf:'ok',inst:RELA,opts:AREAS,ans:'OPF',
 q:'El gerente de QA de la software factory decidió impulsar un proceso de evaluación de la forma en que trabaja la misma, para determinar cuáles son los puntos sólidos y cuáles los endebles. Para eso presenta en la reunión de gerencia los objetivos, la dedicación necesaria del personal y los plazos de la iniciativa, con el fin de lograr el consenso necesario.',
 exp:'Evaluar los procesos para entender **fortalezas y debilidades** → **OPF** (SP 1.2 Evaluar los procesos de la organización).'},
{id:'u2-3pm',u:'U2',t:'OPD',src:'Cuestionario',conf:'ok',inst:RELA,opts:AREAS,ans:'OPD',
 q:'Realizar una reunión con 3 Project Managers para analizar el procedimiento definido (y aún no publicado) para el seguimiento de los proyectos, con el objetivo de encontrar y eliminar probables inconsistencias y/o errores. Dicho procedimiento fue redactado por otro Project Manager que colabora con la redacción de procedimientos iniciales.',
 exp:'La fuente la resuelve como **OPD**: se está estableciendo un **activo de proceso de la organización** (un procedimiento). Es discutible, porque revisar entre pares se parece a VER; la fuente decide por el **contenido** del artefacto, que es organizacional y no un producto de un proyecto.'},
{id:'u2-act1',u:'U2',t:'Activo vs producto de trabajo',src:'Parcial 2022 · 2024',conf:'ok',
 q:'Indique si cada elemento es un activo, un producto de trabajo, o ambos:',cols:['Activo','Producto de trabajo','Ambos'],
 rows:['Plantilla de Casos de Uso','Manual de usuario del compilador Java','Regla de Negocio','Plantilla de Manual de Instalación','Directrices para conformar el Equipo del Proyecto','Descripción del flujo del Proceso de Negocio del Cliente','Manual de Instalación del sistema desarrollado para el cliente'],
 rans:['Activo','Activo','Producto de trabajo','Activo','Activo','Producto de trabajo','Producto de trabajo'],
 exp:'**Activo**: lo que la organización tiene para usar en sus proyectos (plantilla, guía, directriz, y también la documentación de herramientas que adquiere). **Producto de trabajo**: el resultado concreto de una tarea del proyecto («del cliente», «del sistema desarrollado», una regla de negocio). En los ítems confirmados de tres años, «Ambos» nunca fue la respuesta.'},
{id:'u2-act2',u:'U2',t:'Activo vs producto de trabajo',src:'Parcial 2025',conf:'ok',
 q:'Indique si cada elemento es un activo, un producto de trabajo, o ambos:',cols:['Activo','Producto de trabajo','Ambos'],
 rows:['Plantilla para la presentación de la Reunión de Lanzamiento de Proyecto','Guía para confeccionar el Manual de Usuario','Descripción del Proceso de Negocio del Cliente','Manual de Usuario del sistema desarrollado para el cliente'],
 rans:['Activo','Activo','Producto de trabajo','Producto de trabajo'],
 exp:'El molde es de la organización (**activo**); lo moldeado es del proyecto (**producto de trabajo**). «Plantilla» y «guía» son señales de activo; «del cliente» y «del sistema desarrollado», de producto de trabajo.'},
{id:'u2-spem',u:'U2',t:'SPEM',src:'Parcial 2015',conf:'ok',
 q:'En la representación de un proceso según SPEM, relacione cada elemento con la pregunta que responde:',cols:['Quién','Qué','Cómo'],
 rows:['Rol','Producto de trabajo','Tarea'],rans:['Quién','Qué','Cómo'],
 exp:'**Rol** = quién hace el trabajo. **Producto de trabajo** = qué (entradas y salidas de las tareas). **Tarea** = cómo (el esfuerzo a realizar).'},
{id:'n-u2-otsp',u:'U2',t:'OT',src:'Nueva',
 q:'Son prácticas específicas del área OT:',
 opts:['Establecer las necesidades de formación estratégicas','Establecer un plan táctico de formación organizativa','Evaluar la eficacia de la formación','Establecer planes de acción de procesos','Establecer la biblioteca de activos de proceso de la organización'],
 ans:['Establecer las necesidades','Establecer un plan táctico','Evaluar la eficacia'],
 exp:'OT SP 1.1, SP 1.3 y SP 2.3. «Planes de acción de procesos» es de **OPF** (SP 2.1); la biblioteca de activos es de **OPD** (SP 1.5).'},
{id:'n-u2-otresp',u:'U2',t:'OT',src:'Nueva',
 q:'Una necesidad de formación específica de un único proyecto (por ejemplo, un framework que sólo usa ese cliente):',
 opts:['La identifica y trata el propio proyecto; la organización puede cubrirla sólo si se acuerda','La trata siempre la organización, porque OT es responsable de toda la formación','Nunca puede cubrirla la organización','La trata el área de PPQA'],ans:0,
 exp:'La organización trata las necesidades **comunes**; los proyectos y grupos de soporte, las **específicas**. Que la organización cubra una necesidad particular es posible, pero **debe acordarse**.'},
{id:'n-u2-estr',u:'U2',t:'OT',src:'Nueva',fixed:true,
 q:'Las necesidades de formación estratégicas de la organización miran hacia adelante un horizonte de:',opts:['El próximo proyecto','6 meses','2 a 5 años','10 años o más'],ans:'2 a 5 años',
 exp:'**2 a 5 años**, para introducir nuevas tecnologías o cambios organizativos importantes.'},
{id:'n-u2-plan',u:'U2',t:'OT',src:'Nueva',inst:RELA,opts:AREAS,ans:'OT',
 q:'Armar el cronograma de cursos del próximo semestre (Java, testing automatizado y escritura de casos de uso) que se dictarán a todo el personal de la software factory, con instructores, aulas y fechas.',
 exp:'Formación **común a toda la organización** → **OT** (SP 1.3 Establecer un plan táctico de formación organizativa).'},
{id:'n-u2-bibl',u:'U2',t:'OPD',src:'Nueva',inst:RELA,opts:AREAS,ans:'OPD',
 q:'Definir qué contenido y qué organización tendrá la biblioteca de activos de proceso de la software factory (políticas, plantillas, procedimientos de estimación, lecciones aprendidas) y dónde se alojará.',
 exp:'**OPD / SP 1.5 Establecer la biblioteca de activos de proceso de la organización**. No confundir con el repositorio de medición (SP 1.4).'},
{id:'n-u2-piloto',u:'U2',t:'OPF',src:'Nueva',inst:RELA,opts:AREAS,ans:'OPF',
 q:'Probar el nuevo procedimiento de estimación por puntos función en un proyecto piloto y monitorear sus resultados antes de decidir si se despliega a toda la organización.',
 exp:'Es la excepción típica: aunque ocurre en un proyecto, es el seguimiento de una **mejora de proceso en un piloto** → **OPF** (planes piloto y de despliegue).'},
{id:'n-u2-puesto',u:'U2',t:'OPD',src:'Nueva',inst:RELA,opts:AREAS,ans:'OPD',
 q:'Definir la configuración estándar de hardware y software de los puestos de trabajo de los desarrolladores, junto con el proceso para solicitar y aprobar excepciones.',
 exp:'**OPD / SP 1.6 Establecer los estándares del entorno de trabajo**, que incluyen hardware y software de puesto estándar y el proceso para pedir excepciones.'},
{id:'n-u2-regf',u:'U2',t:'OT',src:'Nueva',inst:RELA,opts:AREAS,ans:'OT',
 q:'Registrar qué empleados completaron el curso de testing automatizado y con qué calificación, para que quede constancia de su formación.',
 exp:'**OT / SP 2.2 Establecer los registros de formación**.'},
{id:'n-u2-spemniv',u:'U2',t:'SPEM',src:'Nueva',
 q:'Relacione cada elemento de SPEM con su descripción:',cols:['Delivery Process','Capability Pattern','Activity','Task'],
 rows:['Un proceso completo, tan complejo como se necesite','Fragmento de proceso reutilizable más de una vez dentro de un proceso','Elemento central para organizar los elementos básicos de proceso','Unidad elemental de trabajo del modelo'],
 rans:['Delivery Process','Capability Pattern','Activity','Task'],
 exp:'Ejemplo en RUP: ciclo vital típico (delivery process) → disciplina Entorno → actividad «Preparar el entorno para el proyecto» → tarea «Personalizar el proceso de desarrollo para el proyecto».'},
{id:'n-u2-spemvf',u:'U2',t:'SPEM',src:'Nueva',
 q:'Indique si cada afirmación sobre SPEM es verdadera o falsa:',cols:VF,
 rows:['Es un estándar de la OMG, el mismo consorcio que UML','Es un lenguaje de modelado de procesos de cualquier tipo, no sólo de software','Su alcance se limita a los elementos mínimos necesarios para definir procesos','RUP está basado en SPEM'],
 rans:['Verdadero','Falso','Verdadero','Verdadero'],
 exp:'SPEM está **orientado a procesos de software y sistemas**; no es un lenguaje general de modelado de procesos. Se limita a los elementos mínimos, sin agregar características de un dominio particular.'},
{id:'n-u2-tipopt',u:'U2',t:'RUP',src:'Nueva',
 q:'Clasifique cada producto de trabajo según su tipo en RUP:',cols:['Artefacto','Resultado','Entregable'],
 rows:['Documento de Visión del proyecto','El estado «entorno de desarrollo configurado»','Paquete con el ejecutable, el manual de instalación y las notas de versión que se entrega al cliente','Modelo de casos de uso'],
 rans:['Artefacto','Resultado','Entregable','Artefacto'],
 exp:'**Artefacto** = producto tangible, no trivial. **Resultado** = intangible (un resultado o un estado). **Entregable** = empaquetado de otros productos de trabajo para entregar a una parte interna o externa.'},
{id:'n-u2-guias',u:'U2',t:'RUP',src:'Nueva',
 q:'Relacione cada descripción con el tipo de guía de RUP:',cols:['Plantilla','Directriz','Lista de comprobación','Ejemplo','Informe'],
 rows:['Estructura de secciones y formato estandarizado de un documento de caso de uso','Indicaciones sobre cómo llevar a cabo una entrevista con el usuario','Ítems a verificar durante la inspección de un diseño','Un caso de uso de muestra, parcialmente completado','Resultado generado automáticamente por una herramienta a partir de otros productos'],
 rans:['Plantilla','Directriz','Lista de comprobación','Ejemplo','Informe'],
 exp:'Plantilla = estructura. Directriz = cómo manejar un elemento concreto. Lista de comprobación = ítems a completar o verificar, usada en revisiones. Ejemplo = instancia parcialmente completa. Informe = salida automática de una herramienta.'},
{id:'n-u2-jer',u:'U2',t:'RUP',src:'Nueva',
 q:'Según RUP, ¿cuál es la relación correcta entre disciplina, actividad y tarea?',
 opts:['Una disciplina tiene una o más actividades, y una actividad tiene una o más tareas','Una tarea tiene una o más actividades, y una actividad agrupa varias disciplinas','Una actividad tiene una o más disciplinas, y cada disciplina tiene una o más tareas','Disciplina, actividad y tarea son sinónimos en RUP'],ans:0,
 exp:'**Disciplina ⊃ actividades ⊃ tareas**. La disciplina categoriza tareas por la similitud de sus preocupaciones; la actividad agrupa lógicamente; la tarea es la unidad de trabajo.'},
{id:'n-u2-gran',u:'U2',t:'RUP',src:'Nueva',fixed:true,
 q:'La granularidad de una tarea en RUP oscila entre:',opts:['Unos minutos y unas horas','Unas horas y unos días','Unos días y unas semanas','Una fase completa'],ans:1,
 exp:'**Unas horas y unos días**. La llevan a cabo roles específicos, suele afectar a uno o pocos productos de trabajo y puede desglosarse en pasos.'},
{id:'n-u2-fase',u:'U2',t:'RUP',src:'Nueva',
 q:'En RUP, una fase es:',
 opts:['Un período de tiempo entre dos objetivos importantes','Una categorización de tareas según la similitud de sus preocupaciones','Un conjunto de habilidades, competencias y responsabilidades','Una unidad elemental de trabajo'],ans:0,
 exp:'Fase = **período entre dos objetivos importantes** (Concepción, Elaboración, Construcción, Transición). La segunda opción define disciplina; la tercera, rol; la cuarta, tarea.'},
{id:'n-u2-act3',u:'U2',t:'Activo vs producto de trabajo',src:'Nueva',
 q:'Indique si cada elemento es un activo, un producto de trabajo, o ambos:',cols:['Activo','Producto de trabajo','Ambos'],
 rows:['Checklist de inspección de código de la software factory','Minuta de la reunión de relevamiento del proyecto «Farmacia Online»','Procedimiento de estimación de la organización','Cronograma del proyecto «Turnos Online»','Manual del IDE adquirido por la software factory'],
 rans:['Activo','Producto de trabajo','Activo','Producto de trabajo','Activo'],
 exp:'Checklist, procedimiento y la documentación de una herramienta adquirida son **activos**: la organización los tiene para usar en todos sus proyectos. La minuta y el cronograma de un proyecto puntual son **productos de trabajo**.'},
{id:'n-u2-planacc',u:'U2',t:'OPF',src:'Nueva',
 q:'En OPF, el plan que resulta de la evaluación de procesos y documenta cómo se implementarán las mejoras que atacan las debilidades detectadas es el:',
 opts:['Plan de mejora de procesos','Plan de evaluación','Plan de acción de procesos','Plan de despliegue','Plan de proyecto'],ans:'Plan de acción',
 exp:'Cadena de OPF: plan de mejora (general) → plan de evaluación (alcance, modelo de referencia) → **plan de acción de procesos** (resulta de la evaluación) → plan piloto → plan de despliegue. La aceptación ganada en una evaluación se deteriora rápido si no la sigue un plan de acción.'},
{id:'n-u2-dim',u:'U2',t:'Gestión de procesos',src:'Nueva',
 q:'Las tres dimensiones críticas sobre las que una organización puede centrarse para mejorar son:',
 opts:['Personas','Métodos y procedimientos','Herramientas y equipamiento','Presupuesto','Clientes'],ans:['Personas','Métodos','Herramientas'],
 exp:'Personas · métodos y procedimientos · herramientas y equipamiento. Los **procesos** son los que sustentan el conjunto.'},
{id:'n-u2-avz',u:'U2',t:'Gestión de procesos',src:'Nueva',
 q:'Las áreas de gestión de procesos de CMMI se dividen en básicas y avanzadas. Son avanzadas:',opts:['OPF y OPD','OPP y OID','OT y OPF','OPD y OT','CAR y DAR'],ans:'OPP y OID',
 exp:'Básicas: **OPF, OPD (+IPPD) y OT**. Avanzadas: **OPP y OID**.'},
{id:'n-u2-adap',u:'U2',t:'OPD',src:'Nueva',
 q:'Son acciones de adaptación válidas al crear el proceso definido de un proyecto a partir de las guías de adaptación:',
 opts:['Modificar un modelo de ciclo de vida','Combinar elementos de modelos de ciclo de vida distintos','Reemplazar o reordenar elementos del proceso','Omitir partes del proceso estándar sin documentarlo'],
 ans:['Modificar','Combinar','Reemplazar'],
 exp:'Las guías describen qué es obligatorio, qué opciones hay y **cómo documentar** la adaptación. Buscan equilibrar flexibilidad y consistencia; apartarse sin documentar no es adaptar.'},
{id:'n-u2-elem',u:'U2',t:'OPD',src:'Nueva',
 q:'Son atributos críticos de un elemento de proceso:',opts:['Criterios de entrada','Criterios de salida','Roles','Nombre del cliente','Presupuesto del proyecto'],ans:['Criterios de entrada','Criterios de salida','Roles'],
 exp:'Roles, estándares aplicables, procedimientos y herramientas, objetivos de rendimiento, **criterios de entrada**, entradas, medidas, puntos de verificación, salidas, interfaces y **criterios de salida**. El cliente y el presupuesto son datos de un proyecto, no de un elemento de proceso.'},

/* ---------------- U3 ---------------- */
{id:'u3-ctrl',u:'U3',t:'PMC',src:'Parcial 2020 · 2021',conf:'ok',fixed:true,
 q:'¿En qué momento del ciclo de vida de un proyecto definiría los controles (puntos de control y monitoreo)?',opts:['Inicio','Planificación','Fin','Ejecución'],ans:'Planificación',
 exp:'Los puntos de control y los hitos se definen **al planificar**, en la EDT/WBS. En ejecución se **usan**, no se definen.'},
{id:'u3-desv',u:'U3',t:'PMC',src:'Parcial 2020 · 2021',conf:'ok',fixed:true,
 q:'«Cualquier desvío encontrado dentro del control y monitoreo de un proyecto debe ser resuelto.»',opts:VF,ans:'Falso',
 exp:'Sólo se actúa sobre las **desviaciones significativas**: las que, sin resolver, **impiden al proyecto cumplir sus objetivos**.'},
{id:'u3-replan',u:'U3',t:'PMC',src:'Cuestionario',conf:'ded',fixed:true,
 q:'Cuando el estado real de un proyecto se desvía significativamente de los valores esperados, se llevan a cabo acciones correctivas, que pueden llevar a replanificar. Si esto sucede, ¿se deben redefinir los controles (puntos de control y monitoreo) del proyecto?',opts:VF,ans:'Verdadero',
 exp:'La replanificación puede corregir el plan original, fijar nuevos acuerdos o agregar actividades de mitigación. Si el plan cambia, los puntos de control deben reflejar el plan nuevo. La fuente no muestra la clave: está deducida.'},
{id:'u3-planinc',u:'U3',t:'PP',src:'Parcial 2012 · 2015',conf:'ok',
 q:'La planificación de un proyecto incluye:',
 opts:['La estimación de las tareas','La determinación de los recursos','El pago a los recursos','La identificación de riesgos','La especificación detallada de la arquitectura del software a construir'],
 ans:['La estimación','La determinación','La identificación'],
 exp:'PP estima, determina recursos, arma el calendario e **identifica riesgos**. Pagar no es planificar, y la arquitectura detallada es de **TS** (Solución técnica).'},
{id:'u3-gp',u:'U3',t:'Gestión de proyectos',src:'Parcial 2012',conf:'ok',
 q:'Las siguientes actividades/procesos pueden formar parte de la gestión de proyectos:',
 opts:['Definir las actividades del proyecto','Estimar la duración de las actividades del proyecto','Elaborar presupuestos de proyecto','Definir el equipo de proyecto'],ans:[0,1,2,3],
 exp:'**Todas**. Alcance (definir actividades), tiempo (estimar duración), costes (presupuestos) y personal (definir el equipo) son grupos de procesos de la gestión de proyectos.'},
{id:'u3-equipo',u:'U3',t:'Gestión de proyectos',src:'Parcial 2012',conf:'ok',
 q:'Forma parte de lo que se realiza en el proceso «Definir el Equipo del Proyecto»:',
 opts:['Determinar roles del proyecto','Estimar el esfuerzo previsto para cada rol','Determinar las responsabilidades para cada rol','Controlar el cronograma para cada rol'],ans:['Determinar roles','Determinar las responsabilidades'],
 exp:'«La definición del equipo de proyecto consiste en determinar los **roles y las responsabilidades** del proyecto.» Estimar esfuerzo y controlar el cronograma son de otros grupos.'},
{id:'u3-tiempo',u:'U3',t:'Gestión de proyectos',src:'Parcial 2013',conf:'ok',
 q:'Son procesos relacionados con el tiempo en la gestión de proyectos:',
 opts:['Definir las actividades','Establecer la secuencia de actividades','Estimar la duración de actividades','Controlar el cronograma'],ans:['Establecer','Estimar','Controlar'],
 exp:'Distractor clásico: «Definir las actividades» suena a cronograma pero es del grupo **Alcance**. Tiempo = secuencia, duración, desarrollar y controlar el cronograma.'},
{id:'u3-coord',u:'U3',t:'Gestión de proyectos',src:'Parcial 2015',conf:'ok',
 q:'Son procesos relacionados con la coordinación en la gestión de proyectos:',
 opts:['Desarrollar el plan del proyecto','Establecer la secuencia de actividades','Estimar la duración de actividades','Supervisar el trabajo del proyecto'],ans:['Desarrollar','Supervisar'],
 exp:'Coordinación: iniciar, desarrollar el plan, gestionar la ejecución, **supervisar el trabajo**, control integrado de cambios, cerrar. Secuencia y duración son de **Tiempo**.'},
{id:'u3-vf22',u:'U3',t:'Gestión de proyectos',src:'Parcial 2022',conf:'ok',
 q:'Indique si cada afirmación es verdadera o falsa:',cols:VF,
 rows:['La planificación de un proyecto es un área de proceso que se cumple desde el nivel 2 de maduración del CMMI','Un proyecto puede no tener fin','Los proyectos de software son sólo de desarrollo','Decir «tengo un plan de proyecto» es decir «tengo un diagrama de Gantt»'],
 rans:['Verdadero','Falso','Falso','Falso'],
 exp:'Un proyecto tiene **inicio y fin definidos**. Hay proyectos de desarrollo, mantenimiento y despliegue. El Gantt es una **vista** del cronograma; el plan incluye alcance, estimaciones, recursos, riesgos, calidad y comunicación.'},
{id:'u3-esf',u:'U3',t:'Esfuerzo y EDT',src:'Parcial 2022',conf:'ok',
 ctx:'Dos módulos independientes, X y B. Duración y esfuerzo expresados en días; el esfuerzo se interpreta como días-persona. Un día-persona = 8 horas. Ciclo de vida cascada.',
 table:{head:['Tarea','Duración','Esfuerzo'],rows:[['Analizar X','3 días','3 días'],['Diseñar X','5 días','5 días'],['Codificar X','4 días','4 días'],['Probar X','5 días','5 días'],['Analizar B','2 días','3 días'],['Diseñar B','4 días','5 días'],['Codificar B','3 días','6 días'],['Probar B','3 días','5 días']]},
 q:'Determine el esfuerzo de la fase de análisis en horas-persona.',opts:['24','48','3','6','29','136'],ans:'48',
 exp:'Analizar X (3) + Analizar B (3) = 6 días-persona × 8 h = **48 h**. La trampa es la columna: Analizar B **dura 2 días** pero consume **3 días-persona**. El esfuerzo se suma; la duración no. 24 es sumar un solo módulo y 136 es todo el proyecto.'},
{id:'u3-edt1',u:'U3',t:'Esfuerzo y EDT',src:'Parcial 2024',conf:'ok',
 ctx:'El producto final está compuesto por 3 módulos independientes: X, Y y Z. Tareas de la EDT, para cada módulo: Analizar, Diseñar, Codificar y Probar. Sólo se consideran predecesoras directas.',
 q:'Predecesora(s) directa(s) de «Codificar X»:',opts:['Analizar X','Diseñar X','Probar X','Diseñar Y','Ninguna de las opciones'],ans:['Diseñar X'],
 exp:'Directa = la inmediatamente anterior. Analizar X precede a Diseñar X, que precede a Codificar X, pero **Analizar X no es predecesora directa** de Codificar X.'},
{id:'u3-edt2',u:'U3',t:'Esfuerzo y EDT',src:'Parcial 2024',conf:'ok',
 ctx:'El producto final está compuesto por 3 módulos independientes: X, Y y Z. Tareas de la EDT, para cada módulo: Analizar, Diseñar, Codificar y Probar.',
 q:'Tarea(s) que dan inicio al proyecto:',opts:['Analizar X','Analizar Y','Analizar Z','Diseñar X','Probar Z'],ans:['Analizar X','Analizar Y','Analizar Z'],
 exp:'Los módulos son **independientes**: los tres análisis arrancan en paralelo. Son **tres** tareas de inicio, no una.'},
{id:'u3-pmcprop',u:'U3',t:'PMC',src:'Parcial 2012',conf:'ok',
 q:'Área cuyo propósito es «proporcionar una comprensión del progreso del proyecto para que se puedan tomar acciones correctivas apropiadas cuando el rendimiento se desvíe significativamente del plan»:',opts:['PP','PMC','PPQA','MA','OPF'],ans:'PMC',
 exp:'Es la definición textual de **PMC (Monitorización y control del proyecto)**, nivel 2.'},
{id:'u3-sgpmc',u:'U3',t:'PMC',src:'Parcial 2016',conf:'ok',
 q:'Son metas específicas del área PMC:',
 opts:['Obtener el compromiso con el plan','Monitorizar el proyecto frente al plan','Gestionar las acciones correctivas hasta su cierre','Monitorizar los criterios y las guías de adaptación'],ans:['Monitorizar el proyecto','Gestionar las acciones'],
 exp:'PMC: **SG 1 Monitorizar el proyecto frente al plan** y **SG 2 Gestionar las acciones correctivas hasta su cierre**. «Obtener el compromiso con el plan» es SG 3 de **PP**.'},
{id:'u3-srv1',u:'U3',t:'PP vs PMC',src:'Cuestionario',conf:'ok',inst:RELSP,
 q:'El cliente informó que el server destinado al ambiente de producción, que compró recientemente, estará disponible con 10 días de retraso respecto a lo acordado en la reunión de lanzamiento del proyecto. Por lo tanto, en este momento el equipo del proyecto está determinando si es necesario tomar medidas para compensar dicho retraso.',
 opts:['PP / SP 3.3 Obtener el compromiso con el plan','PP / SP 2.4 Planificar los recursos del proyecto','PMC / SP 1.5 Monitorizar la involucración de las partes interesadas','PMC / SP 2.1 Analizar problemas','OPD / SP 1.3 Establecer los criterios y las guías de adaptación','VER / SP 1.2 Establecer el entorno de verificación','NINGUNA de las otras opciones'],
 ans:'PMC / SP 2.1',
 exp:'La reunión de lanzamiento **ya ocurrió** → estoy monitorizando. Recoger y analizar el problema y determinar las acciones correctivas → **PMC / SP 2.1 Analizar problemas**.'},
{id:'u3-srv2',u:'U3',t:'PP vs PMC',src:'Cuestionario',conf:'ok',inst:RELSP,
 q:'El cliente informó que el server del ambiente de producción estará disponible con 10 días de retraso respecto a lo acordado en la primera conversación al respecto. En este momento el equipo está determinando si es necesario tomar medidas para compensarlo, de manera de informarlo en la reunión donde se reunirá a todo el equipo de trabajo por primera vez para establecer el compromiso sobre roles, objetivos y plazos del proyecto.',
 opts:['PP / SP 3.3 Obtener el compromiso con el plan','PP / SP 2.4 Planificar los recursos del proyecto','PMC / SP 1.2 Monitorizar los compromisos','PMC / SP 2.1 Analizar problemas','PP / SP 1.1 Estimar el alcance del proyecto','NINGUNA de las otras opciones'],
 ans:'PP / SP 2.4',
 exp:'La reunión de lanzamiento está **en el futuro** → todavía estoy planificando → **PP**. Se está retocando la planificación de recursos por el retraso del server: **SP 2.4 Planificar los recursos del proyecto**.'},
{id:'u3-fila',u:'U3',t:'PP vs PMC',src:'Cuestionario',conf:'ok',inst:RELA,opts:AREAS,ans:'PP',
 q:'En el proyecto «Fila de espera virtual», luego de una charla donde el responsable de TI del cliente informó que hasta el tercer mes del proyecto no estará disponible el equipo para manejar los monitores de la sala de espera, el PM está modificando las fechas de la etapa de capacitación e implementación, previstas originalmente para el fin del segundo mes. La modificación se está documentando en el producto de trabajo que será presentado la semana que viene, en la reunión donde se informará a todo el equipo de proyecto las actividades a realizar.',
 exp:'La reunión donde se presenta el plan al equipo es **la semana que viene** → sigo en **PP**.'},
{id:'u3-usu',u:'U3',t:'PP vs PMC',src:'Cuestionario',conf:'ok',inst:RELA,opts:AREAS,ans:'PMC',
 q:'En la última reunión de avance quedó claro que hay un retraso respecto a lo planificado en el relevamiento del proceso de ventas. La causa es el desconocimiento del usuario clave respecto del proceso del cual es responsable, por lo que debe reemplazarse por otra persona con más experiencia. En este momento se realiza una reunión con el usuario clave y el jefe del sector para confirmar que el usuario clave actual se desvincula del proyecto y que el jefe del sector participará en las reuniones semanales de relevamiento.',
 exp:'La reunión de avance **ya pasó** y se está corrigiendo un desvío en la involucración de las partes interesadas → **PMC** (SP 1.5, apoyada en GP 2.7).'},
{id:'u3-mails',u:'U3',t:'PP vs PMC',src:'Cuestionario',conf:'ok',inst:RELA,opts:AREAS,ans:'PMC',
 q:'Corroborar si los usuarios clave, que forman parte del equipo de proyecto, están respondiendo los mails que envía el analista para confirmar la exactitud del contenido de las minutas de reunión publicadas. Estas reuniones fueron convocadas de acuerdo con la agenda de trabajo previamente pactada con el cliente.',
 exp:'La agenda **ya estaba pactada**: el plan está fijado y ahora se controla su cumplimiento → **PMC** (SP 1.2 Monitorizar los compromisos o SP 1.5 Monitorizar la involucración de las partes interesadas).'},
{id:'u3-evid',u:'U3',t:'PMC',src:'Cuestionario',conf:'ok',
 ctx:'Al monitorear una tarea, aproximadamente al 50 % de su avance, el responsable del proyecto encuentra que el esfuerzo se cumplió y los profesionales trabajaron, pero no existe evidencia documental del trabajo. Cada tarea dura 20 días, con jornada completa de 8 horas.',
 q:'Determine en cuáles tareas existen elementos para presumir un problema:',cols:['Con problemas','Sin problemas'],
 rows:['La tarea es de análisis','La tarea es de codificación','La tarea es de prueba'],rans:['Con problemas','Con problemas','Con problemas'],
 exp:'En **las tres**. Una tarea no está hecha si no tiene su evidencia documental. El error conceptual es creer que el trabajo técnico alcanza y la documentación es opcional.'},
{id:'n-u3-apf',u:'U3',t:'Puntos función',src:'Nueva',
 ctx:'Se relevaron los componentes de un sistema: 3 entradas de complejidad baja, 2 salidas de complejidad media, 1 consulta de complejidad alta, 1 fichero lógico interno de complejidad media y 1 fichero de interfaz externo de complejidad baja. La suma de las 14 características del entorno (TDI) da 45.',
 table:{head:['Componente','Baja','Media','Alta'],rows:[['Entradas','3','4','6'],['Salidas','4','5','7'],['Consultas','3','4','6'],['FLI','7','10','15'],['FIE','5','7','10']]},
 q:'¿Cuántos puntos función ajustados tiene el sistema?',opts:['40','44','49,5','58','26'],ans:'44',
 exp:'PFD = 3×3 + 2×5 + 1×6 + 1×10 + 1×5 = 9 + 10 + 6 + 10 + 5 = **40**. Factor de ajuste = 0,65 + 45/100 = **1,10**. PF = 40 × 1,10 = **44**. (La fórmula del factor es la de IFPUG; la wiki la reconstruyó porque el apunte llegó cortado.)'},
{id:'n-u3-fa',u:'U3',t:'Puntos función',src:'Nueva',fixed:true,
 q:'El factor de ajuste de los puntos función puede tomar valores entre:',opts:['0 y 1','0,65 y 1,35','0,5 y 1,5','0 y 70'],ans:'0,65 y 1,35',
 exp:'14 características calificadas de 0 a 5 → TDI entre 0 y 70. Factor = 0,65 + TDI/100 → entre **0,65 y 1,35**: el ajuste mueve el tamaño ±35 %. 0 a 70 es el rango del TDI, no del factor.'},
{id:'n-u3-comp',u:'U3',t:'Puntos función',src:'Nueva',
 q:'Relacione cada definición con el tipo de componente de APF:',cols:['Entrada','Salida','Consulta','FLI','FIE'],
 rows:['Datos que cruzan el límite del sistema hacia adentro','Datos que cruzan el límite del sistema hacia afuera','Combinación de entrada y salida para obtener datos','Datos que residen dentro de la aplicación y son actualizados por las entradas','Datos que residen fuera de la aplicación y son mantenidos por otra aplicación'],
 rans:['Entrada','Salida','Consulta','FLI','FIE'],
 exp:'Antes de clasificar hay que fijar el **límite del sistema**. FLI = fichero lógico interno; FIE = fichero de interfaz externo, mantenido por **otra** aplicación.'},
{id:'n-u3-apfobj',u:'U3',t:'Puntos función',src:'Nueva',
 q:'El Análisis de Puntos Función mide el tamaño del software desde una perspectiva:',
 opts:['Funcional, independiente de la tecnología','Técnica, según las líneas de código','Económica, según el costo por hora','Estructural, según la complejidad ciclomática'],ans:0,
 exp:'Perspectiva **funcional**, independiente de la tecnología. Por eso sirve para comparar productividad entre lenguajes o entornos y para seguir los cambios de alcance entre fases.'},
{id:'n-u3-402040',u:'U3',t:'Estimación',src:'Nueva',
 ctx:'Se estimó un esfuerzo total de 600 horas-persona para un proyecto de desarrollo y se reparte con la distribución 40-20-40.',
 q:'¿Cuántas horas corresponden a la codificación?',opts:['120','240','200','60','300'],ans:'120',
 exp:'40 % análisis y diseño = 240 h · **20 % codificación = 120 h** · 40 % pruebas = 240 h. Codificar es la quinta parte del proyecto.'},
{id:'n-u3-esf2',u:'U3',t:'Esfuerzo y EDT',src:'Nueva',
 ctx:'Dos módulos independientes, A y C. Duración y esfuerzo en días; el esfuerzo se interpreta como días-persona. Un día-persona = 8 horas.',
 table:{head:['Tarea','Duración','Esfuerzo'],rows:[['Analizar A','2 días','2 días'],['Diseñar A','3 días','4 días'],['Codificar A','5 días','5 días'],['Probar A','4 días','6 días'],['Analizar C','2 días','3 días'],['Diseñar C','3 días','3 días'],['Codificar C','4 días','8 días'],['Probar C','3 días','3 días']]},
 q:'Determine el esfuerzo de la fase de prueba en horas-persona.',opts:['72','56','9','48','272','40'],ans:'72',
 exp:'Probar A (6) + Probar C (3) = 9 días-persona × 8 h = **72 h**. Si sumás la **duración** (4 + 3 = 7 días) te da 56, que es la trampa. 272 es el esfuerzo de todo el proyecto.'},
{id:'n-u3-edt3',u:'U3',t:'Esfuerzo y EDT',src:'Nueva',
 ctx:'El producto se compone de 2 módulos independientes, M y N. Tareas de la EDT, para cada módulo: Analizar, Diseñar, Codificar y Probar. Al final, «Integrar M y N», que requiere ambos módulos probados. Sólo se consideran predecesoras directas.',
 q:'Predecesora(s) directa(s) de «Integrar M y N»:',opts:['Probar M','Probar N','Codificar M','Codificar N','Analizar M'],ans:['Probar M','Probar N'],
 exp:'Integrar requiere los dos módulos **probados**: sus predecesoras directas son **Probar M y Probar N**. Codificar es predecesora de Probar, no directa de Integrar.'},
{id:'n-u3-atraso',u:'U3',t:'PP vs PMC',src:'Nueva',inst:RELSP,
 q:'En la reunión de avance de ayer se detectó que la codificación del módulo de Stock lleva 5 días de atraso respecto al cronograma. Hoy el PM está evaluando si puede compensarse con horas extra o si hay que replanificar.',
 opts:['PMC / SP 1.1 Monitorizar los parámetros de planificación','PMC / SP 2.1 Analizar problemas','PMC / SP 2.2 Llevar a cabo las acciones correctivas','PP / SP 2.1 Establecer el presupuesto y el calendario','PP / SP 3.3 Obtener el compromiso con el plan','NINGUNA de las otras opciones'],
 ans:'PMC / SP 2.1',
 exp:'El desvío ya se detectó (la reunión de avance pasó) y ahora se **determina qué acción correctiva tomar** → **PMC / SP 2.1 Analizar problemas**. SP 2.2 sería ejecutar la acción ya decidida.'},
{id:'n-u3-ries',u:'U3',t:'PP vs PMC',src:'Nueva',inst:RELSP,
 q:'El lunes próximo es la reunión de lanzamiento del proyecto. Hoy el PM está armando la lista de riesgos (rotación de personal, demora en la compra del servidor) con su probabilidad e impacto, para incluirla en el plan.',
 opts:['PP / SP 2.2 Identificar los riesgos del proyecto','PMC / SP 1.3 Monitorizar los riesgos del proyecto','PP / SP 2.7 Establecer el plan de proyecto','PMC / SP 2.1 Analizar problemas','NINGUNA de las otras opciones'],
 ans:'PP / SP 2.2',
 exp:'La reunión de lanzamiento es **futura** → PP. Identificar riesgos es **PP / SP 2.2**. Monitorizar los riesgos (PMC / SP 1.3) corresponde cuando el plan ya está en ejecución.'},
{id:'n-u3-comp3',u:'U3',t:'PP vs PMC',src:'Nueva',inst:RELSP,
 q:'Terminada la presentación del plan en la reunión de lanzamiento de hoy, el PM obtiene la firma del sponsor y la confirmación de cada integrante del equipo de que se comprometen con las fechas y roles asignados.',
 opts:['PP / SP 3.3 Obtener el compromiso con el plan','PP / SP 2.6 Planificar la involucración de las partes interesadas','PMC / SP 1.2 Monitorizar los compromisos','PMC / SP 1.5 Monitorizar la involucración de las partes interesadas','NINGUNA de las otras opciones'],
 ans:'PP / SP 3.3',
 exp:'Cierra la planificación: **PP / SP 3.3 Obtener el compromiso con el plan** (SG 3). Monitorizar los compromisos es controlar después que se cumplan.'},
{id:'n-u3-monit',u:'U3',t:'PP vs PMC',src:'Nueva',inst:RELSP,
 q:'Cada viernes, el PM compara las horas consumidas y el avance real de cada tarea contra lo previsto en el plan de proyecto aprobado.',
 opts:['PMC / SP 1.1 Monitorizar los parámetros de planificación','PMC / SP 2.1 Analizar problemas','PP / SP 1.4 Determinar las estimaciones de esfuerzo y de coste','PP / SP 2.1 Establecer el presupuesto y el calendario','NINGUNA de las otras opciones'],
 ans:'PMC / SP 1.1',
 exp:'Comparar esfuerzo, coste y calendario reales contra el plan es **PMC / SP 1.1 Monitorizar los parámetros de planificación**. Todavía no hay un problema para analizar.'},
{id:'n-u3-grupos',u:'U3',t:'Gestión de proyectos',src:'Nueva',
 q:'Relacione cada proceso con su grupo en la Guía práctica de gestión de proyectos:',cols:['Coordinación','Alcance','Tiempo','Costes','Personal'],
 rows:['Elaborar los presupuestos','Definir el equipo del proyecto','Desarrollar el cronograma','Definir las actividades','Control integrado de cambios'],
 rans:['Costes','Personal','Tiempo','Alcance','Coordinación'],
 exp:'«Definir las actividades» es de **Alcance** aunque suene a cronograma. El control integrado de cambios es de **Coordinación**.'},
{id:'n-u3-crit',u:'U3',t:'Gestión de proyectos',src:'Nueva',
 q:'El proceso «Desarrollar el cronograma» debe identificar explícitamente:',
 opts:['El camino crítico','Las reservas para contingencias de gestión','Los roles y las responsabilidades','El plan de comunicaciones'],ans:0,
 exp:'El **camino crítico** es el de mayor duración en la red de actividades; de ahí salen las actividades críticas y los hitos. Las reservas para contingencias van en «Elaborar los presupuestos».'},
{id:'n-u3-reserv',u:'U3',t:'Gestión de proyectos',src:'Nueva',
 q:'El proceso «Elaborar los presupuestos» debe incluir:',
 opts:['Las reservas para contingencias de gestión','El camino crítico','El plan de gestión de personal','Los riesgos aceptados'],ans:0,
 exp:'Los presupuestos deben incluir las **reservas para contingencias de gestión**.'},
{id:'n-u3-signif',u:'U3',t:'PMC',src:'Nueva',
 q:'En PMC, una desviación es significativa cuando:',
 opts:['Si se deja sin resolver, impide al proyecto cumplir sus objetivos','Supera el 10 % de lo planificado','La detecta el cliente','Afecta una tarea del camino crítico, aunque el proyecto igual cumpla sus objetivos'],ans:0,
 exp:'Definición del CMMI: significativa = la que, **sin resolver, impide cumplir los objetivos** del proyecto. No hay un porcentaje fijo.'},
{id:'n-u3-accorr',u:'U3',t:'PMC',src:'Nueva',
 q:'Ante una desviación significativa, son acciones correctivas posibles según PMC:',
 opts:['Replanificar, con o sin corrección del plan original','Establecer nuevos acuerdos','Incluir actividades adicionales de mitigación dentro del plan actual','Bajar el nivel de madurez de la organización'],ans:['Replanificar','Establecer nuevos','Incluir'],
 exp:'Las tres primeras son las que enumera el CMMI. La cuarta no tiene sentido: el nivel de madurez no es una acción correctiva de un proyecto.'},
{id:'n-u3-sgpp',u:'U3',t:'PP',src:'Nueva',
 q:'Son metas específicas del área PP:',
 opts:['Establecer estimaciones','Desarrollar un plan de proyecto','Obtener el compromiso con el plan','Monitorizar el proyecto frente al plan','Gestionar las acciones correctivas hasta su cierre'],
 ans:['Establecer estimaciones','Desarrollar un plan','Obtener el compromiso'],
 exp:'PP: SG 1 Establecer estimaciones · SG 2 Desarrollar un plan de proyecto · SG 3 Obtener el compromiso con el plan. Las otras dos son las metas de **PMC**.'},
{id:'n-u3-spon',u:'U3',t:'Gestión de proyectos',src:'Nueva',
 q:'En la Guía práctica de gestión de proyectos, el participante que provee los recursos financieros del proyecto es el:',
 opts:['Patrocinador (sponsor)','Influyente','Jefe de proyecto','Usuario clave'],ans:0,
 exp:'**Patrocinador**. Los **influyentes** no están directamente relacionados con el proyecto pero pueden influir positiva o negativamente.'},
{id:'n-u3-delphi',u:'U3',t:'Estimación',src:'Nueva',
 q:'Método de estimación grupal en el que expertos estiman de forma independiente y, en vueltas sucesivas en las que se suma información, se busca la convergencia:',
 opts:['Delphi','Valor esperado (tres puntos)','Puntos de función','Distribución 40-20-40'],ans:'Delphi',
 exp:'**Delphi**: grupal, independiente e **iterativo**. Conviene cuando no hay datos históricos pero sí gente con experiencia.'},
{id:'n-u3-ve',u:'U3',t:'Estimación',src:'Nueva',
 ctx:'Para la tarea «Codificar el módulo de facturación» se estimaron 10 h (optimista), 16 h (normal) y 28 h (pesimista).',
 q:'Aplicando la técnica de tres puntos con la ponderación (O + 4N + P) / 6, el valor esperado es:',opts:['17 h','18 h','16 h','54 h'],ans:'17 h',
 exp:'(10 + 4×16 + 28) / 6 = 102 / 6 = **17 h**. 18 h es el promedio simple. Ojo: la clase sólo nombró los tres escenarios; la ponderación 1-4-1 es la estándar, confirmá cuál usa la cátedra.'},
{id:'n-u3-proy',u:'U3',t:'Gestión de proyectos',src:'Nueva',
 q:'Indique si cada afirmación es verdadera o falsa:',cols:VF,
 rows:['Un proceso es repetitivo y produce siempre el mismo producto; un proyecto es único','La duración se expresa en días o meses, y el esfuerzo en horas de trabajo','El tiempo dedicado a gestionar un proyecto es una pérdida que conviene minimizar','El plan de proyecto puede necesitar corregirse por cambios en los requerimientos o estimaciones inexactas'],
 rans:['Verdadero','Verdadero','Falso','Verdadero'],
 exp:'La guía dice que el tiempo dedicado a gestionar **nunca es una pérdida**: es imprescindible para la calidad del resultado. El plan se corrige a lo largo del proyecto.'},

/* ---------------- U5 ---------------- */
{id:'u5-dif',u:'U5',t:'VER vs VAL',src:'Parcial 2025',conf:'ok',
 q:'¿Cuál es la diferencia entre Verificación y Validación?',
 opts:['VER asegura que el producto cumple con lo especificado; VAL asegura que el producto satisface la necesidad del usuario','VER mide la satisfacción del usuario; VAL el cumplimiento de las especificaciones','VAL es opcional y VER obligatorio','VER es opcional y VAL obligatorio','VER y VAL son equivalentes: ambas miden defectos'],ans:0,
 exp:'VER: «¿estoy construyendo el producto **correctamente**?», contra la especificación. VAL: «¿estoy construyendo el producto **correcto**?», contra la necesidad del usuario en su entorno. Ninguna es opcional.'},
{id:'u5-3acc',u:'U5',t:'VER vs VAL',src:'Parcial 2025',conf:'ok',
 q:'Relacione cada acción con el área que corresponde:',cols:['VER','VAL'],
 rows:['Implementar revisiones de los documentos de requisitos y de diseño','Ejecutar pruebas de sistema para verificar el cumplimiento de las especificaciones','Organizar pilotos con usuarios finales para confirmar que el producto satisface sus necesidades'],
 rans:['VER','VER','VAL'],
 exp:'La trampa es la 2: «pruebas de sistema» suena a producto terminado, pero se contrasta **contra la especificación** → VER. Lo que define VAL es **quién juzga**: el usuario, contra su necesidad.'},
{id:'u5-banco',u:'U5',t:'VER vs VAL',src:'Parcial 2025',conf:'ok',
 ctx:'En un proyecto bancario: 1) se realizan inspecciones de requisitos y revisiones de diseño; 2) luego se ejecutan pruebas de aceptación con clientes reales.',
 q:'¿Qué afirmación es correcta?',opts:['La primera es VER y la segunda es VAL','Ambas son VER','Ambas son VAL','La primera es VAL y la segunda es VER'],ans:0,
 exp:'Inspección y revisión son técnicas **estáticas** → VER. Aceptación **con clientes reales** → VAL.'},
{id:'u5-qa',u:'U5',t:'VER vs VAL',src:'Parcial 2025',conf:'ok',
 ctx:'El equipo de QA ejecuta pruebas para comprobar que cada requisito funcional fue implementado. El objetivo es asegurar que «lo construido» cumpla con «lo especificado».',
 q:'¿A qué área de proceso corresponde?',opts:['OT','VAL','OPD','VER','Ninguna de las opciones'],ans:'VER',
 exp:'Que lo haga «el equipo de QA» no lo convierte en PPQA: se contrasta el producto contra **su especificación** → **VER**.'},
{id:'u5-rev',u:'U5',t:'Técnicas estáticas',src:'Parcial 2016',conf:'ok',fixed:true,
 q:'¿En cuáles momentos puede realizarse una Revisión?',
 opts:['En la primera entrevista con el cliente, antes de haber escrito la primera minuta','En la etapa de Análisis','Al estar cerca de terminar la etapa de Programación','En la etapa de Diseño','Todas las anteriores'],ans:'Todas',
 exp:'Las revisiones son la **primera forma de prueba aplicable** y se pueden hacer **en cualquier momento** del ciclo, a diferencia de las pruebas dinámicas, que necesitan el sistema andando.'},
{id:'u5-valase',u:'U5',t:'VER vs VAL',src:'Cuestionario',conf:'ok',
 q:'La actividad de Validación intenta asegurar que:',
 opts:['Estamos construyendo el producto correctamente','El software se ajusta a su especificación','El producto o componente se ajusta a su uso previsto cuando se sitúa en su entorno previsto','El software hace lo que el usuario (cliente) requiere','Estamos construyendo el producto correcto'],
 ans:['El producto o componente','El software hace lo que','Estamos construyendo el producto correcto'],
 exp:'VAL = uso previsto en el entorno previsto · lo que el usuario necesita · «el producto correcto». Las otras dos opciones definen **VER**.'},
{id:'u5-verase',u:'U5',t:'VER vs VAL',src:'Cuestionario',conf:'ok',
 q:'La actividad de Verificación intenta asegurar que:',
 opts:['El software hace lo que el usuario (cliente) requiere','Los productos de trabajo seleccionados cumplen sus requerimientos especificados','Estamos construyendo el producto correctamente','El software se ajusta a su especificación','Estamos construyendo el producto correcto'],
 ans:['Los productos de trabajo','Estamos construyendo el producto correctamente','El software se ajusta'],
 exp:'VER = productos de trabajo contra requerimientos especificados · «construir correctamente». Lo del usuario y «el producto correcto» es **VAL**.'},
{id:'u5-dist1',u:'U5',t:'Discriminar VER / VAL',src:'Cuestionario',conf:'ok',inst:RELSP,
 q:'En el marco del proyecto «Reserva de hoteles on-line», distribuir entre los analistas elegidos para participar de la reunión la descripción del último caso de uso, que acaba de terminar otro analista y que será chequeada en dicha reunión.',
